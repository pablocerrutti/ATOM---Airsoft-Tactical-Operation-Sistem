<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M. - Terminal de Campo</title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #map { flex: 1; width: 100%; border-bottom: 2px solid var(--p); filter: grayscale(0.5) contrast(1.2); }
        #status-bar { height: 45vh; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; box-sizing: border-box; overflow-y: auto; }
        
        #chat-container { grid-column: span 2; display: flex; flex-direction: column; background: #050505; border: 1px solid #222; height: 100px; margin-top: 5px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 5px; font-size: 10px; color: #aaa; }
        #chat-input-area { display: flex; border-top: 1px solid #222; }
        #chat-input { flex: 1; background: #000; border: none; color: var(--p); padding: 8px; font-family: monospace; font-size: 10px; }
        #btn-send { background: var(--p); color: #000; border: none; padding: 0 15px; font-weight: bold; }

        .btn-tactic { background: #111; border: 1px solid var(--p); color: var(--p); padding: 10px; font-weight: bold; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-warn { border-color: var(--warn); color: var(--warn); }
        .full-width { grid-column: span 2; }

        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid var(--p); color: var(--p); font-family: monospace; }
        
        .alert-out { position: fixed; top: 0; left: 0; width: 100%; background: red; color: white; text-align: center; font-weight: bold; padding: 10px; display: none; z-index: 10001; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #timer-display { font-size: 1rem; text-align: center; color: var(--warn); grid-column: span 2; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--p); }
    </style>
</head>
<body>

    <div id="alerta-fuera" class="alert-out">¡FUERA DE ZONA! REGRESE AL CAMPO</div>

    <div id="screen-register" class="overlay">
        <h1 style="letter-spacing: 5px;">A.T.O.M.</h1>
        <select id="select-mision"><option value="">Cargando misiones...</option></select>
        <input type="text" id="reg-callsign" placeholder="CALLSIGN (Nombre)">
        <button class="btn-tactic" style="width:100%" onclick="solicitarInscripcion()">SOLICITAR PARTICIPACIÓN</button>
        <button class="btn-tactic btn-danger" style="width:100%; margin-top: 10px; border: none; background: transparent; font-size: 9px;" onclick="window.location.href='index.html'">CERRAR TERMINAL</button>
    </div>

    <div id="screen-wait" class="overlay" style="display:none;">
        <h2>SOLICITUD ENVIADA</h2>
        <p>Espera a que el Admin te asigne un equipo...</p>
        <div style="color: var(--warn); font-size: 12px; margin-bottom: 20px;">ID: <span id="display-callsign"></span></div>
        <button class="btn-tactic btn-danger" onclick="abandonarMision()">CANCELAR SOLICITUD</button>
    </div>

    <div id="game-ui" style="display: none; height: 100vh; flex-direction: column;">
        <div id="map"></div>
        <div id="status-bar">
            <div id="timer-display">ESTADO: OPERATIVO</div>
            <button class="btn-tactic btn-danger" onclick="cambiarEstado('BAJA')">BAJA</button>
            <button class="btn-tactic btn-warn" onclick="cambiarEstado('MEDICO')">MÉDICO</button>
            <button class="btn-tactic btn-warn full-width" onclick="marcarContacto()">⚠️ MARCAR CONTACTO ENEMIGO</button>

            <div id="chat-container">
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="ENVIAR A EQUIPO...">
                    <button id="btn-send" onclick="enviarMensaje()">></button>
                </div>
            </div>

            <button class="btn-tactic full-width" onclick="cambiarEstado('OPERATIVO')" style="border-color: #fff; color: #fff; margin-top:5px;">RESPAWN</button>
            
            <button class="btn-tactic full-width btn-danger" onclick="abandonarMision()" style="margin-top: 10px; font-size: 9px; opacity: 0.7;">ABANDONAR OPERACIÓN</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, miMarker, miEquipo, miCallsign, miMisionId;
        let zonaJuegoPoligono;
        let miPosActual = null;
        let mapInitialized = false;

        db.ref('operaciones').on('value', s => {
            const select = document.getElementById('select-mision');
            if(!select) return;
            select.innerHTML = '<option value="">SELECCIONAR OPERACIÓN</option>';
            s.forEach(op => {
                let opt = document.createElement('option');
                opt.value = op.key; opt.innerText = op.val().nombre;
                select.appendChild(opt);
            });
        });

        function solicitarInscripcion() {
            miCallsign = document.getElementById('reg-callsign').value.trim().toUpperCase();
            miMisionId = document.getElementById('select-mision').value;
            
            if(!miCallsign || !miMisionId) return alert("Completa todos los campos");

            db.ref(`inscripciones/${miCallsign}`).set({
                callsign: miCallsign,
                mision: miMisionId,
                equipo: 'PENDIENTE',
                estado: 'OPERATIVO'
            });

            document.getElementById('display-callsign').innerText = miCallsign;
            document.getElementById('screen-register').style.display = 'none';
            document.getElementById('screen-wait').style.display = 'flex';

            db.ref(`inscripciones/${miCallsign}/equipo`).on('value', snap => {
                const eq = snap.val();
                if(eq === 'EQUIPO_ROJO' || eq === 'EQUIPO_AZUL') {
                    miEquipo = eq;
                    iniciarInterfazJuego();
                }
            });
        }

        function iniciarInterfazJuego() {
            if(mapInitialized) return;
            document.getElementById('screen-wait').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            initMap();
            conectarChat();
            mapInitialized = true;
        }

        function abandonarMision() {
            if(confirm("¿Seguro que quieres abandonar la operación actual?")) {
                // Borrar rastro en DB
                if(miCallsign) {
                    db.ref(`inscripciones/${miCallsign}`).remove();
                    if(miEquipo) db.ref(`posiciones/${miEquipo}/${miCallsign}`).remove();
                }
                window.location.href = 'index.html';
            }
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 17, center: {lat: -34.095, lng: -56.214}, 
                mapTypeId: 'satellite', disableDefaultUI: true
            });

            miMarker = new google.maps.Marker({ 
                map: map, 
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: "#fff", fillOpacity: 1, strokeColor: "#000" },
                label: { text: miCallsign, color: 'white', fontSize: '9px' }
            });
            
            cargarDatosMision();
            rastrearGPS();
        }

        function cargarDatosMision() {
            db.ref(`operaciones/${miMisionId}`).once('value', snap => {
                const op = snap.val();
                if(!op || !op.zonas) return;
                const bounds = new google.maps.LatLngBounds();
                op.zonas.forEach(z => {
                    if(z.role === 'zona_juego') {
                        zonaJuegoPoligono = new google.maps.Polygon({ paths: z.path, map: map, fillOpacity: 0.1, strokeColor: '#00ff00', strokeWeight: 1 });
                        z.path.forEach(p => bounds.extend(p));
                    }
                    if(z.role === 'objetivo_conquista') {
                        new google.maps.Circle({ map: map, center: {lat: z.lat, lng: z.lng}, radius: 15, fillColor: "gold", fillOpacity: 0.3, strokeColor: "gold" });
                        bounds.extend({lat: z.lat, lng: z.lng});
                    }
                });
                if(!bounds.isEmpty()) map.fitBounds(bounds);
            });
        }

        function rastrearGPS() {
            navigator.geolocation.watchPosition(pos => {
                miPosActual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                miMarker.setPosition(miPosActual);
                if(miEquipo) db.ref(`posiciones/${miEquipo}/${miCallsign}`).set(miPosActual);
                
                if(zonaJuegoPoligono && !google.maps.geometry.poly.containsLocation(new google.maps.LatLng(miPosActual), zonaJuegoPoligono)) {
                    document.getElementById('alerta-fuera').style.display = 'block';
                } else {
                    document.getElementById('alerta-fuera').style.display = 'none';
                }
            }, null, { enableHighAccuracy: true });
        }

        function conectarChat() {
            db.ref(`chats/${miMisionId}/${miEquipo}`).limitToLast(10).on('child_added', snap => {
                const msg = snap.val();
                const div = document.getElementById('chat-messages');
                div.innerHTML += `<div><span style="color:var(--p)">${msg.user}:</span> ${msg.text}</div>`;
                div.scrollTop = div.scrollHeight;
            });
        }

        function enviarMensaje() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            db.ref(`chats/${miMisionId}/${miEquipo}`).push({ user: miCallsign, text: input.value, time: Date.now() });
            input.value = "";
        }

        function cambiarEstado(nuevo) {
            db.ref(`inscripciones/${miCallsign}`).update({ estado: nuevo });
            document.getElementById('timer-display').innerText = `ESTADO: ${nuevo}`;
        }

        function marcarContacto() {
            if(!miPosActual) return;
            db.ref(`alertas_contacto/${miEquipo}`).set({ pos: miPosActual, time: Date.now() });
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry" defer></script>
</body>
</html>
