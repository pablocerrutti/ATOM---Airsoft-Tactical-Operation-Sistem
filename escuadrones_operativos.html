<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid var(--p); padding-bottom: 20px; margin-bottom: 30px; }
        
        .grid-escuadrones { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card-escuadron { 
            border: 1px solid #333; 
            background: #111; 
            overflow: hidden; 
            position: relative;
            transition: 0.3s;
        }
        .card-escuadron:hover { border-color: var(--p); transform: translateY(-5px); }

        .foto-unidad { width: 100%; height: 200px; object-fit: cover; filter: grayscale(50%); }
        
        .info-bar { 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            background: rgba(0,255,0,0.05); 
        }

        .escudo-thumb { 
            width: 60px; 
            height: 60px; 
            border: 2px solid var(--p); 
            border-radius: 50%; 
            margin-right: 15px; 
            background: #000;
        }

        .nombre-equipo { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; }
        
        .btn-back { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin:0;">ESCUADRONES OPERATIVOS</h1>
        <p style="color: #666; font-size: 0.8rem;">REGISTRO OFICIAL DE UNIDADES - URUGUAY</p>
    </div>

    <div id="contenedor" class="grid-escuadrones">
        </div>

    <button class="btn-back" onclick="window.location.href='index.html'">VOLVER AL INICIO</button>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Cargar Escuadrones
        db.ref('equipos').on('value', snap => {
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = "";
            
            if(!snap.exists()) {
                contenedor.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>NO HAY ESCUADRONES REGISTRADOS.</p>";
                return;
            }

            snap.forEach(child => {
                const data = child.val();
                contenedor.innerHTML += `
                    <div class="card-escuadron">
                        <img src="${data.foto}" class="foto-unidad" alt="Unidad">
                        <div class="info-bar">
                            <img src="${data.escudo}" class="escudo-thumb" alt="Escudo">
                            <div class="nombre-equipo">${data.nombre}</div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>escuadrones_operativos.html
