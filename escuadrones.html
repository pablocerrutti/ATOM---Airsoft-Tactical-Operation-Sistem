<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Escuadrones</title>

<style>
:root { --p:#00ff00; --f:#050505; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 display:flex;
 flex-direction:column;
 align-items:center;
 padding:20px;
}

.box {
 width:100%;
 max-width:500px;
 border:1px solid var(--p);
 padding:15px;
 margin-top:20px;
}

input, button, select {
 width:100%;
 padding:10px;
 margin-top:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

.item {
 padding:10px;
 border-bottom:1px solid #222;
 font-size:14px;
}

.small {
 font-size:12px;
 opacity:0.7;
}
</style>
</head>

<body>

<h2>ESCUADRONES A.T.O.M</h2>

<div class="box">
<input id="nombre" placeholder="Nombre escuadrón">

<select id="equipo">
<option value="ROJO">ROJO</option>
<option value="AZUL">AZUL</option>
</select>

<button onclick="crearEscuadron()">CREAR ESCUADRÓN</button>
</div>

<div class="box">
<h3>ESCUADRONES ACTIVOS</h3>
<div id="lista"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let user = null;

/* LOGIN CHECK */
auth.onAuthStateChanged(async u => {
 if (!u) {
  location.href = "login.html";
  return;
 }

 const snap = await db.ref("usuarios/" + u.uid).once("value");
 const data = snap.val();

 if (!data) {
  auth.signOut();
  return;
 }

 user = {
  uid: u.uid,
  callsign: data.callsign,
  rol: data.rol
 };

 cargarEscuadrones();
});

/* CREAR ESCUADRÓN */
function crearEscuadron(){

 const nombre = document.getElementById("nombre").value.trim();
 const equipo = document.getElementById("equipo").value;

 if(!nombre) return alert("Nombre requerido");

 const ref = db.ref("escuadrones").push();

 ref.set({
  nombre,
  equipo,
  lider: user.callsign,
  miembros: {
   [user.callsign]: true
  },
  creado: Date.now()
 });

 document.getElementById("nombre").value = "";
}

/* CARGAR ESCUADRONES (SIN DUPLICAR LISTENERS) */
function cargarEscuadrones(){

 db.ref("escuadrones").off(); // 🔥 evita duplicados

 db.ref("escuadrones").on("value", snap => {

  let html = "";

  snap.forEach(s => {
   const d = s.val();

   html += `
   <div class="item">
    <b>${d.nombre}</b><br>
    <span class="small">Equipo: ${d.equipo}</span><br>
    <span class="small">Líder: ${d.lider}</span>
   </div>`;
  });

  document.getElementById("lista").innerHTML = html;

 });

}
</script>

</body>
</html>
