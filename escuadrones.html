<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-box { border: 2px solid var(--p); padding: 25px; width: 90%; max-width: 400px; background: rgba(0,20,0,0.2); }
        input[type="text"] { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        .file-input { margin: 15px 0; font-size: 0.8rem; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 0.7rem; text-transform: uppercase; }
        button { background: var(--p); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        #status { font-size: 0.7rem; margin-top: 10px; text-align: center; color: yellow; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="text-align: center; margin-top: 0; letter-spacing: 2px;">ALTA DE ESCUADRÓN</h2>
        
        <input type="text" id="nombreEquipo" placeholder="NOMBRE DEL EQUIPO">
        
        <div class="file-input">
            <label>Escudo del Equipo (Logo):</label>
            <input type="file" id="escudoFile" accept="image/*">
        </div>

        <div class="file-input">
            <label>Foto del Escuadrón (Unidad):</label>
            <input type="file" id="fotoFile" accept="image/*">
        </div>

        <div id="status"></div>
        <button id="btnReg" onclick="registrarCompleto()">Dar de Alta Escuadrón</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #555; border: 1px solid #333; margin-top: 15px;">Volver</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        async function registrarCompleto() {
            const nombre = document.getElementById('nombreEquipo').value.trim().toUpperCase();
            const escudoImg = document.getElementById('escudoFile').files[0];
            const fotoImg = document.getElementById('fotoFile').files[0];
            const status = document.getElementById('status');

            if(!nombre || !escudoImg || !fotoImg) {
                return alert("ERROR: NOMBRE, ESCUDO Y FOTO SON OBLIGATORIOS");
            }

            status.innerText = "VERIFICANDO NOMBRE...";

            // 1. Validar nombre duplicado
            const snap = await db.ref('equipos').orderByChild('nombre').equalTo(nombre).once('value');
            if(snap.exists()) {
                status.innerText = "";
                return alert("Escuadron Existente");
            }

            try {
                status.innerText = "SUBIENDO ARCHIVOS TÁCTICOS...";
                document.getElementById('btnReg').disabled = true;

                // 2. Subir Escudo
                const escudoRef = storage.ref(`escudos/${nombre}_logo`);
                await escudoRef.put(escudoImg);
                const escudoUrl = await escudoRef.getDownloadURL();

                // 3. Subir Foto
                const fotoRef = storage.ref(`fotos/${nombre}_unidad`);
                await fotoRef.put(fotoImg);
                const fotoUrl = await fotoRef.getDownloadURL();

                // 4. Guardar en Database
                await db.ref('equipos').push({
                    nombre: nombre,
                    escudo: escudoUrl,
                    foto: fotoUrl,
                    fecha: new Date().toLocaleDateString()
                });

                alert("Registro Exitoso. Bienvenido al sistema A.T.O.M.");
                window.location.href = 'escuadrones_operativos.html';

            } catch (error) {
                console.error(error);
                alert("ERROR EN LA CARGA");
                document.getElementById('btnReg').disabled = false;
            }
        }
    </script>
</body>
</html>
