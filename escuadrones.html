<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .form-box { border: 2px solid var(--p); padding: 25px; width: 85%; max-width: 350px; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background: var(--p); color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="text-align: center;">REGISTRO DE EQUIPO</h2>
        <input type="text" id="equipoNombre" placeholder="NOMBRE DEL ESCUADRÓN">
        <button onclick="registrarEquipo()">DAR DE ALTA EQUIPO</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #666; border: 1px solid #444; margin-top: 10px;">VOLVER</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
  authDomain: "atom--airsoft.firebaseapp.com",
  databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
  projectId: "atom--airsoft",
  storageBucket: "atom--airsoft.firebasestorage.app",
  messagingSenderId: "310010107781",
  appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec",
  measurementId: "G-3X2C87MPPV" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function registrarEquipo() {
            const nombre = document.getElementById('equipoNombre').value.trim().toUpperCase();
            if(!nombre) return;

            db.ref('equipos').orderByChild('nombre').equalTo(nombre).once('value', snap => {
                if(snap.exists()) {
                    alert("Escuadron Existente");
                } else {
                    db.ref('equipos').push({ nombre: nombre }).then(() => {
                        alert("Registro Exitoso. Bienvenido al sistema A.T.O.M.");
                        window.location.href = 'index.html';
                    });
                }
            });
        }
    </script>
</body>
</html>
