<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-box { border: 2px solid var(--p); padding: 25px; width: 90%; max-width: 400px; background: rgba(0,20,0,0.2); }
        input[type="text"], input[type="url"] { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; outline: none; }
        label { display: block; margin-top: 10px; color: #888; font-size: 0.7rem; text-transform: uppercase; }
        button { background: var(--p); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        .hint { font-size: 0.65rem; color: #555; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="text-align: center; margin-top: 0; letter-spacing: 2px;">ALTA DE ESCUADRÓN</h2>
        
        <label>Identificación de la Unidad</label>
        <input type="text" id="nombreEquipo" placeholder="NOMBRE DEL EQUIPO">
        
        <label>Link del Escudo (URL Pública)</label>
        <div class="hint">Ej: https://web.com/mi-logo.jpg</div>
        <input type="url" id="escudoLink" placeholder="PEGAR LINK DEL ESCUDO AQUÍ">

        <label>Link Foto de Unidad (URL Pública)</label>
        <div class="hint">Imagen del equipo en el campo</div>
        <input type="url" id="fotoLink" placeholder="PEGAR LINK DE LA FOTO AQUÍ">

        <button id="btnReg" onclick="registrarEquipo()">Dar de Alta Escuadrón</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #555; border: 1px solid #333; margin-top: 15px;">Volver</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function registrarEquipo() {
            const nombre = document.getElementById('nombreEquipo').value.trim().toUpperCase();
            const escudo = document.getElementById('escudoLink').value.trim();
            const foto = document.getElementById('fotoLink').value.trim();

            if(!nombre || !escudo || !foto) {
                return alert("ERROR: TODOS LOS CAMPOS Y LINKS SON OBLIGATORIOS");
            }

            // Validar si el escuadrón ya existe
            db.ref('equipos').orderByChild('nombre').equalTo(nombre).once('value', snap => {
                if(snap.exists()) {
                    alert("Escuadron Existente");
                } else {
                    db.ref('equipos').push({
                        nombre: nombre,
                        escudo: escudo, // Guardamos directamente el link
                        foto: foto,     // Guardamos directamente el link
                        fecha: new Date().toLocaleDateString()
                    }).then(() => {
                        alert("Registro Exitoso. Bienvenido al sistema A.T.O.M.");
                        window.location.href = 'escuadrones_operativos.html';
                    });
                }
            });
        }
    </script>
</body>
</html>
