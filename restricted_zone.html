<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>A.T.O.M - COMANDANCIA</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .menu-box { border: 1px solid var(--p); padding: 30px; background: rgba(0,20,0,0.5); width: 90%; max-width: 400px; }
        button { width: 100%; padding: 15px; margin: 10px 0; background: transparent; border: 1px solid var(--p); color: var(--p); cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: var(--p); color: #000; }
    </style>
</head>
<body>
    <div class="menu-box">
        <h1 style="color:var(--gold)">COMMAND CENTER</h1>
        <button onclick="window.location.href='editor.html'">🛠️ EDITOR DE MISIONES</button>
        <button onclick="window.location.href='lobby.html'">📡 IR AL LOBBY</button>
        <button onclick="firebase.auth().signOut().then(() => window.location.href='login.html')">✖ SALIR</button>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", projectId: "atom---sistem" };
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(user => { if (!user) window.location.href = 'login.html'; });
    </script>
</body>
</html>
