<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor Pro</title>
    
    <style>html { display: none; }</style>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
            projectId: "atom---sistem",
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(user => {
            if (user) { document.documentElement.style.display = 'block'; } 
            else { window.location.href = 'login.html'; }
        });
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#222; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        #panel { 
            width: 300px; background: rgba(5, 5, 5, 0.98); border-right: 1px solid var(--p); 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 2000; 
            position: absolute; height: 100%; transition: transform 0.3s ease;
        }
        .panel-hidden { transform: translateX(-100%); }
        #map { flex: 1; width: 100%; height: 100%; background: #111; z-index: 1; }

        #menu-toggle { 
            position: absolute; top: 15px; right: 15px; z-index: 2100; 
            width: 45px; height: 45px; background: var(--f); color: var(--p); 
            border: 1px solid var(--p); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        @media (min-width: 1024px) {
            #panel { position: relative; transform: translateX(0); width: 350px; }
            #menu-toggle { display: none; }
            .panel-hidden { transform: translateX(0); }
        }

        .tool-content { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        summary { padding:12px; cursor:pointer; color:var(--gold); border-bottom: 1px solid #111; font-weight: bold; background: #0a0a0a; }
        
        button { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        button.active { background: var(--p); color: #000; }
        
        input, textarea, select { background: #000; border: 1px solid #333; color: var(--p); padding: 10px; width: 100%; box-sizing: border-box; }

        .op-card { background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .stats-box { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div style="padding:20px; background:#111; border-bottom:1px solid var(--p); text-align:center;">
            <h3 style="margin:0; letter-spacing: 2px; font-size: 16px;">COMMAND CENTER</h3>
        </div>

        <details open>
            <summary>📂 CONFIGURACIÓN MISIÓN</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="Nombre Operación...">
                <textarea id="mission-history" placeholder="Briefing..." rows="2"></textarea>
                <textarea id="mission-objectives" placeholder="Objetivos..." rows="2"></textarea>
                <input id="mission-image-url" placeholder="URL Imagen...">
                <button onclick="saveMission()" style="background:var(--gold); color:#000; border:none; margin-top:5px;">💾 GUARDAR</button>
                <button onclick="deleteMission()" style="background:var(--red); color:#fff; border:none;">🗑️ ELIMINAR</button>
            </div>
        </details>

        <details>
            <summary>👥 OPERADORES EN LISTA</summary>
            <div class="tool-content" id="enlisted-list"></div>
        </details>

        <details open>
            <summary>⏱️ CONTROL DE PARTIDA</summary>
            <div class="tool-content">
                <div class="stats-box">
                    <span>BAJAS RED: <b id="val-red">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button style="width:30px" onclick="adjustStat('bajasRed', -1)">-</button>
                        <button style="width:30px" onclick="adjustStat('bajasRed', 1)">+</button>
                    </div>
                </div>
                <div class="stats-box" style="margin-top:5px;">
                    <span>BAJAS BLUE: <b id="val-blue">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button style="width:30px" onclick="adjustStat('bajasBlue', -1)">-</button>
                        <button style="width:30px" onclick="adjustStat('bajasBlue', 1)">+</button>
                    </div>
                </div>
                <label style="font-size: 10px; margin-top: 5px;">DURACIÓN (MIN):</label>
                <input id="mission-duration" type="number" value="60">
                <button id="btn-state-toggle" style="background:var(--red); color:#fff; border:none; margin-top:5px; padding:15px;" onclick="toggleMissionState()">🚀 LANZAR</button>
            </div>
        </details>

        <details open>
            <summary>🛠️ MAPEO TÁCTICO</summary>
            <div class="tool-content">
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 ZONA JUEGO</button>
                <button onclick="startDraw('polygon', 'SAFE_ZONE', this)" style="color:var(--gold); border-color:var(--gold);">🟡 ZONA SEGURA</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 SPAWN ROJO</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 SPAWN AZUL</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="color:var(--red); border-color:var(--red); margin-top:5px;">🗑️ LIMPIAR</button>
            </div>
        </details>

        <button onclick="window.location.href='index.html'" style="margin-top:auto; background:#111; border:none; color:#555; padding:20px;">⬅ VOLVER</button>
    </div>
    
    <div id="map"></div>
</div>

<script>
const db = firebase.database();
let map, drawnItems, currentMissionId = null, currentAtomType = '', isMisionActiva = false;

const ATOM_COLORS = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };

function initMap() {
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
    map = L.map('map', { zoomControl: false, layers: [satellite] }).setView([-34.34, -56.71], 15);
    drawnItems = new L.FeatureGroup().addTo(map);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        layer.atomType = currentAtomType;
        const color = ATOM_COLORS[currentAtomType] || '#0f0';
        if(layer.setStyle) layer.setStyle({ color: color, fillColor: color, fillOpacity: 0.3 });
        drawnItems.addLayer(layer);
    });
    loadMissionList();
}

function loadMissionToEdit(id) {
    if(!id) { location.reload(); return; }
    currentMissionId = id;
    syncOperatives(id);

    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;
        
        // Sincronizar todos los inputs con Firebase
        document.getElementById('mission-name').value = m.nombre || "";
        document.getElementById('mission-history').value = m.historia || "";
        document.getElementById('mission-objectives').value = m.objetivos || "";
        document.getElementById('mission-image-url').value = m.imagen || "";
        document.getElementById('val-red').innerText = m.bajasRed || 0;
        document.getElementById('val-blue').innerText = m.bajasBlue || 0;

        isMisionActiva = m.estado === 'activa';
        const btn = document.getElementById('btn-state-toggle');
        btn.innerText = isMisionActiva ? "🛑 FINALIZAR" : "🚀 LANZAR";
        btn.style.background = isMisionActiva ? "var(--blue)" : "var(--red)";

        drawnItems.clearLayers();
        
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const col = ATOM_COLORS[el.type] || '#0f0';
                if(el.path) layer = L.polygon(el.path, {color: col, fillOpacity: 0.3});
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col, fillOpacity: 0.3});
                else if(el.center) layer = L.marker(el.center);
                
                if(layer) {
                    layer.atomType = el.type;
                    drawnItems.addLayer(layer);
                }
            });

            // CENTRADO AUTOMÁTICO EN LA ZONA DE JUEGO
            if (drawnItems.getLayers().length > 0) {
                setTimeout(() => {
                    map.fitBounds(drawnItems.getBounds(), { 
                        padding: [50, 50],
                        maxZoom: 18 
                    });
                }, 200);
            }
        }
    });
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre requerido");
    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        else if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        else if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });
    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).update({ 
        id: mId, 
        nombre: name, 
        historia: document.getElementById('mission-history').value, 
        objetivos: document.getElementById('mission-objectives').value, 
        imagen: document.getElementById('mission-image-url').value, 
        elementos: elementos 
    });
    alert("MISIÓN GUARDADA");
}

function deleteMission() {
    if (!currentMissionId) return alert("Selecciona misión");
    if (confirm("¿Eliminar?")) db.ref(`misiones/${currentMissionId}`).remove().then(() => location.reload());
}

function toggleMissionState() {
    if (!currentMissionId) return alert("Selecciona una misión");
    if (!isMisionActiva) {
        const duration = parseInt(document.getElementById('mission-duration').value) || 60;
        const endTime = Date.now() + (duration * 60000);
        db.ref(`misiones/${currentMissionId}`).update({ 
            estado: 'activa', 
            endTime: endTime, 
            bajasRed: 0, 
            bajasBlue: 0 
        });
        db.ref('operacion_activa/control').update({ missionId: currentMissionId, activo: true });
    } else {
        db.ref(`misiones/${currentMissionId}`).update({ estado: 'finalizada' });
        db.ref('operacion_activa/control').update({ activo: false });
    }
}

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        const cur = sel.value;
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });
        sel.value = cur;
    });
}

function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }

function startDraw(t, at, b) {
    document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
    b.classList.add('active');
    currentAtomType = at;
    let dr = (t==='polygon') ? new L.Draw.Polygon(map) : (t==='circle') ? new L.Draw.Circle(map) : new L.Draw.Marker(map);
    dr.enable();
}

function clearMap() { if(confirm("¿Limpiar dibujo actual?")) drawnItems.clearLayers(); }

function adjustStat(f, a) { if (currentMissionId) db.ref(`misiones/${currentMissionId}/${f}`).transaction(c => (c || 0) + a); }

function syncOperatives(mId) {
    db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(mId).on('value', snap => {
        const container = document.getElementById('enlisted-list');
        container.innerHTML = '';
        snap.forEach(child => {
            const op = child.val();
            container.innerHTML += `<div class="op-card"><span>${op.callsign}</span><span style="color:var(--gold)">${op.equipo || 'S/E'}</span></div>`;
        });
    });
}

window.onload = initMap;
</script>
</body>
</html>
