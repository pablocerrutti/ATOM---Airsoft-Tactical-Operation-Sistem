<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Gestión de Personal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p: #00ff00; --f: #050505; --gray: #222; --gold: #ffd700; --red: #ff3333; --blue: #3366ff; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }
        
        /* BLOQUEO TOTAL */
        #lock-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--f); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .header { text-align: center; border-bottom: 1px solid var(--p); margin-bottom: 20px; padding-bottom: 10px; flex-shrink: 0; }
        .header p { margin: 5px 0; font-size: 10px; color: var(--p); opacity: 0.8; text-transform: uppercase; }
        
        #operator-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }

        .operator-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--gray);
            padding: 15px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center;
            border-left: 3px solid var(--p);
        }
        
        .role-tag { font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-left: 10px; font-weight: bold; }
        .role-editor { background: var(--blue); color: #fff; }
        .role-admin { background: var(--gold); color: #000; }
        .role-jugador { background: #444; color: #ccc; }

        .stats { font-size: 11px; color: var(--gold); text-align: right; }
        
        .btn-action { 
            background: transparent; border: 1px solid var(--blue); color: var(--blue);
            padding: 8px; font-size: 10px; cursor: pointer; font-family: inherit;
            margin-top: 10px; text-transform: uppercase; font-weight: bold;
        }
        .btn-action:hover { background: var(--blue); color: #fff; }

        .btn-back {
            width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--p); color: var(--p); 
            cursor: pointer; font-weight: bold; text-transform: uppercase; font-family: inherit;
        }

        input { 
            background: #000; border: 1px solid var(--p); color: var(--p); 
            padding: 15px; text-align: center; font-size: 1.5rem; letter-spacing: 10px;
            width: 280px; margin-bottom: 20px; outline: none; border-radius: 0;
        }
    </style>
</head>
<body>

<div id="lock-screen">
    <h3 style="letter-spacing: 5px; margin-bottom: 5px;">A.T.O.M SECURE</h3>
    <p style="font-size: 10px; color: var(--red); margin-bottom: 20px;">SISTEMA RESTRINGIDO - INGRESE CREDENCIAL</p>
    <input type="password" id="access-key" placeholder="****" inputmode="">
    <button class="btn-back" style="width: 280px; background: rgba(0,255,0,0.1);" onclick="verifyAccess()">AUTENTICAR</button>
    <button onclick="location.href='lobby.html'" style="background:none; border:none; color:#444; margin-top:30px; cursor:pointer; font-family: inherit;">[ ABORTAR CONEXIÓN ]</button>
</div>

<div class="header">
    <h2 style="margin:0; letter-spacing: 2px;">GESTIÓN DE OPERADORES</h2>
    <p id="access-level-text">Nivel de Acceso: RESTRINGIDO</p>
</div>

<div id="operator-list">
    </div>

<button class="btn-back" onclick="location.href='lobby.html'">⬅ VOLVER AL LOBBY</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
        databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
        projectId: "atom---sistem"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // CLAVES DE ACCESO TÁCTICO
    const MASTER_KEY = "2024"; 
    const EDITOR_KEY = "1010"; 

    let currentRole = null; 
    let conteoMisiones = {};

    function verifyAccess() {
        const keyInput = document.getElementById('access-key').value.trim();
        
        if (keyInput === MASTER_KEY) {
            currentRole = "admin";
            initSystem();
        } else if (keyInput === EDITOR_KEY) {
            currentRole = "editor";
            initSystem();
        } else {
            alert("⚠️ CREDENCIAL INVÁLIDA. INCIDENTE REPORTADO.");
            document.getElementById('access-key').value = "";
        }
    }

    function initSystem() {
        // 1. Limpiar pantalla de bloqueo
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('access-level-text').innerText = `NIVEL DE ACCESO: ${currentRole.toUpperCase()}`;
        document.getElementById('access-level-text').style.color = currentRole === 'admin' ? 'var(--gold)' : 'var(--blue)';

        // 2. Iniciar escuchas de datos (Solo después de validar)
        loadData();
    }

    function loadData() {
        // Escuchar misiones para el conteo
        db.ref('jugadores_enlistados').on('value', snap => {
            conteoMisiones = {};
            snap.forEach(c => {
                const call = c.val().callsign;
                if(call) conteoMisiones[call] = (conteoMisiones[call] || 0) + 1;
            });
            refreshUI(); // Refrescar cuando cambien las misiones
        });

        // Escuchar lista de usuarios
        db.ref('usuarios').on('value', snap => {
            refreshUI(snap);
        });
    }

    function refreshUI() {
        const listContainer = document.getElementById('operator-list');
        listContainer.innerHTML = '';
        
        db.ref('usuarios').once('value', (snap) => {
            if(!snap.exists()) {
                listContainer.innerHTML = '<p style="text-align:center; opacity:0.5;">NO HAY OPERADORES REGISTRADOS</p>';
                return;
            }

            let dataArr = [];
            snap.forEach(child => {
                let u = child.val();
                u.uid = child.key;
                dataArr.push(u);
            });

            // Ordenar por Callsign
            dataArr.sort((a, b) => (a.callsign || "").localeCompare(b.callsign || ""));

            dataArr.forEach(u => {
                const callsign = u.callsign || "ID_PENDIENTE";
                const role = u.role || "jugador";
                const misiones = conteoMisiones[callsign] || 0;

                const card = document.createElement('div');
                card.className = 'operator-card';
                
                // Lógica de botones: Solo el ADMIN ve el botón y solo en usuarios que son JUGADORES
                const showPromoteBtn = (currentRole === 'admin' && role === 'jugador');

                card.innerHTML = `
                    <div>
                        <span style="font-weight:bold; font-size:1.1rem;">${callsign.toUpperCase()}</span>
                        <span class="role-tag role-${role}">${role.toUpperCase()}</span>
                        <br>
                        ${showPromoteBtn ? 
                            `<button class="btn-action" onclick="promoteUser('${u.uid}', '${callsign}')">⬆ ASCENDER A EDITOR</button>` : 
                            `<div style="height:10px"></div>`}
                    </div>
                    <div class="stats">
                        MISIONES: <span style="color:#fff">${misiones}</span><br>
                        ESTADO: <span style="color:var(--p)">OPERATIVO</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        });
    }

    function promoteUser(uid, name) {
        if(currentRole !== 'admin') return;

        if(confirm(`¿CONFIRMAR ASCENSO PARA ${name}?\n\nPermitirá crear misiones y acceder al Command Center.`)) {
            db.ref(`usuarios/${uid}`).update({ 
                role: 'editor' 
            }).then(() => {
                alert("ACTUALIZACIÓN DE RANGO EXITOSA");
            }).catch(err => {
                alert("ERROR EN BASE DE DATOS: " + err.message);
            });
        }
    }

    // Permitir "Enter" en el input
    document.getElementById('access-key').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyAccess();
    });
</script>

</body>
</html>
