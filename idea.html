<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor Pro</title>
    
    <style>html { display: none; }</style>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --safe:#ffff00; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        /* PANEL LATERAL */
        #panel { 
            width: 300px; 
            background: rgba(5, 5, 5, 0.98); 
            border-right: 1px solid var(--p); 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            z-index: 2000; 
            position: absolute; 
            height: 100%; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .panel-hidden { transform: translateX(-100%); }
        #map { flex: 1; width: 100%; height: 100%; background: #111; z-index: 1; }

        #menu-toggle { 
            position: absolute; top: 15px; left: 15px; z-index: 2100; 
            width: 45px; height: 45px; background: #000; color: var(--p); 
            border: 1px solid var(--p); cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        @media (min-width: 1024px) {
            #panel { position: relative; transform: translateX(0); width: 350px; }
            #menu-toggle { display: none; }
            .panel-hidden { transform: translateX(0); }
        }

        .tool-content { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        summary { padding:12px; cursor:pointer; color:var(--gold); border-bottom: 1px solid #111; font-weight: bold; background: #0a0a0a; outline: none; }
        
        button { 
            width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); 
            cursor:pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; 
        }
        button.active { background: var(--p); color: #000; }
        
        input, textarea, select { 
            background: #000; border: 1px solid #333; color: var(--p); 
            padding: 10px; font-family: inherit; font-size: 13px; width: 100%; box-sizing: border-box;
        }

        .op-card { 
            background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 5px; 
            font-size: 12px; display: flex; justify-content: space-between; align-items: center; 
        }
        
        .stats-box { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border: 1px solid #333; }
        .stat-btn { width: 40px !important; height: 40px; padding: 0 !important; font-size: 20px; }

        .btn-delete { border-color: var(--red) !important; color: var(--red) !important; }
        .btn-delete:hover { background: var(--red); color: #fff; }
        .logout-btn { border-color: #666; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div style="padding:15px; background:#111; border-bottom:1px solid var(--p); text-align:center;">
            <h3 style="margin:0; font-size: 14px; letter-spacing: 1px;">A.T.O.M COMMAND CENTER</h3>
        </div>

        <details open>
            <summary>📂 GESTIÓN DE OPERACIÓN</summary>
            <div class="tool-content">
                <label style="font-size: 10px;">SELECCIONAR MISIÓN:</label>
                <div style="display:flex; gap:5px;">
                    <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                        <option value="">-- NUEVA MISIÓN --</option>
                    </select>
                    <button onclick="loadMissionToEdit(document.getElementById('mission-selector').value)" style="width:60px;">🔄</button>
                </div>
                
                <input id="mission-name" placeholder="Nombre Operación...">
                <textarea id="mission-history" placeholder="Briefing Histórico..." rows="3"></textarea>
                <textarea id="mission-objectives" placeholder="Objetivos Tácticos..." rows="2"></textarea>
                <input id="mission-image-url" placeholder="Ruta URL Portada (Google Drive)...">
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <button class="active" onclick="saveMission()" style="background:var(--p); color:#000; border:none;">💾 GUARDAR</button>
                    <button class="btn-delete" onclick="deleteMission()">🗑️ ELIMINAR</button>
                </div>
            </div>
        </details>

        <details>
            <summary>🛠️ CAPAS Y DIBUJO</summary>
            <div class="tool-content">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button id="btn-sat" class="active" onclick="changeBaseLayer('sat')">SAT</button>
                    <button id="btn-osm" onclick="changeBaseLayer('osm')">MAP</button>
                </div>
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 LÍMITE JUEGO</button>
                <button onclick="startDraw('polygon', 'SAFE_ZONE', this)" style="border-color:var(--safe); color:var(--safe);">🟡 ZONA SEGURA</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 SPAWN ROJO</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 SPAWN AZUL</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="color:var(--red); border-color:var(--red); margin-top:5px;">LIMPIAR DIBUJO</button>
            </div>
        </details>

        <details>
            <summary>👥 ASIGNACIÓN DE EQUIPOS</summary>
            <div class="tool-content" id="enlisted-list">
                <p style="font-size:10px; color:#666; text-align:center;">Carga una misión para ver operadores...</p>
            </div>
        </details>

        <details>
            <summary>🚀 CONTROL EN VIVO</summary>
            <div class="tool-content">
                <div class="stats-box">
                    <span>BAJAS ROJO: <b id="val-red">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button class="stat-btn" onclick="adjustStat('bajasRed', -1)">-</button>
                        <button class="stat-btn" onclick="adjustStat('bajasRed', 1)">+</button>
                    </div>
                </div>
                <div class="stats-box" style="margin-top:5px;">
                    <span>BAJAS AZUL: <b id="val-blue">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button class="stat-btn" onclick="adjustStat('bajasBlue', -1)">-</button>
                        <button class="stat-btn" onclick="adjustStat('bajasBlue', 1)">+</button>
                    </div>
                </div>
                <label style="font-size:10px; margin-top:10px;">DURACIÓN (MIN):</label>
                <input id="mission-duration" type="number" value="60">
                <button id="btn-state-toggle" style="background:var(--red); color:#fff; border:none; margin-top:5px;" onclick="toggleMissionState()">LANZAR OPERACIÓN</button>
            </div>
        </details>

        <div class="tool-content" style="margin-top:auto; padding-bottom: 20px;">
            <button class="logout-btn" onclick="logout()">✖ CERRAR SESIÓN ADMIN</button>
        </div>
    </div>
    <div id="map"></div>
</div>

<script>
// CONFIGURACIÓN FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// ESTADO GLOBAL
let map, drawnItems, currentMissionId = null, currentAtomType = '', isMisionActiva = false;

// CAPAS DE MAPA
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });

// SEGURIDAD
auth.onAuthStateChanged(user => {
    if (user) { 
        document.documentElement.style.display = 'block'; 
        initMap();
    } else { window.location.href = 'login.html'; }
});

function initMap() {
    if (map) return;
    map = L.map('map', { zoomControl: false, layers: [satLayer] }).setView([-34.34, -56.71], 15);
    drawnItems = new L.FeatureGroup().addTo(map);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        layer.atomType = currentAtomType;
        const colors = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ff0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };
        if(layer.setStyle) layer.setStyle({ color: colors[currentAtomType], fillColor: colors[currentAtomType], fillOpacity: 0.3, weight: 2 });
        drawnItems.addLayer(layer);
    });

    loadMissionList();
}

function changeBaseLayer(type) {
    if (type === 'osm') {
        map.removeLayer(satLayer); map.addLayer(osmLayer);
        document.getElementById('btn-osm').classList.add('active');
        document.getElementById('btn-sat').classList.remove('active');
    } else {
        map.removeLayer(osmLayer); map.addLayer(satLayer);
        document.getElementById('btn-sat').classList.add('active');
        document.getElementById('btn-osm').classList.remove('active');
    }
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre de misión requerido");
    
    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        else if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        else if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });

    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).update({
        id: mId,
        nombre: name,
        historia: document.getElementById('mission-history').value,
        objetivos: document.getElementById('mission-objectives').value,
        imagen: document.getElementById('mission-image-url').value,
        elementos: elementos,
        estado: isMisionActiva ? 'activa' : 'reclutando'
    }).then(() => { 
        currentMissionId = mId; 
        alert("MISIÓN GUARDADA CORRECTAMENTE"); 
    });
}

function loadMissionToEdit(id) {
    if(!id) { currentMissionId = null; location.reload(); return; }
    currentMissionId = id;
    syncOperatives(id);
    
    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        if(!m) return;
        
        document.getElementById('mission-name').value = m.nombre;
        document.getElementById('mission-history').value = m.historia || "";
        document.getElementById('mission-objectives').value = m.objetivos || "";
        document.getElementById('mission-image-url').value = m.imagen || "";
        document.getElementById('val-red').innerText = m.bajasRed || 0;
        document.getElementById('val-blue').innerText = m.bajasBlue || 0;
        
        isMisionActiva = m.estado === 'activa';
        updateToggleBtn();

        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const col = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ff0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };
                if(el.path) layer = L.polygon(el.path, {color: col[el.type], fillOpacity: 0.3, weight: 2});
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col[el.type]});
                else layer = L.marker(el.center);
                layer.atomType = el.type;
                drawnItems.addLayer(layer);
            });

            // LÓGICA DE ZOOM CENTRAL: Encuadrar zona de juego
            if (drawnItems.getLayers().length > 0) {
                map.fitBounds(drawnItems.getBounds(), { padding: [40, 40] });
            }
        }
    });
}

function deleteMission() {
    if(!currentMissionId) return alert("Selecciona una misión primero");
    if(confirm("¿ELIMINAR MISIÓN? Esta acción es irreversible.")) {
        db.ref(`misiones/${currentMissionId}`).remove().then(() => {
            alert("MISIÓN ELIMINADA");
            location.reload();
        });
    }
}

function syncOperatives(missionId) {
    db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(missionId).on('value', snap => {
        const container = document.getElementById('enlisted-list');
        container.innerHTML = '';
        snap.forEach(child => {
            const op = child.val();
            container.innerHTML += `
                <div class="op-card">
                    <span>${op.callsign} [${op.equipo || 'S/E'}]</span>
                    <div style="display:flex; gap:3px;">
                        <button style="width:30px;color:var(--red)" onclick="assignTeam('${child.key}', 'RED')">R</button>
                        <button style="width:30px;color:var(--blue)" onclick="assignTeam('${child.key}', 'BLUE')">A</button>
                        <button style="width:30px;" onclick="removeOp('${child.key}')">X</button>
                    </div>
                </div>`;
        });
    });
}

function assignTeam(key, team) { db.ref(`jugadores_enlistados/${key}`).update({ equipo: team }); }
function removeOp(key) { if(confirm("¿Eliminar operador?")) db.ref(`jugadores_enlistados/${key}`).remove(); }

function toggleMissionState() {
    if (!currentMissionId) return alert("Guarda la misión antes de lanzarla");
    isMisionActiva = !isMisionActiva;
    const nuevoEstado = isMisionActiva ? 'activa' : 'reclutando';
    db.ref(`misiones/${currentMissionId}`).update({ 
        estado: nuevoEstado, 
        startTime: isMisionActiva ? Date.now() : null, 
        duration: document.getElementById('mission-duration').value || 60,
        bajasRed: 0, bajasBlue: 0 
    });
    updateToggleBtn();
}

function updateToggleBtn() {
    const btn = document.getElementById('btn-state-toggle');
    btn.innerText = isMisionActiva ? "🛑 ABORTAR OPERACIÓN" : "🚀 LANZAR OPERACIÓN";
    btn.style.background = isMisionActiva ? "var(--blue)" : "var(--red)";
}

function adjustStat(field, amount) { 
    if (!currentMissionId) return; 
    db.ref(`misiones/${currentMissionId}/${field}`).transaction(c => (c || 0) + amount); 
}

function loadMissionList() { 
    db.ref('misiones').on('value', snap => { 
        const sel = document.getElementById('mission-selector'); 
        const current = sel.value; 
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>'; 
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; }); 
        sel.value = current; 
    }); 
}

function startDraw(type, atomType, btn) { 
    document.querySelectorAll('button').forEach(b => b.classList.remove('active')); 
    btn.classList.add('active'); 
    currentAtomType = atomType; 
    let drawer;
    if(type === 'polygon') drawer = new L.Draw.Polygon(map);
    else if(type === 'circle') drawer = new L.Draw.Circle(map);
    else drawer = new L.Draw.Marker(map);
    drawer.enable(); 
}

function clearMap() { if(confirm("¿Limpiar dibujo?")) drawnItems.clearLayers(); }
function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }
function logout() { if(confirm("¿Cerrar sesión?")) auth.signOut().then(()=> window.location.href='index.html'); }
</script>
</body>
</html>
