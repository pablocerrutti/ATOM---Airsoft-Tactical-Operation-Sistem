<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - COMMAND CENTER</title>
    
    <style>html { display: none; }</style>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
            projectId: "atom---sistem",
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(user => {
            if (user) { document.documentElement.style.display = 'block'; } 
            else { window.location.href = 'login.html'; }
        });
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#222; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        
        #access-screen {
            position: fixed; top:0; left:0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #0a1a0a 0%, #050505 100%);
            z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; transition: 0.5s;
        }
        
        .scanner-line {
            position: absolute; top: 0; width: 100%; height: 2px;
            background: var(--p); opacity: 0.3; box-shadow: 0 0 15px var(--p);
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .main-btn {
            width: 320px; padding: 25px; background: rgba(0,255,0,0.05);
            border: 2px solid var(--p); color: var(--p); font-weight: bold;
            text-transform: uppercase; cursor: pointer; letter-spacing: 2px;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .main-btn:hover { background: var(--p); color: #000; box-shadow: 0 0 30px var(--p); }
        
        .wrapper { display: none; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        #panel { 
            width: 300px; background: rgba(5, 5, 5, 0.98); border-right: 1px solid var(--p); 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 2000; 
            position: absolute; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .panel-hidden { transform: translateX(-100%); }
        #map { flex: 1; width: 100%; height: 100%; background: #111; z-index: 1; }

        #menu-toggle { 
            position: absolute; top: 15px; right: 15px; z-index: 2100; 
            width: 45px; height: 45px; background: var(--f); color: var(--p); 
            border: 1px solid var(--p); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        @media (min-width: 1024px) {
            #panel { position: relative; transform: translateX(0); width: 350px; }
            #menu-toggle { display: none; }
        }

        .tool-content { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        summary { padding:12px; cursor:pointer; color:var(--gold); border-bottom: 1px solid #111; font-weight: bold; background: #0a0a0a; }
        
        button { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.2s; }
        button.active { background: var(--p); color: #000; }
        
        input, textarea, select { background: #000; border: 1px solid #333; color: var(--p); padding: 10px; width: 100%; box-sizing: border-box; font-family: monospace; }

        .op-card { background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
        .stats-box { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border: 1px solid #333; }
        
        .btn-team { width: 45px; padding: 5px; font-size: 8px; border: 1px solid #444; }
        .btn-return-command { background: #111; border: 1px solid #444; color: #777; margin-top: 15px; padding: 15px !important; }
    </style>
</head>
<body>

<div id="access-screen">
    <div class="scanner-line"></div>
    <h2 style="letter-spacing: 5px; margin-bottom: 30px; text-shadow: 0 0 10px var(--p);">A.T.O.M SYSTEM</h2>
    
    <button class="main-btn" onclick="window.location.href='operadores1.html'">
        [ BASE DE DATOS OPERADORES ]
    </button>
    
    <button class="main-btn" onclick="openCommandRoom()">
        [ SALA DE COMANDO OPERATIVO ]
    </button>

    <button style="width: 150px; border: none; background: none; color: #444; margin-top: 20px; cursor:pointer;" onclick="window.location.href='index.html'">
        SALIR DEL SISTEMA
    </button>
</div>

<button id="menu-toggle" onclick="togglePanel()">☰</button>

<div class="wrapper" id="main-editor">
    <div id="panel" class="panel-hidden">
        <div style="padding:20px; background:#111; border-bottom:1px solid var(--p); text-align:center;">
            <h3 style="margin:0; letter-spacing: 2px;">COMMAND CENTER</h3>
        </div>

        <details open>
            <summary>📂 CONFIGURACIÓN MISIÓN</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="Nombre Operación...">
                <textarea id="mission-history" placeholder="Briefing / Historia..." rows="2"></textarea>
                <textarea id="mission-objectives" placeholder="Objetivos Tácticos..." rows="2"></textarea>
                <input id="mission-image-url" placeholder="URL Imagen Portada...">
                <button onclick="saveMission()" style="background:var(--gold); color:#000; border:none; margin-top:5px;">💾 GUARDAR CAMBIOS</button>
                <button onclick="deleteMission()" style="background:var(--red); color:#fff; border:none;">🗑️ ELIMINAR MISIÓN</button>
            </div>
        </details>

        <details open>
            <summary>👥 OPERADORES EN LISTA</summary>
            <div class="tool-content" id="enlisted-list">
                <span style="font-size: 10px; opacity: 0.5;">Seleccione misión para asignar equipos...</span>
            </div>
        </details>

        <details open>
            <summary>⏱️ CONTROL DE PARTIDA</summary>
            <div class="tool-content">
                <div class="stats-box">
                    <span>BAJAS RED: <b id="val-red">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button style="width:30px" onclick="adjustStat('bajasRed', -1)">-</button>
                        <button style="width:30px" onclick="adjustStat('bajasRed', 1)">+</button>
                    </div>
                </div>
                <div class="stats-box" style="margin-top:5px;">
                    <span>BAJAS BLUE: <b id="val-blue">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button style="width:30px" onclick="adjustStat('bajasBlue', -1)">-</button>
                        <button style="width:30px" onclick="adjustStat('bajasBlue', 1)">+</button>
                    </div>
                </div>
                <input id="mission-duration" type="number" value="60" style="margin-top:10px;">
                <button id="btn-state-toggle" style="background:var(--red); color:#fff; border:none; margin-top:5px;" onclick="toggleMissionState()">🚀 LANZAR</button>
            </div>
        </details>

        <details open>
            <summary>🛠️ MAPEO TÁCTICO</summary>
            <div class="tool-content">
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 ZONA JUEGO</button>
                <button onclick="startDraw('polygon', 'SAFE_ZONE', this)" style="color:var(--gold); border-color:var(--gold);">🟡 ZONA SEGURA</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 SPAWN ROJO</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 SPAWN AZUL</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="color:var(--red); border-color:var(--red); margin-top:5px;">🗑️ LIMPIAR MAPA</button>
                
                <button class="btn-return-command" onclick="closeCommandRoom()">⬅ VOLVER AL MENÚ TÁCTICO</button>
            </div>
        </details>
    </div>
    
    <div id="map"></div>
</div>

<script>
const db = firebase.database();
let map, drawnItems, currentMissionId = null, currentAtomType = '', isMisionActiva = false;

const ATOM_COLORS = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };

function openCommandRoom() {
    document.getElementById('access-screen').style.display = 'none';
    document.getElementById('main-editor').style.display = 'flex';
    if(!map) initMap();
}

function closeCommandRoom() {
    document.getElementById('access-screen').style.display = 'flex';
    document.getElementById('main-editor').style.display = 'none';
}

function initMap() {
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
    map = L.map('map', { zoomControl: false, layers: [satellite] }).setView([-34.34, -56.71], 15);
    drawnItems = new L.FeatureGroup().addTo(map);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        layer.atomType = currentAtomType;
        const color = ATOM_COLORS[currentAtomType] || '#0f0';
        if(layer.setStyle) layer.setStyle({ color: color, fillColor: color, fillOpacity: 0.3 });
        drawnItems.addLayer(layer);
    });
    loadMissionList();
}

function loadMissionToEdit(id) {
    if(!id) { location.reload(); return; }
    currentMissionId = id;
    syncOperatives(id); // Activa la escucha de operadores para esta misión
    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;
        document.getElementById('mission-name').value = m.nombre;
        document.getElementById('val-red').innerText = m.bajasRed || 0;
        document.getElementById('val-blue').innerText = m.bajasBlue || 0;
        isMisionActiva = m.estado === 'activa';
        const btn = document.getElementById('btn-state-toggle');
        btn.innerText = isMisionActiva ? "🛑 FINALIZAR" : "🚀 LANZAR";
        btn.style.background = isMisionActiva ? "var(--blue)" : "var(--red)";
        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const col = ATOM_COLORS[el.type] || '#0f0';
                if(el.path) layer = L.polygon(el.path, {color: col, fillOpacity: 0.3});
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col, fillOpacity: 0.3});
                else if(el.center) layer = L.marker(el.center);
                layer.atomType = el.type;
                drawnItems.addLayer(layer);
            });
            if (drawnItems.getLayers().length > 0) map.fitBounds(drawnItems.getBounds(), {padding:[40,40]});
        }
    });
}

function syncOperatives(mId) {
    db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(mId).on('value', snap => {
        const container = document.getElementById('enlisted-list');
        container.innerHTML = '';
        
        if(!snap.exists()) {
            container.innerHTML = '<span style="font-size:10px; opacity:0.5;">Esperando operadores...</span>';
            return;
        }

        snap.forEach(child => {
            const op = child.val();
            const opKey = child.key;
            const equipoColor = op.equipo === 'RED' ? 'var(--red)' : (op.equipo === 'BLUE' ? 'var(--blue)' : '#777');
            
            const card = document.createElement('div');
            card.className = 'op-card';
            card.innerHTML = `
                <span style="color:${equipoColor}">[${op.callsign}]</span>
                <div style="display:flex; gap:3px;">
                    <button class="btn-team" onclick="setTeam('${opKey}', 'RED')" style="color:var(--red)">RED</button>
                    <button class="btn-team" onclick="setTeam('${opKey}', 'BLUE')" style="color:var(--blue)">BLUE</button>
                </div>
            `;
            container.appendChild(card);
        });
    });
}

function setTeam(opKey, team) {
    db.ref(`jugadores_enlistados/${opKey}`).update({ 
        equipo: team,
        status: 'EQUIPADO'
    });
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre requerido");
    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        else if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        else if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });
    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).update({ 
        id: mId, nombre: name, 
        historia: document.getElementById('mission-history').value, 
        objetivos: document.getElementById('mission-objectives').value, 
        imagen_url: document.getElementById('mission-image-url').value, 
        elementos: elementos 
    });
    alert("INTELIGENCIA GUARDADA");
}

function toggleMissionState() {
    if(!currentMissionId) return alert("Seleccione una misión primero");
    const nuevoEstado = isMisionActiva ? 'inactiva' : 'activa';
    db.ref(`misiones/${currentMissionId}/estado`).set(nuevoEstado);
}

function adjustStat(f, a) { 
    if (currentMissionId) db.ref(`misiones/${currentMissionId}/${f}`).transaction(c => (c || 0) + a); 
}

function startDraw(t, at, b) {
    document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
    b.classList.add('active');
    currentAtomType = at;
    let dr = (t==='polygon') ? new L.Draw.Polygon(map) : (t==='circle') ? new L.Draw.Circle(map) : new L.Draw.Marker(map);
    dr.enable();
}

function clearMap() { if(confirm("¿Limpiar?")) drawnItems.clearLayers(); }
function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        const cur = sel.value;
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre.toUpperCase()}</option>`; });
        sel.value = cur;
    });
}
</script>
</body>
</html>
