<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operadores Registrados</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p: #00ff00; --f: #050505; --gray: #222; --gold: #ffd700; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        .header { text-align: center; border-bottom: 1px solid var(--p); margin-bottom: 20px; padding-bottom: 10px; flex-shrink: 0; }
        .header p { margin: 5px 0; font-size: 10px; color: var(--p); opacity: 0.8; }
        
        #operator-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }

        .operator-card {
            background: rgba(0, 255, 0, 0.03);
            border: 1px solid var(--gray);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .callsign { font-size: 18px; font-weight: bold; color: var(--p); text-transform: uppercase; }
        .stats { font-size: 11px; color: var(--gold); text-align: right; line-height: 1.4; }
        .mision-count { font-size: 16px; color: #fff; font-weight: bold; }
        
        .btn-back {
            width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--p); color: var(--p); 
            cursor: pointer; font-family: inherit; font-weight: bold;
            text-transform: uppercase; flex-shrink: 0;
        }
        .btn-back:active { background: var(--p); color: #000; }
        .loading { text-align: center; font-style: italic; opacity: 0.6; padding: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 1.2rem;">OPERADORES ACTIVOS</h2>
    <p>A.T.O.M. - REGISTRO CENTRAL DE FUERZAS</p>
</div>

<div id="operator-list">
    <p class="loading">SINCRONIZANDO CON RED TÁCTICA...</p>
</div>

<button class="btn-back" onclick="location.href='lobby.html'">⬅ VOLVER AL LOBBY</button>

<script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
      databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
      projectId: "atom---sistem"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const listContainer = document.getElementById('operator-list');

    async function loadOperators() {
        // Obtenemos los usuarios y las misiones de forma paralela
        db.ref('usuarios').on('value', async (snapUsuarios) => {
            if (!snapUsuarios.exists()) {
                listContainer.innerHTML = '<p class="loading">NO HAY REGISTROS EN LA BASE</p>';
                return;
            }

            // Consultamos la tabla de alistados para contar participaciones reales
            const snapElistados = await db.ref('jugadores_enlistados').once('value');
            const enlistadosData = snapElistados.val() || {};
            
            // Procesar conteo
            const conteoMisiones = {};
            Object.values(enlistadosData).forEach(reg => {
                if(reg.callsign) {
                    conteoMisiones[reg.callsign] = (conteoMisiones[reg.callsign] || 0) + 1;
                }
            });

            listContainer.innerHTML = ''; // Limpiar contenedor

            snapUsuarios.forEach((child) => {
                const user = child.val();
                const callsign = user.callsign || "DESCONOCIDO";
                const totalMisiones = conteoMisiones[callsign] || 0;

                const card = document.createElement('div');
                card.className = 'operator-card';
                card.innerHTML = `
                    <div class="callsign">${callsign}</div>
                    <div class="stats">
                        MISIONES: <span class="mision-count">${totalMisiones}</span><br>
                        SITUACIÓN: <span style="color:#0f0">DISPONIBLE</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        });
    }

    // Iniciar carga
    loadOperators();
</script>

</body>
</html>
