<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operadores Registrados</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p: #00ff00; --f: #050505; --gray: #222; --gold: #ffd700; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        .header { text-align: center; border-bottom: 1px solid var(--p); margin-bottom: 20px; padding-bottom: 10px; flex-shrink: 0; }
        .header p { margin: 5px 0; font-size: 10px; color: var(--p); opacity: 0.8; text-transform: uppercase; }
        
        #operator-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }

        .operator-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--gray);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--p);
        }
        .callsign { font-size: 18px; font-weight: bold; color: var(--p); text-transform: uppercase; letter-spacing: 1px; }
        .stats { font-size: 11px; color: var(--gold); text-align: right; line-height: 1.4; }
        .mision-count { font-size: 16px; color: #fff; font-weight: bold; }
        
        .btn-back {
            width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--p); color: var(--p); 
            cursor: pointer; font-family: inherit; font-weight: bold;
            text-transform: uppercase; flex-shrink: 0;
        }
        .loading { text-align: center; font-style: italic; opacity: 0.6; padding: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 1.2rem; letter-spacing: 2px;">OPERADORES A.T.O.M.</h2>
    <p>Base de Datos de Personal Registrado</p>
</div>

<div id="operator-list">
    <p class="loading">ESTABLECIENDO CONEXIÓN CON EL NODO CENTRAL...</p>
</div>

<button class="btn-back" onclick="location.href='lobby.html'">⬅ VOLVER AL LOBBY</button>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
      databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
      projectId: "atom---sistem"
    };

    // Inicializar Firebase solo si no se ha hecho
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const listContainer = document.getElementById('operator-list');

    function loadOperators() {
        console.log("Iniciando conexión a /usuarios...");
        
        // Primero obtenemos las misiones para tener el conteo listo
        db.ref('jugadores_enlistados').once('value').then(snapE => {
            const enlistadosData = snapE.val() || {};
            const conteoMisiones = {};
            
            Object.values(enlistadosData).forEach(reg => {
                if(reg.callsign) {
                    conteoMisiones[reg.callsign] = (conteoMisiones[reg.callsign] || 0) + 1;
                }
            });

            // Ahora escuchamos los usuarios
            db.ref('usuarios').on('value', (snapU) => {
                console.log("Datos recibidos de /usuarios:", snapU.val());
                
                if (!snapU.exists()) {
                    listContainer.innerHTML = '<p class="loading">ERROR: NO SE ENCONTRARON REGISTROS O ACCESO DENEGADO</p>';
                    return;
                }

                listContainer.innerHTML = ''; 

                snapU.forEach((child) => {
                    const user = child.val();
                    // Si el callsign no existe directo, lo buscamos en los datos
                    const callsign = user.callsign || user.nombre || "OP-" + child.key.substring(0, 5);
                    const totalMisiones = conteoMisiones[callsign] || 0;

                    const card = document.createElement('div');
                    card.className = 'operator-card';
                    card.innerHTML = `
                        <div class="callsign">${callsign}</div>
                        <div class="stats">
                            PARTICIPACIONES: <span class="mision-count">${totalMisiones}</span><br>
                            ESTADO: <span style="color:#0f0">ACTIVO</span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Error de Firebase:", error);
                listContainer.innerHTML = `<p class="loading">ERROR DE RED: ${error.message}</p>`;
            });
        });
    }

    loadOperators();
</script>

</body>
</html>
