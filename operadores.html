<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operadores Registrados</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p: #00ff00; --f: #050505; --gray: #222; --gold: #ffd700; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        .header { text-align: center; border-bottom: 1px solid var(--p); margin-bottom: 20px; padding-bottom: 10px; flex-shrink: 0; }
        .header p { margin: 5px 0; font-size: 10px; color: var(--p); opacity: 0.8; text-transform: uppercase; }
        
        #operator-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }

        .operator-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--gray);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--p);
        }
        .callsign { font-size: 18px; font-weight: bold; color: var(--p); text-transform: uppercase; letter-spacing: 1px; }
        .stats { font-size: 11px; color: var(--gold); text-align: right; line-height: 1.4; }
        .mision-count { font-size: 16px; color: #fff; font-weight: bold; }
        
        .btn-back {
            width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--p); color: var(--p); 
            cursor: pointer; font-family: inherit; font-weight: bold;
            text-transform: uppercase; flex-shrink: 0;
        }
        .loading { text-align: center; font-style: italic; opacity: 0.6; padding: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 1.2rem; letter-spacing: 2px;">OPERADORES A.T.O.M.</h2>
    <p>Base de Datos de Personal Registrado</p>
</div>

<div id="operator-list">
    <p class="loading">ESTABLECIENDO CONEXIÓN CON EL NODO CENTRAL...</p>
</div>

<button class="btn-back" onclick="location.href='lobby.html'">⬅ VOLVER AL LOBBY</button>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
      databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
      projectId: "atom---sistem"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listContainer = document.getElementById('operator-list');

    // Diccionario global para el conteo de misiones
    let conteoMisiones = {};

    function loadOperators() {
        console.log("Sincronizando base de datos...");

        // 1. Cargamos el conteo de misiones de forma independiente
        db.ref('jugadores_enlistados').on('value', (snapE) => {
            conteoMisiones = {};
            if(snapE.exists()) {
                Object.values(snapE.val()).forEach(reg => {
                    if(reg.callsign) {
                        conteoMisiones[reg.callsign] = (conteoMisiones[reg.callsign] || 0) + 1;
                    }
                });
            }
            // Si ya hay usuarios renderizados, forzamos una actualización de los números
            actualizarNumeros();
        });

        // 2. Cargamos la lista de usuarios (Rama Principal)
        db.ref('usuarios').on('value', (snapU) => {
            if (!snapU.exists()) {
                listContainer.innerHTML = '<p class="loading">SISTEMA VACÍO: NO HAY REGISTROS</p>';
                return;
            }

            listContainer.innerHTML = ''; 

            snapU.forEach((child) => {
                const user = child.val();
                // Prioridad: 1. callsign grabado, 2. nombre grabado, 3. ID de nodo
                const callsign = user.callsign || user.nombre || "OP-" + child.key.substring(0, 5);
                const misiones = conteoMisiones[callsign] || 0;

                const card = document.createElement('div');
                card.className = 'operator-card';
                card.setAttribute('data-callsign', callsign); // Para actualizar luego
                card.innerHTML = `
                    <div class="callsign">${callsign}</div>
                    <div class="stats">
                        PARTICIPACIONES: <span class="mision-count">${misiones}</span><br>
                        ESTADO: <span style="color:#0f0">ACTIVO</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }, (error) => {
            console.error("Error en /usuarios:", error);
            listContainer.innerHTML = `<p class="loading">FALLO DE ACCESO: ${error.message}</p>`;
        });
    }

    // Función para actualizar misiones sin recargar toda la lista
    function actualizarNumeros() {
        const cards = document.querySelectorAll('.operator-card');
        cards.forEach(card => {
            const cs = card.getAttribute('data-callsign');
            const span = card.querySelector('.mision-count');
            if(span) span.innerText = conteoMisiones[cs] || 0;
        });
    }

    loadOperators();
</script>

</body>
</html>
