<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - ACCESO</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; }
        body { background:var(--f); color:var(--p); font-family:monospace; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
        #box { border:2px solid var(--p); padding:25px; width:90%; max-width:320px; text-align:center; background:#000; box-shadow:0 0 20px #00ff0033; }
        input { width:100%; padding:10px; margin-top:10px; background:#111; border:1px solid var(--p); color:var(--p); text-align:center; box-sizing: border-box; }
        button { width:100%; margin-top:15px; padding:10px; background:#111; border:1px solid var(--p); color:var(--p); cursor:pointer; font-family: inherit; font-weight: bold; }
        button:hover { background:var(--p); color:#000; }
        .btn-back { border-color: #555; color: #888; font-size: 11px; margin-top: 10px; }
        #status { margin-top:10px; font-size:12px; height:15px; }
        button:disabled { opacity:0.5; cursor:not-allowed; }
    </style>
</head>
<body>

<div id="box">
    <h3>A.T.O.M ACCESS</h3>
    <input id="email" placeholder="EMAIL">
    <input id="pass" type="password" placeholder="CLAVE">
    <button id="btn" onclick="login()">INGRESAR</button>
    <button class="btn-back" onclick="location.href='index.html'">VOLVER AL INICIO</button>
    <div id="status"></div>
</div>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB2P-Zl04sS6R8uKglOpomqzf-D28L8drM",
  authDomain: "atomv2-80e64.firebaseapp.com",
  projectId: "atomv2-80e64",
  storageBucket: "atomv2-80e64.firebasestorage.app",
  messagingSenderId: "602132928481",
  appId: "1:602132928481:web:de8238451dbfb6b02564a0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isLoading = false;

function setStatus(t,c){
    let s=document.getElementById("status");
    s.innerText=t;
    s.style.color=c;
}

function login(){
    if(isLoading) return;

    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("pass").value.trim();
    const btn   = document.getElementById("btn");

    if(!email || !pass){
        setStatus("DATOS INCOMPLETOS","orange");
        return;
    }

    isLoading = true;
    btn.disabled = true;
    setStatus("AUTENTICANDO...","var(--p)");

    auth.signInWithEmailAndPassword(email,pass)
    .then(async (cred)=>{
        const uid = cred.user.uid;
        // Buscamos el perfil en la rama de usuarios
        const snap = await db.ref("usuarios/"+uid).once("value");
        const data = snap.val();

        if(!data){
            setStatus("SIN PERFIL DE USUARIO","red");
            auth.signOut();
            reset();
            return;
        }

        // Normalizamos el rol y guardamos en localStorage
        const rol = data.rol ? data.rol.toUpperCase() : "JUGADOR";
        const usuario = {
            id: uid,
            email: email,
            callsign: data.callsign || "OPERADOR",
            rol: rol
        };

        localStorage.setItem("usuario", JSON.stringify(usuario));
        setStatus("ACCESO CONCEDIDO","lime");

        // Lógica de redirección según rol
        setTimeout(()=>{
            if(rol === "ADMIN" || rol === "EDITOR") {
                // Roles de gestión van a hub2.html
                location.href = "hub2.html";
            } else {
                // Jugadores estándar van a hub.html
                location.href = "hub.html";
            }
        }, 600);

    })
    .catch(err=>{
        setStatus("ERROR DE ACCESO","red");
        console.error(err);
        reset();
    });
}

function reset(){
    isLoading = false;
    document.getElementById("btn").disabled = false;
}
</script>

</body>
</html>
