<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Acceso</title>

<style>
:root { --p:#00ff00; --f:#050505; --red:#ff3333; }

body {
 background:var(--f);
 color:var(--p);
 font-family:monospace;
 margin:0;
 display:flex;
 align-items:center;
 justify-content:center;
 height:100vh;
}

#login-box {
 border:2px solid var(--p);
 padding:25px;
 width:90%;
 max-width:320px;
 text-align:center;
 background:#000;
 box-shadow:0 0 20px #00ff0033;
}

input {
 width:100%;
 padding:10px;
 margin-top:10px;
 background:#111;
 border:1px solid var(--p);
 color:var(--p);
 text-align:center;
}

button {
 width:100%;
 margin-top:15px;
 padding:10px;
 background:#111;
 border:1px solid var(--p);
 color:var(--p);
 cursor:pointer;
}

button:hover {
 background:var(--p);
 color:#000;
}

#status {
 margin-top:10px;
 font-size:12px;
}
</style>
</head>

<body>

<div id="login-box">

<h3>A.T.O.M ACCESS</h3>

<input id="email" placeholder="EMAIL">
<input id="pass" type="password" placeholder="CLAVE">

<button onclick="login()">INGRESAR</button>

<div id="status"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"TU_API_KEY",
 authDomain:"TU_PROJECT.firebaseapp.com",
 databaseURL:"https://TU_PROJECT-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

function setStatus(t,c){
 let s=document.getElementById("status");
 s.innerText=t;
 s.style.color=c;
}

/* 🔐 LOGIN */
function login(){

 let email=document.getElementById("email").value;
 let pass=document.getElementById("pass").value;

 if(!email || !pass){
  setStatus("DATOS INCOMPLETOS","orange");
  return;
 }

 setStatus("AUTENTICANDO...","var(--p)");

 auth.signInWithEmailAndPassword(email,pass)
 .then(async (cred)=>{

  const uid = cred.user.uid;

  const snap = await db.ref("usuarios/"+uid).once("value");
  const data = snap.val();

  if(!data){
   setStatus("SIN PERFIL DE USUARIO","red");
   auth.signOut();
   return;
  }

  const usuario = {
   id: uid,
   email: email,
   callsign: data.callsign,
   rol: data.rol
  };

  localStorage.setItem("usuario", JSON.stringify(usuario));

  setStatus("ACCESO CONCEDIDO","lime");

  setTimeout(()=>{

   if(data.rol === "ADMIN"){
    location.href="admin.html";
   }
   else if(data.rol === "EDITOR"){
    location.href="admin.html";
   }
   else{
    location.href="misiones.html";
   }

  },700);

 })
 .catch(err=>{
  setStatus("ERROR: "+err.message,"red");
 });

}

</script>

</body>
</html>
