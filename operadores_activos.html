<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Cuadro de Honor</title>

<style>
:root { --p:#00ff00; --f:#050505; --gold:#ffd700; }

body {
 background:var(--f);
 color:var(--p);
 font-family:monospace;
 margin:0;
 padding:20px;
}

h2 { text-align:center; letter-spacing: 4px; color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
h3 { border-left: 4px solid var(--p); padding-left: 10px; margin-top: 30px; text-transform: uppercase; }

/* Estilo para Escuadrones */
.escuadron-card {
 background: #111;
 border: 1px solid var(--gold);
 margin-bottom: 20px;
 padding: 15px;
 display: flex;
 align-items: center;
 gap: 20px;
}

.escudo {
 width: 80px;
 height: 80px;
 border: 1px solid var(--p);
 object-fit: cover;
 background: #000;
}

.escuadron-info { flex: 1; }
.escuadron-nombre { font-size: 1.2rem; font-weight: bold; color: var(--gold); display: block; }
.miembros-lista { font-size: 0.9rem; color: #ccc; margin-top: 5px; }

/* Estilo para Operadores Individuales */
.lista-operadores {
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
 gap: 10px;
}

.operador-tag {
 background: #000;
 border: 1px solid var(--p);
 padding: 10px;
 text-align: center;
 font-weight: bold;
}

button {
 width: 100%;
 margin-top: 30px;
 padding: 12px;
 background: #000;
 border: 1px solid var(--p);
 color: var(--p);
 cursor: pointer;
 font-family: inherit;
}

button:hover { background: var(--p); color: #000; }
</style>
</head>

<body>

<h2>CUADRO DE HONOR A.T.O.M</h2>

<!-- Sección de Escuadrones -->
<h3>🛡️ ESCUADRONES ACTIVOS</h3>
<div id="lista-escuadrones">Cargando unidades...</div>

<!-- Sección de Operadores -->
<h3>👤 OPERADORES REGISTRADOS</h3>
<div id="lista-operadores" class="lista-operadores">Cargando operadores...</div>

<button onclick="volver()">VOLVER AL HUB</button>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Ejecutar al cargar la página
document.addEventListener("DOMContentLoaded", () => {
    cargarEscuadrones();
    cargarOperadores();
});

// 🛡️ CARGAR ESCUADRONES (Desde la rama creada por escuadrones.html)
function cargarEscuadrones() {
    db.ref("escuadrones").on("value", snap => {
        const cont = document.getElementById("lista-escuadrones");
        cont.innerHTML = "";

        if (!snap.exists()) {
            cont.innerHTML = "<p>No hay escuadrones registrados aún.</p>";
            return;
        }

        snap.forEach(child => {
            const esc = child.val();
            // Se asume que integrantes es un string o array de callsigns
            const listaMiembros = Array.isArray(esc.integrantes) ? esc.integrantes.join(", ") : esc.integrantes;

            cont.innerHTML += `
            <div class="escuadron-card">
                <img src="${esc.escudo || 'https://via.placeholder.com/80?text=🛡️'}" class="escudo" alt="Escudo">
                <div class="escuadron-info">
                    <span class="escuadron-nombre">${esc.nombre.toUpperCase()}</span>
                    <div class="miembros-lista">Miembros: ${listaMiembros || "No especificados"}</div>
                </div>
            </div>
            `;
        });
    });
}

// 👤 CARGAR OPERADORES (Listado general de la comunidad)
function cargarOperadores() {
    db.ref("usuarios").on("value", snap => {
        const cont = document.getElementById("lista-operadores");
        cont.innerHTML = "";

        snap.forEach(child => {
            const u = child.val();
            cont.innerHTML += `
                <div class="operador-tag">
                    ${u.callsign || "S/N"}
                </div>
            `;
        });
    });
}

function volver() {
    // Redirige al HUB de usuario común
    location.href = "hub2.html";
}
</script>

</body>
</html>
