<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Cuadro de Honor</title>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --grey:#333; }

        body {
            background:var(--f);
            color:var(--p);
            font-family:monospace;
            margin:0;
            padding:20px;
        }

        h2 { text-align:center; letter-spacing: 4px; color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 10px; text-transform: uppercase; }
        h3 { border-left: 4px solid var(--p); padding-left: 10px; margin-top: 30px; text-transform: uppercase; font-size: 1rem; }

        /* Estilo para Escuadrones */
        .escuadron-card {
            background: #0a0a0a;
            border: 1px solid var(--gold);
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
        }
        .escuadron-card:hover { background: #111; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .escudo {
            width: 70px;
            height: 70px;
            border: 1px solid var(--p);
            object-fit: cover;
            background: #000;
            border-radius: 5px;
        }

        .escuadron-info { flex: 1; }
        .escuadron-nombre { font-size: 1.1rem; font-weight: bold; color: var(--gold); display: block; letter-spacing: 1px; }
        .miembros-lista { font-size: 0.85rem; color: #aaa; margin-top: 5px; line-height: 1.4; }

        /* Estilo para Operadores Individuales */
        .lista-operadores {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .operador-tag {
            background: #000;
            border: 1px solid var(--p);
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .operador-tag:hover { background: var(--p); color: #000; }

        .btn-volver {
            width: 100%;
            margin-top: 40px;
            padding: 15px;
            background: #000;
            border: 1px solid var(--p);
            color: var(--p);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn-volver:hover { background: var(--p); color: #000; }

        .loading { color: var(--grey); font-style: italic; text-align: center; grid-column: 1 / -1; padding: 20px; }
    </style>
</head>

<body>

<h2>🎖️ CUADRO DE HONOR A.T.O.M</h2>

<!-- Sección de Escuadrones -->
<h3>🛡️ ESCUADRONES REGISTRADOS</h3>
<div id="lista-escuadrones">
    <div class="loading">Sincronizando base de datos...</div>
</div>

<!-- Sección de Operadores -->
<h3>👤 OPERADORES DE LA COMUNIDAD</h3>
<div id="lista-operadores" class="lista-operadores">
    <div class="loading">Buscando señales GPS...</div>
</div>

<button class="btn-volver" onclick="location.href='hub2.html'">🔙 VOLVER AL HUB</button>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
// Configuración de Firebase (Verificada con tus datos anteriores)
const firebaseConfig = {
    apiKey: "AIzaSyB2P-Zl04sS6R8uKglOpomqzf-D28L8drM",
  authDomain: "atomv2-80e64.firebaseapp.com",
  projectId: "atomv2-80e64",
  storageBucket: "atomv2-80e64.firebasestorage.app",
  messagingSenderId: "602132928481",
  appId: "1:602132928481:web:de8238451dbfb6b02564a0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Cargar datos al iniciar
document.addEventListener("DOMContentLoaded", () => {
    cargarEscuadrones();
    cargarOperadores();
});

// 🛡️ CARGAR ESCUADRONES
function cargarEscuadrones() {
    db.ref("escuadrones").on("value", snap => {
        const cont = document.getElementById("lista-escuadrones");
        cont.innerHTML = "";

        if (!snap.exists()) {
            cont.innerHTML = "<div class='loading'>No hay unidades tácticas registradas.</div>";
            return;
        }

        snap.forEach(child => {
            const esc = child.val();
            // Formatear lista de integrantes si es un array o string
            let lista = "Sin miembros";
            if (esc.integrantes) {
                lista = Array.isArray(esc.integrantes) ? esc.integrantes.join(", ") : esc.integrantes;
            }

            cont.innerHTML += `
            <div class="escuadron-card">
                <img src="${esc.escudo || 'https://via.placeholder.com/80?text=🛡️'}" class="escudo" alt="Escudo">
                <div class="escuadron-info">
                    <span class="escuadron-nombre">${esc.nombre.toUpperCase()}</span>
                    <div class="miembros-lista">MIEMBROS: ${lista}</div>
                </div>
            </div>
            `;
        });
    });
}

// 👤 CARGAR OPERADORES (Cuadro de Honor)
function cargarOperadores() {
    // Escuchamos la rama 'usuarios' donde se guardan los perfiles al registrarse
    db.ref("usuarios").on("value", snap => {
        const cont = document.getElementById("lista-operadores");
        cont.innerHTML = "";

        if (!snap.exists()) {
            cont.innerHTML = "<div class='loading'>Sin operadores registrados.</div>";
            return;
        }

        let totalOperadores = 0;

        snap.forEach(child => {
            const u = child.val();
            // Solo mostrar si tiene un Callsign válido
            if (u.callsign) {
                cont.innerHTML += `
                    <div class="operador-tag">
                        ${u.callsign}
                    </div>
                `;
                totalOperadores++;
            }
        });

        if (totalOperadores === 0) {
            cont.innerHTML = "<div class='loading'>Esperando reclutas...</div>";
        }
    });
}
</script>

</body>
</html>
