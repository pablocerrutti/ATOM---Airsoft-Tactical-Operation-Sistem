<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - LOBBY DE OPERACIONES</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --red:#ff3333; --blue:#3366ff; --shadow: rgba(0, 255, 0, 0.2); }
        
        body { 
            margin:0; font-family: 'Courier New', monospace; background: var(--f); color: var(--p); 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        /* CAPAS DE NAVEGACIÓN */
        .view-layer { display: none; width: 100%; flex-direction: column; align-items: center; padding: 20px 0; animation: fadeIn 0.4s ease; }
        .active-view { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PANTALLA 1: MENÚ PRINCIPAL */
        #lobby-main { justify-content: center; height: 100vh; gap: 20px; }
        
        /* PANTALLA 3: FICHA TÉCNICA */
        .mission-header {
            width: 100%; height: 220px;
            background-size: cover; background-position: center;
            border-bottom: 2px solid var(--p); position: relative;
            display: flex; align-items: flex-end;
        }
        .op-title-banner {
            background: rgba(0,0,0,0.85); width: 100%; padding: 15px 0;
            text-align: center; font-weight: bold; border-top: 1px solid var(--p);
            letter-spacing: 3px; text-shadow: 0 0 10px var(--p);
        }

        /* BOTONES TÁCTICOS */
        .btn { 
            width: 85%; max-width: 320px; padding: 18px; border: 1px solid var(--p); 
            background: rgba(0,20,0,0.5); color: var(--p); font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover { background: var(--p); color: #000; box-shadow: 0 0 20px var(--p); }
        
        .btn-enlist { 
            background: var(--red); color: #fff; border: none; font-size: 18px;
            animation: pulse-red 2s infinite; margin-top: 20px;
        }

        /* BOTONES DE NAVEGACIÓN GPS */
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .btn-gps { 
            padding: 12px; font-size: 10px; border: 1px solid #444; background: #111; color: #fff; 
            cursor: pointer; text-transform: uppercase; font-weight: bold;
        }
        .btn-google { border-color: #4285F4; color: #4285F4; }
        .btn-waze { border-color: #3366ff; color: #3366ff; }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        /* CONTENEDORES */
        .panel { width: 90%; max-width: 450px; background: rgba(0,10,0,0.95); border: 1px solid var(--p); padding: 20px; margin-top: 15px; box-sizing: border-box; }
        .info-box { font-size: 12px; background: rgba(0,40,0,0.4); padding: 12px; border-left: 3px solid var(--gold); margin-bottom: 15px; color: #fff; line-height: 1.4; }
        
        #mini-map { width: 100%; height: 180px; border: 1px solid #333; margin: 10px 0; background: #000; }
        
        select { 
            width: 100%; padding: 15px; background: #000; border: 1px solid var(--p); 
            color: var(--p); margin-bottom: 20px; font-family: monospace; font-size: 14px;
        }

        .label-tag { font-size: 10px; color: var(--p); opacity: 0.8; text-transform: uppercase; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div id="lobby-main" class="view-layer active-view">
        <h1 style="font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 30px;">LOBBY TÁCTICO</h1>
        <button class="btn" onclick="showView('selector-screen')">SALA DE DESPLIEGUE TÁCTICO</button>
        <button class="btn" onclick="window.location.href='operadores.html'">COMPAÑEROS EN ARMAS</button>
        <button class="btn" style="border-color:#444; color:#666;" onclick="window.location.href='index.html'">VOLVER</button>
    </div>

    <div id="selector-screen" class="view-layer">
        <h2 style="letter-spacing: 3px; text-align: center;">DIRECTORIO DE OPERACIONES</h2>
        <div class="panel">
            <span class="label-tag">Conexión con Satélite...</span>
            <select id="mission-selector">
                <option value="">-- SELECCIONAR MISIÓN --</option>
            </select>
            <button class="btn" style="width:100%;" onclick="loadMissionDetail()">VER INTELIGENCIA (SITREP)</button>
            <button class="btn" style="width:100%; border:none; color:var(--red); font-size: 11px;" onclick="showView('lobby-main')">CANCELAR</button>
        </div>
    </div>

    <div id="mission-detail" class="view-layer">
        <div class="mission-header" id="det-img">
            <div class="op-title-banner" id="det-name">OPERACIÓN: ---</div>
        </div>
        
        <div class="panel">
            <span class="label-tag">Ubicación y Mapa</span>
            <div id="mini-map"></div>

            <div class="nav-grid">
                <button class="btn-gps btn-google" id="gps-google" onclick="openGPS('google')">GOOGLE MAPS</button>
                <button class="btn-gps btn-waze" id="gps-waze" onclick="openGPS('waze')">WAZE</button>
            </div>
            
            <span class="label-tag" style="color: var(--gold); margin-top: 15px;">Antecedentes / Briefing</span>
            <div class="info-box" id="det-hist">---</div>

            <span class="label-tag">Objetivos de Campo</span>
            <div class="info-box" style="border-color: var(--p);" id="det-obj">---</div>

            <button class="btn btn-enlist" onclick="confirmEnlistment()">ENLISTARSE</button>
            <button class="btn" style="width:100%; margin-top: 10px; font-size: 10px; padding: 12px; border-color: #444;" onclick="showView('selector-screen')">CAMBIAR MISIÓN</button>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let missionsData = {};
let selectedMissionId = "";
let miniMap;
let missionCoords = null; // Almacena lat/lng para GPS

window.onload = () => {
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONE MISIÓN --</option>';
        missionsData = snap.val() || {};
        
        snap.forEach(child => {
            const m = child.val();
            const opt = document.createElement('option');
            opt.value = child.key;
            opt.innerText = (m.nombre || "MISIÓN SIN NOMBRE").toUpperCase();
            selector.appendChild(opt);
        });
    });
};

function showView(viewId) {
    document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
}

function loadMissionDetail() {
    const id = document.getElementById('mission-selector').value;
    if(!id) return alert("Seleccione una operación.");
    
    selectedMissionId = id;
    const m = missionsData[id];

    document.getElementById('det-name').innerText = "OP. " + m.nombre.toUpperCase();
    document.getElementById('det-hist').innerText = m.historia || "No hay briefing disponible.";
    document.getElementById('det-obj').innerText = m.objetivos || "Sin objetivos primarios.";
    
    const bgUrl = m.imagen_url || "https://images.unsplash.com/photo-1590502142455-89594008902c?q=80&w=1000";
    document.getElementById('det-img').style.backgroundImage = `linear-gradient(to bottom, transparent, var(--f)), url('${bgUrl}')`;

    showView('mission-detail');
    
    setTimeout(() => {
        initMiniMap(m.elementos);
    }, 200);
}

function initMiniMap(elementos) {
    if (miniMap) miniMap.remove();
    
    miniMap = L.map('mini-map', { zoomControl: false, attributionControl: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(miniMap);
    
    const layers = L.featureGroup().addTo(miniMap);
    missionCoords = null;

    if(elementos) {
        elementos.forEach(el => {
            const color = (el.type === 'GAME_ZONE') ? '#0f0' : (el.type === 'SAFE_ZONE' ? '#ff0' : '#f00');
            if(el.path) {
                L.polygon(el.path, {color: color, weight: 2, fillOpacity: 0.2}).addTo(layers);
                if(!missionCoords) missionCoords = el.path[0]; // Toma el primer punto para el GPS
            }
            else if(el.radius) {
                L.circle(el.center, {radius: el.radius, color: color}).addTo(layers);
                if(!missionCoords) missionCoords = el.center;
            }
        });
        
        if(layers.getLayers().length > 0) {
            miniMap.fitBounds(layers.getBounds(), { padding: [10, 10] });
        } else {
            miniMap.setView([-34.34, -56.71], 13);
        }
    }
}

function openGPS(type) {
    if(!missionCoords) return alert("Ubicación de misión no definida.");
    const lat = missionCoords.lat;
    const lng = missionCoords.lng;

    if(type === 'google') {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    } else {
        window.open(`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`, '_blank');
    }
}

function confirmEnlistment() {
    const myCallsign = localStorage.getItem('callsign');
    if(!myCallsign) return window.location.href = 'index.html';

    db.ref(`jugadores_enlistados/${myCallsign}`).update({
        callsign: myCallsign,
        misionId: selectedMissionId,
        equipo: 'PENDIENTE', 
        status: 'ESPERANDO_EQUIPO',
        last_update: Date.now()
    }).then(() => {
        localStorage.setItem('activeMissionId', selectedMissionId);
        location.href = 'mapa_tactico.html';
    });
}
</script>
</body>
</html>
