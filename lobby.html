<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - LOBBY DE OPERACIONES</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --red:#ff3333; --blue:#3366ff; --gray:#222; }
        
        body { 
            margin:0; font-family: 'Courier New', monospace; background: var(--f); color: var(--p); 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        /* NAVEGACIÓN DE VISTAS */
        .view-layer { display: none; width: 100%; flex-direction: column; align-items: center; padding: 20px 0; animation: fadeIn 0.4s ease; }
        .active-view { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PANTALLA INICIAL */
        #lobby-main { justify-content: center; height: 100vh; gap: 20px; }

        /* CABECERA DINÁMICA */
        .mission-header {
            width: 100%; height: 200px; background-size: cover; background-position: center;
            border-bottom: 2px solid var(--p); position: relative; display: flex; align-items: flex-end;
            transition: 0.5s; background-color: #111;
        }
        .op-title-banner {
            background: rgba(0,0,0,0.85); width: 100%; padding: 12px 0;
            text-align: center; font-weight: bold; border-top: 1px solid var(--p);
            letter-spacing: 3px; text-shadow: 0 0 10px var(--p);
        }

        /* ELEMENTOS DE INTERFAZ */
        .panel { width: 92%; max-width: 450px; background: rgba(0,10,0,0.95); border: 1px solid var(--p); padding: 15px; margin-top: 15px; box-sizing: border-box; }
        .info-box { font-size: 12px; background: rgba(0,30,0,0.5); padding: 12px; border-left: 3px solid var(--gold); margin-bottom: 12px; color: #fff; line-height: 1.4; white-space: pre-wrap; }
        #mini-map { width: 100%; height: 200px; border: 1px solid #333; margin: 10px 0; background: #111; z-index: 5; }

        /* BOTONES */
        .btn { 
            width: 85%; max-width: 320px; padding: 18px; border: 1px solid var(--p); 
            background: rgba(0,20,0,0.5); color: var(--p); font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            margin-bottom: 10px; font-family: inherit;
        }
        .btn:hover { background: var(--p); color: #000; box-shadow: 0 0 15px var(--p); }
        
        .btn-enlist { background: var(--red); color: #fff; border: none; font-size: 18px; animation: pulse-red 2s infinite; margin-top: 15px; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255,51,51,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,51,51,0); } 100% { box-shadow: 0 0 0 0 rgba(255,51,51,0); } }

        /* GPS */
        .gps-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 15px; }
        .btn-gps { padding: 12px; font-size: 10px; border: 1px solid #444; background: #000; color: #fff; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn-google { border-color: #4285F4; color: #4285F4; }
        .btn-waze { border-color: #3366ff; color: #3366ff; }

        select { width: 100%; padding: 15px; background: #000; border: 1px solid var(--p); color: var(--p); margin-bottom: 15px; font-family: inherit; outline: none; }
        .label-tag { font-size: 9px; color: var(--p); opacity: 0.7; text-transform: uppercase; margin-bottom: 4px; display: block; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="lobby-main" class="view-layer active-view">
        <h1 style="letter-spacing: 5px; text-align: center;">A.T.O.M<br><span style="font-size: 14px; opacity: 0.6;">SISTEMA DE DESPLIEGUE</span></h1>
        <button class="btn" onclick="showView('selector-screen')">DIRECTORIO DE MISIONES</button>
        <button class="btn" onclick="window.location.href='operadores.html'">OPERADORES REGISTRADOS</button>
        <button class="btn" style="border-color:#444; color:#666;" onclick="logout()">DESCONECTAR</button>
    </div>

    <div id="selector-screen" class="view-layer">
        <h2 style="letter-spacing: 3px;">SELECCIÓN DE OPERACIÓN</h2>
        <div class="panel">
            <span class="label-tag">Enlace satelital activo</span>
            <select id="mission-selector">
                <option value="">-- CARGANDO MISIONES --</option>
            </select>
            <button class="btn" style="width:100%;" onclick="loadMissionDetail()">DESCARGAR INTELIGENCIA</button>
            <button class="btn" style="width:100%; border:none; color:var(--red); font-size: 10px;" onclick="showView('lobby-main')">VOLVER AL MENÚ</button>
        </div>
    </div>

    <div id="mission-detail" class="view-layer">
        <div class="mission-header" id="det-img">
            <div class="op-title-banner" id="det-name">CARGANDO SITREP...</div>
        </div>
        
        <div class="panel">
            <span class="label-tag">Coordenadas de Inserción</span>
            <div id="mini-map"></div>

            <div class="gps-container">
                <button class="btn-gps btn-google" onclick="openGPS('google')">GOOGLE MAPS</button>
                <button class="btn-gps btn-waze" onclick="openGPS('waze')">WAZE</button>
            </div>
            
            <span class="label-tag" style="color: var(--gold);">Briefing / Historia</span>
            <div class="info-box" id="det-hist">---</div>

            <span class="label-tag">Objetivos Tácticos</span>
            <div class="info-box" style="border-color: var(--p);" id="det-obj">---</div>

            <button class="btn btn-enlist" onclick="confirmEnlistment()">CONFIRMAR ALISTAMIENTO</button>
            <button class="btn" style="width:100%; margin-top: 10px; font-size: 10px; padding: 10px; border-color: #444;" onclick="showView('selector-screen')">ABORTAR Y VOLVER</button>
        </div>
    </div>

<script>
// 1. CONFIGURACIÓN FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();

let missionsData = {};
let selectedMissionId = "";
let miniMap = null;
let gpsCoords = null;

const ATOM_COLORS = { 
    'GAME_ZONE': '#0f0', 
    'SAFE_ZONE': '#ffd700', 
    'RESPAWN_RED': '#f33', 
    'RESPAWN_BLUE': '#33f', 
    'OBJ_POINT': '#fff' 
};

// 2. CARGA INICIAL
window.onload = () => {
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONE MISIÓN --</option>';
        
        if (!snap.exists()) {
            selector.innerHTML = '<option value="">SIN MISIONES DISPONIBLES</option>';
            return;
        }

        missionsData = snap.val();
        snap.forEach(child => {
            const m = child.val();
            const opt = document.createElement('option');
            opt.value = child.key;
            opt.innerText = (m.nombre || "OP. ANONIMA").toUpperCase();
            selector.appendChild(opt);
        });
    });
};

function showView(viewId) {
    document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
    // Forzar redibujado de mapa si entramos a detalle
    if(viewId === 'mission-detail' && miniMap) {
        setTimeout(() => { miniMap.invalidateSize(); }, 200);
    }
}

// 3. CARGAR DETALLES DE MISIÓN
function loadMissionDetail() {
    const id = document.getElementById('mission-selector').value;
    if(!id) return alert("Seleccione una misión del listado.");
    
    selectedMissionId = id;
    const m = missionsData[id];

    // Texto e Imagen
    document.getElementById('det-name').innerText = "OPERACIÓN: " + m.nombre.toUpperCase();
    document.getElementById('det-hist').innerText = m.historia || "No hay briefing disponible para esta unidad.";
    document.getElementById('det-obj').innerText = m.objetivos || "Objetivos no especificados.";
    
    const bgUrl = m.imagen_url || "https://images.unsplash.com/photo-1505673539011-d709079c67bb?q=80&w=1000";
    document.getElementById('det-img').style.backgroundImage = `linear-gradient(to bottom, transparent, var(--f)), url('${bgUrl}')`;

    showView('mission-detail');
    
    // Mapa
    setTimeout(() => { renderTacticalMap(m.elementos); }, 300);
}

// 4. LÓGICA DEL MAPA (Leaflet)
function renderTacticalMap(elementos) {
    if (miniMap) { miniMap.remove(); }
    
    miniMap = L.map('mini-map', { zoomControl: false, attributionControl: false });
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(miniMap);
    
    const layers = L.featureGroup().addTo(miniMap);
    gpsCoords = null;

    if(elementos && elementos.length > 0) {
        elementos.forEach(el => {
            const color = ATOM_COLORS[el.type] || '#0f0';
            let layer;
            
            if(el.path) {
                layer = L.polygon(el.path, {color: color, weight: 2, fillOpacity: 0.3}).addTo(layers);
                if(!gpsCoords) gpsCoords = el.path[0];
            }
            else if(el.radius) {
                layer = L.circle(el.center, {radius: el.radius, color: color, fillOpacity: 0.3}).addTo(layers);
                if(!gpsCoords) gpsCoords = el.center;
            }
            else if(el.center) {
                layer = L.marker(el.center).addTo(layers);
                if(!gpsCoords) gpsCoords = el.center;
            }
        });
        
        miniMap.fitBounds(layers.getBounds(), { padding: [20, 20] });
    } else {
        // Fallback si no hay elementos dibujados
        miniMap.setView([-34.34, -56.71], 15);
    }
}

// 5. GPS Y NAVEGACIÓN
function openGPS(type) {
    if(!gpsCoords) return alert("Error: No se detectaron coordenadas en el mapa.");
    const lat = gpsCoords.lat;
    const lng = gpsCoords.lng;
    const url = (type === 'google') 
        ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}` 
        : `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
    window.open(url, '_blank');
}

// 6. ALISTAMIENTO
function confirmEnlistment() {
    const myCallsign = localStorage.getItem('callsign');
    if(!myCallsign) {
        alert("ERROR CRÍTICO: No se encontró Callsign en el dispositivo.");
        window.location.href = 'index.html';
        return;
    }

    db.ref(`jugadores_enlistados/${myCallsign}`).update({
        callsign: myCallsign,
        misionId: selectedMissionId,
        misionNombre: missionsData[selectedMissionId].nombre,
        equipo: 'PENDIENTE', 
        status: 'ESPERANDO_EQUIPO',
        last_update: Date.now()
    }).then(() => {
        localStorage.setItem('activeMissionId', selectedMissionId);
        alert("REGISTRO COMPLETADO. DESPLEGANDO MAPA...");
        location.href = 'mapa_tactico.html';
    }).catch(err => {
        alert("ERROR AL ENLISTAR: " + err.message);
    });
}

function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
}
</script>

</body>
</html>
