<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - LOBBY TÁCTICO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --shadow: rgba(0, 255, 0, 0.4); }
        
        body { 
            margin:0; font-family: 'Courier New', monospace; background: var(--f); color: var(--p); 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Cabecera con imagen dinámica vinculada a 'mission-image-url' */
        .mission-header {
            width: 100%; height: 280px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), var(--f)), 
                        url('https://images.unsplash.com/photo-1590502142455-89594008902c?q=80&w=1000'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--p); transition: background-image 0.6s ease-in-out;
            position: relative;
        }

        .op-title {
            background: rgba(0,0,0,0.85); width: 100%; text-align: center; padding: 15px 0;
            font-size: 1.3rem; font-weight: bold; letter-spacing: 5px; border-bottom: 1px solid var(--p);
            text-shadow: 0 0 10px var(--p);
        }

        .atom-logo-overlay {
            width: 100px; height: 100px; margin-bottom: -50px; z-index: 10;
            filter: drop-shadow(0 0 15px var(--p));
        }

        .panel { 
            width: 90%; max-width: 420px; border: 1px solid var(--p); padding: 60px 20px 20px 20px; 
            background: rgba(0,10,0,0.98); box-shadow: 0 0 40px var(--shadow); margin-top: 40px;
        }

        /* Bloques de información obtenidos de Firebase */
        .info-box {
            font-size: 12px; background: rgba(0,30,0,0.6); padding: 15px;
            border-left: 4px solid var(--gold); margin-bottom: 15px;
            color: #fff; line-height: 1.5; border-radius: 0 5px 5px 0;
        }

        .objectives-box { border-left-color: var(--p); background: rgba(0,50,0,0.2); }

        .label { font-size: 10px; text-transform: uppercase; margin-bottom: 8px; display: block; opacity: 0.7; letter-spacing: 1px; }
        
        select, input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid var(--p); 
            color: var(--p); font-family: monospace; margin-bottom: 20px; outline: none;
        }

        .btn { 
            width: 100%; padding: 18px; border: 1px solid var(--p); background: transparent; 
            color: var(--p); font-weight: bold; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 2px; transition: 0.3s;
        }
        
        .btn-ready { background: var(--p); color: #000; border: none; font-size: 16px; box-shadow: 0 0 10px var(--p); }
        .btn-ready:disabled { background: #1a1a1a; color: #444; border: 1px solid #333; cursor: not-allowed; box-shadow: none; }

        .footer-note { font-size: 9px; text-align: center; margin-top: 25px; color: #444; }
    </style>
</head>
<body>

    <div class="mission-header" id="header-bg">
        <div class="op-title" id="display-mission-name">ESPERANDO BRIEFING...</div>
        <img src="https://i.ibb.co/v4mRLmY/atom-logo.png" alt="ATOM LOGO" class="atom-logo-overlay"> 
    </div>

    <div class="panel">
        <div class="label">Briefing de Inteligencia</div>
        <div class="info-box" id="display-mission-history">
            Seleccione una operación para recibir el informe SITREP.
        </div>

        <div class="label">Objetivos Operativos</div>
        <div class="info-box objectives-box" id="display-mission-objectives">
            -- No hay objetivos asignados --
        </div>

        <div class="block">
            <span class="label">Operaciones Activas en Red</span>
            <select id="mission-selector" onchange="updateUI()">
                <option value="">-- CONECTANDO... --</option>
            </select>
        </div>

        <button class="btn btn-ready" id="btn-join" onclick="confirmMission()" disabled>INICIAR DESPLIEGUE</button>
        
        <div class="footer-note">A.T.O.M. TACTICAL OS - URUGUAY</div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let missionsData = {}; 

window.onload = () => {
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONE MISIÓN --</option>';
        
        if (!snap.exists()) return;

        missionsData = snap.val(); 

        snap.forEach(child => {
            const m = child.val();
            const option = document.createElement('option');
            option.value = child.key;
            // Usa el campo 'nombre' guardado desde el input 'mission-name'
            option.innerText = (m.nombre || "OPERACIÓN S/N").toUpperCase();
            selector.appendChild(option);
        });
    });
};

function updateUI() {
    const id = document.getElementById('mission-selector').value;
    const btn = document.getElementById('btn-join');
    
    // Referencias a los elementos visuales
    const uiName = document.getElementById('display-mission-name');
    const uiHistory = document.getElementById('display-mission-history');
    const uiObjectives = document.getElementById('display-mission-objectives');
    const uiHeader = document.getElementById('header-bg');

    if (id && missionsData[id]) {
        const m = missionsData[id];
        
        // Seteo de datos desde Firebase (usando tus placeholders)
        uiName.innerText = "OP. " + (m.nombre || "DESCONOCIDA").toUpperCase();
        uiHistory.innerHTML = `<strong>SITREP:</strong> ${m.historia || "Sin datos."}`;
        uiObjectives.innerHTML = `<strong>PRIMARIO:</strong> ${m.objetivos || "Limpia de zona."}`;
        
        // Actualizar imagen desde 'mission-image-url'
        if(m.imagen_url) {
            uiHeader.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.2), var(--f)), url('${m.imagen_url}')`;
        }
        
        btn.disabled = false;
    } else {
        uiName.innerText = "ESPERANDO BRIEFING...";
        uiHistory.innerText = "Seleccione una operación para recibir el informe SITREP.";
        uiObjectives.innerText = "-- No hay objetivos asignados --";
        btn.disabled = true;
    }
}

function confirmMission() {
    const mId = document.getElementById('mission-selector').value;
    if(!mId) return;

    localStorage.setItem('activeMissionId', mId);
    
    db.ref('operacion_activa/control').update({
        missionId: mId,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        location.href = 'sala_de_guerra.html';
    });
}
</script>
</body>
</html>
