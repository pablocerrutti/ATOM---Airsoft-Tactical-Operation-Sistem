<div class="block">
    <span class="label">Selector de Operación</span>
    <select id="mission-selector" class="btn" style="width: 100%; margin-bottom: 10px; background: #111;">
        <option value="">-- SELECCIONAR MISIÓN --</option>
    </select>
    <button class="btn btn-ready" onclick="goToWarRoom()" style="width: 100%;">INGRESAR A SALA DE GUERRA</button>
</div>

<script>
// Lógica para cargar misiones en el selector
function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONAR MISIÓN --</option>';
        
        snap.forEach(child => {
            const m = child.val();
            // Solo mostramos misiones que tengan nombre
            if(m.nombre) {
                selector.innerHTML += `<option value="${child.key}">${m.nombre.toUpperCase()}</option>`;
            }
        });
    });
}

function goToWarRoom() {
    const mId = document.getElementById('mission-selector').value;
    if(!mId) return alert("SELECCIONE UNA MISIÓN PRIMERO");

    // Sincronizamos la misión elegida como la "activa" para el usuario
    db.ref('operacion_activa/control/missionId').set(mId).then(() => {
        location.href = 'sala_de_guerra.html';
    });
}

// Llamar al cargar el lobby
window.onload = () => {
    loadMissionList();
};
</script>
