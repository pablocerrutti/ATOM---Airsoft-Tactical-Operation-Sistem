<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Centro de Mando</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); padding: 15px; box-sizing: border-box; }
        .active { display: flex !important; }
        
        /* Contenedor del Mapa */
        .mission-header-flex { display: flex; gap: 10px; height: 220px; margin-bottom: 15px; flex-shrink: 0; position: relative; }
        #radar-static { flex: 1.2; border: 1px solid var(--p); background: #111; position: relative; overflow: hidden; }
        #preview-map { width: 100%; height: 100%; transition: filter 0.5s ease; }
        
        /* Overlay de espera sobre el mapa */
        #map-wait-overlay { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.7); z-index: 1000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 10px; pointer-events: none;
        }
        .map-blurred { filter: blur(6px) grayscale(1); }

        #mission-cover-frame { flex: 0.8; border: 1px solid #333; overflow: hidden; background: #000; display: none; }
        #mission-cover-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }

        .info-container { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; }
        .info-block { margin-bottom: 12px; padding: 10px; border-left: 2px solid var(--p); background: rgba(0,255,0,0.03); }
        .label { color:var(--gold); font-size:10px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .content { font-size:13px; color:#ccc; line-height: 1.4; }

        button { font-family: inherit; cursor: pointer; text-transform: uppercase; transition: 0.2s; border: none; outline: none; }
        .btn-main { background: var(--p); color: #000; padding: 18px; width: 100%; font-weight: bold; font-size: 14px; }
        .btn-sec { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 12px; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-exit { background: var(--red); color: #fff; padding: 15px; width: 100%; font-weight: bold; margin-top: 20px; border-radius: 4px; }
        
        .op-tag { display: inline-block; padding: 3px 8px; border: 1px solid var(--p); margin: 2px; font-size: 10px; font-weight: bold; color: #000; background: var(--p); }
        select { width:100%; padding:14px; background:#000; color:var(--p); border:1px solid var(--p); margin-bottom: 20px; font-family: inherit; }

        #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 4px solid var(--p); }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 class="blink" style="letter-spacing: 5px;">INSERCIÓN TÁCTICA</h1>
        <p>IDENTIFICANDO PARÁMETROS DE COMBATE...</p>
        <div id="team-reveal" style="margin-top: 30px; font-size: 24px; font-weight: bold; display: none;">
            EQUIPO ASIGNADO: <span id="team-name">---</span>
        </div>
    </div>

    <div id="screen-welcome" class="screen active" style="justify-content: center; align-items: center;">
        <div style="border: 1px solid var(--p); padding: 30px; text-align: center; width: 90%; max-width: 400px; background: rgba(0,0,0,0.8);">
            <h2 style="color:var(--gold); margin-top: 0; letter-spacing: 2px;">SISTEMA A.T.O.M</h2>
            <p id="welcome-callsign" style="font-size: 11px; margin-bottom: 25px; color: #888;">BUSCANDO SEÑAL...</p>
            
            <div class="label" style="text-align: left;">Operaciones Disponibles:</div>
            <select id="mission-dropdown" onchange="viewMission(this.value)">
                <option value="">-- SELECCIONAR OPERACIÓN --</option>
            </select>
            
            <button onclick="window.location.href='operadores.html'" class="btn-sec">📡 RADAR DE OPERADORES</button>
            <button class="btn-exit" onclick="exitApplication()">⬅ SALIR DEL SISTEMA</button>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <h2 id="prev-name" style="margin:0 0 15px 0; font-size: 1.2rem; color: var(--gold); text-align: center;">---</h2>
        
        <div class="mission-header-flex">
            <div id="radar-static">
                <div id="preview-map"></div>
                <div id="map-wait-overlay">
                    <div class="blink" style="color: var(--gold); font-size: 14px; font-weight: bold;">[ ESPERANDO ASIGNACIÓN ]</div>
                    <div style="color: #888; font-size: 9px; margin-top: 5px;">MAPA BLOQUEADO POR HQ</div>
                </div>
            </div>
            <div id="mission-cover-frame"><img id="mission-cover-img" src="" alt="Portada"></div>
        </div>
        
        <div class="info-container">
            <div class="info-block">
                <div class="label">[ BRIEFING OPERATIVO ]</div>
                <div id="mission-history-text" class="content">Sincronizando datos...</div>
            </div>
            <div class="info-block">
                <div class="label">[ PERSONAL EN ESPERA ]</div>
                <div id="enlisted-ops" class="op-list"></div>
            </div>
        </div>

        <div id="action-area">
            <button id="btn-enlist" class="btn-main" onclick="enlistOperative()">📝 CONFIRMAR ASISTENCIA</button>
            <button id="btn-abandon" class="btn-sec" style="border-color: var(--red); color: var(--red);" onclick="abandonMission()">❌ ANULAR INSCRIPCIÓN</button>
        </div>
        
        <button onclick="showScreen('screen-welcome')" style="background:none; color:#555; padding:15px; width:100%; font-size: 10px;">⬅ VOLVER AL LOBBY</button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", 
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", 
            projectId: "atom---sistem" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let userCallsign, selectedMissionId, previewMap, drawnItems;

        // Función para optimizar imágenes de Cloudinary al vuelo
        function getCloudinaryUrl(url) {
            if (!url || !url.includes('cloudinary.com')) return url;
            // Inserta optimización: auto-formato, auto-calidad y ancho máximo de 600px
            return url.replace('/upload/', '/upload/f_auto,q_auto,w_600/');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`usuarios/${user.uid}`).on('value', snap => {
                    if (snap.exists()) {
                        userCallsign = snap.val().callsign;
                        document.getElementById('welcome-callsign').innerText = `CALLSIGN: ${userCallsign}`;
                        initLobbySync();
                        syncTacticalStatus();
                    }
                });
            } else { window.location.href = 'index.html'; }
        });

        function exitApplication() {
            if(!confirm("¿CONFIRMAR RETIRADA?")) return;
            const uid = auth.currentUser.uid;
            db.ref(`jugadores_enlistados/${uid}`).remove().then(() => auth.signOut()).then(() => { window.location.href = 'index.html'; });
        }

        function syncTacticalStatus() {
            const uid = auth.currentUser.uid;
            db.ref(`jugadores_enlistados/${uid}`).on('value', snapUser => {
                const userData = snapUser.val();
                if (userData && userData.equipo && userData.equipo !== 'S/E') {
                    db.ref('estado_partida').once('value', snapPartida => {
                        if (snapPartida.val()?.activo) {
                            document.getElementById('lock-screen').style.display = 'flex';
                            document.getElementById('team-reveal').style.display = 'block';
                            document.getElementById('team-name').innerText = userData.equipo;
                            document.getElementById('team-name').style.color = userData.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
                            setTimeout(() => { window.location.href = 'mapa.tactico.html'; }, 2500);
                        }
                    });
                }
            });
        }

        function initLobbySync() {
            db.ref('misiones').on('value', snap => {
                const dd = document.getElementById('mission-dropdown');
                const current = dd.value;
                dd.innerHTML = '<option value="">-- SELECCIONAR OPERACIÓN --</option>';
                snap.forEach(child => { 
                    dd.innerHTML += `<option value="${child.key}">${child.val().nombre.toUpperCase()}</option>`; 
                });
                dd.value = current;
            });
        }

        function viewMission(id) {
            if(!id) return;
            selectedMissionId = id;
            showScreen('screen-preview');
            
            if(!previewMap) {
                previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false });
                // Tiles de CartoDB (más ligeros y rápidos para móviles)
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(previewMap);
                drawnItems = L.featureGroup().addTo(previewMap);
            }

            db.ref(`misiones/${id}`).on('value', snap => {
                const m = snap.val();
                if(!m) return;
                
                document.getElementById('prev-name').innerText = m.nombre.toUpperCase();
                document.getElementById('mission-history-text').innerText = m.historia || "Briefing no disponible.";
                
                const frame = document.getElementById('mission-cover-frame');
                const imgEl = document.getElementById('mission-cover-img');
                
                if(m.imagen) { 
                    imgEl.src = getCloudinaryUrl(m.imagen);
                    imgEl.onload = () => { imgEl.style.opacity = '1'; frame.style.display = 'block'; };
                } else { frame.style.display = 'none'; }

                drawnItems.clearLayers();
                if(m.elementos) {
                    m.elementos.forEach(el => {
                        let layer;
                        const col = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ff0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f' };
                        const color = col[el.type] || '#0f0';
                        if(el.path) layer = L.polygon(el.path, {color: color, weight: 1, fillOpacity: 0.1});
                        else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: color, weight: 1});
                        else layer = L.marker(el.center);
                        drawnItems.addLayer(layer);
                    });
                    setTimeout(() => { 
                        previewMap.invalidateSize(); 
                        if(drawnItems.getLayers().length > 0) previewMap.fitBounds(drawnItems.getBounds());
                    }, 400);
                }
            });

            // Sincronización de lista de operadores y efectos de espera
            db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(id).on('value', snap => {
                const container = document.getElementById('enlisted-ops');
                container.innerHTML = '';
                let yaEnlistado = false;
                
                snap.forEach(child => {
                    if(child.val().callsign === userCallsign) yaEnlistado = true;
                    container.innerHTML += `<span class="op-tag">${child.val().callsign}</span>`;
                });

                const mapEl = document.getElementById('preview-map');
                const overlay = document.getElementById('map-wait-overlay');
                
                if(yaEnlistado) {
                    mapEl.classList.add('map-blurred');
                    overlay.style.display = 'flex';
                    document.getElementById('btn-enlist').style.display = 'none';
                    document.getElementById('btn-abandon').style.display = 'block';
                } else {
                    mapEl.classList.remove('map-blurred');
                    overlay.style.display = 'none';
                    document.getElementById('btn-enlist').style.display = 'block';
                    document.getElementById('btn-abandon').style.display = 'none';
                }
            });
        }

        function enlistOperative() {
            if(!selectedMissionId) return;
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).set({
                callsign: userCallsign, equipo: 'S/E', misionId: selectedMissionId, timestamp: Date.now()
            });
        }

        function abandonMission() {
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).remove().then(() => {
                showScreen('screen-welcome');
                document.getElementById('mission-dropdown').value = "";
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-preview' && previewMap) {
                setTimeout(() => { previewMap.invalidateSize(); }, 300);
            }
        }
    </script>
</body>
</html>
