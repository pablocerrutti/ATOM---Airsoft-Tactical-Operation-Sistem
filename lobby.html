<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operative Lobby</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <!-- Leaflet Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Google Maps API & GoogleMutant Plugin -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#444; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); }
        .active { display: flex !important; }
        
        .btn-logout {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); border: 1px solid var(--red); color: var(--red);
            padding: 5px 10px; font-size: 10px; cursor: pointer; z-index: 1100;
            text-transform: uppercase; font-weight: bold;
        }

        #screen-selector { padding: 20px; box-sizing: border-box; text-align: center; }
        select {
            background: #111; color: var(--p); border: 1px solid var(--p);
            padding: 15px; width: 100%; font-family: monospace; font-size: 14px;
            text-transform: uppercase; outline: none; cursor: pointer; margin: 20px 0;
        }

        #radar-static {
            height: 45%; width: 100%; border-bottom: 1px solid var(--p);
            background: #000; position: relative; overflow: hidden;
        }
        
        .tactical-label {
            background: rgba(0,0,0,0.85); border: 1px solid var(--p); color: var(--p);
            padding: 2px 6px; font-size: 9px; font-weight: bold; border-radius: 2px;
            white-space: nowrap; text-transform: uppercase; 
            box-shadow: 0 0 8px rgba(0,255,0,0.4);
            pointer-events: none;
        }

        .leaflet-container { background: #000 !important; }

        .nav-links { display: flex; gap: 10px; margin-top: 15px; }
        .nav-links a { 
            flex: 1; padding: 12px; font-size: 11px; text-decoration: none; 
            border: 1px solid var(--p); color: #000; background: var(--p);
            text-align: center; font-weight: 900; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        .btn-action { background: var(--p); color: #000; border: none; padding: 18px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .btn-secondary { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; font-size: 11px; }

        #screen-waiting { justify-content: center; align-items: center; background: radial-gradient(circle, #111 0%, #000 100%); }
        .radar-circle { width: 120px; height: 120px; border: 2px solid var(--p); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .bando-msg { font-size: 1.4em; font-weight: bold; margin: 20px 0; padding: 15px; border: 2px solid var(--p); display: none; text-align: center; width: 80%; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes blink { 50% { opacity: 0; } }
        .blink { animation: blink 1.5s infinite; }
    </style>
</head>
<body>

    <button class="btn-logout" onclick="logout()">✖ SALIR</button>

    <div id="screen-selector" class="screen active">
        <h1 style="letter-spacing: 5px; color: var(--gold); margin: 40px 0 5px 0;">A.T.O.M SYSTEM</h1>
        <p id="op-display" style="font-size: 10px; color: var(--p); margin-bottom: 20px;">[ VALIDANDO CREDENCIALES... ]</p>
        
        <label style="font-size: 10px; color: var(--gray);">SELECCIONE OPERACIÓN DISPONIBLE:</label>
        <select id="mission-dropdown" onchange="viewMission(this.value)">
            <option value="">-- ARCHIVOS ENCRIPTADOS --</option>
        </select>

        <div style="flex-grow: 1;"></div>
        <button class="btn-secondary" onclick="window.location.href='operadores.html'">👤 VER OPERADORES ACTIVOS</button>
    </div>

    <div id="screen-preview" class="screen">
        <div id="radar-static">
            <div id="preview-map" style="width: 100%; height: 100%;"></div>
            <div id="no-signal" class="blink" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index: 1000; font-weight: bold; letter-spacing: 5px; pointer-events: none; text-shadow: 2px 2px #000; color: var(--p);">RECUPERANDO DATOS...</div>
        </div>
        
        <div style="padding: 20px; flex-grow: 1;">
            <h2 id="prev-name" style="margin:0; color: var(--gold); text-transform: uppercase;">SIN SELECCIÓN</h2>
            <p style="font-size: 12px; color: var(--p); opacity: 0.7;">VISTA DE SATÉLITE HÍBRIDA OK</p>
            
            <div class="nav-links">
                <a id="link-google" target="_blank">MAPS GOOGLE</a>
                <a id="link-waze" target="_blank">WAZE NAV</a>
            </div>

            <button class="btn-action" onclick="enlistOperative()">📝 CONFIRMAR ENLISTAMIENTO</button>
            <button onclick="showScreen('screen-selector')" style="background:none; border:none; color:var(--gray); margin-top:20px; width:100%; font-family: monospace;">⬅ CANCELAR Y VOLVER</button>
        </div>
    </div>

    <div id="screen-waiting" class="screen">
        <div class="radar-circle"></div>
        <h2 class="blink" style="margin-top: 0; letter-spacing: 2px;">ESPERANDO ÓRDENES</h2>
        <div id="bando-display" class="bando-msg"></div>
        <p style="font-size: 10px; color: var(--gray); position: absolute; bottom: 30px;">ID OPERATIVO: <span id="id-tag">--</span></p>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userCallsign = null;
let selectedMissionId = null;
let previewMap;
let drawnItems;

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('operadores').orderByChild('email').equalTo(user.email).on('value', snap => {
            if (snap.exists()) {
                const data = Object.values(snap.val())[0];
                userCallsign = data.callsign;
                document.getElementById('op-display').innerText = `[ OPERATIVO: ${userCallsign} ]`;
                document.getElementById('id-tag').innerText = userCallsign;
                initLobby();
            }
        });
    } else { window.location.href = 'login.html'; }
});

function initLobby() {
    db.ref('misiones').on('value', snap => {
        const dropdown = document.getElementById('mission-dropdown');
        dropdown.innerHTML = '<option value="">-- ARCHIVOS ENCRIPTADOS --</option>';
        snap.forEach(c => {
            let option = document.createElement('option');
            option.value = c.key;
            option.text = `MISIÓN: ${c.val().nombre}`;
            dropdown.appendChild(option);
        });
    });
    listenGlobalStatus();
}

function viewMission(id) {
    if(!id) return;
    selectedMissionId = id;
    showScreen('screen-preview');
    
    if(!previewMap) {
        previewMap = L.map('preview-map', { 
            zoomControl: false, 
            attributionControl: false 
        }).setView([0,0], 2);

        // IMPLEMENTACIÓN GOOGLE MUTANT HÍBRIDO
        L.gridLayer.googleMutant({
            type: 'hybrid' 
        }).addTo(previewMap);

        drawnItems = L.featureGroup().addTo(previewMap);
    }

    drawnItems.clearLayers();
    document.getElementById('no-signal').style.display = 'block';

    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('prev-name').innerText = m.nombre;
        document.getElementById('no-signal').style.display = 'none';

        if(m.elementos) {
            m.elementos.forEach(el => {
                let color = '#00ff00';
                if(el.type.includes('RED')) color = '#ff3333';
                if(el.type.includes('BLUE')) color = '#3333ff';
                if(el.type.includes('OBJ')) color = '#ffd700';
                if(el.type.includes('SAFE')) color = '#ffd700';

                const style = { color: color, fillColor: color, fillOpacity: 0.3, weight: 2 };

                let layer;
                let centerPos;

                if (el.path) {
                    layer = L.polygon(el.path, style);
                    // Cálculo del centro del polígono para la etiqueta
                    let lats = el.path.map(p => p.lat);
                    let lngs = el.path.map(p => p.lng);
                    centerPos = [
                        (Math.min(...lats) + Math.max(...lats)) / 2,
                        (Math.min(...lngs) + Math.max(...lngs)) / 2
                    ];
                } else if (el.radius) {
                    layer = L.circle(el.center, { radius: el.radius, ...style });
                    centerPos = el.center;
                } else {
                    layer = L.circleMarker(el.center, { radius: 6, ...style });
                    centerPos = el.center;
                }

                // ETIQUETA TÁCTICA (Mismo estilo que el Editor)
                const label = L.marker(centerPos, {
                    icon: L.divIcon({
                        className: 'tactical-label',
                        html: el.type.replace('_', ' '),
                        iconAnchor: [30, 0]
                    }),
                    interactive: false
                });

                drawnItems.addLayer(layer);
                drawnItems.addLayer(label);
            });

            const bounds = drawnItems.getBounds();
            previewMap.fitBounds(bounds, { padding: [40, 40] });

            const center = bounds.getCenter();
            document.getElementById('link-google').href = `https://www.google.com/maps/dir/?api=1&destination=${center.lat},${center.lng}`;
            document.getElementById('link-waze').href = `https://waze.com/ul?ll=${center.lat},${center.lng}&navigate=yes`;
        }
    });
}

function enlistOperative() {
    db.ref(`jugadores_enlistados/${userCallsign}`).set({
        callsign: userCallsign,
        equipo: 'S/E',
        lastSeen: Date.now()
    }).then(() => {
        showScreen('screen-waiting');
        listenMyAssignment();
    });
}

function listenMyAssignment() {
    db.ref(`jugadores_enlistados/${userCallsign}`).on('value', snap => {
        const p = snap.val();
        const display = document.getElementById('bando-display');
        if(p && p.equipo !== 'S/E') {
            display.style.display = 'block';
            display.innerText = `TU BANDO ES: ${p.equipo}`;
            display.style.borderColor = p.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
            display.style.color = p.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
        }
    });
}

function listenGlobalStatus() {
    db.ref('operacion_activa/control').on('value', snap => {
        const status = snap.val();
        if(status && status.status === 'EN_CURSO') {
            db.ref(`jugadores_enlistados/${userCallsign}`).once('value', pSnap => {
                if(pSnap.exists()) window.location.href = 'mapa_tactico.html';
            });
        }
    });
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'screen-preview' && previewMap) {
        setTimeout(() => previewMap.invalidateSize(), 300);
    }
}

function logout() { auth.signOut().then(() => window.location.href = 'index.html'); }
window.onload = initLobby;
</script>
</body>
</html>
