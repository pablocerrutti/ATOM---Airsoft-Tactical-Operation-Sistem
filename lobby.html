<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Lobby Operativo</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        
        /* Screens */
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); padding: 15px; box-sizing: border-box; }
        .active { display: flex !important; }
        
        /* Header: Map & Cover */
        .mission-header-flex { display: flex; gap: 10px; height: 250px; margin-bottom: 15px; width: 100%; flex-shrink: 0; }
        #radar-static { flex: 1.2; height: 100%; border: 1px solid var(--p); background: #111; position: relative; }
        #mission-cover-frame { flex: 0.8; height: 100%; border: 1px solid #333; overflow: hidden; background: #000; display: none; }
        #mission-cover-img { width: 100%; height: 100%; object-fit: cover; }

        /* Info Blocks */
        .info-container { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; }
        .info-block { margin-bottom: 12px; padding: 10px; border-left: 2px solid var(--p); background: rgba(0,255,0,0.03); }
        .label { color:var(--gold); font-size:10px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .content { font-size:13px; color:#ccc; line-height: 1.4; }

        /* Buttons */
        button { font-family: inherit; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-action { background: var(--p); color: #000; border: none; padding: 18px; width: 100%; font-weight: bold; font-size: 14px; }
        .btn-abort { background: var(--red); color: #fff; border: none; padding: 15px; width: 100%; font-weight: bold; font-size: 12px; margin-top: 10px; display: none; }
        .btn-logout { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 10px; width: 100%; font-weight: bold; font-size: 11px; margin-top: 10px; }
        .btn-logout:hover { background: var(--red); color: #fff; }
        
        select { width:100%; padding:14px; background:#000; color:var(--p); border:1px solid var(--p); margin-bottom: 20px; font-family: inherit; }

        .op-tag { display: inline-block; padding: 3px 8px; border: 1px solid var(--p); margin: 2px; font-size: 10px; font-weight: bold; color: #000; background: var(--p); }
        
        #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 4px solid var(--p); box-sizing: border-box; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 class="blink" style="color:var(--gold); letter-spacing: 5px;">INSERCIÓN EN CURSO</h1>
        <p>EL COMANDO ESTÁ ASIGNANDO TU POSICIÓN...</p>
        <div id="team-reveal" style="margin-top: 30px; font-size: 20px; font-weight: bold; display: none;">
            EQUIPO: <span id="team-name">---</span>
        </div>
    </div>

    <div id="screen-welcome" class="screen active" style="justify-content: center; align-items: center;">
        <div style="border: 1px solid var(--p); padding: 30px; text-align: center; width: 100%; max-width: 400px; background: rgba(0,0,0,0.8);">
            <h2 style="color:var(--gold); margin-top: 0; letter-spacing: 2px;">SISTEMA A.T.O.M</h2>
            <p id="welcome-callsign" style="font-size: 11px; margin-bottom: 25px; color: #888;">AUTENTICANDO...</p>
            
            <select id="mission-dropdown" onchange="viewMission(this.value)">
                <option value="">-- SELECCIONAR MISIÓN --</option>
            </select>
            
            <button onclick="window.location.href='operadores.html'" style="background:transparent; color:var(--p); border:1px solid var(--p); padding:12px; width:100%; font-weight: bold;">📡 VER OPERADORES</button>
            <button class="btn-logout" onclick="logout()">✖ CERRAR SESIÓN</button>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <h2 id="prev-name" style="margin:0 0 15px 0; font-size: 1.2rem; color: var(--gold); text-align: center; border-bottom: 1px solid #222; padding-bottom: 10px;">---</h2>
        
        <div class="mission-header-flex">
            <div id="radar-static"><div id="preview-map" style="width:100%; height:100%;"></div></div>
            <div id="mission-cover-frame"><img id="mission-cover-img" src="" alt="Portada"></div>
        </div>
        
        <div class="info-container">
            <div class="info-block"><div class="label">[ BRIEFING TÁCTICO ]</div><div id="mission-history-text" class="content"></div></div>
            <div class="info-block"><div class="label">[ OBJETIVOS ]</div><div id="mission-objectives-text" class="content"></div></div>
            <div class="info-block"><div class="label">[ OPERADORES EN ZONA ]</div><div id="enlisted-ops" class="op-list"></div></div>
        </div>

        <div id="action-area">
            <button id="btn-enlist" class="btn-action" onclick="enlistOperative()">📝 CONFIRMAR ASISTENCIA</button>
            <button id="btn-abandon" class="btn-abort" onclick="abandonMission()">❌ RETIRARSE DE LA MISIÓN</button>
        </div>
        
        <button onclick="showScreen('screen-welcome')" style="background:none; color:#555; border:none; padding:15px; width:100%; font-size: 11px;">⬅ VOLVER AL LOBBY</button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", 
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", 
            projectId: "atom---sistem" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let userCallsign, selectedMissionId, previewMap, drawnItems;

        // Limpia y formatea URLs de Drive
        function formatDriveUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let id = "";
                if (url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
                else if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
                return id ? `https://drive.google.com/uc?export=view&id=${id}` : url;
            }
            return url;
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`usuarios/${user.uid}`).on('value', snap => {
                    if (snap.exists()) {
                        userCallsign = snap.val().callsign;
                        document.getElementById('welcome-callsign').innerText = `OPERADOR ACTIVO: ${userCallsign}`;
                        initLobbySync();
                        syncTacticalStatus();
                    }
                });
            } else { window.location.href = 'index.html'; }
        });

        function logout() {
            if(confirm("¿Confirmar desconexión del sistema?")) {
                auth.signOut().then(() => { window.location.href = 'index.html'; });
            }
        }

        function syncTacticalStatus() {
            const uid = auth.currentUser.uid;
            db.ref('estado_partida').on('value', snapPartida => {
                const partida = snapPartida.val() || {};
                if (partida.activo === true) {
                    document.getElementById('lock-screen').style.display = 'flex';
                    db.ref(`jugadores_enlistados/${uid}`).on('value', snapUser => {
                        const userData = snapUser.val();
                        if (userData && userData.equipo && userData.equipo !== 'S/E') {
                            document.getElementById('team-reveal').style.display = 'block';
                            document.getElementById('team-name').innerText = userData.equipo;
                            document.getElementById('team-name').style.color = userData.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
                            setTimeout(() => { window.location.href = 'mapa.tactico.html'; }, 2000);
                        }
                    });
                } else { document.getElementById('lock-screen').style.display = 'none'; }
            });
        }

        function initLobbySync() {
            db.ref('misiones').on('value', snap => {
                const dd = document.getElementById('mission-dropdown');
                const current = dd.value;
                dd.innerHTML = '<option value="">-- SELECCIONAR MISIÓN --</option>';
                snap.forEach(child => { 
                    const m = child.val();
                    if(m.nombre) dd.innerHTML += `<option value="${child.key}">${m.nombre.toUpperCase()}</option>`; 
                });
                dd.value = current;
            });
        }

        function viewMission(id) {
            if(!id) return;
            selectedMissionId = id;
            showScreen('screen-preview');
            
            // Inicializar Mapa una sola vez
            if(!previewMap) {
                previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(previewMap);
                drawnItems = L.featureGroup().addTo(previewMap);
            }

            db.ref(`misiones/${id}`).on('value', snap => {
                const m = snap.val();
                if(!m) return;
                
                document.getElementById('prev-name').innerText = m.nombre.toUpperCase();
                document.getElementById('mission-history-text').innerText = m.historia || "Briefing no disponible.";
                document.getElementById('mission-objectives-text').innerText = m.objetivos || "Sin objetivos específicos.";
                
                // Portada
                const frame = document.getElementById('mission-cover-frame');
                const img = document.getElementById('mission-cover-img');
                if(m.imagen && m.imagen.trim() !== "") {
                    img.src = formatDriveUrl(m.imagen);
                    frame.style.display = 'block';
                } else {
                    frame.style.display = 'none';
                }

                // Renderizar Zona de Juego en Minimapa
                drawnItems.clearLayers();
                if(m.elementos) {
                    const colors = { 'GAME_ZONE': '#0f0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };
                    m.elementos.forEach(el => {
                        let layer;
                        const col = colors[el.type] || '#0f0';
                        if(el.path) layer = L.polygon(el.path, {color: col, weight: 2, fillOpacity: 0.2});
                        else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col, fillOpacity: 0.2});
                        else layer = L.marker(el.center);
                        drawnItems.addLayer(layer);
                    });
                    
                    // Ajustar vista del mapa con delay para renderizado
                    setTimeout(() => {
                        previewMap.invalidateSize();
                        if(drawnItems.getLayers().length > 0) {
                            previewMap.fitBounds(drawnItems.getBounds(), {padding: [20,20]});
                        }
                    }, 400);
                }
            });

            // Sincronizar Operadores enlistados
            db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(id).on('value', snap => {
                const container = document.getElementById('enlisted-ops');
                container.innerHTML = '';
                let yaEnlistado = false;
                snap.forEach(child => {
                    if(child.val().callsign === userCallsign) yaEnlistado = true;
                    container.innerHTML += `<span class="op-tag">${child.val().callsign}</span>`;
                });
                
                const btnEnlist = document.getElementById('btn-enlist');
                const btnAbandon = document.getElementById('btn-abandon');
                
                if(yaEnlistado) {
                    btnEnlist.innerText = "✓ ASISTENCIA CONFIRMADA";
                    btnEnlist.disabled = true;
                    btnEnlist.style.opacity = "0.5";
                    btnAbandon.style.display = "block";
                } else {
                    btnEnlist.innerText = "📝 CONFIRMAR ASISTENCIA";
                    btnEnlist.disabled = false;
                    btnEnlist.style.opacity = "1";
                    btnAbandon.style.display = "none";
                }
            });
        }

        function enlistOperative() {
            if(!selectedMissionId) return;
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).set({
                callsign: userCallsign, equipo: 'S/E', misionId: selectedMissionId, timestamp: Date.now()
            });
        }

        function abandonMission() {
            if(!confirm("¿Retirar tu asistencia de esta operación?")) return;
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).remove()
            .then(() => {
                showScreen('screen-welcome');
                document.getElementById('mission-dropdown').value = "";
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-preview' && previewMap) {
                setTimeout(() => { previewMap.invalidateSize(); }, 300);
            }
        }
    </script>
</body>
</html>
