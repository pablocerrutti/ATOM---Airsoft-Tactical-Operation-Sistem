<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Lobby</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); padding: 15px; box-sizing: border-box; }
        .active { display: flex !important; }
        #mission-cover-frame { width: 100%; height: 140px; border: 1px solid #444; margin-bottom: 10px; display: none; overflow: hidden; }
        #mission-cover-img { width: 100%; height: 100%; object-fit: cover; }
        #radar-static { height: 180px; border: 1px solid var(--p); margin-bottom: 10px; background: #000; }
        .info-block { margin-bottom: 15px; padding: 10px; border-left: 2px solid var(--p); background: rgba(0,255,0,0.03); }
        .btn-action { background: var(--p); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; }
        select { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="screen-welcome" class="screen active" style="justify-content: center; align-items: center;">
        <div style="border: 1px solid var(--p); padding: 25px; text-align: center; width: 100%; max-width: 350px;">
            <h2 style="color:var(--gold)">SISTEMA A.T.O.M</h2>
            <p id="welcome-callsign">IDENTIFICANDO...</p>
            <select id="mission-dropdown" onchange="viewMission(this.value)">
                <option value="">-- BUSCANDO MISIONES --</option>
            </select>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <h2 id="prev-name">CARGANDO...</h2>
        <div id="mission-cover-frame"><img id="mission-cover-img" src=""></div>
        <div id="radar-static"><div id="preview-map" style="height:100%"></div></div>
        <div style="flex-grow:1; overflow-y:auto;">
            <div class="info-block">
                <div style="color:var(--gold); font-size:10px;">I. HISTORIA</div>
                <div id="mission-history-text" style="font-size:12px;"></div>
            </div>
            <div class="info-block">
                <div style="color:var(--gold); font-size:10px;">II. OBJETIVOS</div>
                <div id="mission-objectives-text" style="font-size:12px;"></div>
            </div>
        </div>
        <button class="btn-action" onclick="enlistOperative()">📝 CONFIRMAR ASISTENCIA</button>
        <button onclick="showScreen('screen-welcome')" style="background:none; color:#666; border:none; padding:10px; cursor:pointer;">⬅ VOLVER</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", projectId: "atom---sistem" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let userCallsign, selectedMissionId, previewMap, drawnItems;

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('operadores').orderByChild('email').equalTo(user.email).on('value', snap => {
                    if (snap.exists()) {
                        userCallsign = Object.values(snap.val())[0].callsign;
                        document.getElementById('welcome-callsign').innerText = `OPERADOR: ${userCallsign}`;
                        initLobbySync();
                    }
                });
            } else { window.location.href = 'login.html'; }
        });

        function initLobbySync() {
            db.ref('misiones').on('value', snap => {
                const dd = document.getElementById('mission-dropdown');
                dd.innerHTML = '<option value="">-- SELECCIONAR MISIÓN --</option>';
                snap.forEach(child => {
                    const m = child.val();
                    dd.innerHTML += `<option value="${child.key}">${m.nombre}</option>`;
                });
            });
        }

        function viewMission(id) {
            if(!id) return;
            selectedMissionId = id;
            showScreen('screen-preview');
            if(!previewMap) {
                previewMap = L.map('preview-map', { zoomControl: false });
                L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(previewMap);
                drawnItems = L.featureGroup().addTo(previewMap);
            }
            drawnItems.clearLayers();
            db.ref(`misiones/${id}`).once('value', snap => {
                const m = snap.val();
                document.getElementById('prev-name').innerText = m.nombre;
                document.getElementById('mission-history-text').innerText = m.historia || "--";
                document.getElementById('mission-objectives-text').innerText = m.objetivos || "--";
                if(m.imagen) { document.getElementById('mission-cover-frame').style.display='block'; document.getElementById('mission-cover-img').src=m.imagen; }
                if(m.elementos) {
                    m.elementos.forEach(el => {
                        let layer;
                        if(el.path) layer = L.polygon(el.path, {color: '#0f0'});
                        else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: '#0f0'});
                        else layer = L.marker(el.center);
                        drawnItems.addLayer(layer);
                    });
                    previewMap.fitBounds(drawnItems.getBounds());
                }
            });
        }

        function enlistOperative() {
            db.ref(`jugadores_enlistados/${userCallsign}`).set({ callsign: userCallsign, equipo: 'S/E', misionId: selectedMissionId, lastSeen: Date.now() })
            .then(() => alert("ENLISTADO. ESPERANDO BANDO..."));
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-preview' && previewMap) setTimeout(() => previewMap.invalidateSize(), 200);
        }
    </script>
</body>
</html>
