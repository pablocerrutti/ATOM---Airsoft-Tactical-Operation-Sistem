<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Lobby</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --red:#ff3333; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { border: 1px solid var(--p); padding: 30px; text-align: center; width: 90%; max-width: 400px; background: rgba(0,0,0,0.8); box-shadow: 0 0 20px rgba(0,255,0,0.1); }
        h2 { color:var(--gold); margin-top: 0; letter-spacing: 2px; }
        .label { color:var(--gold); font-size:10px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; text-align: left; }
        select { width:100%; padding:14px; background:#000; color:var(--p); border:1px solid var(--p); margin-bottom: 20px; font-family: inherit; font-size: 14px; }
        button { font-family: inherit; cursor: pointer; text-transform: uppercase; width: 100%; font-weight: bold; border: none; outline: none; transition: 0.2s; }
        .btn-main { background: var(--p); color: #000; padding: 18px; font-size: 14px; }
        .btn-sec { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 12px; margin-top: 10px; }
        .btn-exit { background: var(--red); color: #fff; padding: 15px; margin-top: 20px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SISTEMA A.T.O.M</h2>
        <p id="welcome-callsign" style="font-size: 11px; margin-bottom: 25px; color: #888;">CONECTANDO AL SATÉLITE...</p>
        
        <div class="label">Seleccionar Operación:</div>
        <select id="mission-dropdown">
            <option value="">-- SELECCIONAR --</option>
        </select>
        
        <button onclick="goToWarRoom()" class="btn-main">INGRESAR A SALA DE GUERRA</button>
        <button onclick="window.location.href='operadores.html'" class="btn-sec">📡 RADAR DE OPERADORES</button>
        <button class="btn-exit" onclick="exitApp()">⬅ SALIR</button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", 
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", 
            projectId: "atom---sistem" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`usuarios/${user.uid}`).once('value', snap => {
                    if (snap.exists()) {
                        document.getElementById('welcome-callsign').innerText = `CALLSIGN: ${snap.val().callsign}`;
                        loadMissions();
                    }
                });
            } else { window.location.href = 'index.html'; }
        });

        function loadMissions() {
            db.ref('misiones').on('value', snap => {
                const dd = document.getElementById('mission-dropdown');
                dd.innerHTML = '<option value="">-- SELECCIONAR --</option>';
                snap.forEach(child => { 
                    dd.innerHTML += `<option value="${child.key}">${child.val().nombre.toUpperCase()}</option>`; 
                });
            });
        }

        function goToWarRoom() {
            const id = document.getElementById('mission-dropdown').value;
            if(!id) return alert("Seleccione una misión");
            window.location.href = `sala.guerra.html?mision=${id}`;
        }

        function exitApp() {
            auth.signOut().then(() => { window.location.href = 'index.html'; });
        }
    </script>
</body>
</html>
