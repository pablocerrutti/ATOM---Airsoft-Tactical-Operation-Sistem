<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operative Lobby</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <!-- Leaflet Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Google Maps API & GoogleMutant Plugin -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#444; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); padding: 20px; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .btn-logout {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); border: 1px solid var(--red); color: var(--red);
            padding: 5px 10px; font-size: 10px; cursor: pointer; z-index: 1100;
            text-transform: uppercase; font-weight: bold;
        }

        #screen-welcome { justify-content: center; align-items: center; text-align: center; }
        
        .welcome-card {
            border: 1px solid var(--p);
            padding: 30px;
            background: rgba(0,255,0,0.05);
            box-shadow: 0 0 20px rgba(0,255,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        select {
            background: #000; color: var(--p); border: 1px solid var(--p);
            padding: 15px; width: 100%; font-family: 'Courier New', monospace; font-size: 14px;
            text-transform: uppercase; outline: none; cursor: pointer; margin: 25px 0;
        }

        /* Ajuste de Mapa */
        #radar-static {
            height: 35%; width: 100%; border: 1px solid var(--p);
            background: #000; position: relative; overflow: hidden; margin-top: 10px; flex-shrink: 0;
        }
        
        /* Contenedor de Historia/Briefing */
        .briefing-container {
            flex-grow: 1;
            margin: 15px 0;
            padding: 15px;
            border: 1px solid rgba(0,255,0,0.2);
            background: rgba(0,20,0,0.3);
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }

        .briefing-title {
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 4px;
        }

        #mission-briefing-text {
            font-size: 13px;
            line-height: 1.4;
            color: #ccc;
            white-space: pre-wrap; /* Mantiene saltos de línea del editor */
        }

        .tactical-label {
            background: rgba(0,0,0,0.85); border: 1px solid var(--p); color: var(--p);
            padding: 2px 6px; font-size: 9px; font-weight: bold; border-radius: 2px;
            white-space: nowrap; text-transform: uppercase; 
            box-shadow: 0 0 8px rgba(0,255,0,0.4);
            pointer-events: none;
        }

        #live-indicator {
            position: absolute; top: 10px; left: 10px; z-index: 1100;
            background: var(--red); color: white; padding: 4px 10px;
            font-size: 10px; font-weight: 900; border-radius: 3px;
            display: none; animation: blink 0.8s infinite;
        }

        /* Footer de Botones */
        .preview-footer {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--gray);
            background: var(--f);
        }

        .nav-links { display: flex; gap: 10px; margin-bottom: 10px; }
        .nav-links a { 
            flex: 1; padding: 12px; font-size: 11px; text-decoration: none; 
            border: 1px solid var(--p); color: #000; background: var(--p);
            text-align: center; font-weight: 900; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        .btn-action { background: var(--p); color: #000; border: none; padding: 18px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        
        #screen-waiting { justify-content: center; align-items: center; background: radial-gradient(circle, #111 0%, #000 100%); }
        .radar-circle { width: 120px; height: 120px; border: 2px solid var(--p); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .bando-msg { font-size: 1.4em; font-weight: bold; margin: 20px 0; padding: 15px; border: 2px solid var(--p); display: none; text-align: center; width: 80%; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes blink { 50% { opacity: 0; } }
        .blink { animation: blink 1.5s infinite; }
    </style>
</head>
<body>

    <button class="btn-logout" onclick="logout()">✖ SALIR</button>

    <!-- PANTALLA INICIAL DE BIENVENIDA -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-card">
            <h1 style="letter-spacing: 5px; color: var(--gold); margin: 0 0 10px 0; font-size: 1.5rem;">BIENVENIDO</h1>
            <h2 id="welcome-callsign" style="color: var(--p); margin: 0 0 30px 0; border-bottom: 1px solid var(--p); display: inline-block; padding: 0 10px;">[ CARGANDO... ]</h2>
            
            <p style="font-size: 12px; color: var(--p); margin-bottom: 10px; opacity: 0.8;">SELECCIONE LA MISIÓN EN LA QUE QUIERE ENLISTARSE:</p>
            
            <select id="mission-dropdown" onchange="viewMission(this.value)">
                <option value="">-- ARCHIVOS DISPONIBLES --</option>
            </select>

            <button style="background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; font-size: 11px;" onclick="window.location.href='operadores.html'">👤 OPERADORES ACTIVOS</button>
        </div>
    </div>

    <!-- PANTALLA DE PREVISUALIZACIÓN -->
    <div id="screen-preview" class="screen">
        <h2 id="prev-name" style="margin:0; color: var(--gold); text-transform: uppercase; font-size: 1.2rem;">SIN SELECCIÓN</h2>
        
        <div id="radar-static">
            <div id="live-indicator">● OPERACIÓN EN CURSO</div>
            <div id="preview-map" style="width: 100%; height: 100%;"></div>
            <div id="no-signal" class="blink" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index: 1000; font-weight: bold; letter-spacing: 5px; pointer-events: none; text-shadow: 2px 2px #000; color: var(--p);">RECUPERANDO DATOS...</div>
        </div>
        
        <!-- Bloque de Historia / Despliegue -->
        <div class="briefing-container">
            <div class="briefing-title">BRIEFING DE MISIÓN & DESPLIEGUE:</div>
            <div id="mission-briefing-text">Cargando inteligencia de campo...</div>
        </div>

        <div class="preview-footer">
            <p id="mission-status-text" style="font-size: 10px; color: var(--p); opacity: 0.7; margin: 5px 0; text-align: center;">VISTA DE SATÉLITE HÍBRIDA OK</p>
            
            <div class="nav-links">
                <a id="link-google" target="_blank">MAPS GOOGLE</a>
                <a id="link-waze" target="_blank">WAZE NAV</a>
            </div>

            <button id="enlist-btn" class="btn-action" onclick="enlistOperative()">📝 CONFIRMAR ENLISTAMIENTO</button>
            <button onclick="showScreen('screen-welcome')" style="background:none; border:none; color:var(--gray); padding: 10px; width:100%; font-family: monospace; cursor:pointer; font-size: 10px;">⬅ VOLVER AL SELECTOR</button>
        </div>
    </div>

    <!-- PANTALLA DE ESPERA -->
    <div id="screen-waiting" class="screen">
        <div class="radar-circle"></div>
        <h2 class="blink" style="margin-top: 0; letter-spacing: 2px;">ESPERANDO ÓRDENES</h2>
        <div id="bando-display" class="bando-msg"></div>
        <p style="font-size: 10px; color: var(--gray); position: absolute; bottom: 30px;">ID OPERATIVO: <span id="id-tag">--</span></p>
    </div>

<script>
// --- CONFIGURACIÓN Y LÓGICA MANTENIDA ---
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userCallsign = null;
let selectedMissionId = null;
let previewMap;
let drawnItems;

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('operadores').orderByChild('email').equalTo(user.email).on('value', snap => {
            if (snap.exists()) {
                const data = Object.values(snap.val())[0];
                userCallsign = data.callsign;
                document.getElementById('welcome-callsign').innerText = userCallsign;
                document.getElementById('id-tag').innerText = userCallsign;
                initLobby();
            }
        });
    } else { window.location.href = 'login.html'; }
});

function initLobby() {
    db.ref('misiones').on('value', snap => {
        const dropdown = document.getElementById('mission-dropdown');
        dropdown.innerHTML = '<option value="">-- ARCHIVOS DISPONIBLES --</option>';
        snap.forEach(c => {
            let option = document.createElement('option');
            option.value = c.key;
            option.text = `OP: ${c.val().nombre}`;
            dropdown.appendChild(option);
        });
    });

    db.ref('operacion_activa/control').on('value', snap => {
        const ctrl = snap.val();
        updateMissionUIStatus(ctrl);
        if(ctrl && ctrl.status === 'EN_CURSO') {
            db.ref(`jugadores_enlistados/${userCallsign}`).once('value', pSnap => {
                const p = pSnap.val();
                if(p && p.equipo !== 'S/E') { window.location.href = 'mapa_tactico.html'; }
            });
        }
    });
}

function updateMissionUIStatus(ctrl) {
    const indicator = document.getElementById('live-indicator');
    const statusText = document.getElementById('mission-status-text');
    const enlistBtn = document.getElementById('enlist-btn');

    if(ctrl && ctrl.status === 'EN_CURSO' && ctrl.missionId === selectedMissionId) {
        if(indicator) indicator.style.display = 'block';
        statusText.innerText = "ATENCIÓN: OPERACIÓN ACTUALMENTE EN CURSO";
        statusText.style.color = "var(--red)";
        enlistBtn.innerText = "SOLICITAR INCORPORACIÓN";
    } else {
        if(indicator) indicator.style.display = 'none';
        statusText.innerText = "VISTA DE SATÉLITE HÍBRIDA OK";
        statusText.style.color = "var(--p)";
        enlistBtn.innerText = "CONFIRMAR ENLISTAMIENTO";
    }
}

function viewMission(id) {
    if(!id) return;
    selectedMissionId = id;
    showScreen('screen-preview');
    
    db.ref('operacion_activa/control').once('value', snap => updateMissionUIStatus(snap.val()));

    if(!previewMap) {
        previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false }).setView([0,0], 2);
        L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(previewMap);
        drawnItems = L.featureGroup().addTo(previewMap);
    }

    drawnItems.clearLayers();
    document.getElementById('no-signal').style.display = 'block';

    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('prev-name').innerText = m.nombre;
        document.getElementById('no-signal').style.display = 'none';

        // CARGA DE HISTORIA/BRIEFING DESDE FIREBASE
        const briefingEl = document.getElementById('mission-briefing-text');
        briefingEl.innerText = m.historia || "SIN INFORMACIÓN ADICIONAL DE DESPLIEGUE.";

        if(m.elementos) {
            m.elementos.forEach(el => {
                let color = '#00ff00';
                if(el.type.includes('RED')) color = '#ff3333';
                if(el.type.includes('BLUE')) color = '#3333ff';
                if(el.type.includes('OBJ') || el.type.includes('SAFE')) color = '#ffd700';

                const style = { color: color, fillColor: color, fillOpacity: 0.3, weight: 2 };
                let layer, centerPos;

                if (el.path) {
                    layer = L.polygon(el.path, style);
                    let lats = el.path.map(p => p.lat);
                    let lngs = el.path.map(p => p.lng);
                    centerPos = [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
                } else if (el.radius) {
                    layer = L.circle(el.center, { radius: el.radius, ...style });
                    centerPos = el.center;
                } else {
                    layer = L.circleMarker(el.center, { radius: 6, ...style });
                    centerPos = el.center;
                }

                const label = L.marker(centerPos, {
                    icon: L.divIcon({
                        className: 'tactical-label',
                        html: el.type.replace('_', ' '),
                        iconAnchor: [30, 0]
                    }),
                    interactive: false
                });

                drawnItems.addLayer(layer);
                drawnItems.addLayer(label);
            });
            const bounds = drawnItems.getBounds();
            previewMap.fitBounds(bounds, { padding: [40, 40] });
            const center = bounds.getCenter();
            document.getElementById('link-google').href = `https://www.google.com/maps/dir/?api=1&destination=${center.lat},${center.lng}`;
            document.getElementById('link-waze').href = `https://waze.com/ul?ll=${center.lat},${center.lng}&navigate=yes`;
        }
    });
}

function enlistOperative() {
    db.ref(`jugadores_enlistados/${userCallsign}`).set({
        callsign: userCallsign,
        equipo: 'S/E',
        lastSeen: Date.now()
    }).then(() => {
        showScreen('screen-waiting');
        listenMyAssignment();
    });
}

function listenMyAssignment() {
    db.ref(`jugadores_enlistados/${userCallsign}`).on('value', snap => {
        const p = snap.val();
        const display = document.getElementById('bando-display');
        if(p && p.equipo !== 'S/E') {
            display.style.display = 'block';
            display.innerText = `BANDO ASIGNADO: ${p.equipo}`;
            display.style.borderColor = p.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
            display.style.color = p.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
            
            db.ref('operacion_activa/control').once('value', cSnap => {
                const ctrl = cSnap.val();
                if(ctrl && ctrl.status === 'EN_CURSO') {
                    setTimeout(() => window.location.href = 'mapa_tactico.html', 2000);
                }
            });
        }
    });
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'screen-preview' && previewMap) {
        setTimeout(() => previewMap.invalidateSize(), 300);
    }
}

function logout() { auth.signOut().then(() => window.location.href = 'index.html'); }
window.onload = initLobby;
</script>
</body>
</html>
