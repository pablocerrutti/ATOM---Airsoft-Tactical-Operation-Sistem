<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - LOBBY TÁCTICO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --red:#ff3333; --blue:#3366ff; }
        body { 
            margin:0; font-family: 'Courier New', monospace; background: var(--f); color: var(--p); 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }
        .view-layer { display: none; width: 100%; flex-direction: column; align-items: center; padding: 20px 0; animation: fadeIn 0.4s ease; }
        .active-view { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .mission-header {
            width: 100%; height: 220px; background-size: cover; background-position: center;
            border-bottom: 2px solid var(--p); position: relative; display: flex; align-items: flex-end;
            background-color: #111;
        }
        .op-title-banner {
            background: rgba(0,0,0,0.85); width: 100%; padding: 15px 0;
            text-align: center; font-weight: bold; border-top: 1px solid var(--p);
            letter-spacing: 3px; text-shadow: 0 0 10px var(--p);
        }
        .panel { width: 92%; max-width: 450px; background: rgba(0,10,0,0.95); border: 1px solid var(--p); padding: 15px; margin-top: 15px; box-sizing: border-box; }
        .info-box { font-size: 12px; background: rgba(0,30,0,0.5); padding: 12px; border-left: 3px solid var(--gold); margin-bottom: 12px; color: #fff; line-height: 1.5; white-space: pre-wrap; }
        #mini-map { width: 100%; height: 250px; border: 1px solid #333; margin: 10px 0; background: #000; }

        .btn { 
            width: 85%; max-width: 320px; padding: 18px; border: 1px solid var(--p); 
            background: rgba(0,20,0,0.5); color: var(--p); font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-family: inherit;
        }
        .btn:hover { background: var(--p); color: #000; }
        .btn-enlist { background: var(--red); color: #fff; border: none; font-size: 1.1rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,51,51,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,51,51,0); } 100% { box-shadow: 0 0 0 0 rgba(255,51,51,0); } }

        .gps-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 15px; }
        .btn-gps { padding: 12px; font-size: 10px; border: 1px solid #444; background: #000; color: #fff; cursor: pointer; font-family: inherit; }

        select { width: 100%; padding: 15px; background: #000; border: 1px solid var(--p); color: var(--p); margin-bottom: 15px; font-family: inherit; }
        .label-tag { font-size: 9px; color: var(--p); opacity: 0.7; text-transform: uppercase; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <div id="lobby-main" class="view-layer active-view" style="justify-content: center; height: 100vh;">
        <h1 style="letter-spacing: 5px; text-align: center;">A.T.O.M<br><span style="font-size: 14px; opacity: 0.6;">SISTEMA DE DESPLIEGUE</span></h1>
        <button class="btn" onclick="showView('selector-screen')">DIRECTORIO DE MISIONES</button>
        <button class="btn" onclick="window.location.href='operadores.html'">GESTIÓN DE PERSONAL</button>
        <button class="btn" style="border-color:#444; color:#666;" onclick="logout()">DESCONECTAR</button>
    </div>

    <div id="selector-screen" class="view-layer">
        <h2 style="letter-spacing: 3px;">SELECCIÓN DE OPERACIÓN</h2>
        <div class="panel">
            <span class="label-tag">Enlace satelital activo</span>
            <select id="mission-selector"><option value="">-- CONECTANDO... --</option></select>
            <button class="btn" style="width:100%;" onclick="loadMissionDetail()">DESCARGAR INTELIGENCIA</button>
            <button class="btn" style="width:100%; border:none; color:var(--red); font-size: 10px;" onclick="showView('lobby-main')">VOLVER AL MENÚ</button>
        </div>
    </div>

    <div id="mission-detail" class="view-layer">
        <div class="mission-header" id="det-img"><div class="op-title-banner" id="det-name">---</div></div>
        <div class="panel">
            <span class="label-tag">Coordenadas de Inserción</span>
            <div id="mini-map"></div>
            <div class="gps-container">
                <button class="btn-gps" style="border-color:#4285F4; color:#4285F4;" onclick="openGPS('google')">GOOGLE MAPS</button>
                <button class="btn-gps" style="border-color:#3366ff; color:#3366ff;" onclick="openGPS('waze')">WAZE</button>
            </div>
            <span class="label-tag" style="color:var(--gold);">Briefing</span>
            <div class="info-box" id="det-hist">---</div>
            <span class="label-tag">Objetivos</span>
            <div class="info-box" style="border-color:var(--p);" id="det-obj">---</div>
            <button class="btn btn-enlist" onclick="confirmEnlistment()">CONFIRMAR ALISTAMIENTO</button>
            <button class="btn" style="width:100%; margin-top: 10px; font-size: 10px; border-color:#444;" onclick="showView('selector-screen')">VOLVER</button>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let missionsData = {};
let selectedMissionId = "";
let miniMap = null;
let gpsCoords = null;

const ATOM_COLORS = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };

function getDirectDriveUrl(url) {
    if (!url || !url.includes('drive.google.com')) return url;
    try {
        const fileId = url.match(/[-\w]{25,}/);
        return fileId ? `https://drive.google.com/uc?export=view&id=${fileId[0]}` : url;
    } catch (e) { return url; }
}

window.onload = () => {
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONE MISIÓN --</option>';
        if (!snap.exists()) return;
        missionsData = snap.val();
        Object.keys(missionsData).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.innerText = (missionsData[key].nombre || "OP").toUpperCase();
            selector.appendChild(opt);
        });
    });
};

function showView(viewId) {
    document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
}

function loadMissionDetail() {
    const id = document.getElementById('mission-selector').value;
    if(!id) return alert("Seleccione misión.");
    selectedMissionId = id;
    const m = missionsData[id];
    if (!m) return alert("Misión no encontrada.");

    document.getElementById('det-name').innerText = "OPERACIÓN: " + (m.nombre || "SIN NOMBRE").toUpperCase();
    document.getElementById('det-hist').innerText = m.historia || "";
    document.getElementById('det-obj').innerText = m.objetivos || "";
    
    // Imagen (igual que en command center)
    let rawUrl = m.imagen_url || m.imagen || "";
    const cleanUrl = getDirectDriveUrl(rawUrl);
    document.getElementById('det-img').style.backgroundImage = `linear-gradient(to bottom, transparent, var(--f)), url('${cleanUrl}')`;

    showView('mission-detail');
    
    // Mapa - Versión que funciona en command center
    let elementosArray = [];
    if (m.elementos) {
        elementosArray = Array.isArray(m.elementos) ? m.elementos : Object.values(m.elementos);
    }

    setTimeout(() => { renderTacticalMap(elementosArray); }, 300);
}

function renderTacticalMap(elementos) {
    if (miniMap) { miniMap.remove(); }
    miniMap = L.map('mini-map', { zoomControl: false, attributionControl: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(miniMap);
    const layers = L.featureGroup().addTo(miniMap);
    gpsCoords = null;

    elementos.forEach(el => {
        const color = ATOM_COLORS[el.type] || '#0f0';
        if (el.path) {
            L.polygon(el.path, {color: color, weight: 2, fillOpacity: 0.3}).addTo(layers);
            if(!gpsCoords) gpsCoords = el.path[0];
        } else if (el.center) {
            if (el.radius) {
                L.circle(el.center, {radius: el.radius, color: color, fillOpacity: 0.3}).addTo(layers);
            } else {
                L.marker(el.center).addTo(layers);
            }
            if(!gpsCoords) gpsCoords = el.center;
        }
    });

    if (elementos.length > 0) {
        miniMap.fitBounds(layers.getBounds(), { padding: [30, 30] });
    } else {
        miniMap.setView([-34.34, -56.71], 15);
    }
    setTimeout(() => { if(miniMap) miniMap.invalidateSize(); }, 200);
}

function openGPS(type) {
    if(!gpsCoords) return alert("Sin coordenadas.");
    const lat = gpsCoords.lat !== undefined ? gpsCoords.lat : gpsCoords[0];
    const lng = gpsCoords.lng !== undefined ? gpsCoords.lng : gpsCoords[1];
    const url = (type === 'google') 
        ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`
        : `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
    window.open(url, '_blank');
}

function confirmEnlistment() {
    const callsign = localStorage.getItem('callsign');
    if(!callsign) return window.location.href = 'index.html';
    db.ref(`jugadores_enlistados/${callsign}`).update({
        callsign: callsign,
        misionId: selectedMissionId,
        misionNombre: missionsData[selectedMissionId].nombre,
        last_update: Date.now()
    }).then(() => {
        localStorage.setItem('activeMissionId', selectedMissionId);
        location.href = 'mapa_tactico.html';
    });
}

function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>
