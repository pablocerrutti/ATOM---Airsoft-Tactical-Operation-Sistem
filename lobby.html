<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Lobby Operativo</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { position: fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction: column; background: var(--f); padding: 15px; box-sizing: border-box; }
        .active { display: flex !important; }
        
        /* Layout con Altura Fija */
        .mission-header-flex { 
            display: flex; 
            gap: 10px; 
            height: 200px; /* Altura fija para la sección */
            margin-bottom: 15px; 
            width: 100%;
        }

        #radar-static { 
            flex: 1; 
            height: 100%;
            border: 1px solid var(--p); 
            background: #111; 
            position: relative; 
            overflow: hidden; 
        }

        #mission-cover-frame { 
            flex: 1; 
            height: 100%;
            border: 1px solid #444; 
            overflow: hidden; 
            display: none; 
            background: #000; 
        }

        #mission-cover-img { 
            width: 100%; 
            height: 100%; 
            display: block;
            /* Mantiene aspecto original sin recortar, adaptándose al ancho/alto */
            object-fit: contain; 
        }

        .info-block { margin-bottom: 12px; padding: 10px; border-left: 2px solid var(--p); background: rgba(0,255,0,0.03); }
        .btn-action { background: var(--p); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-secondary { background: transparent; color: var(--p); border: 1px solid var(--p); padding: 12px; width: 100%; cursor: pointer; font-family: inherit; font-size: 11px; margin-top: 10px; }
        
        select { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); margin-bottom: 20px; font-family: inherit; font-size: 14px; }
        .op-list { background: rgba(0,0,0,0.5); border: 1px solid #222; padding: 8px; font-size: 11px; max-height: 90px; overflow-y: auto; }
        .op-tag { display: inline-block; padding: 2px 5px; border: 1px solid var(--p); margin: 2px; font-size: 10px; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active" style="justify-content: center; align-items: center;">
        <div style="border: 1px solid var(--p); padding: 25px; text-align: center; width: 100%; max-width: 380px; background: rgba(0,20,0,0.4);">
            <h2 style="color:var(--gold); margin-bottom: 5px;">SISTEMA A.T.O.M</h2>
            <p id="welcome-callsign" style="font-size: 12px; margin-bottom: 25px;">IDENTIFICANDO...</p>
            <select id="mission-dropdown" onchange="viewMission(this.value)">
                <option value="">-- SELECCIONAR MISIÓN --</option>
            </select>
            <button class="btn-secondary" onclick="window.location.href='operadores.html'">📡 OPERADORES ACTIVOS EN A.T.O.M</button>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <h2 id="prev-name" style="margin:0 0 10px 0; font-size: 1.1rem; color: var(--gold);">CARGANDO...</h2>
        
        <div class="mission-header-flex">
            <div id="radar-static"><div id="preview-map" style="width:100%; height:100%;"></div></div>
            <div id="mission-cover-frame"><img id="mission-cover-img" src="" onerror="this.parentNode.style.display='none'"></div>
        </div>
        
        <div style="flex-grow:1; overflow-y:auto; margin-bottom: 10px;">
            <div class="info-block">
                <div style="color:var(--gold); font-size:9px;">[ BRIEFING OPERATIVO ]</div>
                <div id="mission-history-text" style="font-size:12px; margin-top:5px; color:#ccc;"></div>
            </div>
            <div class="info-block">
                <div style="color:var(--gold); font-size:9px;">[ OBJETIVOS DE MISIÓN ]</div>
                <div id="mission-objectives-text" style="font-size:12px; margin-top:5px; color:#ccc;"></div>
            </div>
            <div class="info-block">
                <div style="color:var(--gold); font-size:9px;">[ PERSONAL CONFIRMADO ]</div>
                <div id="enlisted-ops" class="op-list"></div>
            </div>
        </div>

        <button id="btn-enlist" class="btn-action" onclick="enlistOperative()">📝 CONFIRMAR ASISTENCIA</button>
        <button onclick="showScreen('screen-welcome')" style="background:none; color:#666; border:none; padding:10px; cursor:pointer; font-family: inherit;">⬅ VOLVER</button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", 
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", 
            projectId: "atom---sistem" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let userCallsign, selectedMissionId, previewMap, drawnItems;

        function formatDriveUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let id = "";
                if (url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
                else if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
                return id ? `https://drive.google.com/uc?export=view&id=${id}` : url;
            }
            return url;
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`usuarios/${user.uid}`).on('value', snap => {
                    if (snap.exists()) {
                        userCallsign = snap.val().callsign;
                        document.getElementById('welcome-callsign').innerText = `OPERADOR: ${userCallsign}`;
                        initLobbySync();
                    }
                });
            } else { window.location.href = 'index.html'; }
        });

        function initLobbySync() {
            db.ref('misiones').on('value', snap => {
                const dd = document.getElementById('mission-dropdown');
                const current = dd.value;
                dd.innerHTML = '<option value="">-- SELECCIONAR MISIÓN --</option>';
                snap.forEach(child => {
                    dd.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
                });
                dd.value = current;
            });
        }

        function viewMission(id) {
            if(!id) return;
            selectedMissionId = id;
            showScreen('screen-preview');
            
            if(!previewMap) {
                previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(previewMap);
                drawnItems = L.featureGroup().addTo(previewMap);
            }

            db.ref(`misiones/${id}`).on('value', snap => {
                const m = snap.val();
                if(!m) return;
                
                document.getElementById('prev-name').innerText = m.nombre;
                document.getElementById('mission-history-text').innerText = m.historia || "---";
                document.getElementById('mission-objectives-text').innerText = m.objetivos || "---";
                
                const frame = document.getElementById('mission-cover-frame');
                const img = document.getElementById('mission-cover-img');
                if(m.imagen) { 
                    frame.style.display='block'; 
                    img.src = formatDriveUrl(m.imagen); 
                } else { frame.style.display='none'; }

                drawnItems.clearLayers();
                if(m.elementos) {
                    const colors = { 'GAME_ZONE': '#0f0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };
                    m.elementos.forEach(el => {
                        let layer;
                        const col = colors[el.type] || '#0f0';
                        if(el.path) layer = L.polygon(el.path, {color: col, weight: 2, fillOpacity: 0.3});
                        else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col, fillOpacity: 0.3});
                        else layer = L.marker(el.center);
                        drawnItems.addLayer(layer);
                    });

                    setTimeout(() => {
                        previewMap.invalidateSize();
                        if(drawnItems.getLayers().length > 0) {
                            previewMap.fitBounds(drawnItems.getBounds(), {padding: [30,30]});
                        }
                    }, 600);
                }
            });

            db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(id).on('value', snap => {
                const container = document.getElementById('enlisted-ops');
                container.innerHTML = '';
                let yaEnlistado = false;
                snap.forEach(child => {
                    if(child.val().callsign === userCallsign) yaEnlistado = true;
                    container.innerHTML += `<span class="op-tag" style="background:var(--p); color:#000;">${child.val().callsign}</span>`;
                });
                const btn = document.getElementById('btn-enlist');
                btn.innerText = yaEnlistado ? "✓ ASISTENCIA CONFIRMADA" : "📝 CONFIRMAR ASISTENCIA";
                btn.disabled = yaEnlistado;
                btn.style.opacity = yaEnlistado ? "0.4" : "1";
            });
        }

        function enlistOperative() {
            if(!selectedMissionId) return;
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).set({
                callsign: userCallsign, equipo: 'S/E', misionId: selectedMissionId, timestamp: Date.now()
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-preview' && previewMap) {
                setTimeout(() => { previewMap.invalidateSize(); }, 200);
            }
        }
    </script>
</body>
</html>
