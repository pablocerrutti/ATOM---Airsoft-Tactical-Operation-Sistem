<script>
// CONFIGURACIÓN CENTRAL - ASEGÚRATE DE QUE ESTO ESTÉ PRESENTE
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

// INICIALIZACIÓN (Esto es lo que faltaba en tu snippet)
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let missionsData = {};
let selectedMissionId = "";
let miniMap;
let gpsCoords = null;

const ATOM_COLORS = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };

// CARGAR LISTA DE MISIONES
window.onload = () => {
    console.log("Conectando con Firebase...");
    db.ref('misiones').on('value', snap => {
        const selector = document.getElementById('mission-selector');
        selector.innerHTML = '<option value="">-- SELECCIONE MISIÓN --</option>';
        
        if (!snap.exists()) {
            console.warn("No se encontraron misiones en la DB.");
            selector.innerHTML = '<option value="">-- SIN MISIONES ACTIVAS --</option>';
            return;
        }

        missionsData = snap.val();
        snap.forEach(child => {
            const m = child.val();
            const opt = document.createElement('option');
            opt.value = child.key;
            opt.innerText = (m.nombre || "OP. DESCONOCIDA").toUpperCase();
            selector.appendChild(opt);
        });
        console.log("Misiones cargadas con éxito.");
    }, error => {
        console.error("Error de Firebase:", error);
        alert("Error de conexión: Verifica las reglas de la base de datos.");
    });
};

// ... (Resto de funciones: showView, loadMissionDetail, initSitreMap, openGPS, confirmEnlistment) ...
// NOTA: En openGPS, corregí el enlace de Google Maps que tenía un error de sintaxis:
function openGPS(type) {
    if(!gpsCoords) return alert("Ubicación no disponible.");
    const lat = gpsCoords.lat;
    const lng = gpsCoords.lng;
    const url = (type === 'google') 
        ? `https://www.google.com/maps?q=${lat},${lng}` 
        : `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
    window.open(url, '_blank');
}
</script>
