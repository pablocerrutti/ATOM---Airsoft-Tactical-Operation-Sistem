<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A.T.O.M. - MAPA TACTICO DE OPERACIONES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --p: #00ff00; --a: #3399ff; --r: #ff3333; }
        body { margin: 0; background: #000; font-family: monospace; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        #hud { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: var(--p); padding: 10px; border: 1px solid var(--p); font-size: 11px; }
        #alert { display: none; position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 5000; background: red; color: white; padding: 20px; border: 4px solid white; font-weight: bold; text-align: center; }
        #radio { position: fixed; bottom: 0; width: 100%; z-index: 2000; background: rgba(0,10,0,0.9); border-top: 2px solid var(--p); height: 180px; display: flex; flex-direction: column; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 10px; color: var(--p); font-size: 12px; }
        .btn-med { background: var(--r); color: white; border: none; padding: 12px; font-weight: bold; width: 100%; }
        .btn-med.down { background: #444; }
        .input-area { display: flex; border-top: 1px solid #333; }
        input { background: #000; border: none; color: var(--p); padding: 12px; flex-grow: 1; outline: none; }
    </style>
</head>
<body>
    <div class="banner-map">A.T.O.M. - AIRSOFT TACTICS OPERATION MAPS</div>
    <a href="index.html" class="btn-home-small">INICIO</a>
    
    <div id="map"></div>

    <div id="controls">
        <div style="display:flex;">
            <button class="btn-action btn-medic" onclick="requestMedic()">🚑 SOLICITAR MÉDICO</button>
            <button class="btn-action btn-down" onclick="reportKilled()">💀 BAJA CONFIRMADA</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const firebaseConfig = { /* TU CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        const opId = urlParams.get('op');
        const myUser = urlParams.get('u');
        
        let map, myTeam, markers = {};

        // Cargar datos de equipo
        db.ref('users/' + myUser).once('value', snap => {
            myTeam = snap.val().team;
            initMap();
        });

        function initMap() {
            map = L.map('map', {zoomControl: false}).setView([-34.10, -56.21], 16);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

            map.locate({watch:true, enableHighAccuracy:true});
            map.on('locationfound', e => {
                db.ref('positions/'+myUser).update({lat:e.latlng.lat, lng:e.latlng.lng, team:myTeam});
            });

            // Escuchar posiciones y alertas médicas
            db.ref('positions').on('value', snap => {
                const data = snap.val();
                for(let id in data) {
                    if(data[id].team === myTeam) {
                        if(markers[id]) map.removeLayer(markers[id]);
                        
                        let iconHtml = `<div style="background:${myTeam==='azul'?'#3399ff':'#ff3333'}; width:12px; height:12px; border-radius:50%; border:2px solid white;"></div>`;
                        
                        if(data[id].status === 'NEED_MEDIC') {
                            iconHtml = `<div class="medic-icon" style="width:15px; height:15px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:10px;">+</div>`;
                            if(id !== myUser) window.navigator.vibrate([200, 100, 200]); // Vibrar si un aliado pide médico
                        }
                        
                        let customIcon = L.divIcon({ html: iconHtml, className: '' });
                        markers[id] = L.marker([data[id].lat, data[id].lng], {icon: customIcon}).addTo(map).bindTooltip(id, {permanent:true, direction:'top'});
                    }
                }
            });
        }

        function requestMedic() {
            db.ref('positions/'+myUser).update({status: 'NEED_MEDIC'});
            // Sumar a estadística de herido
            db.ref('users/'+myUser+'/stats/heridas').transaction(h => (h || 0) + 1);
            alert("ALERTA MÉDICA ENVIADA AL EQUIPO");
        }

        function reportKilled() {
            db.ref('positions/'+myUser).update({status: 'KILLED'});
            db.ref('users/'+myUser+'/stats/bajas').transaction(b => (b || 0) + 1);
            alert("BAJA REGISTRADA EN TU HOJA DE SERVICIO");
        }
    </script>
</body>
</html>
