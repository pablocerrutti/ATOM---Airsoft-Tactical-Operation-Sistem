<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A.T.O.M. - MAPA TACTICO DE OPERACIONES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --p: #00ff00; --a: #3399ff; --r: #ff3333; }
        body { margin: 0; background: #000; font-family: monospace; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        #hud { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: var(--p); padding: 10px; border: 1px solid var(--p); font-size: 11px; }
        #alert { display: none; position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 5000; background: red; color: white; padding: 20px; border: 4px solid white; font-weight: bold; text-align: center; }
        #radio { position: fixed; bottom: 0; width: 100%; z-index: 2000; background: rgba(0,10,0,0.9); border-top: 2px solid var(--p); height: 180px; display: flex; flex-direction: column; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 10px; color: var(--p); font-size: 12px; }
        .btn-med { background: var(--r); color: white; border: none; padding: 12px; font-weight: bold; width: 100%; }
        .btn-med.down { background: #444; }
        .input-area { display: flex; border-top: 1px solid #333; }
        input { background: #000; border: none; color: var(--p); padding: 12px; flex-grow: 1; outline: none; }
    </style>
</head>
<body>
    <div id="alert">⚠️ FUERA DE LÍMITES ⚠️</div>
    <div id="hud">SISTEMA ATAC<br>USER: <span id="u-txt">--</span> | EQ: <span id="t-txt">--</span></div>
    <div id="map"></div>
    <div id="radio">
        <button class="btn-med" onclick="toggleStatus()">⚠️ NOTIFICAR BAJA</button>
        <div id="chat"></div>
        <div class="input-bar">
            <input type="text" id="m-in" placeholder="TRANSMITIR...">
            <button onclick="sendMsg()" style="background:var(--p); border:none; padding:10px;">></button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const opId = new URLSearchParams(window.location.search).get('op');
        let map, myTeam, myCallsign, isDown = false, markers = {}, zones = {};

        function login() {
            const user = prompt("CALLSIGN:").toUpperCase();
            const pass = prompt("CONTRASEÑA:");
            db.ref('users/' + user).once('value', snap => {
                const d = snap.val();
                if (d && d.password === pass) {
                    myCallsign = user; myTeam = d.team;
                    document.getElementById('u-txt').innerText = user;
                    document.getElementById('t-txt').innerText = d.team.toUpperCase();
                    initMap(); listenRadio();
                } else {
                    alert("DEBE DARSE DE ALTA COMO PARTICIPANTE O CLAVE INCORRECTA");
                    window.location.href = "index.html";
                }
            });
        }

        function initMap() {
            map = L.map('map', {zoomControl: false}).setView([-34.10, -56.21], 16);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

            db.ref('operaciones/'+opId).on('value', snap => {
                const op = snap.val(); if(!op) return;
                if(op.limites) zones.poly = L.polygon(op.limites, {color:'lime', fillOpacity:0.05}).addTo(map);
                if(op.resA) zones.resA = L.polygon(op.resA, {color:'#3399ff', fillOpacity:0.1}).addTo(map);
                if(op.resR) zones.resR = L.polygon(op.resR, {color:'#ff3333', fillOpacity:0.1}).addTo(map);
                if(op.objetivos) op.objetivos.forEach(o => L.circleMarker([o.lat, o.lng], {radius:10, color:'yellow'}).addTo(map));
            });

            map.locate({watch:true, enableHighAccuracy:true});
            map.on('locationfound', e => {
                checkZones(e.latlng);
                db.ref('positions/'+myCallsign).set({lat:e.latlng.lat, lng:e.latlng.lng, team:myTeam, status:isDown?'DOWN':'OK'});
            });

            db.ref('positions').on('value', snap => {
                const p = snap.val();
                for(let id in p) {
                    if(p[id].team === myTeam && id !== myCallsign) {
                        if(markers[id]) map.removeLayer(markers[id]);
                        let color = p[id].status==='DOWN'?'#fff':(myTeam==='azul'?'#3399ff':'#ff3333');
                        markers[id] = L.circleMarker([p[id].lat, p[id].lng], {radius:7, color:color, fillOpacity:1}).addTo(map).bindTooltip(id);
                    }
                }
            });
        }

        function checkZones(ll) {
            const pt = turf.point([ll.lng, ll.lat]);
            if(zones.poly) {
                const poly = turf.polygon([zones.poly.getLatLngs()[0].map(p=>[p.lng, p.lat]).concat([[zones.poly.getLatLngs()[0][0].lng, zones.poly.getLatLngs()[0][0].lat]])]);
                document.getElementById('alert').style.display = turf.booleanPointInPolygon(pt, poly) ? 'none' : 'block';
            }
        }

        function toggleStatus() { isDown = !isDown; sendMsg(isDown?"!!! ELIMINADO !!!":"REGRESO A COMBATE"); }
        function sendMsg(alt) {
            const i = document.getElementById('m-in');
            const txt = alt || i.value; if(!txt) return;
            db.ref('radio/'+opId).push({user:myCallsign, msg:txt, team:myTeam});
            i.value = "";
        }

        function listenRadio() {
            db.ref('radio/'+opId).limitToLast(5).on('child_added', snap => {
                const m = snap.val(); if(m.team === myTeam) {
                    const b = document.getElementById('chat'); b.innerHTML += `<div><b>${m.user}:</b> ${m.msg}</div>`; b.scrollTop = b.scrollHeight;
                }
            });
        }

        login();
    </script>
</body>
</html>
