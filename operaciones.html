<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M. - Operaciones</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root { --p: #00ff00; --f: #050505; --accent: #00ffff; }
        body { 
            background: var(--f); color: var(--p); font-family: monospace; 
            margin: 0; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
        }
        header { 
            width: 100%; padding: 20px; text-align: center; 
            border-bottom: 1px solid var(--p); background: rgba(0, 255, 0, 0.05); 
        }
        #status-display { font-size: 0.7rem; margin-top: 10px; color: var(--accent); letter-spacing: 1px; }
        
        /* Lista de Misiones */
        #misiones-list { 
            width: 90%; max-width: 600px; margin-top: 20px; 
            display: none; flex-direction: column; gap: 15px; 
        }
        
        .mision-card { 
            border: 1px solid var(--p); padding: 18px; 
            background: rgba(0, 255, 0, 0.02); 
            position: relative;
        }

        .mision-card h3 { margin: 0 0 10px 0; color: var(--accent); text-transform: uppercase; }
        .mision-card p { margin: 5px 0; font-size: 0.9rem; line-height: 1.4; }

        /* Pantalla de Carga */
        #loader-overlay { margin-top: 100px; text-align: center; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--p);
            border-top: 3px solid transparent; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .btn-retry {
            background: transparent; color: var(--p); border: 1px solid var(--p);
            padding: 10px 20px; cursor: pointer; text-transform: uppercase;
            margin-top: 20px; display: none;
        }

        .btn-back { margin-top: 40px; color: var(--accent); text-decoration: none; font-size: 0.8rem; }
        
        /* Efecto de monitor */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 1.3rem; letter-spacing: 3px;">SISTEMA A.T.O.M.</div>
        <div id="status-display">VERIFICANDO CREDENCIALES...</div>
    </header>

    <div id="loader-overlay">
        <div id="loader-icon" class="spinner"></div>
        <p id="loader-text">Sincronizando con satélite de comando...</p>
        <button id="retry-btn" class="btn-retry" onclick="conectarFirebase()">Reintentar Conexión</button>
    </div>

    <main id="misiones-list"></main>

    <a href="index.html" class="btn-back">← VOLVER AL MENÚ PRINCIPAL</a>

    <script>
        // CONFIGURACIÓN RECUPERADA DE FIREBASE
        // Reemplaza esta URL por la de tu base de datos de Firebase
        const FIREBASE_OPERACIONES_URL = "https://atom-airsoft-tactical-default-rtdb.firebaseio.com/misiones.json";

        async function conectarFirebase() {
            const listado = document.getElementById('misiones-list');
            const loaderOverlay = document.getElementById('loader-overlay');
            const loaderText = document.getElementById('loader-text');
            const loaderIcon = document.getElementById('loader-icon');
            const retryBtn = document.getElementById('retry-btn');
            const status = document.getElementById('status-display');

            // Reset de interfaz para reintento
            listado.innerHTML = "";
            listado.style.display = "none";
            loaderOverlay.style.display = "block";
            loaderIcon.style.display = "block";
            retryBtn.style.display = "none";
            loaderText.innerText = "Sincronizando con satélite de comando...";
            status.innerText = "ENLAZANDO CON BASE DE DATOS...";

            try {
                // Petición a la base de datos de Google Firebase
                const response = await fetch(FIREBASE_OPERACIONES_URL);
                
                if (!response.ok) throw new Error("Fallo de red");

                const misionesData = await response.json();

                if (!misionesData) {
                    loaderIcon.style.display = "none";
                    loaderText.innerText = "NO HAY MISIONES ACTIVAS EN EL SECTOR.";
                    status.innerText = "SECTOR DESPEJADO";
                    return;
                }

                // Si hay datos, ocultamos el loader y mostramos la lista
                loaderOverlay.style.display = "none";
                listado.style.display = "flex";
                status.innerText = "ENLACE ESTABLECIDO - DATOS ACTUALIZADOS";

                // Renderizado dinámico de misiones reales
                Object.keys(misionesData).forEach(id => {
                    const m = misionesData[id];
                    const card = document.createElement('div');
                    card.className = 'mision-card';
                    card.innerHTML = `
                        <h3>${m.nombre || 'MISIÓN CLASIFICADA'}</h3>
                        <p>${m.descripcion || 'Sin detalles adicionales del Comando Central.'}</p>
                        <div style="font-size: 0.7rem; color: var(--accent); margin-top: 10px;">
                            COORDINADAS: ${m.coordenadas || 'No especificadas'} | ESTADO: ${m.estado || 'ACTIVA'}
                        </div>
                    `;
                    listado.appendChild(card);
                });

            } catch (error) {
                console.error("Error de conexión A.T.O.M.:", error);
                loaderIcon.style.display = "none";
                retryBtn.style.display = "block";
                loaderText.innerText = "ERROR CRÍTICO: No se pudo verificar la conexión.";
                loaderText.style.color = "#ff0000";
                status.innerText = "ERROR DE COMUNICACIÓN";
            }
        }

        // Inicio automático al cargar
        window.onload = conectarFirebase;
    </script>
</body>
</html>
