<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M. - Terminal Táctica</title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #map { flex: 1; width: 100%; border-bottom: 2px solid var(--p); background: #000; }
        #status-bar { height: 42vh; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; overflow-y: auto; }
        
        #timer-display { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid var(--p); padding: 5px 15px; font-size: 1.2rem; font-weight: bold; z-index: 1000; display: none; color: var(--p); }

        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        input, select { width: 90%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid var(--p); color: var(--p); font-family: monospace; text-align: center; }
        
        .btn-tactic { background: #111; border: 1px solid var(--p); color: var(--p); padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; font-size: 11px; }
        .btn-tactic:active { background: var(--p); color: #000; }
        .full-width { grid-column: span 2; }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .hidden { display: none !important; }

        #chat-messages { height: 70px; overflow-y: auto; background: #050505; border: 1px solid #222; padding: 5px; font-size: 10px; grid-column: span 2; border-left: 3px solid var(--p); }
    </style>
</head>
<body>

    <div id="timer-display">00:00:00</div>

    <div id="screen-login" class="overlay">
        <h1>A.T.O.M.</h1>
        <p style="font-size: 0.7rem; color: #666;">FLORIDA, URUGUAY - TERMINAL DE CAMPO</p>
        <input type="text" id="login-alias" placeholder="ALIAS / CALLSIGN">
        <input type="password" id="login-pass" placeholder="CONTRASEÑA">
        <select id="select-mision" class="hidden"></select>
        <div id="no-misiones-msg" style="color: var(--warn); font-size: 10px;">CONECTANDO...</div>
        <button id="btn-entrar" class="btn-tactic" style="width: 90%; margin-top: 15px;" onclick="autenticarYEntrar()">SINCRONIZAR</button>
    </div>

    <div id="game-ui" class="hidden" style="height: 100vh; flex-direction: column;">
        <div id="map"></div>
        <div id="status-bar">
            <div id="info-status" class="full-width" style="text-align: center; font-size: 11px; border: 1px solid #222; padding: 5px;">ESPERANDO EQUIPO...</div>
            
            <button id="btn-contacto" class="btn-tactic full-width op-btn hidden" style="border-color: #ffa500; color: #ffa500;" onclick="marcarContacto()">⚠️ MARCAR CONTACTO ENEMIGO</button>
            <button id="btn-medico" class="btn-tactic op-btn hidden" style="border-color: var(--warn); color: var(--warn);" onclick="cambiarEstado('MEDICO')">💉 SOLICITAR MÉDICO</button>
            <button id="btn-baja" class="btn-tactic btn-danger op-btn hidden" onclick="cambiarEstado('BAJA')">💀 INFORMAR BAJA</button>
            
            <div id="chat-messages" class="op-btn hidden"></div>
            <input type="text" id="chat-input" class="op-btn hidden" placeholder="COMUNICACIÓN EQUIPO..." style="grid-column: 1 / 2; margin: 0; height: 40px;">
            <button id="btn-send" class="btn-tactic op-btn hidden" onclick="enviarMensaje()" style="grid-column: 2 / 3;">ENVIAR</button>

            <button class="btn-tactic full-width" style="background: #fff; color: #000;" onclick="cambiarEstado('OPERATIVO')">RESPAWN / LISTO</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, miMarker, miCallsign, miMisionId, miEquipo;
        let markersAliados = {};
        let markersEnemigos = {};

        // 1. CARGA DE MISIONES
        db.ref('operaciones').on('value', snap => {
            const select = document.getElementById('select-mision');
            if (snap.exists()) {
                select.innerHTML = '<option value="">--- SELECCIONAR OPERACIÓN ---</option>';
                snap.forEach(op => {
                    let opt = document.createElement('option');
                    opt.value = op.key; opt.innerText = op.val().nombre;
                    select.appendChild(opt);
                });
                select.classList.remove('hidden');
                document.getElementById('no-misiones-msg').classList.add('hidden');
            }
        });

        async function autenticarYEntrar() {
            miCallsign = document.getElementById('login-alias').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            miMisionId = document.getElementById('select-mision').value;

            if(!miCallsign || !miMisionId) return alert("Datos incompletos.");

            // (Aquí iría tu validación de Google Sheets del código anterior)
            // Por brevedad, saltamos al inicio de terminal:
            document.getElementById('screen-login').classList.add('hidden');
            iniciarTerminal();
        }

        function iniciarTerminal() {
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-ui').classList.remove('hidden');
            
            map = new google.maps.Map(document.getElementById("map"), {
                mapTypeId: 'satellite', disableDefaultUI: true, zoom: 18, center: { lat: -34.095, lng: -56.214 }
            });

            miMarker = new google.maps.Marker({
                map: map, title: "TÚ",
                icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 5, fillColor: "#fff", fillOpacity: 1, strokeColor: "#000", strokeWeight: 2 }
            });

            // 2. FILTRADO DE ZONA Y EQUIPO
            db.ref(`inscripciones/${miCallsign}/equipo`).on('value', snap => {
                if(snap.exists() && snap.val() !== 'PENDIENTE') {
                    miEquipo = snap.val();
                    activarInterfazEquipo();
                    cargarZonasLimitadas();
                    rastrearAliados();
                    escucharContactosEnemigos();
                }
            });
        }

        // CARGAR SOLO LO PERMITIDO (Zona de juego + Mi Respawn + Objetivos)
        function cargarZonasLimitadas() {
            db.ref(`operaciones/${miMisionId}/zonas`).once('value', snap => {
                snap.forEach(zDoc => {
                    const z = zDoc.val();
                    // Mostrar solo zona de juego o el respawn de MI equipo
                    if (z.role === 'zona_juego' || z.role === `respawn_${miEquipo.toLowerCase().split('_')[1]}` || z.role === 'objetivo') {
                        if (z.type === 'polygon') {
                            new google.maps.Polygon({
                                paths: z.path, map: map, strokeColor: '#00ff00', strokeOpacity: 0.8, strokeWeight: 2, fillOpacity: 0.1, fillColor: '#00ff00'
                            });
                        } else {
                            new google.maps.Marker({
                                position: {lat: z.lat, lng: z.lng}, map: map,
                                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: z.role === 'objetivo' ? 'gold' : 'white', fillOpacity: 1, strokeColor: '#000' }
                            });
                        }
                    }
                });
            });
        }

        // VER SOLO COMPAÑEROS
        function rastrearAliados() {
            db.ref(`posiciones/${miEquipo}`).on('value', snap => {
                snap.forEach(aliado => {
                    if (aliado.key !== miCallsign) {
                        if (!markersAliados[aliado.key]) {
                            markersAliados[aliado.key] = new google.maps.Marker({
                                map: map, label: { text: aliado.key, color: 'white', fontSize: '10px' },
                                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 5, fillColor: miEquipo === 'EQUIPO_ROJO' ? 'red' : 'blue', fillOpacity: 1 }
                            });
                        }
                        markersAliados[aliado.key].setPosition(aliado.val());
                    }
                });
            });
        }

        // MARCAR CONTACTO ENEMIGO (Visible para todo el equipo)
        function marcarContacto() {
            const pos = miMarker.getPosition().toJSON();
            db.ref(`operaciones/${miMisionId}/contactos_${miEquipo}`).push({
                pos: pos, timestamp: Date.now(), por: miCallsign
            });
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function escucharContactosEnemigos() {
            db.ref(`operaciones/${miMisionId}/contactos_${miEquipo}`).on('child_added', snap => {
                const c = snap.val();
                const m = new google.maps.Marker({
                    position: c.pos, map: map,
                    icon: { path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW, scale: 6, fillColor: 'orange', fillOpacity: 1, strokeColor: 'red' },
                    animation: google.maps.Animation.BOUNCE
                });
                // Desaparece tras 3 minutos (táctica obsoleta)
                setTimeout(() => m.setMap(null), 180000);
            });
        }

        function activarInterfazEquipo() {
            const status = document.getElementById('info-status');
            status.innerText = `UNIDAD: ${miEquipo}`;
            status.style.color = (miEquipo === 'EQUIPO_ROJO') ? 'var(--red)' : 'var(--blue)';
            document.querySelectorAll('.op-btn').forEach(el => el.classList.remove('hidden'));
        }

        function rastrearGPS() {
            navigator.geolocation.watchPosition(pos => {
                const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                miMarker.setPosition(p);
                if(miEquipo) db.ref(`posiciones/${miEquipo}/${miCallsign}`).set(p);
            }, null, { enableHighAccuracy: true });
        }

        function cambiarEstado(st) {
            db.ref(`inscripciones/${miCallsign}`).update({ estado: st });
            alert("ESTADO ACTUALIZADO: " + st);
        }

        function enviarMensaje() {
            const txt = document.getElementById('chat-input');
            if(!txt.value.trim()) return;
            db.ref(`chats/${miMisionId}/${miEquipo}`).push({ user: miCallsign, text: txt.value });
            txt.value = "";
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=geometry" defer></script>
</body>
</html>
