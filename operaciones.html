<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A.T.O.M. - Despliegue Operativo </title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #header { height: 60px; background: #000; border-bottom: 2px solid var(--p); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 10; }
        #map { flex-grow: 1; background: #111; }

        .overlay-ui { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; gap: 10px; z-index: 5; }
        .info-box { background: rgba(0,0,0,0.8); border: 1px solid var(--p); padding: 10px; font-size: 12px; flex-grow: 1; }
        
        select, button { background: #111; border: 1px solid var(--p); color: var(--p); padding: 8px; font-family: monospace; cursor: pointer; }
        .team-indicator { padding: 5px 10px; font-weight: bold; text-transform: uppercase; border: 1px solid #444; }
        .team-rojo { border-color: var(--red); color: var(--red); }
        .team-azul { border-color: var(--blue); color: var(--blue); }
        
        #setup-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div style="border: 2px solid var(--p); padding: 30px; background: #050505; width: 320px;">
            <h2 style="letter-spacing: 4px;">IDENTIFICACIÓN</h2>
            <select id="select-mision" style="margin-bottom: 10px; width: 100%"><option>CARGANDO MISIONES...</option></select>
            <input type="text" id="user-callsign" placeholder="TU CALLSIGN" style="width: 100%; background: #111; border: 1px solid var(--p); color: var(--p); padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
            <button onclick="iniciarDespliegue()" style="width: 100%">INICIAR TRANSMISIÓN GPS</button>
        </div>
    </div>

    <div id="header">
        <div>
            <span id="op-active-name" style="font-weight: bold; color: #fff;">ESPERANDO ORDENES</span>
            <span id="my-team-display" class="team-indicator" style="margin-left: 15px;">SIN ASIGNAR</span>
        </div>
        <button onclick="location.reload()" style="font-size: 10px;">ABORTAR</button>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, myCallsign, myTeam, myMisionId;
        let playerMarkers = {};
        let missionShapes = [];

        // Cargar misiones al inicio
        db.ref('operaciones').once('value', snap => {
            const sel = document.getElementById('select-mision');
            sel.innerHTML = "";
            snap.forEach(m => {
                sel.innerHTML += `<option value="${m.key}">${m.val().nombre}</option>`;
            });
        });

        function iniciarDespliegue() {
            myCallsign = document.getElementById('user-callsign').value.trim().toUpperCase();
            myMisionId = document.getElementById('select-mision').value;

            if(!myCallsign) return alert("INGRESE CALLSIGN");

            // Verificar equipo del jugador
            db.ref(`inscripciones/${myCallsign}`).once('value', snap => {
                const data = snap.val();
                if(!data || data.mision !== myMisionId) {
                    return alert("NO ESTÁS INSCRITO EN ESTA MISIÓN");
                }
                myTeam = data.equipo;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('my-team-display').innerText = myTeam.replace('_', ' ');
                document.getElementById('my-team-display').className = `team-indicator team-${myTeam.split('_')[1].toLowerCase()}`;
                
                initMap();
                cargarDatosMision();
                activarRastreoGPS();
                escucharCompañeros();
            });
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 17,
                mapTypeId: 'satellite',
                disableDefaultUI: true,
                styles: [{ featureType: "all", elementType: "labels", stylers: [{ visibility: "on" }] }]
            });
        }

        function cargarDatosMision() {
            db.ref(`operaciones/${myMisionId}`).once('value', snap => {
                const m = snap.val();
                document.getElementById('op-active-name').innerText = m.nombre;
                const bounds = new google.maps.LatLngBounds();

                m.zonas.forEach(z => {
                    let shape;
                    if(z.type === 'polygon') {
                        shape = new google.maps.Polygon({ paths: z.path, map: map, clickable: false });
                        z.path.forEach(p => bounds.extend(p));
                    } else {
                        shape = new google.maps.Marker({ position: {lat: z.lat, lng: z.lng}, map: map });
                        bounds.extend({lat: z.lat, lng: z.lng});
                    }
                    aplicarEstiloTatico(shape, z.role);
                });
                if(!bounds.isEmpty()) map.fitBounds(bounds);
            });
        }

        function activarRastreoGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const localizacion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    db.ref(`posiciones/${myTeam}/${myCallsign}`).set(localizacion);
                    map.panTo(localizacion);
                }, null, { enableHighAccuracy: true });
            }
        }

        function escucharCompañeros() {
            // Solo escucha la rama de posiciones de TU equipo
            db.ref(`posiciones/${myTeam}`).on('value', snap => {
                snap.forEach(pPos => {
                    const callsign = pPos.key;
                    if(callsign === myCallsign) return; // No dibujarse a si mismo dos veces

                    if(!playerMarkers[callsign]) {
                        playerMarkers[callsign] = new google.maps.Marker({
                            map: map,
                            label: { text: callsign, color: 'white', fontSize: '10px', fontWeight: 'bold' },
                            icon: {
                                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                                scale: 5,
                                fillColor: myTeam === 'EQUIPO_ROJO' ? 'red' : 'blue',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 1
                            }
                        });
                    }
                    playerMarkers[callsign].setPosition(pPos.val());
                });
            });
        }

        function aplicarEstiloTatico(shape, role) {
            const c = {
                'respawn_rojo': { icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: 'red', fillOpacity: 0.8, strokeColor: '#fff' } },
                'respawn_azul': { icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: 'blue', fillOpacity: 0.8, strokeColor: '#fff' } },
                'objetivo': { icon: { path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW, scale: 8, fillColor: 'gold', fillOpacity: 1, strokeColor: '#000' } },
                'zona_juego': { fillColor: '#00ff00', strokeColor: '#00ff00', fillOpacity: 0.05, strokeWeight: 2 }
            };
            if(c[role]) shape.setOptions(c[role]);
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=geometry" defer></script>
</body>
</html>
