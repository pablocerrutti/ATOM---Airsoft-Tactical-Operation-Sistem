<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M. - Terminal de Despliegue</title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #map { flex: 1; width: 100%; border-bottom: 2px solid var(--p); filter: brightness(0.8) contrast(1.2); background: #111; }
        #status-bar { height: 40vh; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; overflow-y: auto; }
        
        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        select, input { width: 90%; padding: 15px; margin: 10px 0; background: #111; border: 1px solid var(--p); color: var(--p); font-family: monospace; text-align: center; font-size: 1rem; }
        
        .btn-tactic { background: #111; border: 1px solid var(--p); color: var(--p); padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-tactic:active { background: var(--p); color: #000; }
        .btn-tactic:disabled { opacity: 0.5; cursor: not-allowed; border-color: #444; color: #444; }
        .full-width { grid-column: span 2; }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .hidden { display: none !important; }

        #chat-messages { height: 80px; overflow-y: auto; background: #050505; border: 1px solid #222; padding: 5px; font-size: 10px; grid-column: span 2; border-left: 3px solid var(--p); }
        .alert-out { position: fixed; top: 0; width: 100%; background: red; color: white; text-align: center; padding: 10px; display: none; z-index: 10000; animation: blink 0.5s infinite; }
        
        .fade-alert { animation: fadeInOut 2s infinite; color: var(--red); margin: 10px; font-size: 0.8rem; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="alerta-fuera" class="alert-out">¡FUERA DE LÍMITE TÁCTICO!</div>

    <div id="screen-login" class="overlay">
        <h1 style="letter-spacing: 5px; margin-bottom: 5px;">A.T.O.M. ACCESS</h1>
        <p style="font-size: 0.7rem; color: #666; margin-bottom: 20px;">FLORIDA, URUGUAY - OPS TERMINAL</p>
        
        <input type="text" id="login-alias" placeholder="ALIAS / CALLSIGN">
        <input type="password" id="login-pass" placeholder="CONTRASEÑA">
        
        <div id="misiones-wrapper" style="width: 100%; text-align: center;">
            <select id="select-mision" class="hidden"></select>
            <div id="no-misiones-msg" class="fade-alert">CONECTANDO CON EL CENTRO DE MANDO...</div>
        </div>

        <button id="btn-entrar" class="btn-tactic" style="width: 90%; margin-top: 15px;" onclick="autenticarYEntrar()">INGRESAR AL MAPA</button>
        <button class="btn-tactic" style="margin-top:20px; border:none; font-size:10px; opacity: 0.5;" onclick="window.location.href='index.html'">VOLVER AL INICIO</button>
    </div>

    <div id="game-ui" class="hidden" style="height: 100vh; flex-direction: column;">
        <div id="map"></div>
        <div id="status-bar">
            <div id="info-status" class="full-width" style="text-align: center; font-size: 11px; color: var(--warn);">ESPERANDO ASIGNACIÓN DE ESCUADRA...</div>
            
            <button id="btn-baja" class="btn-tactic btn-danger hidden" onclick="cambiarEstado('BAJA')">💀 BAJA</button>
            <button id="btn-medico" class="btn-tactic hidden" style="border-color: var(--warn); color: var(--warn);" onclick="cambiarEstado('MEDICO')">💉 MÉDICO</button>
            <button id="btn-contacto" class="btn-tactic full-width hidden" style="border-color: orange; color: orange;" onclick="marcarContacto()">⚠️ MARCAR CONTACTO ENEMIGO</button>

            <div id="chat-messages" class="hidden"></div>
            <input type="text" id="chat-input" class="hidden" placeholder="MENSAJE A EQUIPO..." style="grid-column: 1 / 2; margin: 0; height: 35px;">
            <button id="btn-send" class="btn-tactic hidden" onclick="enviarMensaje()" style="grid-column: 2 / 3;">OK</button>

            <button class="btn-tactic full-width" style="background: #fff; color: #000; margin-top: 5px;" onclick="cambiarEstado('OPERATIVO')">ACTUALIZAR ESTADO / RESPAWN</button>
            <button class="btn-tactic full-width" style="border:none; font-size: 9px; margin-top: 5px;" onclick="location.reload()">CERRAR SESIÓN</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const sheetId = '1ibyfOH6EcNWDPbZ_JJd4I_e21UGr24qfmbNbBNmaFM4';
        let map, miMarker, miCallsign, miMisionId, miEquipo;
        let zonaJuegoPoligono;

        // 1. CARGA DE MISIONES
        db.ref('operaciones').on('value', snap => {
            const select = document.getElementById('select-mision');
            const msg = document.getElementById('no-misiones-msg');
            if (snap.exists()) {
                select.innerHTML = '<option value="">--- SELECCIONE MISIÓN ---</option>';
                snap.forEach(op => {
                    let opt = document.createElement('option');
                    opt.value = op.key; opt.innerText = op.val().nombre;
                    select.appendChild(opt);
                });
                select.classList.remove('hidden');
                msg.classList.add('hidden');
            } else {
                msg.innerText = "NO HAY OPERACIONES ACTIVAS";
            }
        });

        // 2. AUTENTICACIÓN MEJORADA
        async function autenticarYEntrar() {
            miCallsign = document.getElementById('login-alias').value.trim().toUpperCase();
            const pass = document.getElementById('login-pass').value.trim();
            miMisionId = document.getElementById('select-mision').value;

            if(!miCallsign || !pass || !miMisionId) {
                alert("Faltan datos de acceso.");
                return;
            }

            const btn = document.getElementById('btn-entrar');
            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            try {
                // Forzamos la URL para evitar problemas de caché o formato
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=usuarios&tq=SELECT%20A,B`;
                const response = await fetch(url);
                const rawText = await response.text();
                
                // Limpiar el JSON que devuelve Google
                const jsonData = JSON.parse(rawText.substring(47).slice(0, -2));
                const rows = jsonData.table.rows;

                let validado = false;
                let usuarioExiste = false;

                for (let row of rows) {
                    const sheetUser = row.c[0] ? row.c[0].v.toString().toUpperCase() : "";
                    const sheetPass = row.c[1] ? row.c[1].v.toString() : "";

                    if (sheetUser === miCallsign) {
                        usuarioExiste = true;
                        if (sheetPass === pass) {
                            validado = true;
                            break;
                        }
                    }
                }

                if (!usuarioExiste) {
                    alert(`ERROR: [${miCallsign}] no registrado.`);
                    resetBtn(btn);
                    return;
                }

                if (!validado) {
                    alert("CONTRASEÑA INCORRECTA");
                    resetBtn(btn);
                    return;
                }

                // EXITOSO
                db.ref(`inscripciones/${miCallsign}`).set({
                    callsign: miCallsign,
                    mision: miMisionId,
                    equipo: 'PENDIENTE',
                    estado: 'OPERATIVO',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                
                document.getElementById('screen-login').classList.add('hidden');
                lanzarMapaEstatico();

            } catch (error) {
                console.error("Error en validación:", error);
                alert("Error de conexión con la base de datos.");
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.innerText = "INGRESAR AL MAPA";
            btn.disabled = false;
        }

        // 3. MAPA
        function lanzarMapaEstatico() {
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-ui').classList.remove('hidden');
            
            // Un pequeño delay asegura que el contenedor del mapa tenga tamaño antes de cargar
            setTimeout(() => {
                initMap();
            }, 300);

            db.ref(`inscripciones/${miCallsign}/equipo`).on('value', snap => {
                if(snap.exists() && snap.val() !== 'PENDIENTE') {
                    miEquipo = snap.val();
                    activarFuncionesEscuadra();
                }
            });
        }

        function initMap() {
            // VERIFICAR SI GOOGLE MAPS CARGÓ
            if (typeof google === 'undefined') {
                alert("Error: Google Maps no se cargó. Revisa tu API Key.");
                return;
            }

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 17, 
                center: {lat: -34.095, lng: -56.214},
                mapTypeId: 'satellite', 
                disableDefaultUI: true,
                gestureHandling: 'greedy'
            });

            miMarker = new google.maps.Marker({
                map: map,
                icon: { path: google.maps.SymbolPath.CIRCLE, scale:
