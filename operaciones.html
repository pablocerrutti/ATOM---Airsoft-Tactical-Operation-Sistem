<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M. - Terminal Táctica</title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --warn: #ffd700; --safe: #00ffff; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #map { flex: 1; width: 100%; border-bottom: 2px solid var(--p); background: #000; }
        #status-bar { height: 42vh; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; overflow-y: auto; }
        
        /* Cronómetro Superior */
        #timer-display { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid var(--p); padding: 5px 15px; font-size: 1.2rem; font-weight: bold; z-index: 1000; display: none; color: var(--p); text-shadow: 0 0 5px var(--p); }

        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        select, input { width: 90%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid var(--p); color: var(--p); font-family: monospace; text-align: center; font-size: 1rem; }
        
        .btn-tactic { background: #111; border: 1px solid var(--p); color: var(--p); padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; font-size: 11px; }
        .btn-tactic:active { background: var(--p); color: #000; }
        .full-width { grid-column: span 2; }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .hidden { display: none !important; }

        #chat-messages { height: 70px; overflow-y: auto; background: #050505; border: 1px solid #222; padding: 5px; font-size: 10px; grid-column: span 2; border-left: 3px solid var(--p); }
        .alert-out { position: fixed; top: 0; width: 100%; background: red; color: white; text-align: center; padding: 10px; display: none; z-index: 10001; animation: blink 0.5s infinite; font-weight: bold; }
        
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="timer-display">00:00:00</div>
    <div id="alerta-fuera" class="alert-out">¡FUERA DE LÍMITE TÁCTICO!</div>

    <div id="screen-login" class="overlay">
        <h1 style="letter-spacing: 5px; margin-bottom: 5px;">A.T.O.M.</h1>
        <p style="font-size: 0.7rem; color: #666; margin-bottom: 20px;">FLORIDA, URUGUAY - TERMINAL DE CAMPO</p>
        
        <input type="text" id="login-alias" placeholder="ALIAS / CALLSIGN">
        <input type="password" id="login-pass" placeholder="CONTRASEÑA">
        
        <select id="select-mision" class="hidden"></select>
        <div id="no-misiones-msg" style="color: var(--warn); font-size: 10px;">ESTABLECIENDO CONEXIÓN...</div>

        <button id="btn-entrar" class="btn-tactic" style="width: 90%; margin-top: 15px;" onclick="autenticarYEntrar()">SINCRONIZAR TERMINAL</button>
        <button class="btn-tactic" style="width: 90%; margin-top: 10px; border-color: #444; color: #666;" onclick="window.location.href='index.html'">VOLVER AL INICIO</button>
    </div>

    <div id="game-ui" class="hidden" style="height: 100vh; flex-direction: column;">
        <div id="map"></div>
        <div id="status-bar">
            <div id="info-status" class="full-width" style="text-align: center; font-size: 11px; color: var(--warn); border: 1px solid #222; padding: 5px;">ESPERANDO INICIO DE MISIÓN...</div>
            
            <button id="btn-baja" class="btn-tactic btn-danger op-btn hidden" onclick="cambiarEstado('BAJA')">💀 INFORMAR BAJA</button>
            <button id="btn-medico" class="btn-tactic op-btn hidden" style="border-color: var(--warn); color: var(--warn);" onclick="cambiarEstado('MEDICO')">💉 MÉDICO</button>
            
            <button id="btn-contacto" class="btn-tactic full-width op-btn hidden" style="border-color: orange; color: orange;" onclick="marcarContacto()">⚠️ CONTACTO ENEMIGO</button>

            <div id="chat-messages" class="op-btn hidden"></div>
            <input type="text" id="chat-input" class="op-btn hidden" placeholder="MENSAJE..." style="grid-column: 1 / 2; margin: 0; height: 40px;">
            <button id="btn-send" class="btn-tactic op-btn hidden" onclick="enviarMensaje()" style="grid-column: 2 / 3;">ENVIAR</button>

            <button class="btn-tactic full-width" style="background: #fff; color: #000; margin-top: 5px;" onclick="cambiarEstado('OPERATIVO')">RE-SINCRONIZAR / RESPAWN</button>
            <button class="btn-tactic full-width" style="border:none; font-size: 9px; opacity: 0.5;" onclick="location.reload()">DESCONECTAR TERMINAL</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const sheetId = '1ibyfOH6EcNWDPbZ_JJd4I_e21UGr24qfmbNbBNmaFM4';
        let map, miMarker, miCallsign, miMisionId, miEquipo;
        let timerInterval;

        // 1. LISTAR MISIONES
        db.ref('operaciones').on('value', snap => {
            const select = document.getElementById('select-mision');
            const msg = document.getElementById('no-misiones-msg');
            if (snap.exists()) {
                select.innerHTML = '<option value="">--- SELECCIONAR OPERACIÓN ---</option>';
                snap.forEach(op => {
                    let opt = document.createElement('option');
                    opt.value = op.key; opt.innerText = op.val().nombre;
                    select.appendChild(opt);
                });
                select.classList.remove('hidden');
                msg.classList.add('hidden');
            }
        });

        async function autenticarYEntrar() {
            miCallsign = document.getElementById('login-alias').value.trim().toUpperCase();
            const pass = document.getElementById('login-pass').value.trim();
            miMisionId = document.getElementById('select-mision').value;

            if(!miCallsign || !pass || !miMisionId) return alert("Complete los datos de acceso.");

            const btn = document.getElementById('btn-entrar');
            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            try {
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=usuarios`;
                const response = await fetch(url);
                const text = await response.text();
                const data = JSON.parse(text.substr(47).slice(0, -2));
                
                let valido = false;
                data.table.rows.forEach(row => {
                    if (row.c[0]?.v.toString().toUpperCase() === miCallsign && row.c[1]?.v.toString() === pass) valido = true;
                });

                if (!valido) {
                    alert("Credenciales incorrectas.");
                    btn.disabled = false; btn.innerText = "SINCRONIZAR TERMINAL";
                    return;
                }

                db.ref(`inscripciones/${miCallsign}`).set({
                    callsign: miCallsign, mision: miMisionId, equipo: 'PENDIENTE', estado: 'OPERATIVO', timestamp: Date.now()
                });
                
                document.getElementById('screen-login').classList.add('hidden');
                iniciarTerminal();

            } catch (e) { alert("Error de red."); btn.disabled = false; }
        }

        function iniciarTerminal() {
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-ui').classList.remove('hidden');
            
            map = new google.maps.Map(document.getElementById("map"), {
                mapTypeId: 'satellite', disableDefaultUI: true, zoom: 17, center: { lat: -34.095, lng: -56.214 }
            });

            miMarker = new google.maps.Marker({
                map: map, title: miCallsign,
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: "#00ff00", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2 }
            });

            // Escuchar el Timer y el Estado de la Misión desde Firebase
            db.ref(`operaciones/${miMisionId}/control`).on('value', snap => {
                const ctrl = snap.val();
                if (ctrl && ctrl.activo) {
                    document.getElementById('timer-display').style.display = 'block';
                    iniciarContadorLocal(ctrl.startTime);
                } else {
                    document.getElementById('timer-display').style.display = 'none';
                    clearInterval(timerInterval);
                }
            });

            db.ref(`inscripciones/${miCallsign}/equipo`).on('value', snap => {
                if(snap.exists() && snap.val() !== 'PENDIENTE') {
                    miEquipo = snap.val();
                    activarInterfazEquipo();
                }
            });

            rastrearGPS();
        }

        function iniciarContadorLocal(startTime) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const ahora = Date.now();
                const diff = ahora - startTime;
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function activarInterfazEquipo() {
            const status = document.getElementById('info-status');
            status.innerText = `ASIGNADO A: ${miEquipo.replace('_', ' ')}`;
            status.style.color = (miEquipo === 'EQUIPO_ROJO') ? 'var(--red)' : 'var(--blue)';
            
            // Habilitar todos los botones tácticos
            document.querySelectorAll('.op-btn').forEach(el => el.classList.remove('hidden'));

            // Conectar Chat de Equipo
            db.ref(`chats/${miMisionId}/${miEquipo}`).limitToLast(10).on('child_added', snap => {
                const m = snap.val();
                const box = document.getElementById('chat-messages');
                box.innerHTML += `<div><b>[${m.user}]</b>: ${m.text}</div>`;
                box.scrollTop = box.scrollHeight;
            });
        }

        function rastrearGPS() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(pos => {
                const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                miMarker.setPosition(p);
                if(miEquipo) db.ref(`posiciones/${miEquipo}/${miCallsign}`).set(p);
            }, null, { enableHighAccuracy: true });
        }

        function cambiarEstado(nuevo) {
            db.ref(`inscripciones/${miCallsign}`).update({ estado: nuevo });
            if(navigator.vibrate) navigator.vibrate(200);
        }

        function enviarMensaje() {
            const txt = document.getElementById('chat-input');
            if(!txt.value.trim() || !miEquipo) return;
            db.ref(`chats/${miMisionId}/${miEquipo}`).push({ user: miCallsign, text: txt.value });
            txt.value = "";
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=geometry" defer></script>
</body>
</html>
