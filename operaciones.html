<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAC - Misiones</title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; text-align: center; }
        .banner { background: #111; padding: 15px; border-bottom: 2px solid var(--p); font-weight: bold; }
        #login-area, #ops-area { margin: 20px auto; width: 90%; max-width: 400px; }
        .op-card { border: 1px solid var(--p); padding: 15px; margin-bottom: 15px; background: #111; cursor: pointer; }
        .no-ops { color: #ff3333; padding: 40px; border: 1px dashed #ff3333; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        .btn-home { display: inline-block; margin: 20px; color: var(--p); text-decoration: none; border: 1px solid var(--p); padding: 8px 15px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="banner">A.T.O.M. - AIRSOFT TACTICS OPERATION MAPS</div>

    <div id="login-area">
        <h3>IDENTIFICACIÓN REQUERIDA</h3>
        <input type="text" id="l-user" placeholder="CALLSIGN">
        <input type="password" id="l-pass" placeholder="CONTRASEÑA">
        <button onclick="validar()" style="width:100%; padding:12px; background:var(--p); font-weight:bold;">VERIFICAR</button>
    </div>

    <div id="ops-area" style="display:none;">
        <h3>MISIONES DISPONIBLES</h3>
        <div id="lista-ops"></div>
        <div id="user-stats" style="margin-top:30px; border-top:1px solid #333; padding-top:15px; font-size:12px;"></div>
    </div>

    <a href="index.html" class="btn-home">⬅ VOLVER AL INICIO</a>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { /* TU CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function validar() {
            const u = document.getElementById('l-user').value.toUpperCase();
            const p = document.getElementById('l-pass').value;
            db.ref('users/' + u).once('value', snap => {
                const d = snap.val();
                if(d && d.password === p) {
                    document.getElementById('login-area').style.display = 'none';
                    document.getElementById('ops-area').style.display = 'block';
                    cargarOps(u, d.stats);
                } else { alert("ACCESO DENEGADO"); }
            });
        }

        function cargarOps(user, stats) {
            document.getElementById('user-stats').innerHTML = `
                <p>OPERADOR: ${user}</p>
                <p>MISIÓNES: ${stats.misiones || 0} | BAJAS: ${stats.bajas || 0} | HERIDAS: ${stats.heridas || 0}</p>
            `;

            db.ref('operaciones').on('value', snap => {
                const ops = snap.val();
                const container = document.getElementById('lista-ops');
                container.innerHTML = "";
                if(!ops) {
                    container.innerHTML = "<div class='no-ops'>NO HAY OPERACIONES DISPONIBLES EN ESTE MOMENTO</div>";
                } else {
                    for(let id in ops) {
                        container.innerHTML += `
                            <div class="op-card" onclick="window.location.href='mapa.html?op=${id}&u=${user}'">
                                <strong>${ops[id].nombre}</strong><br>
                                <small>ESTADO: ACTIVA</small>
                            </div>
                        `;
                    }
                }
            });
        }
    </script>
</body>
</html>
