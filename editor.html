<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor (Leaflet)</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <!-- Leaflet Assets (Alternativa gratuita) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        #panel { 
            width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 1000;
            transition: transform 0.3s ease; position: absolute; height: 100%; backdrop-filter: blur(10px);
        }
        .panel-hidden { transform: translateX(-100%); }
        
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100; background: var(--f);
            color: var(--p); border: 1px solid var(--p); padding: 10px; cursor: pointer;
            border-radius: 4px; font-weight: bold;
        }

        #map { flex:1; width: 100%; height: 100%; background: #0a0a0a; }
        .menu-header { padding: 60px 15px 15px 15px; background:#111; border-bottom:1px solid var(--p); text-align: center; }
        
        details { border-bottom: 1px solid #222; background: #080808; }
        summary { padding: 15px; cursor: pointer; outline: none; font-weight: bold; font-size: 13px; color: var(--gold); list-style: none; display: flex; justify-content: space-between; align-items: center; }
        
        .tool-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        button { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; transition: 0.2s; font-size: 11px; text-transform: uppercase; }
        button.active { background: var(--p); color: #000; box-shadow: 0 0 15px var(--p); }
        
        .btn-save { background: var(--gold); color: #000; border: none; font-size: 13px; margin-top: 10px; }
        .btn-exit-menu { margin-top: 20px; border-color: var(--red); color: var(--red); background: rgba(255,0,0,0.05); }
        .btn-exit-menu:hover { background: var(--red); color: #fff; }

        .player-item { padding: 8px; border-bottom: 1px solid #222; font-size: 12px; display: flex; justify-content: space-between; }
        
        .leaflet-container { background: #000 !important; }
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        @media (min-width: 1024px) { #panel { position: relative; transform: translateX(0); width: 350px; } #menu-toggle { display: none; } .menu-header { padding: 15px; } }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰ MENÚ</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div class="menu-header">
            <h3 style="margin:0; font-size: 1.2rem;">A.T.O.M EDITOR</h3>
        </div>

        <details open>
            <summary>📂 OPERACIONES</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="NOMBRE DE OP..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:var(--p);">
                <button class="btn-save" onclick="saveMission()">💾 GUARDAR EN FIREBASE</button>
            </div>
        </details>

        <details>
            <summary>🛠️ HERRAMIENTAS TÁCTICAS</summary>
            <div class="tool-content">
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 LÍMITE JUEGO</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 RESPAWN RED</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 RESPAWN BLUE</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="border-color:#444; color:#666; margin-top:10px;">LIMPIAR MAPA</button>
            </div>
        </details>

        <details>
            <summary>👥 OPERADORES</summary>
            <div class="tool-content">
                <div id="player-list" style="max-height: 200px; overflow-y: auto;"></div>
                <button onclick="autoBalanceTeams()" style="border-color: var(--gold); color: var(--gold);">⚖️ AUTOBALANCEAR</button>
                
                <button class="btn-exit-menu" onclick="window.location.href='index.html'">
                    ✖ SALIR AL MENÚ PRINCIPAL
                </button>
            </div>
        </details>
    </div>
    <div id="map"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    authDomain: "atom---sistem.firebaseapp.com",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
    storageBucket: "atom---sistem.firebasestorage.app",
    messagingSenderId: "151110156876",
    appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawnItems, currentMissionId = null;
let currentAtomType = '';

function initMap() {
    map = L.map('map', { zoomControl: false }).setView([-34.34, -56.71], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    map.on(L.Draw.Event.CREATED, function (event) {
        const layer = event.layer;
        layer.atomType = currentAtomType;
        
        if(currentAtomType.includes('RED')) layer.setStyle?.({color: '#ff3333', fillColor: '#ff3333'});
        if(currentAtomType.includes('BLUE')) layer.setStyle?.({color: '#3333ff', fillColor: '#3333ff'});
        if(currentAtomType === 'GAME_ZONE') layer.setStyle?.({color: '#00ff00', fillColor: '#00ff00'});

        drawnItems.addLayer(layer);
        resetButtons();
    });

    loadMissionList();
    syncPlayers();
}

function startDraw(type, atomType, btn) {
    resetButtons();
    btn.classList.add('active');
    currentAtomType = atomType;

    let drawer;
    if(type === 'polygon') drawer = new L.Draw.Polygon(map);
    if(type === 'circle') drawer = new L.Draw.Circle(map);
    if(type === 'marker') drawer = new L.Draw.Marker(map);
    
    drawer.enable();
}

function resetButtons() {
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
}

function clearMap() { drawnItems.clearLayers(); }

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Asigna un nombre");

    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });

    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).set({ id: mId, nombre: name, elementos: elementos })
      .then(() => alert("OPERACIÓN GUARDADA"));
}

function loadMissionToEdit(id) {
    if(!id) return location.reload();
    currentMissionId = id;
    clearMap();
    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('mission-name').value = m.nombre;
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                if(el.path) layer = L.polygon(el.path);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius});
                else layer = L.marker(el.center);
                
                layer.atomType = el.type;
                drawnItems.addLayer(layer);
            });

            // AUTO-ENFOQUE: Posiciona el mapa sobre los elementos cargados
            if (drawnItems.getLayers().length > 0) {
                map.fitBounds(drawnItems.getBounds(), { padding: [50, 50] });
            }
        }
    });
}

function syncPlayers() {
    db.ref('jugadores_enlistados').on('value', snap => {
        const listDiv = document.getElementById('player-list');
        listDiv.innerHTML = '';
        snap.forEach(child => {
            const p = child.val();
            listDiv.innerHTML += `<div class="player-item"><span>${p.callsign}</span> <span style="color:var(--gold)">${p.equipo || 'S/E'}</span></div>`;
        });
    });
}

function autoBalanceTeams() {
    db.ref('jugadores_enlistados').once('value', snap => {
        let players = []; snap.forEach(c => players.push({id: c.key}));
        players.sort(() => Math.random() - 0.5);
        players.forEach((p, i) => {
            db.ref(`jugadores_enlistados/${p.id}`).update({ equipo: i % 2 === 0 ? 'RED' : 'BLUE' });
        });
    });
}

function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });
    });
}

window.onload = initMap;
</script>
</body>
</html>
