<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        
        #panel { width:320px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; overflow-y: auto; z-index: 10; }
        #map { flex:1; }

        .menu-header { padding:15px; background:#111; border-bottom:1px solid #222; font-weight:bold; }
        .tool-box { padding:10px; display:flex; flex-direction:column; gap:8px; }
        
        button { 
            width:100%; padding:12px; background:#111; color:var(--p); 
            border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; 
        }
        button:hover { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; }
        
        .btn-save { background: var(--gold); color: #000; border: none; margin-top: 15px; font-size: 16px; }
        input { width:100%; padding:12px; background:#000; border:1px solid var(--gold); color:var(--gold); box-sizing: border-box; }
        
        .edit-tag { background: var(--gold); color: #000; padding: 5px; font-size: 10px; text-align: center; font-weight: bold; display:none; }
    </style>
</head>
<body>

<div id="panel">
    <div class="menu-header">
        <h3 style="margin:0;">A.T.O.M EDITOR</h3>
        <div id="edit-tag" class="edit-tag">MODO EDICIÓN ACTIVO</div>
    </div>

    <div class="tool-box">
        <small>1. CARGAR EXISTENTE</small>
        <select id="mission-selector" onchange="loadMissionToEdit(this.value)" style="width:100%; padding:10px; background:#111; color:var(--p); border:1px solid #333;">
            <option value="">-- NUEVA MISIÓN --</option>
        </select>
    </div>

    <div class="tool-box">
        <small>2. HERRAMIENTAS</small>
        <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>
        <button onclick="setMode('SAFE_ZONE', this)">⚪ ZONA SEGURA</button>
        <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>
        <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>
        <button onclick="setMode('OBJ_TOWER', this)">🔘 OBJETIVO</button>
    </div>

    <div class="tool-box" style="margin-top:auto; border-top:1px solid #222;">
        <input id="mission-name" placeholder="NOMBRE DE LA OP...">
        <button class="btn-save" id="save-btn" onclick="saveMission()">💾 GUARDAR EN FIREBASE</button>
        <button onclick="location.href='restricted_zone.html'" style="border:none; color:#666; font-size:10px;">VOLVER AL PANEL</button>
    </div>
</div>

<div id="map"></div>

<script>
// Configuración proporcionada
// Configuración Real de A.T.O.M v2.0
const firebaseConfig = {
  apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
  authDomain: "atom---sistem.firebaseapp.com",
  databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
  projectId: "atom---sistem",
  storageBucket: "atom---sistem.firebasestorage.app",
  messagingSenderId: "151110156876",
  appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
};

// Inicializar
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let map, drawingManager;
let currentMissionId = null;
let mapOverlays = [];

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, 
        zoom: 15,
        mapTypeId: "satellite",
        disableDefaultUI: true
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: true, draggable: true, fillOpacity: 0.3 },
        circleOptions: { editable: true, draggable: true, fillOpacity: 0.4 }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        if (!mode) { e.overlay.setMap(null); return alert("Selecciona herramienta"); }
        e.overlay.atomType = mode;
        mapOverlays.push(e.overlay);
    });

    loadMissionList();
}

function setMode(mode, btn) {
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;

    const isCircle = mode.includes("RESPAWN");
    const isPolygon = mode.includes("ZONE");
    
    drawingManager.setDrawingMode(
        isCircle ? google.maps.drawing.OverlayType.CIRCLE :
        isPolygon ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.MARKER
    );
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name || mapOverlays.length === 0) return alert("Datos incompletos");

    let elements = {};
    mapOverlays.forEach((obj, i) => {
        const id = "el_" + Date.now() + "_" + i;
        let data = { type: obj.atomType };
        
        if (obj.getPath) {
            data.path = obj.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
        } else if (obj.getRadius) {
            data.center = {lat: obj.getCenter().lat(), lng: obj.getCenter().lng()};
            data.radius = obj.getRadius();
        } else {
            data.pos = {lat: obj.getPosition().lat(), lng: obj.getPosition().lng()};
        }
        elements[id] = data;
    });

    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).set({
        id: mId,
        nombre: name,
        estado: "PREPARACION",
        elements: elements
    }).then(() => {
        alert("Operación Guardada");
        location.reload();
    });
}

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

function loadMissionToEdit(id) {
    if(!id) return location.reload();
    currentMissionId = id;
    document.getElementById('edit-tag').style.display = "block";
    
    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('mission-name').value = m.nombre;
        // Aquí se cargan los elementos al mapa (lógica similar a la anterior)
    });
}
</script>
<!-- API Key de Google Maps necesaria para renderizar el editor -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing&callback=initMap" async defer></script>
</body>
</html>
