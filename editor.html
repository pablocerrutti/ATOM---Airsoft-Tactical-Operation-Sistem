<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor Pro (Hybrid)</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <!-- Leaflet Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- Google Maps API & GoogleMutant Plugin -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        #panel { 
            width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 1000;
            transition: transform 0.3s ease; position: absolute; height: 100%; backdrop-filter: blur(10px);
        }
        .panel-hidden { transform: translateX(-100%); }
        
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100; background: var(--f);
            color: var(--p); border: 1px solid var(--p); padding: 10px; cursor: pointer;
        }

        #map { flex:1; width: 100%; height: 100%; background: #000; }
        .menu-header { padding: 60px 15px 15px 15px; background:#111; border-bottom:1px solid var(--p); text-align: center; }
        
        details { border-bottom: 1px solid #222; background: #080808; }
        summary { padding: 15px; cursor: pointer; outline: none; font-weight: bold; font-size: 13px; color: var(--gold); list-style: none; }
        
        .tool-content { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        button { width:100%; padding:10px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        button.active { background: var(--p); color: #000; box-shadow: 0 0 10px var(--p); }
        
        .btn-save { background: var(--gold); color: #000; border: none; font-size: 12px; }
        .btn-delete { background: var(--red); color: #fff; border: none; font-size: 10px; margin-top: 5px; }

        .mission-control-box { background: #111; padding: 10px; border: 1px solid var(--gold); border-radius: 4px; }
        #timer-display { font-size: 24px; font-weight: 900; text-align: center; color: var(--gold); display: block; margin: 5px 0; }
        .score-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; }

        .player-item { 
            padding: 5px; border-bottom: 1px solid #222; font-size: 11px; 
            display: flex; align-items: center; gap: 5px;
        }
        .team-btn { padding: 2px 5px; font-size: 9px; border: 1px solid var(--gray); cursor: pointer; }
        .team-red { color: var(--red); border-color: var(--red); }
        .team-blue { color: var(--blue); border-color: var(--blue); }

        @media (min-width: 1024px) { #panel { position: relative; transform: translateX(0); width: 350px; } #menu-toggle { display: none; } .menu-header { padding: 15px; } }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰ MENÚ</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div class="menu-header">
            <h3 style="margin:0; font-size: 1rem;">A.T.O.M COMMAND CENTER</h3>
        </div>

        <details open>
            <summary>📂 GESTIÓN DE MISIÓN</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)" style="width:100%; padding:8px; background:#000; color:var(--p); border:1px solid #333;">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="NOMBRE DE OPERACIÓN..." style="width:100%; padding:8px; background:#000; border:1px solid #333; color:var(--p); box-sizing: border-box;">
                <button class="btn-save" onclick="saveMission()">💾 GUARDAR / ACTUALIZAR</button>
                <button id="btn-delete-mission" class="btn-delete" style="display:none;" onclick="deleteCurrentMission()">🗑️ ELIMINAR MISIÓN</button>
                <button onclick="toggleMapStyle()" id="btn-map-style" style="margin-top:5px; border-color:var(--gray);">🛰️ VISTA: HÍBRIDA</button>
            </div>
        </details>

        <!-- El resto de los detalles del panel se mantienen igual -->
        <details open>
            <summary>⏱️ CONTROL DE PARTIDA</summary>
            <div class="tool-content mission-control-box">
                <div class="score-row">
                    <span style="color:var(--red)">RED BAJAS: <b id="kills-red">0</b></span>
                    <span style="color:var(--blue)">BLUE BAJAS: <b id="kills-blue">0</b></span>
                </div>
                <span id="timer-display">00:00:00</span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                    <button id="btn-start" onclick="launchMission()" style="border-color:var(--gold); color:var(--gold);">🚀 LANZAR</button>
                    <button onclick="pauseMission()">⏸ PAUSAR</button>
                    <button onclick="resetMission()" style="color:var(--red); border-color:var(--red);">🔄 RESET</button>
                    <button onclick="endMission()">🏁 FINALIZAR</button>
                </div>
            </div>
        </details>

        <details>
            <summary>🛠️ HERRAMIENTAS TÁCTICAS</summary>
            <div class="tool-content">
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 LÍMITE JUEGO</button>
                <button onclick="startDraw('polygon', 'SAFE_ZONE', this)" style="border-color:var(--gold); color:var(--gold);">🟡 ZONA SEGURA</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 RESPAWN RED</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 RESPAWN BLUE</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="border-color:#444; color:#666; margin-top:5px;">LIMPIAR LIENZO</button>
            </div>
        </details>

        <details>
            <summary>👥 OPERADORES EN ESPERA</summary>
            <div class="tool-content">
                <div id="player-list" style="max-height: 180px; overflow-y: auto; background: #000; padding: 5px;"></div>
                <button onclick="autoBalanceTeams()" style="border-color: var(--gold); color: var(--gold); margin-top:10px;">⚖️ AUTOBALANCEAR EQUIPOS</button>
                <button onclick="window.location.href='index.html'" style="margin-top:20px; border-color:var(--red); color:var(--red);">⬅ VOLVER AL MENÚ</button>
            </div>
        </details>
    </div>
    <div id="map"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawnItems, currentMissionId = null;
let currentAtomType = '';
let missionTimerInterval;

// CAPAS DE MAPA CON GOOGLE MUTANT
let currentLayer;

function initMap() {
    map = L.map('map', { zoomControl: false }).setView([-34.34, -56.71], 15);
    
    // Iniciar con Capa Híbrida de Google (Satelite + Etiquetas)
    currentLayer = L.gridLayer.googleMutant({
        type: 'hybrid' 
    }).addTo(map);
    
    drawnItems = new L.FeatureGroup().addTo(map);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        layer.atomType = currentAtomType;
        const colors = {
            'GAME_ZONE': '#00ff00', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#ff3333',
            'RESPAWN_BLUE': '#3333ff', 'OBJ_POINT': '#ffffff'
        };
        if(layer.setStyle) layer.setStyle({ color: colors[currentAtomType], fillColor: colors[currentAtomType], fillOpacity: 0.3 });
        drawnItems.addLayer(layer);
        resetButtons();
    });

    loadMissionList();
    syncPlayers();
    listenMissionControl();
}

function toggleMapStyle() {
    const btn = document.getElementById('btn-map-style');
    map.removeLayer(currentLayer);

    if (btn.innerText.includes("HÍBRIDA")) {
        currentLayer = L.gridLayer.googleMutant({ type: 'roadmap' }).addTo(map);
        btn.innerText = "🗺️ VISTA: CALLEJERO";
    } else {
        currentLayer = L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
        btn.innerText = "🛰️ VISTA: HÍBRIDA";
    }
}

// Las funciones de guardado y lógica de misión se mantienen intactas
function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Indica nombre de Operación");

    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        else if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        else if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });

    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).set({ id: mId, nombre: name, elementos: elementos })
      .then(() => alert("BASE DE DATOS ACTUALIZADA"));
}

function loadMissionToEdit(id) {
    currentMissionId = id;
    clearMap();
    document.getElementById('btn-delete-mission').style.display = id ? 'block' : 'none';
    if(!id) return;

    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('mission-name').value = m.nombre;
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const style = { weight: 2, fillOpacity: 0.3 };
                if(el.type === 'GAME_ZONE') style.color = '#00ff00';
                if(el.type === 'SAFE_ZONE') style.color = '#ffd700';
                if(el.type.includes('RED')) style.color = '#ff3333';
                if(el.type.includes('BLUE')) style.color = '#3333ff';

                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                else layer = L.marker(el.center);
                
                layer.atomType = el.type;
                drawnItems.addLayer(layer);
            });
            if (drawnItems.getLayers().length > 0) map.fitBounds(drawnItems.getBounds());
        }
    });
}

function deleteCurrentMission() {
    if(!currentMissionId) return;
    if(confirm("¿ELIMINAR ESTA MISIÓN PERMANENTEMENTE?")) {
        db.ref(`misiones/${currentMissionId}`).remove();
        location.reload();
    }
}

function launchMission() {
    if(!currentMissionId) return alert("Selecciona una misión primero");
    db.ref('operacion_activa/control').update({
        status: 'EN_CURSO',
        startTime: Date.now(),
        missionId: currentMissionId,
        paused: false
    });
}

function pauseMission() {
    db.ref('operacion_activa/control').update({ paused: true });
}

function resetMission() {
    if(confirm("¿RESETEAR RELOJ Y BAJAS?")) {
        db.ref('operacion_activa/control').update({ startTime: Date.now(), killsRed: 0, killsBlue: 0 });
    }
}

function endMission() {
    db.ref('operacion_activa/control').update({ status: 'RECLUTAMIENTO', paused: false });
}

function listenMissionControl() {
    db.ref('operacion_activa/control').on('value', snap => {
        const data = snap.val() || {};
        document.getElementById('kills-red').innerText = data.killsRed || 0;
        document.getElementById('kills-blue').innerText = data.killsBlue || 0;
        
        clearInterval(missionTimerInterval);
        if(data.status === 'EN_CURSO' && !data.paused) {
            missionTimerInterval = setInterval(() => {
                const diff = Date.now() - data.startTime;
                document.getElementById('timer-display').innerText = new Date(diff).toISOString().substr(11, 8);
            }, 1000);
        }
    });
}

function syncPlayers() {
    db.ref('jugadores_enlistados').on('value', snap => {
        const listDiv = document.getElementById('player-list');
        listDiv.innerHTML = '';
        snap.forEach(child => {
            const p = child.val();
            listDiv.innerHTML += `
                <div class="player-item">
                    <span style="flex-grow:1">${p.callsign}</span>
                    <button class="team-btn team-red" onclick="assignTeam('${p.callsign}', 'RED')">R</button>
                    <button class="team-btn team-blue" onclick="assignTeam('${p.callsign}', 'BLUE')">B</button>
                    <button class="team-btn" onclick="assignTeam('${p.callsign}', 'S/E')">--</button>
                    <button onclick="kickPlayer('${p.callsign}')" style="width:auto; padding:2px 5px; border-color:var(--red); color:var(--red);">✖</button>
                </div>`;
        });
    });
}

function assignTeam(callsign, team) { db.ref(`jugadores_enlistados/${callsign}`).update({ equipo: team }); }
function kickPlayer(callsign) { if(confirm(`¿ELIMINAR A ${callsign}?`)) db.ref(`jugadores_enlistados/${callsign}`).remove(); }

function autoBalanceTeams() {
    db.ref('jugadores_enlistados').once('value', snap => {
        let players = []; snap.forEach(c => players.push(c.key));
        players.sort(() => Math.random() - 0.5);
        players.forEach((id, i) => assignTeam(id, i % 2 === 0 ? 'RED' : 'BLUE'));
    });
}

function startDraw(type, atomType, btn) {
    resetButtons();
    btn.classList.add('active');
    currentAtomType = atomType;
    let drawer = (type === 'polygon') ? new L.Draw.Polygon(map) : (type === 'circle') ? new L.Draw.Circle(map) : new L.Draw.Marker(map);
    drawer.enable();
}
function resetButtons() { document.querySelectorAll('button').forEach(b => b.classList.remove('active')); }
function clearMap() { drawnItems.clearLayers(); }
function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }
function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });
    });
}

window.onload = initMap;
</script>
</body>
</html>
