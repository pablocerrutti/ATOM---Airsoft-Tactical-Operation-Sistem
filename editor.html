<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>A.T.O.M - Tactical Editor</title>

    

    <!-- Firebase Legacy SDK -->

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>



    <style>

        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }

        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }

        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }

        

        #panel { 

            width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); 

            display: flex; flex-direction: column; overflow-y: auto; z-index: 1000;

            transition: transform 0.3s ease; position: absolute; height: 100%; backdrop-filter: blur(10px);

        }

        .panel-hidden { transform: translateX(-100%); }

        

        #menu-toggle {

            position: absolute; top: 15px; left: 15px; z-index: 1100; background: var(--f);

            color: var(--p); border: 1px solid var(--p); padding: 10px; cursor: pointer;

            border-radius: 4px; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,0,0.3);

        }



        #map { flex:1; width: 100%; height: 100%; }

        .menu-header { padding: 60px 15px 15px 15px; background:#111; border-bottom:1px solid var(--p); text-align: center; }

        

        details { border-bottom: 1px solid #222; background: #080808; }

        summary { padding: 15px; cursor: pointer; outline: none; font-weight: bold; font-size: 13px; color: var(--gold); list-style: none; display: flex; justify-content: space-between; align-items: center; }

        

        .tool-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; }

        h4 { margin: 0; font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; }

        

        button { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; transition: 0.2s; font-size: 11px; text-transform: uppercase; }

        button:active { background:var(--p); color:#000; }

        button.active { background: var(--p); color: #000; box-shadow: 0 0 15px var(--p); }

        

        .btn-save { background: var(--gold); color: #000; border: none; font-size: 13px; margin-top: 10px; }

        .btn-launch { background: var(--red); color: #fff; border: none; font-size: 14px; animation: blink 2s infinite; }

        .btn-stop { background: #550000; color: #fff; border: 1px solid var(--red); margin-top: 5px; }

        .btn-reset { border-color: var(--gray); color: var(--gray); margin-top: 15px; font-size: 10px; }

        

        input, select { width:100%; padding:12px; background:#000; border:1px solid #333; color:var(--p); font-family: inherit; box-sizing: border-box; font-size: 14px; }

        

        /* Estilos Reloj y Bajas */

        .timer-container { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; background: #111; padding: 10px 0; border-radius: 8px; }

        .kill-counter { text-align: center; width: 60px; }

        .kill-count { font-size: 1.5rem; font-weight: bold; display: block; }

        .kill-label { font-size: 8px; color: var(--gray); }

        #timer-display { font-size: 1.8rem; text-align: center; color: var(--gold); font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        

        /* Estilos Lista de Jugadores */

        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px solid #222; font-size: 12px; }

        .team-red { color: var(--red); }

        .team-blue { color: var(--blue); }

        .team-none { color: var(--gray); }



        @media (min-width: 1024px) { #panel { position: relative; transform: translateX(0); width: 350px; } #menu-toggle { display: none; } .menu-header { padding: 15px; } }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    </style>

</head>

<body>



<button id="menu-toggle" onclick="togglePanel()">☰ MENÚ</button>



<div class="wrapper">

    <div id="panel" class="panel-hidden">

        <div class="menu-header">

            <h3 style="margin:0; font-size: 1.2rem;">A.T.O.M EDITOR</h3>

        </div>



        <details open>

            <summary>📂 OPERACIONES</summary>

            <div class="tool-content">

                <h4>Cargar Existente</h4>

                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">

                    <option value="">-- NUEVA MISIÓN --</option>

                </select>

                <h4>Configuración</h4>

                <input id="mission-name" placeholder="NOMBRE DE OP...">

                <select id="mission-status">

                    <option value="RECLUTANDO">ESTADO: RECLUTANDO</option>

                    <option value="EN_CURSO">ESTADO: EN CURSO</option>

                    <option value="FINALIZADA">ESTADO: FINALIZADA</option>

                </select>

                <button class="btn-save" onclick="saveMission()">💾 GUARDAR CON ETIQUETAS</button>

            </div>

        </details>



        <!-- NUEVA CAJA DE HERRAMIENTAS: OPERADORES -->

        <details>

            <summary>👥 OPERADORES ENLISTADOS</summary>

            <div class="tool-content">

                <div id="player-list" style="max-height: 200px; overflow-y: auto; background: #000; border: 1px solid #222; margin-bottom: 10px;">

                    <!-- Los callsigns aparecerán aquí -->

                    <div class="player-item team-none">Esperando enlistados...</div>

                </div>

                <button onclick="autoBalanceTeams()" style="border-color: var(--gold); color: var(--gold);">⚖️ AUTOBALANCEAR EQUIPOS</button>

            </div>

        </details>



        <details>

            <summary>🛠️ HERRAMIENTAS TÁCTICAS</summary>

            <div class="tool-content">

                <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>

                <button onclick="setMode('SAFE_ZONE', this)">🟠 ZONA SEGURA</button>

                <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>

                <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>

                <button onclick="setMode('OBJ_POINT', this)">⚪ PUNTO CAPTURABLE</button>

                <div style="display:flex; gap:5px; margin-top:5px;">

                    <button onclick="undoLast()" style="border-color:var(--gold); color:var(--gold);">↩️ UNDO</button>

                    <button onclick="clearMap()" style="border-color:#444; color:#666;">LIMPIAR</button>

                </div>

            </div>

        </details>



        <details>

            <summary>🚀 CONTROL DE CAMPO</summary>

            <div class="tool-content">

                <div class="timer-container">

                    <div class="kill-counter">

                        <span class="kill-count" id="red-kills" style="color:var(--red)">0</span>

                        <span class="kill-label">BAJAS R</span>

                    </div>

                    <div id="timer-display">00:00:00</div>

                    <div class="kill-counter">

                        <span class="kill-count" id="blue-kills" style="color:var(--blue)">0</span>

                        <span class="kill-label">BAJAS B</span>

                    </div>

                </div>

                <button id="btn-launch" class="btn-launch" onclick="launchMission()">⚡ INICIAR OPERACIÓN</button>

                <button id="btn-stop" class="btn-stop" onclick="stopMission()">🛑 FINALIZAR MISIÓN (STOP)</button>

                <button class="btn-reset" onclick="resetToLobby()">🔄 RESETEAR TODO AL LOBBY</button>

            </div>

        </details>

    </div>

    <div id="map"></div>

</div>



<script>

// --- CONFIGURACIÓN ---

const firebaseConfig = {

    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",

    authDomain: "atom---sistem.firebaseapp.com",

    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",

    projectId: "atom---sistem",

    storageBucket: "atom---sistem.firebasestorage.app",

    messagingSenderId: "151110156876",

    appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"

};



firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let map, drawingManager;

let currentMissionId = null;

let mapOverlays = [];

let mapLabels = [];

let timerInterval = null;



const MODE_DEFS = {

    'GAME_ZONE': { label: 'LÍMITE JUEGO', color: '#00ff00' },

    'SAFE_ZONE': { label: 'ZONA SEGURA', color: '#ffa500' },

    'RESPAWN_RED': { label: 'RESPAWN ROJO', color: '#ff3333' },

    'RESPAWN_BLUE': { label: 'RESPAWN AZUL', color: '#3333ff' },

    'OBJ_POINT': { label: 'OBJETIVO', color: '#ffffff' }

};



function initMap() {

    map = new google.maps.Map(document.getElementById("map"), {

        center: {lat:-34.34, lng:-56.71}, 

        zoom: 15,

        mapTypeId: "hybrid",

        disableDefaultUI: true,

        zoomControl: true

    });



    drawingManager = new google.maps.drawing.DrawingManager({

        drawingControl: false,

        polygonOptions: { editable: true, draggable: true, fillOpacity: 0.3, strokeWeight: 2 },

        circleOptions: { editable: true, draggable: true, fillOpacity: 0.4, strokeWeight: 2 }

    });

    drawingManager.setMap(map);



    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {

        const mode = document.body.dataset.mode;

        if (!mode) { e.overlay.setMap(null); return; }

        e.overlay.atomType = mode;

        const config = MODE_DEFS[mode];

        e.overlay.setOptions({ fillColor: config.color, strokeColor: config.color });

        addMarkerLabel(e.overlay, config.label);

        mapOverlays.push(e.overlay);

    });



    loadMissionList();

    syncTimer();

    syncPlayersAndStats(); // Nueva sincronización

}



function addMarkerLabel(overlay, text) {

    let position;

    if (overlay.getPaths) {

        const bounds = new google.maps.LatLngBounds();

        overlay.getPath().forEach(p => bounds.extend(p));

        position = bounds.getCenter();

    } else {

        position = overlay.getCenter();

    }

    const label = new google.maps.Marker({

        position: position,

        map: map,

        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 0 },

        label: { text: text, color: "white", fontWeight: "bold", fontSize: "12px" }

    });

    mapLabels.push(label);

}



function fitMapToContents() {

    if (mapOverlays.length === 0) return;

    const bounds = new google.maps.LatLngBounds();

    mapOverlays.forEach(overlay => {

        if (overlay.getPaths) {

            overlay.getPath().forEach(p => bounds.extend(p));

        } else {

            bounds.extend(overlay.getCenter());

            const radius = overlay.getRadius();

            const center = overlay.getCenter();

            bounds.extend(google.maps.geometry.spherical.computeOffset(center, radius, 0));

            bounds.extend(google.maps.geometry.spherical.computeOffset(center, radius, 180));

        }

    });

    map.fitBounds(bounds);

    setTimeout(() => { if (map.getZoom() > 18) map.setZoom(18); }, 200);

}



function saveMission() {

    const name = document.getElementById('mission-name').value;

    if (!name) return alert("Asigna un nombre");

    let elements = {};

    mapOverlays.forEach((obj, i) => {

        const config = MODE_DEFS[obj.atomType];

        let data = { type: obj.atomType, label: config.label, color: config.color };

        if (obj.getPaths) data.path = obj.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));

        else { data.center = {lat: obj.getCenter().lat(), lng: obj.getCenter().lng()}; data.radius = obj.getRadius(); }

        elements["el_" + i] = data;

    });

    const mId = currentMissionId || db.ref('misiones').push().key;

    db.ref(`misiones/${mId}`).set({ id: mId, nombre: name, estado: document.getElementById('mission-status').value, elementos: elements });

    alert("MISIÓN Y ETIQUETAS GUARDADAS");

}



function loadMissionToEdit(id) {

    if(!id) return location.reload();

    currentMissionId = id;

    clearMap();

    db.ref(`misiones/${id}`).once('value', snap => {

        const m = snap.val();

        document.getElementById('mission-name').value = m.nombre;

        if(m.elementos) {

            Object.values(m.elementos).forEach(el => {

                let overlay;

                const style = { fillColor: el.color, strokeColor: el.color, editable: true };

                if (el.path) overlay = new google.maps.Polygon({ path: el.path, map: map, ...style });

                else overlay = new google.maps.Circle({ center: el.center, radius: el.radius, map: map, ...style });

                overlay.atomType = el.type;

                mapOverlays.push(overlay);

                addMarkerLabel(overlay, el.label);

            });

            fitMapToContents();

        }

    });

}



// --- NUEVAS FUNCIONES DE SINCRONIZACIÓN Y BALANCEO ---



function syncPlayersAndStats() {

    // Sincronizar Bajas

    db.ref('operacion_activa/stats').on('value', snap => {

        const stats = snap.val() || { redKills: 0, blueKills: 0 };

        document.getElementById('red-kills').innerText = stats.redKills;

        document.getElementById('blue-kills').innerText = stats.blueKills;

    });



    // Sincronizar Lista de Jugadores

    db.ref('jugadores_enlistados').on('value', snap => {

        const listDiv = document.getElementById('player-list');

        listDiv.innerHTML = '';

        if(!snap.exists()) {

            listDiv.innerHTML = '<div class="player-item team-none">Sin jugadores</div>';

            return;

        }

        snap.forEach(child => {

            const p = child.val();

            const teamClass = p.equipo === 'RED' ? 'team-red' : (p.equipo === 'BLUE' ? 'team-blue' : 'team-none');

            listDiv.innerHTML += `

                <div class="player-item ${teamClass}">

                    <span>${p.callsign}</span>

                    <span>${p.equipo || 'S/E'}</span>

                </div>`;

        });

    });

}



function autoBalanceTeams() {

    db.ref('jugadores_enlistados').once('value', snap => {

        if(!snap.exists()) return alert("No hay jugadores para balancear");

        let players = [];

        snap.forEach(c => { players.push({ id: c.key, ...c.val() }); });

        

        // Mezcla aleatoria

        players.sort(() => Math.random() - 0.5);

        

        let updates = {};

        players.forEach((p, index) => {

            const team = (index % 2 === 0) ? 'RED' : 'BLUE';

            updates[`jugadores_enlistados/${p.id}/equipo`] = team;

        });

        

        db.ref().update(updates).then(() => alert("EQUIPOS BALANCEADOS"));

    });

}



// --- FIN NUEVAS FUNCIONES ---



function launchMission() {

    if (!currentMissionId) return alert("Carga una misión primero.");

    db.ref('operacion_activa/control').set({ startTime: Date.now(), status: 'EN_CURSO', endTime: null });

}



function stopMission() {

    if(!confirm("¿Finalizar operación?")) return;

    db.ref('operacion_activa/control').update({ status: 'FINALIZADA', endTime: Date.now() });

}



function syncTimer() {

    db.ref('operacion_activa/control').on('value', snap => {

        const data = snap.val();

        if (timerInterval) clearInterval(timerInterval);

        if (data && data.status === 'EN_CURSO') {

            document.getElementById('btn-launch').style.display = 'none';

            document.getElementById('btn-stop').style.display = 'block';

            timerInterval = setInterval(() => { updateTimerDisplay(Date.now() - data.startTime); }, 1000);

        } else if (data && data.status === 'FINALIZADA') {

            document.getElementById('btn-launch').style.display = 'block';

            document.getElementById('btn-launch').innerText = "RE-INICIAR";

            document.getElementById('btn-stop').style.display = 'none';

            updateTimerDisplay(data.endTime - data.startTime);

        } else {

            document.getElementById('timer-display').innerText = "00:00:00";

            document.getElementById('btn-launch').style.display = 'block';

            document.getElementById('btn-stop').style.display = 'none';

        }

    });

}



function updateTimerDisplay(ms) {

    const h = Math.floor(ms / 3600000).toString().padStart(2, '0');

    const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');

    const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');

    document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;

}



function resetToLobby() {

    if(!confirm("¿Resetear?")) return;

    db.ref('operacion_activa/control').set({ status: 'RECLUTANDO', startTime: 0, endTime: null });

    db.ref('operacion_activa/stats').set({ redKills: 0, blueKills: 0 }); // Reset stats también

}



function clearMap() {

    mapOverlays.forEach(o => o.setMap(null));

    mapLabels.forEach(l => l.setMap(null));

    mapOverlays = [];

    mapLabels = [];

}



function setMode(mode, btn) {

    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    document.body.dataset.mode = mode;

    drawingManager.setDrawingMode(mode.includes("RESPAWN") || mode === 'OBJ_POINT' ? google.maps.drawing.OverlayType.CIRCLE : google.maps.drawing.OverlayType.POLYGON);

}



function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }



function loadMissionList() {

    db.ref('misiones').on('value', snap => {

        const sel = document.getElementById('mission-selector');

        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';

        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });

    });

}



function undoLast() { if(mapOverlays.length) { mapOverlays.pop().setMap(null); mapLabels.pop().setMap(null); } }



</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry&callback=initMap" async defer></script>

</body>

</html>
