<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor Pro</title>
    
    <!-- Bloqueo de renderizado hasta validar -->
    <style>html { display: none; }</style>

    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <!-- Script de Seguridad para el Editor -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
            projectId: "atom---sistem",
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(user => {
            const ADMIN_EMAIL = "tu-email-registrado@gmail.com"; 
            if (user && user.email === ADMIN_EMAIL) {
                document.documentElement.style.display = 'block';
                // Aquí podrías llamar a initMap() si fuera necesario, 
                // pero lo maneja el window.onload
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>

    <!-- Leaflet Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- Google Maps API & GoogleMutant -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        /* MANTENEMOS TUS ESTILOS ORIGINALES SIN TOCAR */
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        #panel { width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); display: flex; flex-direction: column; overflow-y: auto; z-index: 1000; position: absolute; height: 100%; transition: 0.3s; }
        .panel-hidden { transform: translateX(-100%); }
        #map { flex:1; width: 100%; height: 100%; background: #000; }
        /* ... el resto de tus estilos de panel, botones y detalles ... */
        textarea, input { width:100%; padding:8px; background:#000; border:1px solid #333; color:var(--p); font-family: inherit; margin-bottom: 5px; }
        button { width:100%; padding:10px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-save { background: var(--gold); color: #000; border: none; }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()" style="position:absolute; top:10px; left:10px; z-index:1100;">☰</button>

<div class="wrapper">
    <div id="panel">
        <div style="padding: 20px; border-bottom: 1px solid var(--p);">
            <h3 style="margin:0;">TACTICAL EDITOR</h3>
        </div>

        <details open>
            <summary style="padding:10px; cursor:pointer; color:var(--gold)">📂 GESTIÓN MISIONES</summary>
            <div style="padding:10px;">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)" style="width:100%; background:#000; color:var(--p); padding:10px;">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <label>NOMBRE:</label>
                <input id="mission-name" type="text">
                <label>BRIEFING:</label>
                <textarea id="mission-history"></textarea>
                <label>OBJETIVOS:</label>
                <textarea id="mission-objectives"></textarea>
                <label>URL PORTADA:</label>
                <input id="mission-image-url" type="text">
                <button class="btn-save" onclick="saveMission()">💾 GUARDAR CAMBIOS</button>
            </div>
        </details>
        <!-- Resto de tus details de Herramientas y Operadores... -->
    </div>
    <div id="map"></div>
</div>

<script>
    // AQUÍ MANTENEMOS TODA TU LÓGICA DE MAPA, DRAW Y FIREBASE SIN CAMBIOS
    // Asegúrate de copiar el resto de tus funciones: initMap, saveMission, loadMissionList, etc.
    // Solo he modificado la parte superior para la validación de seguridad.
</script>
</body>
</html>
