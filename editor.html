<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones Profesional</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        #panel { width:350px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; overflow-y: auto; z-index: 10; }
        #map { flex:1; }
        .menu-header { padding:15px; background:#111; border-bottom:1px solid var(--p); text-align: center; }
        details { border-bottom: 1px solid #222; }
        summary { padding: 12px; cursor: pointer; outline: none; background: #111; font-weight: bold; font-size: 12px; color: var(--gold); }
        summary:hover { background: #1a1a1a; }
        .tool-content { padding: 15px; background: #080808; }
        h4 { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; color: #888; }
        button { width:100%; padding:10px; background:#111; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; margin-bottom: 8px; transition: 0.2s; font-size: 11px; }
        button:hover { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; box-shadow: 0 0 10px var(--p); }
        .btn-delete { background: #300; color: var(--red); border-color: var(--red); }
        .btn-save { background: var(--gold); color: #000; border: none; font-size: 14px; margin-top: 10px; }
        .btn-launch { background: var(--red); color: #fff; border: none; font-size: 16px; animation: blink 2s infinite; }
        input, select { width:100%; padding:12px; background:#000; border:1px solid #444; color:var(--p); font-family: inherit; margin-bottom: 10px; box-sizing: border-box; }
        #timer-display { font-size: 2.2rem; text-align: center; color: var(--gold); font-weight: bold; margin: 10px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .edit-tag { background: var(--gold); color: #000; padding: 5px; font-size: 10px; text-align: center; font-weight: bold; display:none; margin-top: 5px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="panel">
    <div class="menu-header">
        <h3 style="margin:0;">A.T.O.M EDITOR</h3>
        <div id="edit-tag" class="edit-tag">MODO EDICIÓN: <span id="active-id">NUEVO</span></div>
    </div>

    <details open>
        <summary>📂 GESTIÓN DE OPERACIONES</summary>
        <div class="tool-content">
            <h4>Cargar Misión</h4>
            <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                <option value="">-- NUEVA OPERACIÓN --</option>
            </select>
            <input id="mission-name" placeholder="NOMBRE CLAVE...">
            <select id="mission-status">
                <option value="RECLUTANDO">RECLUTANDO</option>
                <option value="EN_CURSO">EN CURSO</option>
                <option value="FINALIZADA">FINALIZADA</option>
            </select>
            <button class="btn-save" onclick="saveMission()">💾 GUARDAR EN NUBE</button>
            <button id="delete-mission-btn" class="btn-delete" style="display:none;" onclick="deleteMission()">❌ ELIMINAR REGISTRO</button>
        </div>
    </details>

    <details open>
        <summary>🛠️ HERRAMIENTAS DE MAPA</summary>
        <div class="tool-content">
            <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>
            <button onclick="setMode('SAFE_ZONE', this)">🟠 ZONA SEGURA</button>
            <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>
            <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>
            <button onclick="setMode('OBJ_POINT', this)">⚪ OBJETIVO CAPTURABLE</button>
            
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick="undoLast()" style="border-color:var(--gold); color:var(--gold);">↩️ DESHACER</button>
                <button onclick="clearMap()" style="border-color:#555; color:#777;">LIMPIAR</button>
            </div>
        </div>
    </details>

    <details open>
        <summary>🚀 CONTROL DE MISIÓN</summary>
        <div class="tool-content">
            <div id="timer-display">00:00:00</div>
            <button id="btn-launch" class="btn-launch" onclick="launchMission()">⚡ LANZAR OPERACIÓN</button>
            
            <h4 style="margin-top:15px;">Lobby de Operadores</h4>
            <div id="player-lobby" style="background:#111; padding:5px; border:1px solid #333; max-height:100px; overflow-y:auto; font-size:10px;">
                Esperando reclutas...
            </div>
            <button onclick="autoBalance()" style="font-size:9px; margin-top:5px; border-color:var(--gold); color:var(--gold);">⚖️ AUTO-BALANCEAR</button>
        </div>
    </details>
</div>

<div id="map"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    authDomain: "atom---sistem.firebaseapp.com",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
    storageBucket: "atom---sistem.firebasestorage.app",
    messagingSenderId: "151110156876",
    appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let map, drawingManager;
let currentMissionId = null;
let mapOverlays = [];
let clockInterval = null;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, 
        zoom: 15,
        mapTypeId: "hybrid",
        tilt: 45,
        disableDefaultUI: false
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: true, draggable: true, fillOpacity: 0.3, strokeWeight: 2 },
        circleOptions: { editable: true, draggable: true, fillOpacity: 0.4, strokeWeight: 2 }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        if (!mode) { e.overlay.setMap(null); return alert("Selecciona una herramienta primero"); }
        e.overlay.atomType = mode;
        const style = getStyleByMode(mode);
        e.overlay.setOptions(style);
        if(mode === 'OBJ_POINT') e.overlay.dominio = 'NEUTRO';
        mapOverlays.push(e.overlay);
    });

    loadMissionList();
    loadEnlistedPlayers();
}

function getStyleByMode(mode) {
    const styles = {
        'GAME_ZONE': { fillColor: '#00ff00', strokeColor: '#00ff00' },
        'SAFE_ZONE': { fillColor: '#ffa500', strokeColor: '#ffa500' },
        'RESPAWN_RED': { fillColor: '#ff0000', strokeColor: '#ff0000' },
        'RESPAWN_BLUE': { fillColor: '#0000ff', strokeColor: '#0000ff' },
        'OBJ_POINT': { fillColor: '#808080', strokeColor: '#ffffff', fillOpacity: 0.6 }
    };
    return styles[mode] || {};
}

function setMode(mode, btn) {
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;
    if (mode.includes("RESPAWN") || mode === 'OBJ_POINT') {
        drawingManager.setDrawingMode(google.maps.drawing.OverlayType.CIRCLE);
    } else if (mode.includes("ZONE")) {
        drawingManager.setDrawingMode(google.maps.drawing.OverlayType.POLYGON);
    }
}

function undoLast() {
    if (mapOverlays.length > 0) {
        const last = mapOverlays.pop();
        last.setMap(null);
    }
}

function clearMap() {
    mapOverlays.forEach(o => o.setMap(null));
    mapOverlays = [];
}

// PERSISTENCIA MEJORADA PARA LOBBY
function saveMission() {
    const name = document.getElementById('mission-name').value;
    const status = document.getElementById('mission-status').value;
    if (!name || mapOverlays.length === 0) return alert("Nombre o dibujo táctico ausente.");

    let elements = {};
    let objetivosCount = 0;
    
    mapOverlays.forEach((obj, i) => {
        const id = "el_" + i;
        let data = { type: obj.atomType, dominio: obj.dominio || 'N/A' };
        
        if (obj.atomType.includes("ZONE")) {
            data.path = obj.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
        } else {
            data.center = {lat: obj.getCenter().lat(), lng: obj.getCenter().lng()};
            data.radius = obj.getRadius();
            if(obj.atomType === 'OBJ_POINT') objetivosCount++;
        }
        elements[id] = data;
    });

    const mId = currentMissionId || db.ref('misiones').push().key;
    const centerPos = map.getCenter();
    
    db.ref(`misiones/${mId}`).set({
        id: mId,
        nombre: name,
        estado: status,
        elementos: elements,
        cant_objetivos: objetivosCount, // Para ver en el lobby
        config_mapa: {
            centro: { lat: centerPos.lat(), lng: centerPos.lng() },
            zoom: map.getZoom(),
            gps_url: `https://www.google.com/maps?q=${centerPos.lat()},${centerPos.lng()}` // Link directo
        },
        timestamp: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        alert("Operación Sincronizada.");
        location.reload();
    });
}

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        sel.innerHTML = '<option value="">-- NUEVA OPERACIÓN --</option>';
        snap.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

function loadMissionToEdit(id) {
    if(!id) { location.reload(); return; }
    clearMap();
    currentMissionId = id;
    document.getElementById('edit-tag').style.display = "block";
    document.getElementById('active-id').innerText = id;
    document.getElementById('delete-mission-btn').style.display = "block";
    
    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('mission-name').value = m.nombre;
        document.getElementById('mission-status').value = m.estado;
        
        if(m.elementos) {
            const bounds = new google.maps.LatLngBounds();
            Object.values(m.elementos).forEach(el => {
                let overlay;
                if(el.type.includes("ZONE")) {
                    overlay = new google.maps.Polygon({
                        path: el.path, map: map, editable: true, draggable: true, atomType: el.type,
                        ...getStyleByMode(el.type)
                    });
                    el.path.forEach(p => bounds.extend(p));
                } else {
                    overlay = new google.maps.Circle({
                        center: el.center, radius: el.radius, map: map, editable: true, draggable: true, atomType: el.type,
                        dominio: el.dominio, ...getStyleByMode(el.type)
                    });
                    bounds.extend(el.center);
                    if(el.dominio === 'ROJO') overlay.setOptions({fillColor:'#ff0000', strokeColor:'#ff0000'});
                    if(el.dominio === 'AZUL') overlay.setOptions({fillColor:'#0000ff', strokeColor:'#0000ff'});
                }
                mapOverlays.push(overlay);
            });
            map.fitBounds(bounds);
        }
        if(m.startTime) startClock(m.startTime);
    });
}

function launchMission() {
    if(!currentMissionId) return alert("Carga o guarda una misión primero.");
    const t0 = Date.now();
    db.ref(`misiones/${currentMissionId}`).update({ estado: "EN_CURSO", startTime: t0 });
    db.ref('operacion_activa/control').set({ misionActiva: currentMissionId, t0: t0, comando: "START" });
    startClock(t0);
}

function startClock(t0) {
    if(clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(() => {
        const diff = Date.now() - t0;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function deleteMission() {
    if(confirm("¿CONFIRMA ELIMINACIÓN TOTAL?")) {
        db.ref(`misiones/${currentMissionId}`).remove().then(() => location.reload());
    }
}

function loadEnlistedPlayers() {
    db.ref('operacion_activa/despliegue').on('value', snap => {
        const lobby = document.getElementById('player-lobby');
        lobby.innerHTML = "";
        snap.forEach(child => {
            const p = child.val();
            const color = p.equipo === 'ROJO' ? 'var(--red)' : (p.equipo === 'AZUL' ? 'var(--blue)' : '#fff');
            lobby.innerHTML += `<div style="margin-bottom:2px; color:${color}">• ${p.callsign} [${p.equipo}]</div>`;
        });
    });
}

function autoBalance() {
    db.ref('operacion_activa/despliegue').once('value', snap => {
        let players = [];
        snap.forEach(c => players.push(c.key));
        players.sort(() => Math.random() - 0.5);
        players.forEach((uid, i) => {
            db.ref(`operacion_activa/despliegue/${uid}`).update({ equipo: (i % 2 === 0) ? 'ROJO' : 'AZUL' });
        });
    });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry&callback=initMap" async defer></script>
</body>
</html>
