<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor</title>
    
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#808080; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        #panel { 
            width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 1000;
            transition: transform 0.3s ease; position: absolute; height: 100%; backdrop-filter: blur(10px);
        }
        .panel-hidden { transform: translateX(-100%); }
        
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100; background: var(--f);
            color: var(--p); border: 1px solid var(--p); padding: 10px; cursor: pointer;
            border-radius: 4px; font-weight: bold;
        }

        #map { flex:1; width: 100%; height: 100%; }
        .menu-header { padding: 60px 15px 15px 15px; background:#111; border-bottom:1px solid var(--p); text-align: center; }
        
        details { border-bottom: 1px solid #222; background: #080808; }
        summary { padding: 15px; cursor: pointer; outline: none; font-weight: bold; font-size: 13px; color: var(--gold); list-style: none; display: flex; justify-content: space-between; align-items: center; }
        
        .tool-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        h4 { margin: 0; font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; }
        
        button { width:100%; padding:12px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; transition: 0.2s; font-size: 11px; text-transform: uppercase; }
        button:active { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; box-shadow: 0 0 15px var(--p); }
        
        .btn-save { background: var(--gold); color: #000; border: none; font-size: 13px; margin-top: 10px; }
        .btn-launch { background: var(--red); color: #fff; border: none; font-size: 14px; animation: blink 2s infinite; }
        .btn-stop { background: #550000; color: #fff; border: 1px solid var(--red); margin-top: 5px; }
        .btn-reset { border-color: var(--gray); color: var(--gray); margin-top: 15px; font-size: 10px; }
        
        /* Botón Salir Estilizado dentro del Menú */
        .btn-exit-menu {
            margin-top: 20px; border-color: var(--red); color: var(--red); background: rgba(255,0,0,0.05);
        }
        .btn-exit-menu:hover { background: var(--red); color: #fff; }
        
        input, select { width:100%; padding:12px; background:#000; border:1px solid #333; color:var(--p); font-family: inherit; box-sizing: border-box; font-size: 14px; }
        
        .player-item { display: flex; flex-direction: column; padding: 10px; border-bottom: 1px solid #222; gap: 8px; }
        .player-info { display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 4px; }
        .btn-mini { padding: 5px; font-size: 9px; width: 45px; border: 1px solid #444; color: #888; background: #111; }
        .active-red { border-color: var(--red); color: var(--red); }
        .active-blue { border-color: var(--blue); color: var(--blue); }
        .active-none { border-color: var(--p); color: var(--p); }

        .timer-container { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; background: #111; padding: 10px 0; border-radius: 8px; }
        #timer-display { font-size: 1.8rem; text-align: center; color: var(--gold); font-weight: bold; }

        @media (min-width: 1024px) { #panel { position: relative; transform: translateX(0); width: 350px; } #menu-toggle { display: none; } .menu-header { padding: 15px; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰ MENÚ</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div class="menu-header">
            <h3 style="margin:0; font-size: 1.2rem;">A.T.O.M EDITOR</h3>
        </div>

        <details open>
            <summary>📂 OPERACIONES</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="NOMBRE DE OP...">
                <select id="mission-status">
                    <option value="RECLUTANDO">ESTADO: RECLUTANDO</option>
                    <option value="EN_CURSO">ESTADO: EN CURSO</option>
                </select>
                <button class="btn-save" onclick="saveMission()">💾 GUARDAR</button>
            </div>
        </details>

        <details>
            <summary>👥 OPERADORES</summary>
            <div class="tool-content">
                <div id="player-list" style="max-height: 200px; overflow-y: auto; background: #000;">
                    <div class="player-item">Cargando...</div>
                </div>
                <button onclick="autoBalanceTeams()" style="border-color: var(--gold); color: var(--gold); font-size: 9px;">⚖️ BALANCEO AUTOMÁTICO</button>
            </div>
        </details>

        <details>
            <summary>🛠️ MAPA</summary>
            <div class="tool-content">
                <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE JUEGO</button>
                <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN RED</button>
                <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN BLUE</button>
                <button onclick="setMode('OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="undoLast()" style="border-color:var(--gold); color:var(--gold);">↩️ DESHACER</button>
            </div>
        </details>

        <details>
            <summary>🚀 CONTROL</summary>
            <div class="tool-content">
                <div id="timer-display">00:00:00</div>
                <button id="btn-launch" class="btn-launch" onclick="launchMission()">⚡ INICIAR</button>
                <button class="btn-reset" onclick="resetToLobby()">🔄 RESET LOBBY</button>
                
                <!-- BOTÓN SALIR INTEGRADO EN EL MENÚ -->
                <button class="btn-exit-menu" onclick="window.location.href='index.html'">
                    ✖ SALIR AL MENÚ PRINCIPAL
                </button>
            </div>
        </details>
    </div>
    <div id="map"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    authDomain: "atom---sistem.firebaseapp.com",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
    storageBucket: "atom---sistem.firebasestorage.app",
    messagingSenderId: "151110156876",
    appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let map, drawingManager, currentMissionId = null, mapOverlays = [];

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, zoom: 15, mapTypeId: "hybrid", disableDefaultUI: true, zoomControl: true
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: true, draggable: true, fillOpacity: 0.3, strokeWeight: 2 },
        circleOptions: { editable: true, draggable: true, fillOpacity: 0.4, strokeWeight: 2 }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        if (!mode) return e.overlay.setMap(null);
        e.overlay.atomType = mode;
        const color = mode.includes('RED') ? '#ff3333' : (mode.includes('BLUE') ? '#3333ff' : '#00ff00');
        e.overlay.setOptions({ fillColor: color, strokeColor: color });
        mapOverlays.push(e.overlay);
    });

    loadMissionList();
    syncPlayers();
}

function syncPlayers() {
    db.ref('jugadores_enlistados').on('value', snap => {
        const listDiv = document.getElementById('player-list');
        listDiv.innerHTML = '';
        snap.forEach(child => {
            const p = child.val();
            const id = child.key;
            const item = document.createElement('div');
            item.className = 'player-item';
            item.innerHTML = `
                <div class="player-info"><b>${p.callsign}</b> <span>${p.equipo || 'S/E'}</span></div>
                <div class="btn-group">
                    <button class="btn-mini ${p.equipo==='RED'?'active-red':''}" onclick="setTeam('${id}','RED')">RED</button>
                    <button class="btn-mini ${p.equipo==='BLUE'?'active-blue':''}" onclick="setTeam('${id}','BLUE')">BLUE</button>
                    <button class="btn-mini ${!p.equipo || p.equipo==='S/E'?'active-none':''}" onclick="setTeam('${id}','S/E')">S/E</button>
                </div>
            `;
            listDiv.appendChild(item);
        });
    });
}

function setTeam(id, team) { db.ref(`jugadores_enlistados/${id}`).update({ equipo: team }); }

function autoBalanceTeams() {
    db.ref('jugadores_enlistados').once('value', snap => {
        let players = []; snap.forEach(c => players.push(c.key));
        players.sort(() => Math.random() - 0.5);
        players.forEach((id, i) => setTeam(id, i % 2 === 0 ? 'RED' : 'BLUE'));
    });
}

function setMode(mode, btn) {
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;
    drawingManager.setDrawingMode(mode.includes('ZONE') ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.CIRCLE);
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre requerido");
    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).set({ id: mId, nombre: name, estado: document.getElementById('mission-status').value });
    alert("Guardado");
}

function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }
function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        sel.innerHTML = '<option value="">-- NUEVA --</option>';
        snap.forEach(c => sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`);
    });
}
function undoLast() { if(mapOverlays.length) mapOverlays.pop().setMap(null); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry&callback=initMap" async defer></script>
</body>
</html>
