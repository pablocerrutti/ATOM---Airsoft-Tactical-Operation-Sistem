<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Editor Pro</title>
    
    <style>html { display: none; }</style>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
            projectId: "atom---sistem",
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(user => {
            if (user) { document.documentElement.style.display = 'block'; } 
            else { window.location.href = 'login.html'; }
        });
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#222; }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        #panel { width: 320px; background: rgba(0,0,0,0.95); border-right: 1px solid var(--p); display: flex; flex-direction: column; overflow-y: auto; z-index: 1000; position: absolute; height: 100%; transition: 0.3s; }
        .panel-hidden { transform: translateX(-100%); }
        #map { flex:1; width: 100%; height: 100%; background: #111; }
        .tool-content { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        summary { padding:10px; cursor:pointer; color:var(--gold); border-bottom: 1px solid #111; font-weight: bold; background: #0a0a0a; }
        button { width:100%; padding:10px; background:#000; color:var(--p); border:1px solid var(--p); cursor:pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        button.active { background: var(--p); color: #000; }
        input, textarea, select { background: #000; border: 1px solid #333; color: var(--p); padding: 8px; font-family: inherit; font-size: 12px; }
        .op-card { background: #111; border: 1px solid #333; padding: 8px; margin-bottom: 5px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .stats-box { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border: 1px solid #333; margin-bottom: 5px; }
        .stat-btn { width: 35px !important; padding: 5px !important; font-size: 16px; }
        #menu-toggle { position:absolute; top:10px; left:10px; z-index:1100; padding:10px; background:#000; color:var(--p); border:1px solid var(--p); cursor: pointer; }
        @media (min-width: 1024px) { #panel { position: relative; transform: translateX(0); width: 350px; } #menu-toggle { display: none; } }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="togglePanel()">☰</button>

<div class="wrapper">
    <div id="panel" class="panel-hidden">
        <div style="padding:15px; background:#111; border-bottom:1px solid var(--p); text-align:center;">
            <h3 style="margin:0; letter-spacing: 2px;">COMMAND CENTER</h3>
        </div>

        <details open>
            <summary>📂 CONFIGURACIÓN MISIÓN</summary>
            <div class="tool-content">
                <select id="mission-selector" onchange="loadMissionToEdit(this.value)">
                    <option value="">-- NUEVA MISIÓN --</option>
                </select>
                <input id="mission-name" placeholder="Nombre Operación...">
                <textarea id="mission-history" placeholder="Briefing..." rows="2"></textarea>
                <textarea id="mission-objectives" placeholder="Objetivos..." rows="2"></textarea>
                <input id="mission-image-url" placeholder="URL Imagen...">
                <button onclick="saveMission()" style="background:var(--gold); color:#000; border:none; margin-top:5px;">💾 GUARDAR MISIÓN</button>
            </div>
        </details>

        <details>
            <summary>👥 OPERADORES</summary>
            <div class="tool-content" id="enlisted-list"></div>
        </details>

        <details open>
            <summary>⏱️ CONTROL DE PARTIDA</summary>
            <div class="tool-content">
                <div class="stats-box">
                    <span>BAJAS RED: <b id="val-red">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button class="stat-btn" onclick="adjustStat('bajasRed', -1)">-</button>
                        <button class="stat-btn" onclick="adjustStat('bajasRed', 1)">+</button>
                    </div>
                </div>
                <div class="stats-box">
                    <span>BAJAS BLUE: <b id="val-blue">0</b></span>
                    <div style="display:flex; gap:5px;">
                        <button class="stat-btn" onclick="adjustStat('bajasBlue', -1)">-</button>
                        <button class="stat-btn" onclick="adjustStat('bajasBlue', 1)">+</button>
                    </div>
                </div>
                <label style="font-size:10px;">DURACIÓN (MIN):</label>
                <input id="mission-duration" type="number" value="60">
                <button id="btn-state-toggle" style="background:var(--red); color:#fff; border:none; padding:15px; margin-top:10px;" onclick="toggleMissionState()">🚀 LANZAR OPERACIÓN</button>
            </div>
        </details>

        <details open>
            <summary>🛠️ HERRAMIENTAS DE MAPEO</summary>
            <div class="tool-content">
                <button onclick="startDraw('polygon', 'GAME_ZONE', this)">🟢 ZONA DE JUEGO</button>
                <button onclick="startDraw('polygon', 'SAFE_ZONE', this)" style="border-color:var(--gold); color:var(--gold);">🟡 ZONA SEGURA</button>
                <button onclick="startDraw('circle', 'RESPAWN_RED', this)">🔴 SPAWN ROJO</button>
                <button onclick="startDraw('circle', 'RESPAWN_BLUE', this)">🔵 SPAWN AZUL</button>
                <button onclick="startDraw('marker', 'OBJ_POINT', this)">⚪ OBJETIVO</button>
                <button onclick="clearMap()" style="color:var(--red); border-color:var(--red); margin-top:10px;">🗑️ LIMPIAR MAPA</button>
            </div>
        </details>

        <button onclick="window.location.href='idea.html'" style="margin-top:auto; background:#111; border:none; color:#555;">⬅ SALIR</button>
    </div>
    <div id="map"></div>
</div>

<script>
const db = firebase.database();
let map, drawnItems, currentMissionId = null, currentAtomType = '', isMisionActiva = false;

// Diccionario de colores centralizado
const ATOM_COLORS = { 
    'GAME_ZONE': '#0f0', 
    'SAFE_ZONE': '#ffd700', // Amarillo Gold
    'RESPAWN_RED': '#f33', 
    'RESPAWN_BLUE': '#33f', 
    'OBJ_POINT': '#fff' 
};

function initMap() {
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
    map = L.map('map', { zoomControl: false, layers: [satellite] }).setView([-34.34, -56.71], 15);
    drawnItems = new L.FeatureGroup().addTo(map);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        layer.atomType = currentAtomType;
        const color = ATOM_COLORS[currentAtomType] || '#0f0';
        if(layer.setStyle) layer.setStyle({ color: color, fillColor: color, fillOpacity: 0.3 });
        drawnItems.addLayer(layer);
    });
    loadMissionList();
}

function saveMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre requerido");
    let elementos = [];
    drawnItems.eachLayer(layer => {
        let item = { type: layer.atomType };
        if (layer instanceof L.Polygon) item.path = layer.getLatLngs()[0];
        else if (layer instanceof L.Circle) { item.center = layer.getLatLng(); item.radius = layer.getRadius(); }
        else if (layer instanceof L.Marker) item.center = layer.getLatLng();
        elementos.push(item);
    });
    const mId = currentMissionId || db.ref('misiones').push().key;
    db.ref(`misiones/${mId}`).update({ id: mId, nombre: name, historia: document.getElementById('mission-history').value, objetivos: document.getElementById('mission-objectives').value, imagen: document.getElementById('mission-image-url').value, elementos: elementos });
    alert("MISIÓN GUARDADA");
}

function loadMissionToEdit(id) {
    if(!id) { location.reload(); return; }
    currentMissionId = id;
    syncOperatives(id);
    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;
        document.getElementById('mission-name').value = m.nombre;
        document.getElementById('val-red').innerText = m.bajasRed || 0;
        document.getElementById('val-blue').innerText = m.bajasBlue || 0;
        isMisionActiva = m.estado === 'activa';
        const btn = document.getElementById('btn-state-toggle');
        btn.innerText = isMisionActiva ? "🛑 FINALIZAR" : "🚀 LANZAR";
        btn.style.background = isMisionActiva ? "var(--blue)" : "var(--red)";
        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const col = ATOM_COLORS[el.type] || '#0f0';
                if(el.path) layer = L.polygon(el.path, {color: col, fillOpacity: 0.3});
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: col});
                else layer = L.marker(el.center);
                layer.atomType = el.type;
                drawnItems.addLayer(layer);
            });
            if (drawnItems.getLayers().length > 0) map.fitBounds(drawnItems.getBounds(), { padding: [30, 30] });
        }
    });
}

function syncOperatives(mId) {
    db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(mId).on('value', snap => {
        const container = document.getElementById('enlisted-list');
        container.innerHTML = '';
        snap.forEach(child => {
            const op = child.val();
            container.innerHTML += `<div class="op-card"><span>${op.callsign}</span><div><button onclick="assignTeam('${child.key}','RED')">R</button><button onclick="assignTeam('${child.key}','BLUE')">A</button><button onclick="removeOp('${child.key}')">X</button></div></div>`;
        });
    });
}

function assignTeam(k, t) { db.ref(`jugadores_enlistados/${k}`).update({ equipo: t }); }
function removeOp(k) { if(confirm("¿Eliminar?")) db.ref(`jugadores_enlistados/${k}`).remove(); }

function toggleMissionState() {
    if (!currentMissionId) return;
    if (!isMisionActiva) {
        const end = Date.now() + (parseInt(document.getElementById('mission-duration').value) * 60000);
        db.ref(`misiones/${currentMissionId}`).update({ estado: 'activa', endTime: end, bajasRed: 0, bajasBlue: 0 });
        db.ref('estado_partida').set({ activo: true, misionId: currentMissionId });
    } else {
        db.ref(`misiones/${currentMissionId}`).update({ estado: 'finalizada' });
        db.ref('estado_partida').set({ activo: false });
    }
}

function adjustStat(f, a) { if (currentMissionId) db.ref(`misiones/${currentMissionId}/${f}`).transaction(c => (c || 0) + a); }

function loadMissionList() {
    db.ref('misiones').on('value', snap => {
        const sel = document.getElementById('mission-selector');
        const cur = sel.value;
        sel.innerHTML = '<option value="">-- NUEVA MISIÓN --</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });
        sel.value = cur;
    });
}

function startDraw(t, at, b) {
    document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
    b.classList.add('active');
    currentAtomType = at;
    let drawer = (t === 'polygon') ? new L.Draw.Polygon(map) : (t === 'circle') ? new L.Draw.Circle(map) : new L.Draw.Marker(map);
    drawer.enable();
}

function clearMap() { if(confirm("¿Borrar dibujo?")) drawnItems.clearLayers(); }
function togglePanel() { document.getElementById('panel').classList.toggle('panel-hidden'); }
window.onload = initMap;
</script>
</body>
</html>
