<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Airsoft Tactical Operation Maps</title>
    
    <link rel="icon" type="image/png" href="logo_atom.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --p: #00ff00; --f: #050505; --red: #ff3333; --gold: #ffd700; --gray: #222; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .static-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Static_grain.gif');
            opacity: 0.05; pointer-events: none; z-index: 2000;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--f); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        
        .logo-container { 
            width: 150px; height: 150px; border: 2px solid var(--p); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            animation: pulse 2s infinite; background: rgba(0, 255, 0, 0.05);
        }
        .logo-img { width: 85%; height: auto; filter: drop-shadow(0 0 5px var(--p)); }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(0, 255, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); } }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; flex: 1; display: none; }
        #status-bar { font-size: 10px; padding: 10px; border-bottom: 1px solid var(--gray); display: flex; justify-content: space-between; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .auth-card { background: #111; padding: 20px; border: 1px solid var(--gray); margin-top: 20px; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 10px; 
            background: #000; border: 1px solid var(--p); color: var(--p);
            font-family: inherit; font-size: 16px; outline: none;
        }
        .btn-primary { width: 100%; padding: 15px; background: var(--p); color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-outline { width: 100%; padding: 10px; background: transparent; color: var(--p); border: 1px solid var(--p); margin-top: 10px; cursor: pointer; }

        #admin-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; }
        .admin-box { width: 90%; max-width: 400px; border: 2px solid var(--red); padding: 30px; background: #000; text-align: center; }
        .admin-input { border-color: var(--red) !important; color: var(--red) !important; }
        .btn-admin { background: var(--red); color: #fff; width: 100%; padding: 15px; border: none; font-weight: bold; cursor: pointer; }

        footer { padding: 20px; text-align: center; border-top: 1px solid var(--gray); }
        .btn-restricted { color: #444; text-decoration: none; font-size: 10px; border: 1px solid #222; padding: 5px 10px; background: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="static-overlay"></div>

<div id="admin-overlay">
    <div class="admin-box">
        <h2 class="blink" style="color: var(--red);">SISTEMA RESTRINGIDO</h2>
        <p style="color: var(--red); font-size: 11px; margin-bottom: 20px;">VALIDACIÓN NIVEL COMANDO</p>
        <input type="email" id="admin-email" class="admin-input" placeholder="EMAIL DE COMANDO">
        <input type="password" id="admin-pass" class="admin-input" placeholder="CONTRASEÑA">
        <button class="btn-admin" onclick="validateAdmin()">AUTENTICAR ACCESO</button>
        <p onclick="closeAdmin()" style="margin-top: 15px; font-size: 10px; color: #555; cursor: pointer;">CANCELAR</p>
    </div>
</div>

<div id="splash-screen">
    <div class="logo-container"><img src="logo_atom.png" alt="ATOM" class="logo-img"></div>
    <p id="boot-text" style="margin-top: 20px; letter-spacing: 2px;">INICIALIZANDO...</p>
</div>

<div id="status-bar">
    <span>SISTEMA: <span id="net-status" class="blink">COMPROBANDO...</span></span>
    <span>FLORIDA, UY</span>
</div>

<div class="container" id="main-app">
    <header style="text-align: center; margin-bottom: 20px;">
        <h2 style="margin-bottom:0;">IDENTIFICACIÓN</h2>
        <p style="font-size: 11px; color: var(--gold); margin-top:5px;">SISTEMA TÁCTICO A.T.O.M.</p>
    </header>

    <div class="auth-card">
        <div id="login-form">
            <input type="email" id="log-email" placeholder="EMAIL DE OPERADOR">
            <input type="password" id="log-pass" placeholder="CONTRASEÑA">
            <button class="btn-primary" onclick="login()">ACCEDER AL LOBBY</button>
            <button class="btn-outline" onclick="toggleForm('reg')">NUEVO RECLUTA</button>
        </div>

        <div id="register-form" style="display:none;">
            <input type="text" id="reg-callsign" placeholder="CALLSIGN (EJ: COBRA)">
            <input type="email" id="reg-email" placeholder="EMAIL">
            <input type="password" id="reg-pass" placeholder="CONTRASEÑA">
            <button class="btn-primary" onclick="register()">CREAR PERFIL</button>
            <button class="btn-outline" onclick="toggleForm('log')">VOLVER</button>
        </div>
    </div>
</div>

<footer>
    <button class="btn-restricted" onclick="openAdmin()">⚙️ ZONA RESTRINGIDA</button>
</footer>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
      authDomain: "atom---sistem.firebaseapp.com",
      databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
      projectId: "atom---sistem",
      storageBucket: "atom---sistem.firebasestorage.app",
      messagingSenderId: "151110156876",
      appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('boot-text').innerText = "SISTEMA LISTO";
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('net-status').innerText = "ONLINE";
                document.getElementById('net-status').classList.remove('blink');
            }, 600);
        }, 1000);
    };

    function toggleForm(type) {
        document.getElementById('login-form').style.display = type === 'reg' ? 'none' : 'block';
        document.getElementById('register-form').style.display = type === 'reg' ? 'block' : 'none';
    }

    // ACCESO JUGADOR
    async function login() {
        const email = document.getElementById('log-email').value.trim();
        const pass = document.getElementById('log-pass').value.trim();
        
        if(!email || !pass) return alert("Ingrese datos");

        try {
            // Limpieza de sesión previa para evitar conflictos
            if(auth.currentUser) await auth.signOut();

            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            const snap = await db.ref(`usuarios/${userCredential.user.uid}`).once('value');
            
            if(snap.exists()){
                const data = snap.val();
                localStorage.setItem('callsign', data.callsign);
                localStorage.setItem('userRole', data.rol || 'PLAYER');
                location.href = "lobby.html";
            } else {
                alert("Error: Usuario no registrado en la base de datos.");
            }
        } catch(e) { alert("ACCESO DENEGADO: Verifique correo y contraseña"); }
    }

    // ACCESO ADMINISTRADOR
    async function validateAdmin() {
        const email = document.getElementById('admin-email').value.trim();
        const pass = document.getElementById('admin-pass').value.trim();
        
        if(!email || !pass) return alert("Credenciales incompletas");

        try {
            // Forzar cierre de cualquier sesión activa
            await auth.signOut();

            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            const snap = await db.ref(`usuarios/${userCredential.user.uid}`).once('value');
            const data = snap.val();
            
            if (data && (data.rol === "ADMIN" || data.rol === "EDITOR")) {
                localStorage.setItem('callsign', data.callsign);
                localStorage.setItem('userRole', data.rol);
                location.href = "idea.html";
            } else {
                alert("RANGO INSUFICIENTE: Se requiere nivel ADMIN o EDITOR");
                await auth.signOut();
            }
        } catch (error) { alert("FALLO DE SEGURIDAD: Credenciales de mando inválidas"); }
    }

    // REGISTRO
    async function register() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();
        const call = document.getElementById('reg-callsign').value.toUpperCase().trim();
        
        if(!call || !email || !pass) return alert("Complete todos los campos");
        
        try {
            const res = await auth.createUserWithEmailAndPassword(email, pass);
            const userData = { callsign: call, email: email, rol: 'PLAYER', uid: res.user.uid };
            
            await db.ref(`usuarios/${res.user.uid}`).set(userData);
            localStorage.setItem('callsign', call);
            localStorage.setItem('userRole', 'PLAYER');
            
            alert("REGISTRO EXITOSO");
            location.href = "lobby.html";
        } catch(e) { alert("ERROR: " + e.message); }
    }

    function openAdmin() { document.getElementById('admin-overlay').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('admin-overlay').style.display = 'none'; }
</script>
</body>
</html>
