<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema A.T.O.M. - Uruguay</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root { --p:#00ff00; --f:#050505; }

body {
 background: var(--f);
 color: var(--p);
 font-family: monospace;
 margin:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 overflow:hidden;
}

/* SPLASH */
#splash-screen {
 position:fixed;
 inset:0;
 background:#000;
 z-index:9999;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:20px;
}

/* TERMINAL */
#boot-text {
 width:100%;
 max-width:500px;
 font-size:12px;
 line-height:18px;
 height:200px;
 overflow:hidden;
 white-space:pre-line;
}

/* PROGRESS BAR */
#progress {
 width:100%;
 max-width:500px;
 height:10px;
 border:1px solid var(--p);
 margin-top:10px;
}

#bar {
 height:100%;
 width:0%;
 background:var(--p);
}

/* LOGO */
.logo-container {
 width:200px;
 height:200px;
 margin-top:20px;
}

.glitch-img {
 width:100%;
 filter:drop-shadow(0 0 5px var(--p));
 animation: glitch 2s infinite;
}

/* MAIN */
#main-content {
 display:none;
 opacity:0;
 flex-direction:column;
 align-items:center;
 width:100%;
}

.main-title {
 font-size:2rem;
 letter-spacing:3px;
 animation: text-glitch 500ms infinite;
}

.grid-container {
 display:grid;
 grid-template-columns:1fr;
 gap:15px;
 width:90%;
 max-width:380px;
}

.module-card {
 border:2px solid var(--p);
 padding:20px;
 text-align:center;
 text-decoration:none;
 color:var(--p);
 text-transform:uppercase;
}

.module-card:hover {
 background:var(--p);
 color:#000;
}

/* FX */
@keyframes glitch {
 0% {transform:translate(0);}
 20% {transform:translate(-2px,2px);}
 40% {transform:translate(2px,-2px);}
 100% {transform:translate(0);}
}

@keyframes text-glitch {
 0% {transform:translate(0);}
 50% {transform:translate(1px,-1px);}
 100% {transform:translate(0);}
}

@keyframes fadeIn {
 from {opacity:0; transform:translateY(10px);}
 to {opacity:1; transform:translateY(0);}
}

body::before {
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 50%);
 background-size:100% 4px;
 pointer-events:none;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash-screen">

<div id="boot-text"></div>

<div id="progress">
<div id="bar"></div>
</div>

<div class="logo-container">
<img src="logo_atom.png" class="glitch-img">
</div>

</div>

<!-- MAIN -->
<div id="main-content">

<div class="main-title">A.T.O.M SYSTEM</div>
<p style="opacity:0.7;font-size:12px;">AIRSOFT TACTICAL OPERATION MAPS</p>

<div class="grid-container">
<a href="registro_usuario.html" class="module-card">ALTA USUARIO</a>
<a href="escuadrones.html" class="module-card">ESCUADRONES</a>
<a href="operaciones.html" class="module-card">MISIONES</a>
<a href="admin.html" class="module-card" style="border-color:#444;opacity:0.7;">COMANDO CENTRAL</a>
</div>

</div>

<script>

const bootLines = [
"> BOOTING A.T.O.M SYSTEM...",
"> CHECKING MODULES...",
"> GPS MODULE ........ OK",
"> DATABASE LINK ..... OK",
"> ENCRYPTION LAYER .. OK",
"> AUTH SYSTEM ....... OK",
"> LOADING TACTICAL MAPS...",
"> CONNECTING OPERATORS...",
"> SYSTEM READY"
];

let i = 0;
let textEl = document.getElementById("boot-text");
let bar = document.getElementById("bar");

function typeLine(){
 if(i < bootLines.length){
  textEl.innerHTML += bootLines[i] + "\n";
  i++;
  bar.style.width = (i / bootLines.length * 100) + "%";
  setTimeout(typeLine, 300);
 } else {
  setTimeout(startMain, 800);
 }
}

function startMain(){
 document.getElementById("splash-screen").style.opacity = "0";

 setTimeout(()=>{
  document.getElementById("splash-screen").style.display = "none";
  let main = document.getElementById("main-content");
  main.style.display = "flex";
  main.style.animation = "fadeIn 1s forwards";
 },800);
}

window.onload = typeLine;

</script>

</body>
</html>
