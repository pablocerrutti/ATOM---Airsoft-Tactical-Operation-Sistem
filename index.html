<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Lobby de Despliegue</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --p: #00ff00; --f: #050505; --gold: #ffd700; --gray: #1a1a1a; --red: #ff3333; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh;
        }

        header { padding: 15px; border-bottom: 1px solid var(--p); background: #000; }
        .op-info { display: flex; justify-content: space-between; align-items: center; }
        .callsign { font-weight: bold; color: var(--gold); font-size: 1.2rem; }

        #mission-container { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        #mini-map { width: 100%; height: 250px; background: #111; border: 1px solid var(--p); margin-bottom: 15px; }

        .mission-card { background: var(--gray); padding: 15px; border-left: 4px solid var(--gold); margin-bottom: 10px; }
        .btn-secondary { width: 100%; padding: 12px; background: transparent; color: var(--gold); border: 1px solid var(--gold); cursor: pointer; margin-bottom: 20px; font-family: inherit; }
        
        .btn-enlist { width: 100%; padding: 20px; background: var(--p); color: #000; border: none; font-weight: bold; cursor: pointer; position: sticky; bottom: 0; }
        .btn-enlist:disabled { background: #222; color: #555; }

        footer { padding: 20px; text-align: center; border-top: 1px solid var(--gray); margin-top: auto; }
        .btn-restricted { color: #444; font-size: 10px; border: 1px solid #222; padding: 5px 10px; background: none; cursor: pointer; }

        /* MODAL TÁCTICO PERSONALIZADO */
        #auth-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            z-index: 3000; align-items: center; justify-content: center;
        }
        .modal-content {
            width: 90%; max-width: 400px; background: #000; border: 2px solid var(--gold);
            padding: 30px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .modal-content h3 { color: var(--gold); margin-top: 0; }
        .modal-input { 
            width: 100%; padding: 15px; background: #111; border: 1px solid var(--gold); 
            color: var(--gold); text-align: center; font-family: inherit; font-size: 1.2rem; margin: 20px 0;
        }
        .modal-btns { display: flex; gap: 10px; }
        .btn-confirm { flex: 1; padding: 15px; background: var(--gold); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; padding: 15px; background: #222; color: #fff; border: none; cursor: pointer; }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        @media (min-width: 600px) {
            body { align-items: center; }
            #mission-container, header, .btn-enlist, footer { width: 500px; }
        }
    </style>
</head>
<body>

<!-- MODAL DE VERIFICACIÓN -->
<div id="auth-modal">
    <div class="modal-content">
        <h3 class="blink">AUTORIZACIÓN REQUERIDA</h3>
        <p style="font-size: 12px; color: #888;">INGRESE SU CALLSIGN PARA VALIDAR ACCESO A NIVEL ADMIN/EDITOR</p>
        <input type="text" id="modal-callsign-input" class="modal-input" placeholder="CALLSIGN" autocomplete="off">
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeAuthModal()">ABORTAR</button>
            <button class="btn-confirm" onclick="confirmIdentity()">VERIFICAR</button>
        </div>
    </div>
</div>

<header>
    <div class="op-info">
        <div>
            <div id="display-callsign" class="callsign">CARGANDO...</div>
            <div style="font-size: 10px;">ESTADO: OPERATIVO</div>
        </div>
        <button onclick="logout()" style="background:none; border:1px solid var(--p); color:var(--p); font-size:10px; padding:5px;">SALIR</button>
    </div>
</header>

<div id="mission-container">
    <div id="mission-data">
        <h4 style="margin: 0 0 10px 0;">OPERACIÓN DISPONIBLE:</h4>
        <div class="mission-card">
            <p id="no-mission" style="color:var(--red);">ESPERANDO ÓRDENES DEL COMANDO...</p>
            <div id="active-mission-info" style="display:none;">
                <h3 id="m-name" style="margin:0; color:#fff;">--</h3>
                <p id="m-status" style="font-size:0.8rem; color:#aaa;">--</p>
            </div>
        </div>
    </div>

    <button class="btn-secondary" onclick="location.href='operadores.html'">👥 OPERADORES OPERATIVOS</button>

    <div id="mini-map">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; font-size:12px; color:#444;">VISTA PREVIA TÁCTICA</div>
    </div>

    <div id="waiting-area" style="display:none; text-align:center; padding:20px; border:1px dashed var(--gold);">
        <span class="blink" style="color:var(--gold);">[ ENLISTADO ]</span>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">COORDENADAS ENVIADAS AL COMANDO.</p>
    </div>
</div>

<button class="btn-enlist" id="btn-action" onclick="handleEnlist()" disabled>DESPLEGAR EN MISIÓN</button>

<footer>
    <button class="btn-restricted" onclick="openAuthModal()">⚙️ ZONA RESTRINGIDA</button>
</footer>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
  authDomain: "atom---sistem.firebaseapp.com",
  databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
  projectId: "atom---sistem",
  storageBucket: "atom---sistem.firebasestorage.app",
  messagingSenderId: "151110156876",
  appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userProfile = null; // Variable global para persistir el perfil

// Listener de autenticación mejorado
auth.onAuthStateChanged(user => {
    if (user) {
        // Forzamos la descarga inmediata del perfil
        db.ref(`usuarios/${user.uid}`).on('value', snap => {
            userProfile = snap.val();
            if(userProfile) {
                document.getElementById('display-callsign').innerText = userProfile.callsign;
                checkActiveMission(user.uid);
            }
        });
    } else {
        location.href = "index.html";
    }
});

function checkActiveMission(uid) {
    db.ref('misiones').orderByChild('estado').equalTo('PREPARACION').on('value', snap => {
        if (snap.exists()) {
            const missions = snap.val();
            const mId = Object.keys(missions)[0];
            const m = missions[mId];
            document.getElementById('no-mission').style.display = 'none';
            document.getElementById('active-mission-info').style.display = 'block';
            document.getElementById('m-name').innerText = m.nombre;
            document.getElementById('m-status').innerText = "FASE DE RECLUTAMIENTO";
            document.getElementById('btn-action').disabled = false;
        }
    });
}

function handleEnlist() {
    if (!userProfile) return alert("PERFIL NO CARGADO");
    const user = auth.currentUser;
    db.ref(`operacion_activa/despliegue/${user.uid}`).set({
        callsign: userProfile.callsign,
        enlistado: true,
        lanzada: false,
        pos: { lat: 0, lng: 0 }
    }).then(() => {
        document.getElementById('btn-action').style.display = 'none';
        document.getElementById('waiting-area').style.display = 'block';
    });
}

// LÓGICA DE ACCESO CON VARIABLE GLOBAL
function openAuthModal() {
    // Si la sesión existe pero el perfil aún no descargó, esperamos un segundo
    if (!userProfile) {
        alert("SINCRONIZANDO CON COMANDO... REINTENTE EN 2 SEGUNDOS");
        return;
    }

    // Verificación de Rango
    if (userProfile.rol === "ADMIN" || userProfile.rol === "EDITOR") {
        document.getElementById('auth-modal').style.display = 'flex';
        document.getElementById('modal-callsign-input').focus();
    } else {
        alert("ACCESO DENEGADO: NIVEL DE AUTORIZACIÓN INSUFICIENTE");
    }
}

function closeAuthModal() {
    document.getElementById('auth-modal').style.display = 'none';
    document.getElementById('modal-callsign-input').value = "";
}

function confirmIdentity() {
    const input = document.getElementById('modal-callsign-input').value.trim().toUpperCase();
    if (!userProfile.callsign) return alert("ERROR DE PERFIL");

    if (input === userProfile.callsign.toUpperCase()) {
        location.href = "restricted_zone.html";
    } else {
        alert("ALERTA: CALLSIGN INCORRECTO");
        closeAuthModal();
    }
}

function logout() { auth.signOut(); }
</script>
</body>
</html>
