<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema A.T.O.M. - Uruguay</title>
    
    <!-- Favicon local -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root { 
            --p: #00ff00; 
            --f: #000000; 
        }

        body { 
            background: var(--f); 
            color: var(--p); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease;
        }

        .logo-wrapper { width: 300px; }

        .glitch-img {
            width: 100%;
            filter: drop-shadow(0 0 15px var(--p));
            animation: glitch-anim 0.2s infinite;
        }

        #main-app {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            transition: opacity 1s ease;
        }

        .btn-tactical {
            border: 1px solid var(--p);
            background: rgba(0, 255, 0, 0.05);
            padding: 15px;
            margin: 10px;
            text-align: center;
            text-decoration: none;
            color: var(--p);
            width: 250px;
            text-transform: uppercase;
        }

        .btn-tactical:hover { background: var(--p); color: #000; }

        @keyframes glitch-anim {
            0% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="logo-wrapper">
            <!-- Ruta relativa al mismo repositorio -->
            <img src="logo_atom.png" id="atom-logo" class="glitch-img" alt="Cargando A.T.O.M...">
        </div>
    </div>

    <div id="main-app">
        <h1>SISTEMA A.T.O.M.</h1>
        <div style="font-size: 0.8rem; margin-bottom: 20px;">FLORIDA - URUGUAY</div>
        <a href="#" class="btn-tactical">Misiones Operativas</a>
        <a href="#" class="btn-tactical">Registro de Tropa</a>
    </div>

    <script>
        const logo = document.getElementById('atom-logo');
        
        function entrar() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                setTimeout(() => document.getElementById('main-app').style.opacity = '1', 50);
            }, 800);
        }

        // Al estar en el mismo repo, la carga es casi instantánea
        logo.onload = () => setTimeout(entrar, 2000);

        // Fallback de seguridad
        setTimeout(() => {
            if (document.getElementById('splash-screen').style.display !== 'none') entrar();
        }, 4000);
    </script>
</body>
</html>
