<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Airsoft Tactical Operation Maps</title>
    
    <link rel="icon" type="image/png" href="logo_atom.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --p: #00ff00; --f: #050505; --red: #ff3333; --gold: #ffd700; --gray: #222; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--f); color: var(--p); 
            font-family: 'Courier New', monospace; overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .static-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Static_grain.gif');
            opacity: 0.05; pointer-events: none; z-index: 2000;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--f); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        
        .logo-container { 
            width: 140px; height: 140px; border: 2px solid var(--p); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            animation: pulse 2s infinite; background: rgba(0, 255, 0, 0.05);
        }
        .logo-img { width: 80%; height: auto; filter: drop-shadow(0 0 5px var(--p)); }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(0, 255, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); } }

        .container { width: 100%; max-width: 450px; margin: 0 auto; padding: 20px; flex: 1; display: none; }
        #status-bar { font-size: 10px; padding: 10px; border-bottom: 1px solid var(--gray); display: flex; justify-content: space-between; opacity: 0.6; }
        
        .auth-card { background: #111; padding: 25px; border: 1px solid var(--gray); margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { 
            width: 100%; padding: 15px; margin-bottom: 12px; 
            background: #000; border: 1px solid var(--p); color: var(--p);
            font-family: inherit; font-size: 16px; outline: none;
        }
        input::placeholder { color: rgba(0, 255, 0, 0.3); }

        .btn-primary { width: 100%; padding: 16px; background: var(--p); color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-outline { width: 100%; padding: 10px; background: transparent; color: var(--p); border: 1px solid var(--p); margin-top: 10px; cursor: pointer; font-family: inherit; }

        #admin-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 5000; align-items: center; justify-content: center; }
        .admin-box { width: 90%; max-width: 380px; border: 2px solid var(--red); padding: 30px; background: #000; text-align: center; }
        .admin-input { border-color: var(--red) !important; color: var(--red) !important; }
        .btn-admin { background: var(--red); color: #fff; width: 100%; padding: 16px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        footer { padding: 20px; text-align: center; }
        .btn-restricted { color: #333; text-decoration: none; font-size: 10px; border: 1px solid #1a1a1a; padding: 6px 12px; background: none; cursor: pointer; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="static-overlay"></div>

<div id="admin-overlay">
    <div class="admin-box">
        <h2 style="color: var(--red); letter-spacing: 2px;">ACCESO RESTRINGIDO</h2>
        <p style="color: var(--red); font-size: 10px; margin-bottom: 20px; opacity: 0.8;">IDENTIFICACIÓN DE MANDO NIVEL 5</p>
        <input type="email" id="admin-email" class="admin-input" placeholder="EMAIL DE COMANDO">
        <input type="password" id="admin-pass" class="admin-input" placeholder="CONTRASEÑA">
        <button class="btn-admin" onclick="validateAdmin()">VALIDAR CREDENCIALES</button>
        <p onclick="closeAdmin()" style="margin-top: 20px; font-size: 11px; color: #444; cursor: pointer;">CANCELAR ACCESO</p>
    </div>
</div>

<div id="splash-screen">
    <div class="logo-container">
        <img src="logo_atom.png" alt="ATOM" class="logo-img">
    </div>
    <p id="boot-text" style="margin-top: 20px; letter-spacing: 3px; font-size: 12px; opacity: 0.7;">CARGANDO ENCRIPTACIÓN...</p>
</div>

<div id="status-bar">
    <span>NODO: FLORIDA_UY</span>
    <span>SISTEMA: ONLINE</span>
</div>

<div class="container" id="main-app">
    <header style="text-align: center; margin-bottom: 25px;">
        <h2 style="margin: 0; letter-spacing: 4px;">IDENTIFICACIÓN</h2>
        <div style="width: 50px; height: 2px; background: var(--p); margin: 10px auto;"></div>
        <p style="font-size: 11px; color: var(--gold); margin: 0;">AIRSOFT TACTICAL OPERATION MAPS</p>
    </header>

    <div class="auth-card">
        <div id="login-form">
            <input type="email" id="log-email" placeholder="EMAIL DE OPERADOR">
            <input type="password" id="log-pass" placeholder="CONTRASEÑA">
            <button class="btn-primary" onclick="login()">ACCEDER AL LOBBY</button>
            <button class="btn-outline" onclick="toggleForm('reg')">NUEVO RECLUTA</button>
        </div>

        <div id="register-form" style="display:none;">
            <input type="text" id="reg-callsign" placeholder="CALLSIGN (EJ: LOBO)">
            <input type="email" id="reg-email" placeholder="EMAIL">
            <input type="password" id="reg-pass" placeholder="CONTRASEÑA">
            <button class="btn-primary" onclick="register()">CREAR PERFIL TÁCTICO</button>
            <button class="btn-outline" onclick="toggleForm('log')">VOLVER AL ACCESO</button>
        </div>
    </div>
</div>

<footer>
    <button class="btn-restricted" onclick="openAdmin()">SISTEMA DE GESTIÓN</button>
</footer>

<script>
    // CONFIGURACIÓN CENTRAL
    const firebaseConfig = {
      apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
      authDomain: "atom---sistem.firebaseapp.com",
      databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
      projectId: "atom---sistem",
      storageBucket: "atom---sistem.firebasestorage.app",
      messagingSenderId: "151110156876",
      appId: "1:151110156876:web:89c5506f9279fc3b5d2ae9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // FLUJO DE INICIO
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }, 1200);
    };

    // 1. LOGIN DE OPERADORES (LOBBY)
    function login() {
        const email = document.getElementById('log-email').value.trim();
        const pass = document.getElementById('log-pass').value.trim();
        
        if(!email || !pass) return alert("DATOS INCOMPLETOS");

        auth.signInWithEmailAndPassword(email, pass)
            .then((u) => {
                return db.ref(`usuarios/${u.user.uid}`).once('value');
            })
            .then((snap) => {
                if (snap.exists()) {
                    const d = snap.val();
                    localStorage.setItem('callsign', d.callsign || "OPERADOR");
                    localStorage.setItem('userRole', d.rol || "PLAYER");
                    // Redirección directa
                    window.location.replace("lobby.html");
                } else {
                    alert("ERROR: EL PERFIL NO EXISTE EN LA BASE DE DATOS");
                }
            })
            .catch((e) => alert("FALLO DE AUTENTICACIÓN: REVISE SUS DATOS"));
    }

    // 2. VALIDACIÓN DE MANDO (IDEA.HTML)
    function validateAdmin() {
        const email = document.getElementById('admin-email').value.trim();
        const pass = document.getElementById('admin-pass').value.trim();
        
        if(!email || !pass) return alert("INGRESE CREDENCIALES DE MANDO");

        auth.signInWithEmailAndPassword(email, pass)
            .then((u) => {
                return db.ref(`usuarios/${u.user.uid}`).once('value');
            })
            .then((snap) => {
                const d = snap.val();
                if (d && (d.rol === "ADMIN" || d.rol === "EDITOR")) {
                    localStorage.setItem('callsign', d.callsign);
                    localStorage.setItem('userRole', d.rol);
                    // Redirección directa a zona restringida
                    window.location.replace("idea.html");
                } else {
                    alert("ACCESO RECHAZADO: RANGO INSUFICIENTE");
                    auth.signOut();
                }
            })
            .catch((e) => alert("ALERTA: CREDENCIALES DE MANDO INVÁLIDAS"));
    }

    // 3. REGISTRO DE NUEVOS
    function register() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();
        const call = document.getElementById('reg-callsign').value.toUpperCase().trim();
        
        if(!call || !email || !pass) return alert("COMPLETE TODOS LOS CAMPOS");
        
        auth.createUserWithEmailAndPassword(email, pass)
            .then((res) => {
                const userData = { callsign: call, email: email, rol: 'PLAYER', uid: res.user.uid };
                return db.ref(`usuarios/${res.user.uid}`).set(userData);
            })
            .then(() => {
                localStorage.setItem('callsign', call);
                localStorage.setItem('userRole', 'PLAYER');
                alert("OPERADOR REGISTRADO CON ÉXITO");
                window.location.replace("lobby.html");
            })
            .catch((e) => alert("ERROR EN REGISTRO: " + e.message));
    }

    // INTERFAZ
    function toggleForm(type) {
        document.getElementById('login-form').style.display = type === 'reg' ? 'none' : 'block';
        document.getElementById('register-form').style.display = type === 'reg' ? 'block' : 'none';
    }
    function openAdmin() { document.getElementById('admin-overlay').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('admin-overlay').style.display = 'none'; }
</script>

</body>
</html>
