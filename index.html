<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAC - Comunidad Airsoft</title>
    <style>
        :root { --p: #00ff00; --f: #0a0a0a; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid var(--p); padding-bottom: 20px; margin-bottom: 30px; }
        .event-card { border: 1px solid var(--p); padding: 15px; margin-bottom: 20px; background: rgba(0,255,0,0.05); }
        .event-card h3 { margin-top: 0; color: #fff; }
        .btn { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 10px 20px; cursor: pointer; width: 100%; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: var(--p); color: #000; }
        .admin-link { display: block; text-align: center; margin-top: 50px; font-size: 0.8rem; color: #444; text-decoration: none; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 10px; margin-bottom: 10px; width: calc(100% - 22px); }
    </style>
</head>
<body>
    <div class="header">
        <h1>SISTEMA A.T.O.M - Airsoft Tactics Operation Maps.</h1>
        <p>CENTRO DE OPERACIONES Y COMUNIDAD</p>
    </div>

    <div id="auth-section">
        <h3>REGISTRO DE COMBATIENTE</h3>
        <input type="text" id="reg-callsign" placeholder="CALLSIGN (Nombre en juego)">
        <input type="email" id="reg-email" placeholder="CORREO ELECTRÓNICO">
        <input type="password" id="reg-pass" placeholder="CONTRASEÑA">
        <button class="btn" onclick="registrar()">DARSE DE ALTA</button>
    </div>

    <hr style="border: 0.5px solid #222; margin: 30px 0;">

    <h2>PRÓXIMAS OPERACIONES</h2>
    <div id="calendar">
        <p>Buscando transmisiones enemigas...</p>
    </div>

    <a href="admin.html" class="admin-link">ACCESO COMANDANCIA [ADMIN]</a>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        function registrar() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const callsign = document.getElementById('reg-callsign').value;

            auth.createUserWithEmailAndPassword(email, pass).then((userCredential) => {
                db.ref('users/' + userCredential.user.uid).set({
                    callsign: callsign,
                    role: 'jugador',
                    team: 'pendiente'
                });
                alert("Soldado registrado correctamente.");
            }).catch(e => alert(e.message));
        }

        // Cargar eventos del calendario
        db.ref('operaciones').on('value', (snap) => {
            const ops = snap.val();
            const container = document.getElementById('calendar');
            container.innerHTML = "";
            for (let id in ops) {
                container.innerHTML += `
                    <div class="event-card">
                        <h3>${ops[id].nombre}</h3>
                        <p>📍 Ubicación: Florida, Uruguay</p>
                        <button class="btn" onclick="window.location.href='mapa.html?op=${id}'">DESPLEGARSE</button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
