<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema A.T.O.M. - Uruguay</title>

<link rel="icon" type="image/png" href="logo_atom.png">

<style>
:root { --p:#00ff00; --f:#050505; }

body {
 background: var(--f);
 color: var(--p);
 font-family: monospace;
 margin:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 overflow:hidden;
}

/* BOOT SCREEN */
#splash-screen {
 position:fixed;
 inset:0;
 background:#000;
 z-index:9999;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:20px;
}

#boot-text {
 width:100%;
 max-width:500px;
 font-size:12px;
 line-height:18px;
 height:200px;
 overflow:hidden;
 white-space:pre-line;
}

#progress {
 width:100%;
 max-width:500px;
 height:10px;
 border:1px solid var(--p);
 margin-top:10px;
}

#bar {
 height:100%;
 width:0%;
 background:var(--p);
}

/* MAIN MENU */
#main-content {
 display:none;
 opacity:0;
 flex-direction:column;
 align-items:center;
 width:100%;
}

.main-title {
 font-size:2rem;
 letter-spacing:3px;
 text-align:center;
}

.subtitle {
 font-size:12px;
 opacity:0.7;
 text-align:center;
 margin-bottom:20px;
}

/* GRID */
.grid {
 display:grid;
 grid-template-columns:1fr;
 gap:12px;
 width:90%;
 max-width:380px;
}

.btn {
 border:2px solid var(--p);
 padding:15px;
 text-align:center;
 cursor:pointer;
 text-decoration:none;
 color:var(--p);
 transition:0.2s;
 text-transform:uppercase;
}

.btn:hover {
 background:var(--p);
 color:#000;
}

/* ADMIN BUTTON */
#adminBtn {
 display:none;
 border-color:#444;
 opacity:0.5;
}

/* SCAN EFFECT */
body::before {
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 50%);
 background-size:100% 4px;
 pointer-events:none;
}

/* ANIM */
@keyframes fadeIn {
 from {opacity:0; transform:translateY(10px);}
 to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- BOOT -->
<div id="splash-screen">

<div id="boot-text"></div>

<div id="progress">
 <div id="bar"></div>
</div>

<img src="logo_atom.png" width="160" style="margin-top:20px;">

</div>

<!-- MAIN -->
<div id="main-content">

<div class="main-title">A.T.O.M SYSTEM</div>
<div class="subtitle">AIRSOFT TACTICAL OPERATIONS MAP</div>

<div class="grid">

<!-- ACCESO -->
<a class="btn" href="login.html">Ingresar a A.T.O.M</a>

<!-- REGISTRO OPERADOR -->
<a class="btn" href="registro_usuario.html">Registro de Operadores</a>

<!-- USUARIOS -->
<a class="btn" href="misiones.html">Misiones disponibles</a>

<a class="btn" href="escuadrones.html">Registro de Escuadrones</a>

<a class="btn" href="usuarios_admin.html">Escuadrones y Operadores Activos</a>

<!-- ADMIN / EDITOR -->
<a id="adminBtn" class="btn" href="admin.html">
Zona Editor / Comando Central
</a>

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain:"atom--airsoft.firebaseapp.com",
 databaseURL:"https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId:"atom--airsoft",
 storageBucket:"atom--airsoft.firebasestorage.app",
 messagingSenderId:"310010107781",
 appId:"1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* 🔐 CONTROL DE ROLES */
auth.onAuthStateChanged(user => {
 if (!user) return;

 db.ref("usuarios/" + user.uid).once("value").then(snap => {
  const data = snap.val();
  if (!data) return;

  const rol = data.rol;

  localStorage.setItem("usuario", JSON.stringify({
   id: user.uid,
   callsign: data.callsign,
   rol: rol
  }));

  // SOLO ADMIN / EDITOR
  if (rol === "ADMIN" || rol === "EDITOR") {
   document.getElementById("adminBtn").style.display = "block";
   document.getElementById("adminBtn").style.opacity = "1";
  }
 });
});

/* BOOT SEQUENCE */
const bootLines = [
"> BOOTING A.T.O.M SYSTEM...",
"> INITIALIZING MODULES...",
"> GPS MODULE ........ OK",
"> DATABASE .......... OK",
"> AUTH SYSTEM ....... OK",
"> MAP ENGINE ........ OK",
"> CONNECTING USERS...",
"> SYSTEM READY"
];

let i = 0;
const text = document.getElementById("boot-text");
const bar = document.getElementById("bar");

function boot() {
 if (i < bootLines.length) {
  text.innerHTML += bootLines[i] + "\n";
  bar.style.width = ((i+1)/bootLines.length)*100 + "%";
  i++;
  setTimeout(boot, 250);
 } else {
  setTimeout(startApp, 700);
 }
}

function startApp() {
 document.getElementById("splash-screen").style.opacity = "0";

 setTimeout(() => {
  document.getElementById("splash-screen").style.display = "none";
  const main = document.getElementById("main-content");
  main.style.display = "flex";
  main.style.animation = "fadeIn 1s forwards";
 }, 800);
}

window.onload = boot;
</script>

</body>
</html>
