<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M SYSTEM URUGUAY</title>
<link rel="icon" href="favicon.png">

<style>
:root { --p:#00ff00; --f:#050505; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 overflow:hidden;
}

/* SPLASH */
#splash {
 position:fixed;
 inset:0;
 background:#000;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:9999;
}

#logo {
 width:160px;
 max-width:60%;
 margin-bottom:20px;
 filter: drop-shadow(0 0 10px #00ff00);
 animation:pulse 2s infinite;
}

@keyframes pulse {
 0% { transform:scale(1); opacity:0.8; }
 50% { transform:scale(1.05); opacity:1; }
 100% { transform:scale(1); opacity:0.8; }
}

#boot {
 font-size:12px;
 width:90%;
 max-width:500px;
 height:180px;
 overflow:hidden;
 white-space:pre-line;
}

#barWrap {
 width:90%;
 max-width:500px;
 height:10px;
 border:1px solid var(--p);
 margin-top:10px;
}

#bar {
 height:100%;
 width:0%;
 background:var(--p);
}

/* MAIN */
#main {
 display:none;
 flex-direction:column;
 align-items:center;
 width:100%;
 text-align:center;
}

.title {
 font-size:2rem;
 margin-bottom:10px;
}

.grid {
 display:grid;
 gap:15px;
 width:90%;
 max-width:360px;
}

.btn {
 border:2px solid var(--p);
 padding:18px;
 color:var(--p);
 text-decoration:none;
 text-transform:uppercase;
 text-align:center;
 cursor:pointer;
 transition:0.2s;
 background: transparent;
 font-family: inherit;
 font-size: 14px;
}

.btn:hover {
 background:var(--p);
 color:#000;
}

body::before {
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 50%);
 background-size:100% 4px;
 pointer-events:none;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
 <img id="logo" src="logo_atom.png" alt="A.T.O.M LOGO">
 <div id="boot"></div>
 <div id="barWrap"><div id="bar"></div></div>
</div>

<!-- MAIN -->
<div id="main">
 <div class="title">A.T.O.M SYSTEM</div>
 <p style="opacity:.7;font-size:12px;">AIRSOFT TACTICAL OPERATIONS MAP</p>
 <p style="opacity:.7;font-size:12px;">creado por Pablo Cerrutti - florida</p>

 <div class="grid">
  <a class="btn" href="login.html">INGRESAR A A.T.O.M</a>
  <a class="btn" href="registro_usuario.html">REGISTRARSE COMO OPERADOR</a>
 </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const lines = [
"> INIT A.T.O.M SYSTEM",
"> CHECK DATABASE .... OK",
"> AUTH MODULE ....... OK",
"> GPS MODULE ........ OK",
"> LOADING INTERFACE...",
"> SYSTEM READY"
];

let i = 0;
const boot = document.getElementById("boot");
const bar = document.getElementById("bar");

function startBoot(){
 if(i < lines.length){
  boot.innerText += lines[i] + "\n";
  bar.style.width = ((i+1)/lines.length)*100 + "%";
  i++;
  setTimeout(startBoot, 250);
 } else {
  // Al terminar la animación, verificamos si ya hay una sesión iniciada
  checkSession();
 }
}

function checkSession() {
 auth.onAuthStateChanged(user => {
  if (user) {
   // Si hay usuario, consultamos su rol antes de mostrar nada
   db.ref("usuarios/" + user.uid).once("value").then(snap => {
    const data = snap.val();
    if (data) {
     if (data.rol === "ADMIN" || data.rol === "EDITOR") {
      window.location.href = "hub.html";
     } else {
      window.location.href = "hub2.html";
     }
    } else {
     // Si no tiene datos en DB, mostramos el menú principal
     showMain();
    }
   });
  } else {
   // Si no hay sesión, mostramos el menú principal
   showMain();
  }
 });
}

function showMain(){
 document.getElementById("splash").style.display = "none";
 document.getElementById("main").style.display = "flex";
}

window.onload = startBoot;
</script>

</body>
</html>
