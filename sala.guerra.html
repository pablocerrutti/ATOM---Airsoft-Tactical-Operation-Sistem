<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - SALA DE GUERRA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --bg-card: rgba(15,15,15,0.95); }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }
        
        /* Contenedores Visuales */
        .intel-header { display: flex; gap: 10px; height: 180px; margin-bottom: 10px; flex-shrink: 0; }
        #map-frame { flex: 1.2; border: 1px solid var(--p); background: #000; position: relative; }
        #preview-map { width: 100%; height: 100%; }

        #img-frame { flex: 0.8; border: 1px solid #333; background: #111; position: relative; overflow: hidden; }
        #mission-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0; }
        .overlay-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); font-size: 8px; padding: 2px; text-align: center; color: var(--p); }

        /* Panel de Datos (Sincronizados) */
        .info-scroll { flex: 1; overflow-y: auto; }
        .block { background: var(--bg-card); border: 1px solid #222; border-left: 4px solid var(--p); padding: 12px; margin-bottom: 10px; }
        .label { color: var(--gold); font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        /* Estilo para que parezcan datos de sistema, no campos de escritura */
        .data-field { 
            width: 100%; background: transparent; border: none; 
            color: #eee; font-family: sans-serif; font-size: 14px; margin-bottom: 5px;
            resize: none; pointer-events: none; /* Bloquea edición */
        }

        .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 5px; }
        .btn { padding: 16px; border: 1px solid var(--p); background: transparent; color: var(--p); font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: monospace; }
        .btn-ready { background: var(--p); color: #000; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
    </style>
</head>
<body>

    <div class="screen">
        <h2 id="m-header" style="margin:5px 0 10px 0; text-align: center; letter-spacing: 2px; font-size: 18px;">INTELIGENCIA DE MISIÓN</h2>

        <div class="intel-header">
            <div id="map-frame"><div id="preview-map"></div></div>
            <div id="img-frame">
                <img id="mission-img" src="">
                <div class="overlay-label">DRONE_RECON_FEED</div>
            </div>
        </div>

        <div class="info-scroll">
            <div class="block">
                <span class="label">Operación Seleccionada</span>
                <input id="mission-name" class="data-field" readonly>
                
                <span class="label">Briefing / Antecedentes</span>
                <textarea id="mission-history" class="data-field" rows="3" readonly></textarea>
                
                <span class="label">Objetivos Primarios</span>
                <textarea id="mission-objectives" class="data-field" rows="3" readonly></textarea>

                <input type="hidden" id="mission-image-url">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-ready" onclick="confirmDeployment()">CONFIRMAR ASISTENCIA</button>
            <button class="btn" onclick="location.href='lobby.html'" style="border-color:#444; color:#888; font-size: 11px;">VOLVER AL LOBBY</button>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "INVITADO";

let map, drawnItems, activeMissionId;

window.onload = () => {
    initMap();
    listenActiveMission();
};

function initMap() {
    map = L.map('preview-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
    drawnItems = L.featureGroup().addTo(map);
}

function listenActiveMission() {
    // Escucha qué ID de misión está activa en el sistema
    db.ref('operacion_activa/control/missionId').on('value', snap => {
        activeMissionId = snap.val();
        if(activeMissionId) {
            syncWithMissionData(activeMissionId);
        }
    });
}

function syncWithMissionData(id) {
    // Sincronización automática con los valores del Editor/Firebase
    db.ref(`misiones/${id}`).on('value', snap => {
        const data = snap.val();
        if(!data) return;

        // Tomamos los valores de Firebase (guardados por el editor) y los volcamos a la UI
        document.getElementById('mission-name').value = (data.nombre || "SIN NOMBRE").toUpperCase();
        document.getElementById('mission-history').value = data.historia || "No hay briefing disponible.";
        document.getElementById('mission-objectives').value = data.objetivos || "No hay objetivos asignados.";
        
        // Sincronización de Imagen de Portada
        const img = document.getElementById('mission-img');
        if(data.imagen) {
            img.src = data.imagen;
            img.style.opacity = "1";
        }

        // Sincronización de Mini Mapa (Elementos dibujados en el editor)
        drawnItems.clearLayers();
        if(data.elementos) {
            data.elementos.forEach(el => {
                let layer;
                const style = { color: '#0f0', weight: 2, fillOpacity: 0.15, dashArray: '5, 5' };
                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                
                if(layer) drawnItems.addLayer(layer);
            });

            // Auto-centrado del mini mapa según los perímetros
            if(drawnItems.getLayers().length > 0) {
                map.fitBounds(drawnItems.getBounds(), { padding: [20, 20] });
            }
        }
        
        // Refrescar tamaño del mapa por si hubo cambios de layout
        setTimeout(() => map.invalidateSize(), 500);
    });
}

function confirmDeployment() {
    if(!activeMissionId) return alert("ERROR: NO HAY MISIÓN ACTIVA");

    db.ref(`jugadores_enlistados/${myCallsign}`).set({
        callsign: myCallsign,
        equipo: 'S/E',
        misionId: activeMissionId,
        lat: 0, lng: 0,
        lastSeen: Date.now()
    }).then(() => {
        location.href = 'mapa_tactico.html';
    });
}
</script>
</body>
</html>
