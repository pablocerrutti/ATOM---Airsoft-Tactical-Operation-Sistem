<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - SALA DE GUERRA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --gold:#ffd700; --bg-card: rgba(15,15,15,0.95); }
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }
        
        /* Header Intel */
        .intel-header { display: flex; gap: 10px; height: 200px; margin-bottom: 10px; flex-shrink: 0; }
        #map-frame { flex: 1.2; border: 1px solid var(--p); background: #000; position: relative; }
        #preview-map { width: 100%; height: 100%; }

        #img-frame { flex: 0.8; border: 1px solid #333; background: #111; position: relative; overflow: hidden; }
        #mission-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 0.5s; }
        .overlay-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); font-size: 9px; padding: 3px; text-align: center; }

        /* Contenido */
        .info-scroll { flex: 1; overflow-y: auto; padding-right: 5px; }
        .block { background: var(--bg-card); border: 1px solid #222; border-left: 4px solid var(--p); padding: 12px; margin-bottom: 10px; }
        .label { color: var(--gold); font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .content { font-family: sans-serif; color: #eee; font-size: 14px; line-height: 1.4; }
        
        .status-tag { float: right; font-size: 10px; padding: 2px 8px; border: 1px solid var(--p); text-transform: uppercase; font-weight: bold; }

        /* Botones */
        .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 5px; }
        .btn { padding: 16px; border: 1px solid var(--p); background: transparent; color: var(--p); font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: monospace; }
        .btn-ready { background: var(--p); color: #000; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
    </style>
</head>
<body>

    <div class="screen">
        <h2 id="m-title" style="margin:5px 0 10px 0; text-align: center; letter-spacing: 2px;">CARGANDO INTEL...</h2>

        <div class="intel-header">
            <div id="map-frame"><div id="preview-map"></div></div>
            <div id="img-frame">
                <img id="mission-img" src="">
                <div class="overlay-label">SATELLITE_FEED_V.01</div>
            </div>
        </div>

        <div class="info-scroll">
            <div class="block">
                <span id="m-status" class="status-tag">---</span>
                <span class="label">Briefing / Historia</span>
                <div id="m-briefing" class="content">Sincronizando con HQ...</div>
            </div>
            <div class="block">
                <span class="label">Objetivos de Misión</span>
                <div id="m-objectives" class="content">Calculando prioridades...</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-ready" onclick="deploy()">CONFIRMAR ASISTENCIA</button>
            <button class="btn" onclick="location.href='lobby.html'" style="border-color:#444; color:#888;">VOLVER</button>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "INVITADO";

let map, drawnItems, currentId;

window.onload = () => {
    initMap();
    // Escuchar qué misión se seleccionó en el Lobby
    db.ref('operacion_activa/control/missionId').on('value', snap => {
        currentId = snap.val();
        if(currentId) syncMissionDetails(currentId);
    });
};

function initMap() {
    map = L.map('preview-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
    drawnItems = L.featureGroup().addTo(map);
}

function syncMissionDetails(id) {
    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;

        // Sincronización de variables según tus rutas
        document.getElementById('m-title').innerText = (m.nombre || "SIN NOMBRE").toUpperCase();
        document.getElementById('m-briefing').innerText = m.historia || "Sin historia disponible.";
        document.getElementById('m-objectives').innerText = m.objetivos || "Sin objetivos.";
        document.getElementById('m-status').innerText = m.estado || "PENDIENTE";

        if(m.imagen) {
            const img = document.getElementById('mission-img');
            img.src = m.imagen;
            img.style.opacity = "1";
        }

        // Mapa: Perímetros
        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const style = { color: '#0f0', weight: 2, fillOpacity: 0.15, dashArray: '5, 5' };
                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                if(layer) drawnItems.addLayer(layer);
            });
            if(drawnItems.getLayers().length > 0) {
                map.fitBounds(drawnItems.getBounds(), { padding: [20, 20] });
            }
        }
        setTimeout(() => map.invalidateSize(), 500);
    });
}

function deploy() {
    if(!currentId) return alert("ERROR DE CONEXIÓN");
    
    // Registrar operador y pasar al mapa táctico
    db.ref(`jugadores_enlistados/${myCallsign}`).set({
        callsign: myCallsign,
        equipo: 'S/E',
        misionId: currentId,
        lat: 0, lng: 0,
        lastSeen: Date.now()
    }).then(() => {
        location.href = 'mapa_tactico.html';
    });
}
</script>
</body>
</html>
