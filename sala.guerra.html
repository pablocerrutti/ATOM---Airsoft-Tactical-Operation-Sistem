<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Sala de Guerra</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --bg-block: rgba(0, 255, 0, 0.05); }
        body { margin:0; font-family: 'Segoe UI', 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        
        .screen { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }
        
        /* Layout Superior: Mapa e Imagen */
        .header-tactical { display: flex; gap: 10px; height: 180px; margin-bottom: 10px; flex-shrink: 0; }
        
        #map-container { flex: 1.2; border: 1px solid var(--p); position: relative; overflow: hidden; background: #000; box-shadow: inset 0 0 15px rgba(0,255,0,0.2); }
        #preview-map { width: 100%; height: 100%; transition: filter 0.5s ease; }
        
        #mission-cover-frame { flex: 0.8; border: 1px solid #333; overflow: hidden; background: #111; position: relative; border-radius: 2px; }
        #mission-cover-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }

        /* Overlay de Bloqueo Táctico */
        #map-wait-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--gold); }
        .map-blurred { filter: blur(5px) grayscale(1) brightness(0.5); }

        /* Información con Scroll Legible */
        .info-scroll { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .info-scroll::-webkit-scrollbar { width: 4px; }
        .info-scroll::-webkit-scrollbar-thumb { background: var(--p); }

        .block { margin-bottom: 10px; padding: 12px; border: 1px solid #222; border-left: 3px solid var(--p); background: var(--bg-block); }
        .label { color:var(--gold); font-size:11px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; border-bottom: 1px solid rgba(255,215,0,0.2); display: inline-block; padding-bottom: 2px; }
        .content { font-size:14px; color:#e0e0e0; line-height: 1.5; text-align: justify; }
        
        /* Operadores */
        .op-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .op-tag { padding: 4px 8px; border: 1px solid var(--p); font-size: 11px; color: #000; background: var(--p); font-weight: bold; border-radius: 2px; }

        /* Botones de Acción */
        .actions-bar { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        button { font-family: inherit; cursor: pointer; text-transform: uppercase; width: 100%; border: none; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--p); color: #000; padding: 15px; font-size: 15px; box-shadow: 0 4px 10px rgba(0,255,0,0.2); }
        .btn-main:active { transform: scale(0.98); }
        .btn-sec { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 10px; font-size: 12px; }
        .btn-cancel { border-color: var(--red); color: var(--red); }

        /* Tooltips del Mapa */
        .tactical-label { background: rgba(0,0,0,0.7); border: 1px solid var(--p); color: var(--p); font-weight: bold; font-size: 10px; padding: 2px 5px; }

        /* Pantalla de Inserción (Lock) */
        #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 10px solid var(--p); }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 class="blink" style="color:var(--p); font-size: 2.5rem; margin:0;">INSERCIÓN</h1>
        <p style="color:var(--gold); letter-spacing: 2px;">BANDO ASIGNADO: <span id="team-name" style="font-size: 1.5rem;">---</span></p>
        <p style="font-size: 10px; color: #555;">TRANSFIRIENDO COORDENADAS AL MAPA TÁCTICO...</p>
    </div>

    <div class="screen">
        <h2 id="m-name" style="margin:5px 0 10px 0; font-size: 1.3rem; color: var(--gold); text-align: center; text-shadow: 0 0 10px rgba(255,215,0,0.3);"> briefing de misión</h2>
        
        <div class="header-tactical">
            <div id="map-container">
                <div id="preview-map"></div>
                <div id="map-wait-overlay">
                    <div class="blink" style="color: var(--gold); font-size: 12px; font-weight: bold;">[ EN ESPERA ]</div>
                    <div style="font-size: 10px; color: #fff; margin-top: 5px;">HQ ASIGNANDO BANDO</div>
                </div>
            </div>
            <div id="mission-cover-frame">
                <img id="mission-cover-img" src="" alt="FOTO OPERACIÓN">
            </div>
        </div>

        <div class="info-scroll">
            <div class="block">
                <div class="label">Contexto Histórico / Historia</div>
                <div id="m-briefing" class="content">Recuperando archivos cifrados de la base de datos...</div>
            </div>
            <div class="block">
                <div class="label">Objetivos Primarios</div>
                <div id="m-objectives" class="content">Esperando directivas del comando central...</div>
            </div>
            <div class="block">
                <div class="label">Operadores en el Área</div>
                <div id="m-ops" class="op-list">
                    </div>
            </div>
        </div>

        <div class="actions-bar">
            <button id="btn-enlist" class="btn-main" onclick="enlist()">CONFIRMAR DESPLIEGUE</button>
            <button id="btn-cancel" class="btn-sec btn-cancel" onclick="cancelEnlist()" style="display:none;">ABORTAR ASISTENCIA</button>
            <button class="btn-sec" onclick="window.location.href='lobby.html'">VOLVER AL PANEL CENTRAL</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const misionId = params.get('mision');
        
        const firebaseConfig = { 
            apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY", 
            databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com", 
            projectId: "atom---sistem" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let previewMap, drawnItems, userCallsign;

        function getCloudinaryUrl(url) {
            if (!url || url.includes('collection')) return url;
            return url.replace('/upload/', '/upload/f_auto,q_auto,w_800/');
        }

        auth.onAuthStateChanged(user => {
            if (!user || !misionId) { window.location.href = 'lobby.html'; return; }
            db.ref(`usuarios/${user.uid}`).once('value', s => { 
                userCallsign = s.val().callsign; 
                initWarRoom();
                syncStatus();
            });
        });

        function initWarRoom() {
            // Inicializar Mapa centrado
            previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(previewMap);
            drawnItems = L.featureGroup().addTo(previewMap);

            // Cargar datos de la misión
            db.ref(`misiones/${misionId}`).on('value', snap => {
                const m = snap.val();
                if(!m) return;
                document.getElementById('m-name').innerText = m.nombre.toUpperCase();
                document.getElementById('m-briefing').innerText = m.historia || "Sin descripción disponible.";
                document.getElementById('m-objectives').innerText = m.objetivos || "Sin objetivos definidos.";
                
                const imgFrame = document.getElementById('mission-cover-frame');
                const img = document.getElementById('mission-cover-img');
                if(m.imagen) {
                    img.src = getCloudinaryUrl(m.imagen);
                    img.onload = () => { img.style.opacity = '1'; imgFrame.style.display = 'block'; };
                }

                drawnItems.clearLayers();
                if(m.elementos) {
                    m.elementos.forEach(el => {
                        let layer;
                        const colors = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ff0', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f' };
                        const color = colors[el.type] || '#0f0';
                        
                        if(el.path) layer = L.polygon(el.path, {color: color, weight: 2, fillOpacity: 0.15});
                        else if(el.radius) layer = L.circle(el.center, {radius: el.radius, color: color, weight: 2});
                        else layer = L.marker(el.center);
                        
                        if(el.label) layer.bindTooltip(el.label, {permanent: true, direction: 'center', className: 'tactical-label'}).openTooltip();
                        drawnItems.addLayer(layer);
                    });
                    setTimeout(() => { 
                        previewMap.invalidateSize();
                        if(drawnItems.getLayers().length > 0) previewMap.fitBounds(drawnItems.getBounds(), {padding: [10, 10]});
                    }, 500);
                }
            });

            // Sincronizar Operadores y Estado de asistencia
            db.ref('jugadores_enlistados').orderByChild('misionId').equalTo(misionId).on('value', snap => {
                const container = document.getElementById('m-ops');
                const overlay = document.getElementById('map-wait-overlay');
                const mapDiv = document.getElementById('preview-map');
                container.innerHTML = '';
                let enlistado = false;

                snap.forEach(c => {
                    if(c.val().callsign === userCallsign) enlistado = true;
                    container.innerHTML += `<span class="op-tag">${c.val().callsign}</span>`;
                });

                document.getElementById('btn-enlist').style.display = enlistado ? 'none' : 'block';
                document.getElementById('btn-cancel').style.display = enlistado ? 'block' : 'none';
                
                if(enlistado) {
                    mapDiv.classList.add('map-blurred');
                    overlay.style.display = 'flex';
                } else {
                    mapDiv.classList.remove('map-blurred');
                    overlay.style.display = 'none';
                }
            });
        }

        function syncStatus() {
            const uid = auth.currentUser.uid;
            db.ref(`jugadores_enlistados/${uid}`).on('value', snap => {
                const data = snap.val();
                if(data && data.equipo && data.equipo !== 'S/E') {
                    db.ref('estado_partida').once('value', p => {
                        if(p.val()?.activo) {
                            document.getElementById('lock-screen').style.display = 'flex';
                            const teamSpan = document.getElementById('team-name');
                            teamSpan.innerText = data.equipo;
                            teamSpan.style.color = data.equipo === 'RED' ? 'var(--red)' : 'var(--blue)';
                            setTimeout(() => { window.location.href = 'mapa.tactico.html'; }, 2500);
                        }
                    });
                }
            });
        }

        function enlist() {
            db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).set({
                callsign: userCallsign, equipo: 'S/E', misionId: misionId, timestamp: Date.now()
            });
        }

        function cancelEnlist() {
            if(confirm("¿Seguro que deseas abortar el despliegue?")) {
                db.ref(`jugadores_enlistados/${auth.currentUser.uid}`).remove();
            }
        }
    </script>
</body>
</html>
