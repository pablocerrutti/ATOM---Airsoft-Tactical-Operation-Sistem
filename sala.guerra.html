<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - SALA DE GUERRA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --bg-card: rgba(20,20,20,0.9); }
        
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }
        
        /* Panel Superior: Mapa + Imagen */
        .intel-header { display: flex; gap: 10px; height: 180px; margin-bottom: 15px; flex-shrink: 0; }
        
        #intel-map-frame { flex: 1.2; border: 1px solid var(--p); position: relative; background: #000; overflow: hidden; }
        #preview-map { width: 100%; height: 100%; transition: filter 0.5s; }

        #mission-cover-frame { flex: 0.8; border: 1px solid #333; background: #111; position: relative; overflow: hidden; }
        #mission-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: opacity 0.5s; }
        .img-label { position: absolute; bottom: 5px; right: 5px; font-size: 9px; color: #666; }

        /* Estilos de Bloqueo */
        .locked-intel { filter: blur(8px) grayscale(1) brightness(0.3); }
        #map-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: rgba(0,0,0,0.7);
            pointer-events: none; text-align: center; padding: 10px;
        }

        /* Información */
        .info-panel { flex: 1; overflow-y: auto; }
        .block { background: var(--bg-card); border: 1px solid #222; border-left: 4px solid var(--p); padding: 15px; margin-bottom: 12px; }
        .label { color: var(--gold); font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .content { font-family: sans-serif; color: #eee; font-size: 15px; line-height: 1.5; }

        .op-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .op-badge { background: var(--p); color: #000; padding: 3px 8px; font-size: 11px; font-weight: bold; border-radius: 2px; }

        .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
        .btn { padding: 16px; border: 1px solid var(--p); background: transparent; color: var(--p); font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: monospace; font-size: 14px; }
        .btn-ready { background: var(--p); color: #000; font-size: 16px; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .btn-abort { border-color: var(--red); color: var(--red); }

        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }

        #deployment-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            border: 10px solid var(--p); text-align: center;
        }
    </style>
</head>
<body>

    <div id="deployment-screen">
        <h1 class="blink">INSERCIÓN INICIADA</h1>
        <p id="deploy-team" style="font-size: 24px; letter-spacing: 5px; font-weight: bold;"></p>
        <p style="color: #666; font-size: 12px;">ESTABLECIENDO ENLACE TÁCTICO...</p>
    </div>

    <div class="screen">
        <h2 id="mission-title" style="margin:5px 0 15px 0; text-align: center; color: var(--gold); letter-spacing: 2px;">IDENTIFICANDO MISIÓN...</h2>

        <div class="intel-header">
            <div id="intel-map-frame">
                <div id="preview-map" class="locked-intel"></div>
                <div id="map-overlay">
                    <div id="overlay-msg" class="blink" style="font-weight: bold; color: var(--gold);">[ RECONOCIMIENTO REQUERIDO ]</div>
                    <div style="font-size: 10px; color: #888; margin-top: 5px;">CONFIRMA PARA DESBLOQUEAR INTEL</div>
                </div>
            </div>
            
            <div id="mission-cover-frame">
                <img id="mission-img" src="https://via.placeholder.com/400x300?text=CARGANDO..." alt="Misión">
                <div class="img-label">SATELLITE_FEED</div>
            </div>
        </div>

        <div class="info-panel">
            <div class="block">
                <span class="label">Briefing de la Operación</span>
                <div id="m-briefing" class="content">Sincronizando...</div>
            </div>
            <div class="block">
                <span class="label">Objetivos Tácticos</span>
                <div id="m-objectives" class="content">Analizando...</div>
            </div>
            <div class="block">
                <span class="label">Operativos en Zona</span>
                <div id="m-operators" class="op-list"></div>
            </div>
        </div>

        <div class="actions">
            <button id="btn-join" class="btn btn-ready" onclick="registerOp()">CONFIRMAR ASISTENCIA</button>
            <button id="btn-leave" class="btn btn-abort" onclick="unregisterOp()" style="display:none;">ABORTAR DESPLIEGUE</button>
            <button class="btn" onclick="location.href='lobby.html'" style="border-color: #444; color: #888;">VOLVER</button>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "OPERADOR_ANON";

let previewMap, drawnItems, missionId;

window.onload = () => {
    initPreviewMap();
    listenActiveMission();
};

function initPreviewMap() {
    previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(previewMap);
    drawnItems = L.featureGroup().addTo(previewMap);
}

function listenActiveMission() {
    db.ref('operacion_activa/control/missionId').on('value', snap => {
        missionId = snap.val();
        if(missionId) loadMissionData(missionId);
    });

    db.ref('jugadores_enlistados').on('value', snap => {
        const opsContainer = document.getElementById('m-operators');
        opsContainer.innerHTML = '';
        let imEnlisted = false;

        snap.forEach(child => {
            const d = child.val();
            if(d.callsign === myCallsign) imEnlisted = true;
            opsContainer.innerHTML += `<span class="op-badge">${d.callsign}</span>`;
        });
        toggleUI(imEnlisted);
    });
}

function loadMissionData(id) {
    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        if(!m) return;

        document.getElementById('mission-title').innerText = m.nombre.toUpperCase();
        document.getElementById('m-briefing').innerText = m.historia || "Sin descripción de inteligencia.";
        document.getElementById('m-objectives').innerText = m.objetivos || "Sin objetivos primarios.";

        if(m.imagen) {
            const imgEl = document.getElementById('mission-img');
            imgEl.src = m.imagen;
            imgEl.style.opacity = "1";
        }

        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const style = { 
                    color: '#0f0', 
                    weight: 2, 
                    fillOpacity: 0.15, 
                    dashArray: '5, 5' 
                };

                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                
                if(layer) drawnItems.addLayer(layer);
            });

            // Ajuste automático del zoom a la zona de juego
            if(drawnItems.getLayers().length > 0) {
                previewMap.fitBounds(drawnItems.getBounds(), { padding: [20, 20] });
            }
        }
    });
}

function toggleUI(enlisted) {
    const mapEl = document.getElementById('preview-map');
    const overlay = document.getElementById('map-overlay');
    const btnJoin = document.getElementById('btn-join');
    const btnLeave = document.getElementById('btn-leave');

    if(enlisted) {
        mapEl.classList.remove('locked-intel');
        overlay.style.display = 'none';
        btnJoin.style.display = 'none';
        btnLeave.style.display = 'block';
    } else {
        mapEl.classList.add('locked-intel');
        overlay.style.display = 'flex';
        btnJoin.style.display = 'block';
        btnLeave.style.display = 'none';
    }
    // Forzar redibujado para evitar áreas grises en el mapa
    setTimeout(() => previewMap.invalidateSize(), 200);
}

function registerOp() {
    if(!missionId) return alert("HQ AÚN NO HA DESIGNADO UNA MISIÓN");
    
    db.ref(`jugadores_enlistados/${myCallsign}`).set({
        callsign: myCallsign,
        equipo: 'S/E',
        misionId: missionId,
        lat: 0, lng: 0,
        lastSeen: Date.now()
    }).then(() => {
        // Redirección táctica
        location.href = 'mapa_tactico.html';
    }).catch(err => {
        console.error("Error de enlace:", err);
        alert("FALLO EN EL ENLACE CON EL SERVIDOR");
    });
}

function unregisterOp() {
    db.ref(`jugadores_enlistados/${myCallsign}`).remove();
}
</script>
</body>
</html>
