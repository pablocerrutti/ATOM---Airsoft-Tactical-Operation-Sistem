<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Control de Operadores</title>

<style>
:root { --p:#00ff00; --f:#050505; --red:#ff3333; }

body {
 background:var(--f);
 color:var(--p);
 font-family:monospace;
 margin:0;
 padding:10px;
}

h2 { text-align:center; }

.user {
 border-bottom:1px solid #222;
 padding:10px;
 display:flex;
 flex-direction:column;
 margin-bottom:10px;
 background:#000;
}

.row {
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
}

button, select {
 margin-top:5px;
 padding:8px;
 background:#111;
 border:1px solid var(--p);
 color:var(--p);
 cursor:pointer;
}

button:hover {
 background:var(--p);
 color:#000;
}

.danger {
 border-color:var(--red);
 color:var(--red);
}
</style>
</head>

<body>

<h2>CONTROL DE OPERADORES</h2>

<div id="lista"></div>

<button onclick="volver()">VOLVER</button>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyB2P-Zl04sS6R8uKglOpomqzf-D28L8drM",
  authDomain: "atomv2-80e64.firebaseapp.com",
  projectId: "atomv2-80e64",
  storageBucket: "atomv2-80e64.firebasestorage.app",
  messagingSenderId: "602132928481",
  appId: "1:602132928481:web:de8238451dbfb6b02564a0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

// 🔐 PROTECCIÓN TOTAL
auth.onAuthStateChanged(async (user)=>{
 if(!user){
  location.href="login.html";
  return;
 }

 currentUser = user;

 try{
  const snap = await db.ref("usuarios/"+user.uid).once("value");
  const data = snap.val();

  if(!data || data.rol !== "ADMIN"){
   alert("ACCESO DENEGADO");
   location.href="misiones.html";
   return;
  }

  cargarUsuarios();

 }catch(err){
  console.error(err);
  alert("ERROR DE SEGURIDAD");
 }
});

// 📋 LISTADO
function cargarUsuarios(){
 db.ref("usuarios").on("value",snap=>{
  let cont=document.getElementById("lista");
  cont.innerHTML="";

  snap.forEach(s=>{
   let u=s.val();
   let id=s.key;

   cont.innerHTML += `
   <div class="user">
     <div class="row">
       <b>${u.callsign || "SIN CALLSIGN"}</b>
       <span>${u.email || ""}</span>
     </div>

     <div class="row">
       <select onchange="cambiarRol('${id}', this.value)">
         <option value="JUGADOR" ${u.rol==="JUGADOR"?"selected":""}>JUGADOR</option>
         <option value="EDITOR" ${u.rol==="EDITOR"?"selected":""}>EDITOR</option>
         <option value="ADMIN" ${u.rol==="ADMIN"?"selected":""}>ADMIN</option>
       </select>

       <button class="danger" onclick="eliminar('${id}')">ELIMINAR</button>
     </div>
   </div>
   `;
  });
 });
}

// 🎖 CAMBIAR ROL (PROTEGIDO)
function cambiarRol(id,rol){

 if(id === currentUser.uid){
  alert("NO PUEDES CAMBIAR TU PROPIO ROL");
  return;
 }

 if(!confirm("¿Cambiar rol del usuario?")) return;

 db.ref("usuarios/"+id).update({rol:rol})
 .then(()=> alert("ROL ACTUALIZADO"))
 .catch(err=>{
  console.error(err);
  alert("ERROR AL CAMBIAR ROL");
 });
}

// ❌ ELIMINAR (PROTEGIDO)
function eliminar(id){

 if(id === currentUser.uid){
  alert("NO PUEDES ELIMINARTE A TI MISMO");
  return;
 }

 if(!confirm("⚠ ELIMINAR USUARIO DE LA BASE DE DATOS?")) return;

 db.ref("usuarios/"+id).remove()
 .then(()=> alert("USUARIO ELIMINADO"))
 .catch(err=>{
  console.error(err);
  alert("ERROR AL ELIMINAR");
 });
}

// VOLVER
function volver(){
 location.href="admin.html";
}
</script>

</body>
</html>
