<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Registro de Operador</title>

<style>
:root { --p:#00ff00; --f:#050505; --red:#ff3333; }

body {
 background:var(--f);
 color:var(--p);
 font-family:monospace;
 margin:0;
 display:flex;
 align-items:center;
 justify-content:center;
 height:100vh;
 overflow:hidden;
}

/* SCAN EFFECT */
body::before {
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 50%);
 background-size:100% 4px;
 pointer-events:none;
}

/* BOX */
#box {
 border:2px solid var(--p);
 padding:25px;
 width:90%;
 max-width:320px;
 background:#000;
 text-align:center;
 box-shadow:0 0 20px #00ff0033;
}

/* TITLE */
.title {
 font-size:18px;
 letter-spacing:2px;
 margin-bottom:10px;
 animation: glitch 0.5s infinite;
}

/* INPUTS */
input {
 width:100%;
 padding:10px;
 margin-top:10px;
 background:#111;
 border:1px solid var(--p);
 color:var(--p);
 text-align:center;
}

/* BUTTON */
button {
 width:100%;
 margin-top:15px;
 padding:10px;
 background:#111;
 border:1px solid var(--p);
 color:var(--p);
 cursor:pointer;
}

button:hover {
 background:var(--p);
 color:#000;
}

/* STATUS */
#status {
 margin-top:10px;
 font-size:12px;
 height:15px;
}

/* ANIM */
@keyframes glitch {
 0% {transform:translate(0);}
 50% {transform:translate(1px,-1px);}
 100% {transform:translate(0);}
}

/* SCAN LINE */
#scan {
 position:absolute;
 top:0;
 left:0;
 width:100%;
 height:2px;
 background:var(--p);
 animation: scan 3s linear infinite;
 opacity:0.2;
}

@keyframes scan {
 0% {top:0;}
 100% {top:100%;}
}

</style>
</head>

<body>

<div id="scan"></div>

<div id="box">

<div class="title">ALTA DE OPERADOR</div>
<p style="font-size:12px;opacity:0.6;">REGISTRO EN SISTEMA TÁCTICO</p>

<input id="callsign" placeholder="CALLSIGN">
<input id="email" placeholder="EMAIL">
<input id="pass" type="password" placeholder="CLAVE">

<button onclick="registrar()">REGISTRAR</button>

<div id="status"></div>

<button onclick="volver()" style="margin-top:10px;border-color:#444;color:#888;">VOLVER</button>

</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"TU_API_KEY",
 authDomain:"TU_PROJECT.firebaseapp.com",
 databaseURL:"https://TU_PROJECT-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

function setStatus(text,color){
 let s=document.getElementById("status");
 s.innerText=text;
 s.style.color=color;
}

function registrar(){

 let callsign=document.getElementById("callsign").value.trim();
 let email=document.getElementById("email").value.trim();
 let pass=document.getElementById("pass").value.trim();

 if(!callsign || !email || !pass){
  setStatus("COMPLETAR TODOS LOS CAMPOS","orange");
  return;
 }

 if(pass.length < 6){
  setStatus("CLAVE MÍNIMO 6 CARACTERES","orange");
  return;
 }

 setStatus("CREANDO OPERADOR...","var(--p)");

 auth.createUserWithEmailAndPassword(email,pass)
 .then(userCredential=>{

  let uid=userCredential.user.uid;

  return db.ref("usuarios/"+uid).set({
   callsign: callsign.toUpperCase(),
   email: email,
   rol: "JUGADOR",
   fecha: Date.now()
  });

 })
 .then(()=>{
  setStatus("OPERADOR REGISTRADO ✔","#00ff00");

  setTimeout(()=>{
   window.location.href="login.html";
  },1000);
 })
 .catch(err=>{
  setStatus("ERROR: "+err.message,"var(--red)");
 });

}

function volver(){
 window.location.href="index.html";
}

</script>

</body>
</html>
