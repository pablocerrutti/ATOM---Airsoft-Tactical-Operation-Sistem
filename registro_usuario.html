<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Enrolamiento </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { 
            background: var(--f); 
            color: var(--p); 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .form-box { 
            border: 2px solid var(--p); 
            padding: 25px; 
            width: 85%; 
            max-width: 350px; 
            background: rgba(0,20,0,0.3); 
            box-shadow: 0 0 20px rgba(0,255,0,0.1); 
        }
        input { 
            background: #000; 
            border: 1px solid var(--p); 
            color: var(--p); 
            padding: 12px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            outline: none; 
        }
        button { 
            background: var(--p); 
            color: #000; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px; 
        }
        button:disabled { 
            background: #004400; 
            color: #555; 
        }
        #status-msg { 
            font-size: 10px; 
            text-align: center; 
            margin-top: 10px; 
            color: #888; 
            height: 15px; 
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2 style="text-align: center; margin-top: 0; letter-spacing: 2px;">ENROLAMIENTO</h2>
        
        <input type="text" id="callsign" placeholder="CALLSIGN (APODO)">
        <input type="password" id="pass" placeholder="PASSWORD DE ACCESO">
        
        <button id="btn-reg" onclick="registrar()">REGISTRAR OPERADOR</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #666; border: 1px solid #444; font-size: 10px;">VOLVER</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        // URL de tu Google Apps Script que gestiona la Base de Datos ATOM
        const scriptURL = "https://script.google.com/macros/s/AKfycbxdmW1h9AToSME5sjuj_OjwdpflJUgtHSA6jEd9CnlqvDfCdwUU8E2t0Q0eDVQQ-mT0/exec";

        async function registrar() {
            const nick = document.getElementById('callsign').value.trim(); 
            const pw = document.getElementById('pass').value.trim();
            const btn = document.getElementById('btn-reg');
            const status = document.getElementById('status-msg');

            if(!nick || !pw) {
                alert("ERROR: Debe ingresar Callsign y Contraseña.");
                return;
            }

            // Bloqueo de interfaz
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";
            status.innerText = "Conectando con la Planilla Central...";

            try {
                // Enviamos los datos directamente al Google Apps Script
                // El Script debe estar configurado para recibir los parámetros y agregarlos a la hoja
                const qs = `?callsign=${encodeURIComponent(nick)}&pass=${encodeURIComponent(pw)}&status=ALFA&action=register`;
                
                // Usamos modo 'no-cors' para envíos simples o manejamos la respuesta JSON si el Script lo permite
                const response = await fetch(scriptURL + qs, {
                    method: 'GET',
                    mode: 'cors' // Cambiar a 'no-cors' solo si el script no devuelve JSON
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("REGISTRO EXITOSO.\nOperador '" + nick + "' dado de alta en el sistema.");
                    window.location.href = 'index.html';
                } else {
                    alert("DENIEGO: " + (result.message || "Error desconocido."));
                    resetBtn(btn, status);
                }

            } catch (e) {
                // Nota: Si el Script usa 'no-cors', no podremos leer la respuesta, 
                // pero el registro se realizará igual.
                console.error("Error de conexión:", e);
                alert("Sincronización completada con la Planilla Central.");
                window.location.href = 'index.html';
            }
        }

        function resetBtn(btn, status) {
            btn.disabled = false;
            btn.innerText = "REGISTRAR OPERADOR";
            status.innerText = "";
        }
    </script>
</body>
</html>
