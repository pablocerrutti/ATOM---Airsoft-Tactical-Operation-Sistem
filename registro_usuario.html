<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Enrolamiento </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { 
            background: var(--f); 
            color: var(--p); 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .form-box { 
            border: 2px solid var(--p); 
            padding: 25px; 
            width: 85%; 
            max-width: 350px; 
            background: rgba(0,20,0,0.3); 
            box-shadow: 0 0 20px rgba(0,255,0,0.1); 
        }
        input { 
            background: #000; 
            border: 1px solid var(--p); 
            color: var(--p); 
            padding: 12px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            outline: none; 
        }
        button { 
            background: var(--p); 
            color: #000; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px; 
        }
        button:disabled { 
            background: #004400; 
            color: #555; 
        }
        #status-msg { 
            font-size: 10px; 
            text-align: center; 
            margin-top: 10px; 
            color: #888; 
            height: 15px; 
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2 style="text-align: center; margin-top: 0; letter-spacing: 2px;">ENROLAMIENTO</h2>
        
        <input type="text" id="callsign" placeholder="CALLSIGN (APODO)">
        <input type="password" id="pass" placeholder="PASSWORD DE ACCESO">
        
        <button id="btn-reg" onclick="registrar()">REGISTRAR OPERADOR</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #666; border: 1px solid #444; font-size: 10px;">VOLVER</button>
        
        <div id="status-msg"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // URL de tu Google Apps Script (Actualizada)
        const scriptURL = "https://script.google.com/macros/s/AKfycbxdmW1h9AToSME5sjuj_OjwdpflJUgtHSA6jEd9CnlqvDfCdwUU8E2t0Q0eDVQQ-mT0/exec";

        function registrar() {
            // Captura de datos respetando minúsculas y mayúsculas
            const nick = document.getElementById('callsign').value.trim(); 
            const pw = document.getElementById('pass').value.trim();
            const btn = document.getElementById('btn-reg');
            const status = document.getElementById('status-msg');

            // Validación de campos vacíos
            if(!nick || !pw) {
                alert("ERROR: Debe ingresar Callsign y Contraseña.");
                return;
            }

            // Bloqueo de interfaz durante el proceso
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";
            status.innerText = "Sincronizando identidad con el sistema...";

            // 1. VALIDACIÓN EN FIREBASE (Verifica si el apodo ya existe con ese formato exacto)
            db.ref('users').orderByChild('callsign').equalTo(nick).once('value', snap => {
                if(snap.exists()) {
                    alert("DENIEGO: El apodo '" + nick + "' ya está registrado.");
                    btn.disabled = false;
                    btn.innerText = "REGISTRAR OPERADOR";
                    status.innerText = "";
                } else {
                    const userData = {
                        callsign: nick,
                        pass: pw,
                        status: "ALFA"
                    };

                    // 2. GUARDAR EN FIREBASE (Base de datos en tiempo real)
                    db.ref('users').push(userData).then(() => {
                        status.innerText = "Actualizando Planilla Central...";
                        
                        // 3. ENVIAR A GOOGLE SHEETS via GET (Más compatible con CORS)
                        const qs = `?callsign=${encodeURIComponent(nick)}&pass=${encodeURIComponent(pw)}&status=ALFA`;
                        
                        fetch(scriptURL + qs, {
                            method: 'GET',
                            mode: 'no-cors'
                        }).then(() => {
                            alert("REGISTRO EXITOSO.\nOperador '" + nick + "' dado de alta.");
                            window.location.href = 'index.html';
                        }).catch(e => {
                            console.error("Error en Google Sheets:", e);
                            alert("Registrado en Firebase, pero hubo un fallo en la Planilla.");
                            window.location.href = 'index.html';
                        });

                    }).catch(err => {
                        alert("Error crítico de sistema: " + err.message);
                        btn.disabled = false;
                        btn.innerText = "REGISTRAR OPERADOR";
                    });
                }
            });
        }
    </script>
</body>
</html>
