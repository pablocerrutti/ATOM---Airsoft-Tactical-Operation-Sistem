<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #050505; }
        body { background: var(--f); color: var(--p); font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .form-box { border: 2px solid var(--p); padding: 25px; width: 85%; max-width: 350px; background: rgba(0,20,0,0.3); }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; outline: none; }
        button { background: var(--p); color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="text-align: center; margin-top: 0;">ENROLAMIENTO</h2>
        <input type="text" id="callsign" placeholder="CALLSIGN (APODO)">
        <input type="password" id="pass" placeholder="PASSWORD DE ACCESO">
        <button onclick="registrar()">REGISTRAR OPERADOR</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; color: #666; border: 1px solid #444; font-size: 10px;">VOLVER</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script>
        // Configuración corregida
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec",
            measurementId: "G-3X2C87MPPV"
        };

        // Inicialización
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function registrar() {
            const nick = document.getElementById('callsign').value.trim().toUpperCase();
            const pw = document.getElementById('pass').value;

            if(!nick || !pw) {
                alert("COMPLETE LOS CAMPOS");
                return;
            }

            console.log("Intentando registrar a:", nick); // Para que veas en consola (F12)

            // VALIDACIÓN DE DUPLICADOS
            db.ref('users').orderByChild('callsign').equalTo(nick).once('value', snap => {
                if(snap.exists()) {
                    alert("Usuario Existente");
                } else {
                    db.ref('users').push({
                        callsign: nick,
                        pass: pw,
                        team: "sin asignar",
                        status: "ALFA"
                    }).then(() => {
                        alert("Registro Exitoso. Bienvenido al sistema A.T.O.M.");
                        window.location.href = 'index.html';
                    }).catch(err => {
                        alert("Error de Firebase: " + err.message);
                    });
                }
            });
        }
    </script>
</body>
</html>
