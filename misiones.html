<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Operativo de Campo</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff4444; --blue:#4444ff; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; flex-direction: column; }
        
        /* HUD Superior */
        #hud-top { width: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--p); }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #map { flex:1; }

        /* Panel Lateral */
        #side-menu { width: 260px; background: rgba(0,0,0,0.95); border-right: 2px solid var(--p); display: flex; flex-direction: column; padding: 15px; overflow-y: auto; box-sizing: border-box; transition: 0.3s; }
        
        /* Selector Minimalista (Solo Flecha) */
        .mission-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        #mission-selector { background: #111; color: var(--p); border: 1px solid var(--p); padding: 10px; flex: 1; cursor: pointer; appearance: none; text-align: center; }
        .arrow-icon { color: var(--p); font-size: 1.2rem; }

        /* Desplegables */
        .collapsible { background: #111; cursor: pointer; padding: 12px; width: 100%; border: 1px solid var(--p); color: var(--p); text-align: left; margin-top: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .content { display: none; flex-direction: column; background: rgba(0,255,0,0.05); padding: 5px; border: 1px solid #222; border-top: none; }
        .active + .content { display: flex; }

        button { width:100%; padding:12px; margin-top:8px; background:#000; color:var(--p); border:1px solid var(--p); font-weight: bold; cursor: pointer; font-family: inherit; }
        button:disabled { opacity: 0.3; border-color: #333; }
        
        .btn-enlist { background: #003300; border-color: #00ff00; display: none; }
        .btn-leave { background: #200; border-color: #f44; color: #f44; display: none; margin-top: 15px; }
        
        #mission-timer { font-size: 1.5rem; text-shadow: 0 0 5px var(--p); }
    </style>
</head>
<body>

<div id="hud-top">
    <div style="color:var(--red)">R: <span id="kill-red">0</span></div>
    <div id="mission-timer">00:00:00</div>
    <div style="color:var(--blue)">A: <span id="kill-blue">0</span></div>
</div>

<div class="main-container">
    <div id="side-menu">
        <h3 id="user-callsign">...</h3>
        
        <div class="mission-nav">
            <span class="arrow-icon">▼</span>
            <select id="mission-selector" onchange="syncMission(this.value)">
                <option value="">SELECCIONAR OP.</option>
            </select>
        </div>

        <button id="btn-enlist" class="btn-enlist" onclick="enlistPlayer()">📝 ENLISTARSE</button>

        <button class="collapsible" onclick="this.classList.toggle('active')">SISTEMAS TÁCTICOS <span>+</span></button>
        <div class="content">
            <button id="ptt-btn" disabled>🎤 PTT EQUIPO</button>
            <button id="med-btn" onclick="requestMedic()" disabled>🚑 MÉDICO (<span id="med-count">0</span>/2)</button>
            <button id="enemy-btn" onclick="markEnemy()" disabled style="color:var(--red)">⚠ AVISTAMIENTO</button>
        </div>

        <div id="obj-status" style="margin-top:15px; border-top:1px solid #333; padding-top:10px; font-size: 0.8rem;">
            <div id="obj-list">Seleccione una misión para cargar cartografía...</div>
        </div>

        <button class="btn-leave" id="btn-leave" onclick="leaveMatch()">🏳 ABANDONAR</button>
        <button style="margin-top:auto; border-color:#555; color:#888;" onclick="logout()">✖ SALIR</button>
    </div>

    <div id="map"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

<script>
const fbConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(fbConfig);
const db = firebase.database();
const auth = firebase.auth();

let map, missionId, myUID, myCallsign, myTeam = null;
let activeOverlays = [];

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.5, lng:-56.2},
        zoom: 15,
        mapTypeId: "satellite",
        disableDefaultUI: true
    });
}

auth.onAuthStateChanged(user => {
    if (user) {
        myUID = user.uid;
        db.ref(`usuarios/${user.uid}`).once('value', snap => {
            myCallsign = snap.val()?.callsign || "Operador";
            document.getElementById('user-callsign').innerText = myCallsign;
        });
        loadMissions();
    } else { location.href = "login.html"; }
});

function syncMission(id) {
    if(!id) return;
    missionId = id;
    
    db.ref(`operaciones/${id}`).on('value', snap => {
        const data = snap.val();
        if(!data) return;

        // 1. Posicionar cámara según el editor
        if(data.center) {
            map.setCenter(data.center);
            map.setZoom(data.zoom || 15);
        }

        // 2. Renderizar polígonos y marcas exactamente como el editor
        renderTacticalElements(data.elements);
        
        // 3. Control de botones de enlistamiento
        checkEnlistmentStatus();
        
        if(data.startTime) startClock(data.startTime);
    });
}

function renderTacticalElements(elements) {
    activeOverlays.forEach(o => o.setMap(null));
    activeOverlays = [];
    const list = document.getElementById('obj-list');
    list.innerHTML = "<strong>INTELIGENCIA DE CAMPO:</strong><br>";

    if(!elements) return;

    Object.values(elements).forEach(e => {
        let overlay;
        const color = e.type === 'GAME_ZONE' ? '#00ff00' : e.type.includes('RED') ? '#ff4444' : '#4444ff';

        if (e.path) { // Polígonos de Zona
            overlay = new google.maps.Polygon({
                paths: e.path,
                fillColor: color,
                fillOpacity: 0.2,
                strokeColor: color,
                strokeWeight: 2,
                map: map
            });
        } else if (e.radius) { // Círculos de Respawn
            overlay = new google.maps.Circle({
                center: e.center,
                radius: e.radius,
                fillColor: color,
                fillOpacity: 0.4,
                strokeColor: color,
                strokeWeight: 1,
                map: map
            });
        } else if (e.pos) { // Marcadores de Objetivo
            overlay = new google.maps.Marker({
                position: e.pos,
                icon: 'http://maps.google.com/mapfiles/ms/icons/grey-dot.png',
                map: map
            });
            list.innerHTML += `<div>🔘 Objetivo Detectado</div>`;
        }
        if(overlay) activeOverlays.push(overlay);
    });
}

function checkEnlistmentStatus() {
    db.ref(`operaciones/${missionId}/participantes/${myUID}`).once('value', snap => {
        const p = snap.val();
        if(p) {
            document.getElementById('btn-enlist').style.display = 'none';
            document.getElementById('btn-leave').style.display = 'block';
            if(p.team && p.team !== "PENDIENTE") enableCombatReady(p.team);
        } else {
            document.getElementById('btn-enlist').style.display = 'block';
            document.getElementById('btn-leave').style.display = 'none';
        }
    });
}

function enableCombatReady(team) {
    myTeam = team;
    const btns = ['ptt-btn', 'med-btn', 'enemy-btn'];
    btns.forEach(id => document.getElementById(id).disabled = false);
}

function enlistPlayer() {
    db.ref(`operaciones/${missionId}/participantes/${myUID}`).set({
        callsign: myCallsign,
        team: "PENDIENTE",
        status: "ACTIVO"
    });
}

function leaveMatch() {
    if(confirm("¿CONFIRMAR RETIRADA?")) {
        db.ref(`operaciones/${missionId}/participantes/${myUID}`).remove();
        location.reload();
    }
}

function loadMissions() {
    db.ref("operaciones").on("value", snap => {
        const sel = document.getElementById("mission-selector");
        sel.innerHTML = '<option value="">▼ SELECCIONAR</option>';
        snap.forEach(c => { sel.innerHTML += `<option value="${c.key}">${c.val().nombre}</option>`; });
    });
}

function startClock(start) {
    setInterval(() => {
        const d = Date.now() - start;
        document.getElementById('mission-timer').innerText = new Date(d).toISOString().substr(11, 8);
    }, 1000);
}

function logout() { auth.signOut().then(() => location.href = "login.html"); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>
</body>
</html>
