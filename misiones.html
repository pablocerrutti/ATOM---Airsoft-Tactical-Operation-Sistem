<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Operaciones Tácticas</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 height:100vh;
 overflow:hidden;
}

/* MAPA */
#map {
 height:100vh;
 width:100%;
}

/* HUD */
#hud {
 position:fixed;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 18px;
 border:1px solid var(--p);
 z-index:1000;
}

/* MENU */
#menu {
 position:fixed;
 right:0;
 top:0;
 width:260px;
 height:100%;
 background:#050505;
 border-left:2px solid var(--p);
 padding:10px;
 overflow:auto;
 z-index:1000;
}

/* BOTONES */
button, input, select {
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

.chat {
 height:150px;
 overflow:auto;
 border:1px solid #333;
 margin-top:10px;
 font-size:12px;
 padding:5px;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="hud">A.T.O.M ACTIVE</div>

<div id="menu">
<h3>COMANDO</h3>
<div id="info"></div>

<input id="msg" placeholder="mensaje">
<button onclick="enviarMsg()">ENVIAR</button>

<div class="chat" id="chat"></div>
<button onclick="logout()">SALIR</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.appspot.com",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* STATE */
let user = null;
let map;
let mode = null;
let currentMission = null;
let shapes = [];

/* ================= MAPA ================= */
window.initMap = function () {

 map = new google.maps.Map(document.getElementById("map"), {
  center: { lat: -34.9, lng: -56.2 },
  zoom: 15,
  mapTypeId: "satellite"
 });

 map.addListener("click", (e) => {

  if (!mode) return;

  const point = {
   type: mode,
   lat: e.latLng.lat(),
   lng: e.latLng.lng()
  };

  shapes.push(point);

  new google.maps.Marker({
   position: e.latLng,
   map: map
  });

 });

};

/* ================= AUTH ================= */
auth.onAuthStateChanged(async u => {
 if (!u) return location.href = "login.html";

 const snap = await db.ref("usuarios/" + u.uid).once("value");
 const data = snap.val();

 if (!data) {
  auth.signOut();
  return;
 }

 user = {
  id: u.uid,
  callsign: data.callsign,
  rol: data.rol
 };

 document.getElementById("info").innerText = user.callsign;

};

/* ================= MODOS ================= */
function setMode(m) {
 mode = m;
}

/* ================= GUARDAR MISIÓN ================= */
function guardar() {

 const nombre = prompt("Nombre misión:");
 if (!nombre) return;

 db.ref("operaciones").push().set({
  nombre,
  zonas: shapes,
  estado: { activo: false },
  modo: "DOMINIO"
 });

 alert("Misión guardada");
}

/* ================= NUEVA ================= */
function nueva() {
 shapes = [];
 alert("Editor reiniciado");
}

/* ================= CHAT ================= */
function enviarMsg() {

 const msg = document.getElementById("msg").value;
 if (!msg) return;

 db.ref("chat").push({
  user: user.callsign,
  msg
 });

 document.getElementById("msg").value = "";
}

db.ref("chat").on("child_added", snap => {
 const c = snap.val();
 document.getElementById("chat").innerHTML +=
 `<div><b>${c.user}:</b> ${c.msg}</div>`;
});

/* ================= LOGOUT ================= */
function logout() {
 auth.signOut().then(() => location.href = "login.html");
}
</script>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
