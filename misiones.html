<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Campo de Operaciones</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body{
 margin:0;
 font-family:monospace;
 background:var(--f);
 color:var(--p);
 overflow:hidden;
}

/* MAPA */
#map{
 height:100vh;
 width:100%;
}

/* HUD */
#hud{
 position:fixed;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 15px;
 border:1px solid var(--p);
 z-index:1000;
}

/* MENU */
#menu{
 position:fixed;
 right:0;
 top:0;
 width:260px;
 height:100%;
 background:#050505;
 border-left:2px solid var(--p);
 padding:10px;
 overflow:auto;
 z-index:1000;
}

/* BOTONES */
button, input{
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

/* CHAT */
.chat{
 height:150px;
 overflow:auto;
 border:1px solid #333;
 margin-top:10px;
 font-size:12px;
 padding:5px;
}

/* ALERTA */
#alerta{
 position:fixed;
 top:60px;
 left:50%;
 transform:translateX(-50%);
 background:red;
 color:#fff;
 padding:8px 12px;
 display:none;
 z-index:2000;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">
⏱ <span id="timer">00:00</span> |
🔴 <span id="rKills">0</span> |
🔵 <span id="aKills">0</span>
</div>

<div id="alerta"></div>

<button id="ptt">🎤 EQUIPO</button>

<div id="menu">
<h3>OPERACIÓN</h3>
<div id="info"></div>

<input id="msg" placeholder="mensaje equipo">
<button onclick="sendMsg()">ENVIAR</button>

<div class="chat" id="chat"></div>
<button onclick="logout()">SALIR</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let map;
let missionId=null;
let team=null;
let killsR=0;
let killsA=0;
let startTime=null;
let inZone=true;

/* MAP */
window.initMap=function(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.9,lng:-56.2},
  zoom:15,
  mapTypeId:"satellite"
 });
};

/* LOGIN */
auth.onAuthStateChanged(async u=>{
 if(!u) return location.href="login.html";

 const snap=await db.ref("usuarios/"+u.uid).once("value");
 const d=snap.val();
 if(!d) return auth.signOut();

 user={id:u.uid,callsign:d.callsign};

 document.getElementById("info").innerText=user.callsign;

 const ins=await db.ref("inscripciones")
 .orderByChild("uid").equalTo(u.uid).once("value");

 ins.forEach(s=>{
  missionId=s.val().mision;
  team=s.val().equipo;
 });

 listenMission();
 listenChat();
 listenObjectives();
});

/* MISION */
function listenMission(){
 db.ref("operaciones/"+missionId+"/estado")
 .on("value",snap=>{
  const st=snap.val();
  if(!st || !st.activo) return;

  startTime=st.startTime;
  setInterval(updateTimer,1000);
 });
}

/* TIMER */
function updateTimer(){
 if(!startTime) return;
 let t=Math.floor((Date.now()-startTime)/1000);
 let m=Math.floor(t/60);
 let s=t%60;
 document.getElementById("timer")
 .innerText=`${m}:${s.toString().padStart(2,"0")}`;
}

/* CHAT */
function sendMsg(){
 let msg=document.getElementById("msg").value;
 if(!msg) return;

 db.ref("chat").push({
  user:user.callsign,
  team:team,
  msg
 });

 document.getElementById("msg").value="";
}

function listenChat(){
 db.ref("chat").on("child_added",s=>{
  let c=s.val();
  if(c.team!==team) return;

  document.getElementById("chat").innerHTML+=
  `<div><b>${c.user}:</b> ${c.msg}</div>`;
 });
}

/* OBJETIVOS */
function listenObjectives(){
 db.ref("objetivos").on("value",snap=>{
  snap.forEach(s=>{
   let o=s.val();

   if(o.mision!==missionId) return;

   let color="#ffff00";
   if(o.estado==="ROJO") color="red";
   if(o.estado==="AZUL") color="blue";

   new google.maps.Circle({
    strokeColor:color,
    fillColor:color,
    fillOpacity:0.3,
    map:map,
    center:{lat:o.lat,lng:o.lng},
    radius:20
   });
  });
});

/* BAJAS SIMULADAS */
function kill(teamX){
 if(teamX==="ROJO") killsR++;
 if(teamX==="AZUL") killsA++;

 document.getElementById("rKills").innerText=killsR;
 document.getElementById("aKills").innerText=killsA;
}

/* ALERTA ZONA */
function showAlert(msg){
 let a=document.getElementById("alerta");
 a.innerText=msg;
 a.style.display="block";
 setTimeout(()=>a.style.display="none",3000);
}

/* LOGOUT */
function logout(){
 auth.signOut().then(()=>location.href="login.html");
}
</script>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
