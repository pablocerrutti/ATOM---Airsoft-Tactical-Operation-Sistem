<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M. - Operación</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body { margin:0; font-family: monospace; background:var(--f); color:var(--p); }

#map { height:100vh; width:100%; }

/* HUD */
#hud {
 position:fixed;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 18px;
 border:1px solid var(--p);
 z-index:1000;
}

/* MENÚ */
#menu {
 position:fixed;
 right:0;
 top:0;
 width:260px;
 height:100%;
 background:#050505;
 border-left:2px solid var(--p);
 padding:10px;
 overflow:auto;
 z-index:1000;
}

/* BOTÓN PTT */
#ptt {
 position: fixed;
 bottom: 20px;
 left: 50%;
 transform: translateX(-50%);
 width: 120px;
 height: 120px;
 border-radius: 50%;
 background: #000;
 border: 3px solid #00ff00;
 color: #00ff00;
 font-size: 16px;
 z-index: 2000;
 box-shadow: 0 0 20px #00ff00;
}
#ptt.active {
 background:#00ff00;
 color:#000;
}

/* CHAT */
.chat {
 height:150px;
 overflow:auto;
 border:1px solid #333;
 margin-top:10px;
 font-size:12px;
 padding:5px;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="hud">00:00:00</div>

<button id="ptt">🎤 RADIO</button>

<div id="menu">
<h3>COMANDO</h3>
<div id="info"></div>

<input id="msg" placeholder="mensaje">
<button onclick="enviarMsg()">ENVIAR</button>

<div class="chat" id="chat"></div>
<button onclick="logout()">SALIR</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"TU_API_KEY",
 databaseURL:"TU_DB_URL"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* ====== VARIABLES ====== */
let user=null;
let currentMisionId=null;
let localStream, micTrack;
let peers={};

const rtcConfig = {
 iceServers:[{urls:"stun:stun.l.google.com:19302"}]
};

/* ====== LOGIN SEGURO ====== */
auth.onAuthStateChanged(async u=>{
 if(!u){ location.href="login.html"; return; }

 const snap = await db.ref("usuarios/"+u.uid).once("value");
 const data = snap.val();

 user = {
  id:u.uid,
  callsign:data.callsign,
  rol:data.rol
 };

 document.getElementById("info").innerText=user.callsign;

 await iniciarAudio();
 obtenerEquipo();
});

/* ====== AUDIO ====== */
async function iniciarAudio(){
 localStream = await navigator.mediaDevices.getUserMedia({audio:true});
 micTrack = localStream.getAudioTracks()[0];
 micTrack.enabled=false;
}

/* ====== EQUIPO ====== */
function obtenerEquipo(){
 db.ref("inscripciones").orderByChild("uid").equalTo(user.id).once("value",snap=>{
  snap.forEach(s=>{
   let ins=s.val();
   currentMisionId=ins.mision;
   user.equipo=ins.equipo;

   registrarRadio();
  });
 });
}

/* ====== REGISTRO RADIO ====== */
function registrarRadio(){
 const path=`webrtc/${currentMisionId}/${user.equipo}/${user.id}`;

 db.ref(path).set({online:true});

 escucharRadio();
}

/* ====== RADIO ====== */
function escucharRadio(){

 const base=`webrtc/${currentMisionId}/${user.equipo}`;

 db.ref(base).on("child_added",snap=>{
  const id=snap.key;
  if(id===user.id) return;

  if(!peers[id]){
   crearPeer(id,true);
  }
 });

}

/* ====== CREAR PEER ====== */
function crearPeer(id,offer){

 const pc=new RTCPeerConnection(rtcConfig);

 pc.ontrack=e=>{
  let audio=new Audio();
  audio.srcObject=e.streams[0];
  audio.play();
 };

 pc.onicecandidate=e=>{
  if(e.candidate){
   db.ref(`webrtc/${currentMisionId}/${user.equipo}/${id}/ice`)
   .push(JSON.stringify(e.candidate));
  }
 };

 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

 peers[id]=pc;

 if(offer){
  pc.createOffer().then(o=>{
   pc.setLocalDescription(o);

   db.ref(`webrtc/${currentMisionId}/${user.equipo}/${id}/offer`)
   .set(JSON.stringify(o));
  });
 }

 escucharPeer(id);
}

/* ====== ESCUCHAR PEER ====== */
function escucharPeer(id){

 const ref=db.ref(`webrtc/${currentMisionId}/${user.equipo}/${id}`);

 ref.on("value",snap=>{
  const data=snap.val();
  const pc=peers[id];

  if(data?.offer && !pc.currentRemoteDescription){
   pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));

   pc.createAnswer().then(a=>{
    pc.setLocalDescription(a);

    ref.child("answer").set(JSON.stringify(a));
   });
  }

  if(data?.answer){
   pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));
  }
 });

 ref.child("ice").on("child_added",c=>{
  const pc=peers[id];
  pc.addIceCandidate(new RTCIceCandidate(JSON.parse(c.val())));
 });
}

/* ====== PTT ====== */
const ptt=document.getElementById("ptt");

ptt.onmousedown=()=>{
 if(!micTrack) return;
 micTrack.enabled=true;
 ptt.classList.add("active");
};

ptt.onmouseup=()=>{
 if(!micTrack) return;
 micTrack.enabled=false;
 ptt.classList.remove("active");
};

ptt.ontouchstart=e=>{
 e.preventDefault();
 micTrack.enabled=true;
 ptt.classList.add("active");
};

ptt.ontouchend=()=>{
 micTrack.enabled=false;
 ptt.classList.remove("active");
};

/* ====== CHAT ====== */
function enviarMsg(){
 let msg=document.getElementById("msg").value;
 if(!msg) return;

 db.ref("chat").push({user:user.callsign,msg});
 document.getElementById("msg").value="";
}

db.ref("chat").on("child_added",snap=>{
 let c=snap.val();
 document.getElementById("chat").innerHTML+=`<div><b>${c.user}:</b> ${c.msg}</div>`;
});

/* ====== LOGOUT ====== */
function logout(){
 auth.signOut().then(()=>{
  location.href="login.html";
 });
}
</script>

</body>
</html>
