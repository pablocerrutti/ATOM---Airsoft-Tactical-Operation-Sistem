<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Campo de Operaciones</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body{
 margin:0;
 font-family:monospace;
 background:var(--f);
 color:var(--p);
 overflow:hidden;
}

#map{height:100vh;width:100%;}

#hud{
 position:fixed;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 15px;
 border:1px solid var(--p);
 z-index:1000;
}

#menu{
 position:fixed;
 right:0;
 top:0;
 width:260px;
 height:100%;
 background:#050505;
 border-left:2px solid var(--p);
 padding:10px;
 overflow:auto;
 z-index:1000;
}

button,input{
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

.chat{
 height:140px;
 overflow:auto;
 border:1px solid #333;
 margin-top:10px;
 font-size:12px;
 padding:5px;
}

.team{
 font-size:12px;
 margin-top:10px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">
⏱ <span id="timer">00:00</span> |
📡 <span id="team">-</span>
</div>

<div id="menu">
<h3>OPERACIÓN</h3>
<div id="info"></div>

<div class="team" id="teamInfo"></div>

<input id="msg" placeholder="mensaje equipo">
<button onclick="sendMsg()">ENVIAR</button>

<div class="chat" id="chat"></div>

<button onclick="logout()">SALIR</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let map;
let missionId=null;
let team=null;
let escuadron=null;
let startTime=0;

/* MAP */
window.initMap=function(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.9,lng:-56.2},
  zoom:15,
  mapTypeId:"satellite"
 });
};

/* AUTH */
auth.onAuthStateChanged(async u=>{
 if(!u) return location.href="login.html";

 const snap=await db.ref("usuarios/"+u.uid).once("value");
 const d=snap.val();

 user={id:u.uid,callsign:d.callsign};

 document.getElementById("info").innerText=user.callsign;

 // buscar inscripción
 const ins=await db.ref("inscripciones")
 .orderByChild("uid").equalTo(u.uid).once("value");

 ins.forEach(s=>{
  const data=s.val();
  missionId=data.mision;
  team=data.equipo;
  escuadron=data.escuadron;
 });

 document.getElementById("teamInfo").innerHTML=
 `Equipo: ${team}<br>Escuadrón: ${escuadron}`;

 listenMission();
 listenChat();
});

/* MISION */
function listenMission(){
 db.ref("operaciones/"+missionId+"/estado")
 .on("value",snap=>{
  const st=snap.val();
  if(!st || !st.activo) return;

  startTime=st.startTime || Date.now();
  setInterval(updateTimer,1000);
 });
}

/* TIMER */
function updateTimer(){
 let t=Math.floor((Date.now()-startTime)/1000);
 let m=Math.floor(t/60);
 let s=t%60;
 document.getElementById("timer").innerText=
 `${m}:${s.toString().padStart(2,"0")}`;
}

/* CHAT SOLO EQUIPO */
function sendMsg(){
 let msg=document.getElementById("msg").value;
 if(!msg) return;

 db.ref("chat").push({
  user:user.callsign,
  team:team,
  msg
 });

 document.getElementById("msg").value="";
}

function listenChat(){
 db.ref("chat").on("child_added",s=>{
  const c=s.val();
  if(c.team!==team) return;

  document.getElementById("chat").innerHTML+=
  `<div><b>${c.user}:</b> ${c.msg}</div>`;
 });
}

/* LOGOUT */
function logout(){
 auth.signOut().then(()=>location.href="login.html");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
