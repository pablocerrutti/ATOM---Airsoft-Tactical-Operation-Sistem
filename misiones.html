<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Panel de Operador</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --grey:#555; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        #panel { width:300px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; z-index:10; }
        #map { flex:1; }
        .menu-content { padding:10px; display:flex; flex-direction:column; gap: 8px; overflow-y: auto; }
        
        /* Bloqueo de herramientas hasta que la misión inicie */
        .locked { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        
        button { width:100%; padding:12px; background:#111; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; }
        .btn-medico { background: #600; color: white; border-color: var(--red); font-size: 1.2rem; height: 60px; }
        .btn-enemy { background: #330000; color: var(--red); }
        .status-box { border: 1px solid var(--p); padding: 10px; font-size: 0.9rem; background: #080808; }
        .timer-display { font-size: 22px; text-align: center; color: var(--gold); border: 1px solid var(--gold); padding: 5px; }
        
        #respawn-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0.8); z-index:100; flex-direction:column; align-items:center; justify-content:center; color:white; text-align:center; }
        
        .waiting-room { padding: 20px; text-align: center; background: #111; border: 1px solid var(--gold); color: var(--gold); margin: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="respawn-overlay">
    <h1>🚨 ELIMINADO 🚨</h1>
    <p>MAPA BLOQUEADO - DIRÍGETE AL RESPAWN</p>
    <button onclick="resetRespawn()" style="width:200px; background:white; color:red;">RE-GENERAR (MEDIC)</button>
</div>

<div id="panel">
    <div style="padding:15px; border-bottom:2px solid var(--p)">
        <h3 style="margin:0 0 10px 0;">A.T.O.M OPS</h3>
        
        <p style="font-size:10px; margin:0;">OPERACIÓN DISPONIBLE:</p>
        <select id="mission-selector" onchange="requestEnlist(this.value)">
            <option value="">-- SELECCIONAR --</option>
        </select>
        
        <div id="status-tag" style="margin-top:10px; font-size:12px; color:var(--gold)">ESTADO: SIN ASIGNAR</div>
    </div>

    <!-- AREA DE ESPERA: Visible cuando el jugador se enlistó pero la misión no arrancó -->
    <div id="waiting-area" class="waiting-room" style="display:none;">
        ESPERANDO ASIGNACIÓN DE EQUIPO Y DESPLIEGUE DEL ADMIN...
    </div>

    <!-- HERRAMIENTAS TÁCTICAS: Se activan con 'locked' toggler -->
    <div id="tactical-tools" class="menu-content locked">
        <div id="timer" class="timer-display">00:00:00</div>
        
        <div class="status-box">
            EQUIPO: <span id="my-team-label">---</span><br>
            Bajas RED: <span id="deaths-red">0</span> | BLUE: <span id="deaths-blue">0</span>
        </div>

        <button onclick="reportEnemy()" class="btn-enemy">⚠️ AVISTAMIENTO ENEMIGO</button>
        <button id="btn-medico" class="btn-medico" onclick="useMedic()">💉 SOLICITAR MÉDICO</button>

        <div style="border:1px solid #333; padding:5px;">
            <p style="margin:0 0 5px 0; font-size:10px;">COMMS (PTT)</p>
            <button onmousedown="startVoice()" onmouseup="stopVoice()" style="background:#222;">🎤 RADIO</button>
        </div>
    </div>

    <button style="margin-top:auto; background:#222;" onclick="location.href='hub2.html'">🔙 SALIR AL MENU</button>
</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// CALLSIGN DEL JUGADOR (Podría venir de un login o prompt)
const CALLSIGN = "PABLO"; 

let map, currentMissionId = null, myTeam = null;
let teamMarkers = {}, missionOverlays = [];
let watchId = null;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71},
        zoom: 17,
        mapTypeId: "satellite",
        disableDefaultUI: true
    });
    loadMissions();
}

function loadMissions() {
    db.ref("operaciones").on("value", s => {
        const sel = document.getElementById("mission-selector");
        sel.innerHTML = '<option value="">-- SELECCIONAR --</option>';
        s.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

// 1. SOLICITAR ENLISTAMIENTO
function requestEnlist(id) {
    if(!id) return;
    currentMissionId = id;
    
    // El jugador se registra para que el Admin lo vea
    db.ref(`operaciones/${id}/players/${CALLSIGN}`).update({
        callsign: CALLSIGN,
        requestTime: Date.now(),
        team: "PENDING", // El admin lo cambiará a RED o BLUE
        status: "WAITING"
    });

    document.getElementById('status-tag').innerText = "ESTADO: EN ESPERA";
    document.getElementById('waiting-area').style.display = "block";
    
    // Escuchar cambios en mi perfil (Asignación de equipo por Admin)
    db.ref(`operaciones/${id}/players/${CALLSIGN}`).on('value', snap => {
        const pData = snap.val();
        if(pData && pData.team !== "PENDING") {
            myTeam = pData.team;
            document.getElementById('my-team-label').innerText = myTeam;
            document.getElementById('my-team-label').style.color = (myTeam === 'RED' ? '#ff3333' : '#3333ff');
            startTracking();
        }
    });

    // Escuchar el estado de la misión (Lanzamiento por Admin)
    db.ref(`operaciones/${id}`).on('value', snap => {
        const mission = snap.val();
        if(!mission) return;

        // Renderizar elementos del mapa (Zonas, Respawns, etc)
        renderMissionElements(mission.elements);

        // Si la misión está ACTIVA, desbloqueamos herramientas
        if(mission.estado === "ACTIVA" && myTeam) {
            document.getElementById('tactical-tools').classList.remove('locked');
            document.getElementById('waiting-area').style.display = "none";
            document.getElementById('status-tag').innerText = "ESTADO: EN COMBATE";
            if(mission.startTime) syncTimer(mission.startTime);
        }

        // Sincronizar bajas globales
        document.getElementById('deaths-red').innerText = mission.stats?.deaths_RED || 0;
        document.getElementById('deaths-blue').innerText = mission.stats?.deaths_BLUE || 0;
    });
}

function renderMissionElements(elements) {
    missionOverlays.forEach(o => o.setMap(null));
    missionOverlays = [];
    if(!elements) return;

    const bounds = new google.maps.LatLngBounds();
    Object.values(elements).forEach(e => {
        let obj;
        const color = e.type === 'GAME_ZONE' ? '#00ff00' : e.type === 'SAFE_ZONE' ? '#ffffff' : e.type.includes('RED') ? '#ff0000' : '#0000ff';
        
        if(e.path) {
            obj = new google.maps.Polygon({ paths: e.path, fillColor: color, strokeColor: color, fillOpacity: 0.1, map: map });
            e.path.forEach(p => bounds.extend(p));
        } else if(e.radius) {
            obj = new google.maps.Circle({ center: e.center, radius: e.radius, fillColor: color, strokeColor: color, fillOpacity: 0.2, map: map });
            bounds.extend(e.center);
        } else if(e.pos) {
            obj = new google.maps.Marker({ position: e.pos, map: map });
            bounds.extend(e.pos);
        }
        if(obj) missionOverlays.push(obj);
    });
    if(missionOverlays.length) map.fitBounds(bounds);
}

function startTracking() {
    if(navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(pos => {
            const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            db.ref(`operaciones/${currentMissionId}/players/${CALLSIGN}/coords`).set(coords);
            map.panTo(coords);
        }, null, { enableHighAccuracy: true });
    }
}

function syncTimer(startTime) {
    setInterval(() => {
        const diff = Date.now() - startTime;
        const h = Math.floor(diff/3600000).toString().padStart(2,'0');
        const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        document.getElementById("timer").innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function useMedic() {
    // Al usar médico, se envía la señal al admin y se suma la baja al equipo
    db.ref(`operaciones/${currentMissionId}/stats/deaths_${myTeam}`).transaction(c => (c || 0) + 1);
    document.getElementById('respawn-overlay').style.display = 'flex';
}

function reportEnemy() {
    navigator.geolocation.getCurrentPosition(pos => {
        db.ref(`operaciones/${currentMissionId}/enemy_pings`).push({
            coords: { lat: pos.coords.latitude, lng: pos.coords.longitude },
            team: myTeam,
            time: Date.now()
        });
    });
}

function resetRespawn() { document.getElementById('respawn-overlay').style.display = 'none'; }
function startVoice() { /* Logic */ }
function stopVoice() { /* Logic */ }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>
</body>
</html>
