<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - Battlefield Tactical</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body{
 margin:0;
 font-family:monospace;
 background:var(--f);
 color:var(--p);
 display:flex;
 height:100vh;
 overflow:hidden;
}

/* PANEL IZQUIERDO (MAPA) */
#map{
 flex:1;
}

/* PANEL DERECHO */
#menu{
 width:300px;
 background:#050505;
 border-left:2px solid var(--p);
 display:flex;
 flex-direction:column;
}

.section{
 padding:10px;
 border-bottom:1px solid #222;
}

button, input, select{
 width:100%;
 padding:10px;
 margin-top:5px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

.list{
 font-size:12px;
 max-height:150px;
 overflow:auto;
 border:1px solid #222;
 padding:5px;
}

.badge{
 padding:4px;
 margin:2px 0;
 background:#111;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- PANEL DERECHO -->
<div id="menu">

<div class="section">
<h3>MISIONES</h3>
<div id="missions" class="list"></div>
</div>

<div class="section">
<h3>ACCIONES</h3>

<button onclick="sendMed()">🚑 LLAMAR MÉDICO</button>
<button onclick="markEnemy()">⚠ CONTACTO ENEMIGO</button>
</div>

<div class="section">
<h3>CHAT EQUIPO</h3>
<input id="msg">
<button onclick="sendMsg()">ENVIAR</button>
<div id="chat" class="list"></div>
</div>

<div class="section">
<button onclick="logout()">SALIR</button>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let missionId=null;
let team=null;
let map;

/* ===== MAPA ===== */
window.initMap=function(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.9,lng:-56.2},
  zoom:15,
  mapTypeId:"satellite"
 });
};

/* ===== AUTH ===== */
auth.onAuthStateChanged(async u=>{
 if(!u) return location.href="login.html";

 const snap=await db.ref("usuarios/"+u.uid).once("value");
 user=snap.val();

 loadMissions();
 listenChat();
});

/* ===== MISIONES ===== */
function loadMissions(){
 db.ref("operaciones").on("value",snap=>{
  let html="";
  snap.forEach(s=>{
   html+=`<div class="badge" onclick="joinMission('${s.key}')">
   ${s.val().nombre}
   </div>`;
  });
  document.getElementById("missions").innerHTML=html;
 });
}

/* ===== UNIRSE ===== */
function joinMission(id){
 missionId=id;

 db.ref("inscripciones/"+user.callsign).set({
  uid:user.id,
  missionId:id,
  equipo:"PENDIENTE"
 });

 alert("Unido a misión, esperando asignación de equipo");

 focusMission(id);
}

/* ===== ZOOM MAPA ===== */
function focusMission(id){
 db.ref("operaciones/"+id).once("value",snap=>{
  const m=snap.val();
  if(!m) return;

  map.setCenter({lat:-34.9,lng:-56.2});
  map.setZoom(16);
 });
}

/* ===== MEDICO ===== */
function sendMed(){
 db.ref("alertas/"+missionId).push({
  uid:user.id,
  tipo:"MEDICO",
  time:Date.now()
 });
}

/* ===== CONTACTO ===== */
function markEnemy(){
 db.ref("alertas/"+missionId).push({
  uid:user.id,
  tipo:"CONTACTO",
  time:Date.now()
 });
}

/* ===== CHAT ===== */
function sendMsg(){
 let msg=document.getElementById("msg").value;

 db.ref("chat/"+missionId).push({
  user:user.callsign,
  msg,
  team:team
 });

 document.getElementById("msg").value="";
}

function listenChat(){
 db.ref("chat").on("child_added",s=>{
  let c=s.val();
  if(c.missionId!==missionId) return;

  document.getElementById("chat").innerHTML+=
  `<div>${c.user}: ${c.msg}</div>`;
 });
}

/* ===== LOGOUT ===== */
function logout(){
 auth.signOut().then(()=>location.href="login.html");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
