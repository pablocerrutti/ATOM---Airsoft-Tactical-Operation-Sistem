<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M. - Base de Datos Centralizada</title>
    <style>
        :root { --p: #00ff00; --f: #050505; --cyan: #00ffff; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; padding: 20px; box-sizing: border-box; }
        h1, h2 { text-transform: uppercase; border-bottom: 2px solid var(--p); padding-bottom: 10px; letter-spacing: 2px; }
        h2 { color: var(--cyan); border-color: var(--cyan); margin-top: 40px; }

        /* Estilos Escuadrones */
        .grid-escuadrones { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-escuadron { border: 1px solid var(--cyan); background: rgba(0, 255, 255, 0.05); padding: 15px; position: relative; }
        .escudo { width: 80px; height: 80px; border: 1px solid var(--cyan); float: left; margin-right: 15px; object-fit: cover; background: #000; }
        .foto-grupo { width: 100%; height: 180px; object-fit: cover; margin-top: 15px; border: 1px solid #333; }
        .nombre-eq { font-size: 1.4rem; font-weight: bold; color: var(--cyan); display: block; text-transform: uppercase; }

        /* Estilos Operadores */
        .lista-usuarios { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .badge-user { border: 1px solid var(--p); padding: 5px 12px; font-size: 0.9rem; background: rgba(0, 255, 0, 0.1); text-transform: uppercase; color: #fff; }
        
        .btn-volver { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: #000; border: none; padding: 12px 24px; cursor: pointer; font-family: monospace; font-weight: bold; text-decoration: none; text-transform: uppercase; z-index: 100; }
        .btn-volver:hover { background: #fff; }
        .loading { color: #555; font-style: italic; }
    </style>
</head>
<body>

    <h1><span id="count-users">0</span> OPERADORES VALIDADOS</h1>
    <div id="usuarios-list" class="lista-usuarios"><span class="loading">Sincronizando personal...</span></div>

    <h2>ESCUADRONES REGISTRADOS</h2>
    <div id="escuadrones-grid" class="grid-escuadrones"><span class="loading">Sincronizando unidades...</span></div>

    <a href="index.html" class="btn-volver">VOLVER AL INICIO</a>

    <script>
        const sheetId = '1ibyfOH6EcNWDPbZ_JJd4I_e21UGr24qfmbNbBNmaFM4';

        // Función genérica para leer cualquier pestaña de tu Google Sheet
        async function fetchSheetData(tabName) {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${tabName}`;
            const response = await fetch(url);
            const text = await response.text();
            return JSON.parse(text.substr(47).slice(0, -2));
        }

        // 1. CARGAR OPERADORES (Pestaña: usuarios)
        async function cargarOperadores() {
            try {
                const data = await fetchSheetData('usuarios');
                const container = document.getElementById('usuarios-list');
                const countLabel = document.getElementById('count-users');
                container.innerHTML = "";
                
                let total = 0;
                data.table.rows.forEach(row => {
                    const callsign = row.c[0] ? row.c[0].v : null;
                    if (callsign && callsign.toLowerCase() !== "callsign") {
                        const badge = document.createElement('div');
                        badge.className = 'badge-user';
                        badge.innerText = callsign;
                        container.appendChild(badge);
                        total++;
                    }
                });
                countLabel.innerText = total;
            } catch (e) { container.innerText = "ERROR DE CONEXIÓN CON TABLA DE PERSONAL."; }
        }

        // 2. CARGAR ESCUADRONES (Pestaña: escuadrones)
        async function cargarEscuadrones() {
            const container = document.getElementById('escuadrones-grid');
            try {
                const data = await fetchSheetData('escuadrones');
                container.innerHTML = "";

                data.table.rows.forEach(row => {
                    // Mapeo de columnas (A=0, B=1, C=2, D=3, E=4)
                    const nombre = row.c[0] ? row.c[0].v : null;
                    if (!nombre || nombre.toLowerCase() === "nombre") return;

                    const lider = row.c[1] ? row.c[1].v : "S/D";
                    const escudo = row.c[2] ? row.c[2].v : 'https://via.placeholder.com/80?text=ESCUDO';
                    const foto = row.c[3] ? row.c[3].v : 'https://via.placeholder.com/400x200?text=SIN+FOTO';
                    const desc = row.c[4] ? row.c[4].v : "Escuadrón operativo validado.";

                    const card = document.createElement('div');
                    card.className = 'card-escuadron';
                    card.innerHTML = `
                        <img src="${escudo}" class="escudo" onerror="this.src='https://via.placeholder.com/80?text=ERR'">
                        <span class="nombre-eq">${nombre}</span>
                        <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">LÍDER: ${lider}</div>
                        <div style="clear:both"></div>
                        <img src="${foto}" class="foto-grupo" onerror="this.src='https://via.placeholder.com/400x200?text=ERROR+URL'">
                        <p style="font-size: 0.85rem; color: #ccc; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px;">
                            ${desc}
                        </p>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { container.innerText = "ERROR AL RECUPERAR DATOS DE ESCUADRONES."; }
        }

        // Ejecución inicial
        cargarOperadores();
        cargarEscuadrones();
    </script>
</body>
</html>
