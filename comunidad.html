<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M. - Base de Datos Centralizada</title>
    <style>
        :root { --p: #00ff00; --f: #050505; --cyan: #00ffff; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; padding: 20px; box-sizing: border-box; }
        h1, h2 { text-transform: uppercase; border-bottom: 2px solid var(--p); padding-bottom: 10px; letter-spacing: 2px; }
        h2 { color: var(--cyan); border-color: var(--cyan); margin-top: 40px; }

        /* Estilos Escuadrones */
        .grid-escuadrones { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-escuadron { border: 1px solid var(--cyan); background: rgba(0, 255, 255, 0.05); padding: 15px; position: relative; }
        .escudo { width: 70px; height: 70px; border: 1px solid var(--cyan); float: left; margin-right: 15px; object-fit: cover; background: #000; border-radius: 4px; }
        .foto-grupo { width: 100%; height: 180px; object-fit: cover; margin-top: 15px; border: 1px solid #333; filter: grayscale(50%); }
        .nombre-eq { font-size: 1.3rem; font-weight: bold; color: var(--cyan); display: block; text-transform: uppercase; line-height: 1.2; }
        .lider-name { font-size: 0.85rem; color: #aaa; margin-top: 5px; letter-spacing: 1px; }

        /* Estilos Operadores */
        .lista-usuarios { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .badge-user { border: 1px solid var(--p); padding: 4px 10px; font-size: 0.85rem; background: rgba(0, 255, 0, 0.05); text-transform: uppercase; color: #fff; border-radius: 2px; }
        
        .btn-volver { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: #000; border: none; padding: 12px 24px; cursor: pointer; font-family: monospace; font-weight: bold; text-decoration: none; text-transform: uppercase; z-index: 100; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .loading { color: #444; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1><span id="count-users">0</span> OPERADORES EN ACTIVO</h1>
    <div id="usuarios-list" class="lista-usuarios"><span class="loading">Sincronizando terminales...</span></div>

    <h2>UNIDADES DE COMBATE (ESCUADRONES)</h2>
    <div id="escuadrones-grid" class="grid-escuadrones"><span class="loading">Recuperando inteligencia de escuadrones...</span></div>

    <a href="index.html" class="btn-volver">VOLVER</a>

    <script>
        const sheetId = '1ibyfOH6EcNWDPbZ_JJd4I_e21UGr24qfmbNbBNmaFM4';

        // Función para limpiar y procesar los datos de Google
        async function fetchSheetData(tabName) {
            // Usamos tqx=out:csv o tqx=out:json. Para mayor estabilidad usamos el endpoint de Visualización.
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${tabName}`;
            const response = await fetch(url);
            const text = await response.text();
            // Limpiar el envoltorio de Google (google.visualization.Query.setResponse(...))
            const jsonData = JSON.parse(text.substring(47).slice(0, -2));
            return jsonData.table.rows;
        }

        // 1. CARGAR SOLO NOMBRES DE OPERADORES
        async function cargarOperadores() {
            const container = document.getElementById('usuarios-list');
            const countLabel = document.getElementById('count-users');
            try {
                const rows = await fetchSheetData('usuarios');
                container.innerHTML = "";
                let total = 0;

                rows.forEach((row, index) => {
                    // Evitamos la cabecera (index 0 suele ser 'Callsign')
                    const nombre = row.c[0] ? row.c[0].v : null;
                    if (nombre && index > 0) {
                        const badge = document.createElement('div');
                        badge.className = 'badge-user';
                        badge.innerText = nombre;
                        container.appendChild(badge);
                        total++;
                    }
                });
                countLabel.innerText = total;
            } catch (e) {
                console.error(e);
                container.innerHTML = "<span style='color:red'>ERROR: VERIFICAR PERMISOS DE LA HOJA.</span>";
            }
        }

        // 2. CARGAR ESCUADRONES (Escudo, Nombre, Líder, Foto)
        async function cargarEscuadrones() {
            const container = document.getElementById('escuadrones-grid');
            try {
                const rows = await fetchSheetData('escuadrones');
                container.innerHTML = "";

                rows.forEach((row, index) => {
                    if (index === 0) return; // Saltamos cabecera

                    // Mapeo basado en tu estructura (A=Nombre, B=Líder, C=Escudo, D=Foto)
                    const nombre = row.c[0] ? row.c[0].v : "UNIDAD DESCONOCIDA";
                    const lider  = row.c[1] ? row.c[1].v : "NO ASIGNADO";
                    const escudo = row.c[2] ? row.c[2].v : "";
                    const foto   = row.c[3] ? row.c[3].v : "";

                    const card = document.createElement('div');
                    card.className = 'card-escuadron';
                    card.innerHTML = `
                        <img src="${escudo}" class="escudo" onerror="this.src='https://via.placeholder.com/80?text=A.T.O.M.'">
                        <span class="nombre-eq">${nombre}</span>
                        <div class="lider-name">LÍDER: ${lider}</div>
                        <div style="clear:both"></div>
                        <img src="${foto}" class="foto-grupo" onerror="this.style.display='none'">
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                container.innerHTML = "<span style='color:red'>ERROR EN ENLACE DE INTELIGENCIA.</span>";
            }
        }

        // Ejecutar carga
        cargarOperadores();
        cargarEscuadrones();
    </script>
</body>
</html>
