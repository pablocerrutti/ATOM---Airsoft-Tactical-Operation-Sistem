<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M. - Base de Datos</title>
    <style>
        :root { --p: #00ff00; --f: #050505; --cyan: #00ffff; }
        body { background: var(--f); color: var(--p); font-family: monospace; margin: 0; padding: 20px; box-sizing: border-box; }
        h1, h2 { text-transform: uppercase; border-bottom: 2px solid var(--p); padding-bottom: 10px; letter-spacing: 2px; }
        h2 { color: var(--cyan); border-color: var(--cyan); margin-top: 40px; }

        /* Contenedor de Escuadrones */
        .grid-escuadrones { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-escuadron { border: 1px solid var(--cyan); background: rgba(0, 255, 255, 0.05); padding: 15px; position: relative; transition: 0.3s; }
        .card-escuadron:hover { background: rgba(0, 255, 255, 0.1); }
        .escudo { width: 80px; height: 80px; border: 1px solid var(--cyan); float: left; margin-right: 15px; object-fit: cover; background: #000; }
        .foto-grupo { width: 100%; height: 180px; object-fit: cover; margin-top: 15px; border: 1px solid #333; }
        .nombre-eq { font-size: 1.4rem; font-weight: bold; color: var(--cyan); display: block; text-transform: uppercase; }

        /* Lista de Usuarios */
        .lista-usuarios { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .badge-user { border: 1px solid var(--p); padding: 5px 12px; font-size: 0.9rem; background: rgba(0, 255, 0, 0.1); text-transform: uppercase; }
        
        .btn-volver { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: #000; border: none; padding: 12px 24px; cursor: pointer; font-family: monospace; font-weight: bold; text-decoration: none; text-transform: uppercase; z-index: 100; }
        .btn-volver:hover { background: #fff; }
    </style>
</head>
<body>

    <h1><span id="count-users">0</span> OPERADORES EN SISTEMA</h1>
    <div id="usuarios-list" class="lista-usuarios">ESTABLECIENDO CONEXIÓN CON EL SERVIDOR...</div>

    <h2>ESCUADRONES OPERATIVOS</h2>
    <div id="escuadrones-grid" class="grid-escuadrones">BUSCANDO REGISTROS DE ESCUADRONES...</div>

    <a href="index.html" class="btn-volver">VOLVER AL INICIO</a>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // Configuración de tu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. CARGAR USUARIOS DESDE /users
        db.ref('users').on('value', snap => {
            const container = document.getElementById('usuarios-list');
            const countLabel = document.getElementById('count-users');
            container.innerHTML = "";
            let total = 0;

            if(!snap.exists()) {
                container.innerText = "NO HAY REGISTROS DE PERSONAL.";
                countLabel.innerText = "0";
                return;
            }

            snap.forEach(userSnap => {
                const user = userSnap.val();
                const badge = document.createElement('div');
                badge.className = 'badge-user';
                // Usamos .callsign porque es como lo guarda el formulario de enrolamiento
                badge.innerText = `[${user.status || 'ALFA'}] ${user.callsign}`;
                container.appendChild(badge);
                total++;
            });
            countLabel.innerText = total;
        });

        // 2. CARGAR ESCUADRONES DESDE /escuadrones
        db.ref('escuadrones').on('value', snap => {
            const container = document.getElementById('escuadrones-grid');
            container.innerHTML = "";

            if(!snap.exists()) {
                container.innerHTML = "<p style='color:#666'>SIN UNIDADES DE COMBATE REGISTRADAS.</p>";
                return;
            }

            snap.forEach(eqSnap => {
                const eq = eqSnap.val();
                
                const card = document.createElement('div');
                card.className = 'card-escuadron';
                
                // Fallbacks para imágenes por si el link está roto o vacío
                const imgEscudo = eq.escudoURL || 'https://via.placeholder.com/80?text=NONE';
                const imgGrupo = eq.fotoGrupoURL || 'https://via.placeholder.com/400x200?text=SIN+FOTO+DE+EQUIPO';

                card.innerHTML = `
                    <img src="${imgEscudo}" class="escudo" onerror="this.src='https://via.placeholder.com/80?text=ERR'">
                    <span class="nombre-eq">${eq.nombre}</span>
                    <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">ID ÚNICO: ${eqSnap.key}</div>
                    <div style="clear:both"></div>
                    <img src="${imgGrupo}" class="foto-grupo" onerror="this.src='https://via.placeholder.com/400x200?text=ERROR+IMAGEN'">
                    <p style="font-size: 0.85rem; color: #ccc; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px;">
                        ${eq.descripcion || 'Escuadrón táctico registrado en el sistema A.T.O.M. Uruguay.'}
                    </p>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
