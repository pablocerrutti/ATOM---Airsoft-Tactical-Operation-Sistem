<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Map</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --p:#00ff00; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family: monospace; }
        #map { width:100%; height:100%; position: absolute; top:0; left:0; }
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .badge { background: rgba(0,0,0,0.8); border: 1px solid var(--p); color: var(--p); padding: 10px; font-weight: bold; font-size: 12px; }
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; }
        .btn-abort { background: #300; color: #f33; border: 1px solid #f33; padding: 15px 40px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud">
        <div id="hud-team" class="badge">BANDO: ---</div>
        <div id="hud-timer" class="badge" style="color: var(--gold);">00:00:00</div>
    </div>

    <div class="controls">
        <button class="btn-abort" onclick="abortMission()">Abandodar Misión</button>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myCallsign = localStorage.getItem('callsign');
const activeMissionId = localStorage.getItem('activeMissionId');
let map;

function initTactical() {
    if(!myCallsign || !activeMissionId) {
        window.location.href = 'lobby.html';
        return;
    }

    db.ref(`misiones/${activeMissionId}`).once('value', snap => {
        const m = snap.val();
        const first = Object.values(m.elementos)[0];
        const center = first.center || first.path[0];

        map = new google.maps.Map(document.getElementById("map"), {
            center: center, zoom: 18, mapTypeId: "hybrid", disableDefaultUI: true, tilt: 45
        });
        renderElements(map, m.elementos);
    });

    db.ref(`jugadores_enlistados/${myCallsign}`).on('value', snap => {
        const p = snap.val();
        if(p) {
            const el = document.getElementById('hud-team');
            el.innerText = `BANDO: ${p.equipo}`;
            el.style.color = p.equipo === 'RED' ? '#ff3333' : '#3333ff';
            el.style.borderColor = el.style.color;
        }
    });

    db.ref('operacion_activa/control').on('value', snap => {
        const status = snap.val();
        if(status.status === 'RECLUTANDO') {
            alert("MISIÓN FINALIZADA");
            window.location.href = 'lobby.html';
        }
        updateTimer(status.startTime);
    });
}

function updateTimer(start) {
    setInterval(() => {
        const ms = Date.now() - start;
        const h = Math.floor(ms / 3600000).toString().padStart(2, '0');
        const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('hud-timer').innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function abortMission() {
    if(confirm("¿Desea salir del área de operaciones?")) {
        db.ref(`jugadores_enlistados/${myCallsign}`).remove();
        window.location.href = 'lobby.html';
    }
}

function renderElements(mapObj, elementos) {
    Object.values(elementos).forEach(el => {
        const style = { fillColor: el.color, strokeColor: el.color, fillOpacity: 0.3, map: mapObj };
        if (el.path) new google.maps.Polygon({ path: el.path, ...style });
        else new google.maps.Circle({ center: el.center, radius: el.radius, ...style });
    });
}

window.onload = initTactical;
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=geometry" async defer></script>
</body>
</html>
