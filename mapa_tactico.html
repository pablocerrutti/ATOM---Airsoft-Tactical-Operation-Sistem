<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - Tactical Map Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <!-- Leaflet para consistencia con el Editor -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --p:#00ff00; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; --gray:#222; --bg:rgba(5,5,5,0.9); }
        body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family: 'Courier New', monospace; }
        
        /* Contenedor del Mapa y Efecto de Baja */
        #map-container { width:100%; height:100%; transition: filter 0.5s ease; }
        #map { width:100%; height:100%; }
        .KIA { filter: grayscale(1) blur(8px) brightness(0.4); pointer-events: none; }

        /* HUD Superior Centralizado */
        .hud-top {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px; z-index: 1000;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 10px 20px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
            border: 1px solid var(--p); border-top: none;
        }
        .score { font-size: 18px; font-weight: 900; }
        #timer { color: var(--gold); font-size: 20px; min-width: 80px; text-align: center; }

        /* Menú Táctico Desplegable (Lateral) */
        #side-menu {
            position: absolute; top: 0; left: -260px; width: 250px; height: 100%;
            background: var(--bg); border-right: 1px solid var(--p);
            z-index: 2000; transition: 0.3s; padding: 60px 10px 20px 10px;
            display: flex; flex-direction: column; gap: 15px;
        }
        #side-menu.open { left: 0; }
        .menu-toggle {
            position: absolute; top: 15px; left: 10px; z-index: 2100;
            background: var(--bg); color: var(--p); border: 1px solid var(--p);
            padding: 8px; cursor: pointer; font-weight: bold;
        }

        /* Botón PTT y Médico */
        .btn-main {
            width: 100%; padding: 15px; border: 1px solid var(--p);
            background: rgba(0,255,0,0.1); color: var(--p);
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-medic { border-color: var(--gold); color: var(--gold); margin-top: 10px; }
        .btn-medic.warning { background: var(--red); color: white; animation: blink 0.5s infinite; }
        
        .btn-abort { margin-top: auto; border-color: var(--red); color: var(--red); font-size: 10px; }

        .status-badge { font-size: 10px; text-align: center; padding: 5px; border: 1px solid #444; color: #888; }

        @keyframes blink { 50% { opacity: 0.3; } }
        .tactical-label { color: white; font-weight: bold; font-size: 9px; text-transform: uppercase; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()">☰ TÁCTICO</button>

    <div id="side-menu">
        <div class="status-badge" id="op-callsign">OPERATIVO: ---</div>
        <div class="status-badge" id="op-team">EQUIPO: ---</div>
        
        <button class="btn-main">🎤 PTT RADIO</button>
        
        <button id="medic-trigger" class="btn-main btn-medic" onclick="handleMedicRequest()">
            ➕ SOLICITAR MÉDICO
        </button>

        <button class="btn-main btn-abort" onclick="abortMission()">🚪 ABANDONAR MISIÓN</button>
    </div>

    <div class="hud-top">
        <div class="score" style="color: var(--red);" id="kills-red">0</div>
        <div id="timer">00:00:00</div>
        <div class="score" style="color: var(--blue);" id="kills-blue">0</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myCallsign = localStorage.getItem('callsign') || "GHOST";
const activeMissionId = localStorage.getItem('activeMissionId');

let map, drawnItems;
let myTeam = 'S/E';
let medicSteps = 0;
let teamMarkers = {};
let respawnZone = null;

function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 2);
    
    // Vista Satélite (Esri World Imagery)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
    }).addTo(map);

    drawnItems = L.featureGroup().addTo(map);
    
    loadMissionData();
    syncPlayerStatus();
    listenGlobalTimer();
    startGPS();
}

function loadMissionData() {
    if(!activeMissionId) return;
    db.ref(`misiones/${activeMissionId}`).once('value', snap => {
        const m = snap.val();
        if(!m || !m.elementos) return;

        m.elementos.forEach(el => {
            let layer;
            const style = { weight: 2, fillOpacity: 0.2, color: '#00ff00' };
            
            // Lógica de colores según tipo
            if(el.type === 'SAFE_ZONE') style.color = '#ffd700';
            if(el.type === 'RESPAWN_RED') style.color = '#ff3333';
            if(el.type === 'RESPAWN_BLUE') style.color = '#3333ff';

            if(el.path) layer = L.polygon(el.path, style);
            else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
            else layer = L.circleMarker(el.center, {radius: 8, ...style});

            // Guardar referencia del respawn del equipo para el modo KIA
            if(el.type === `RESPAWN_${myTeam}`) respawnZone = layer;

            drawnItems.addLayer(layer);
        });
        map.fitBounds(drawnItems.getBounds());
    });
}

function syncPlayerStatus() {
    db.ref(`jugadores_enlistados/${myCallsign}`).on('value', snap => {
        const p = snap.val();
        if(!p) return;
        myTeam = p.equipo;
        document.getElementById('op-callsign').innerText = `OPERATIVO: ${myCallsign}`;
        document.getElementById('op-team').innerText = `EQUIPO: ${myTeam}`;
        document.getElementById('op-team').style.color = myTeam === 'RED' ? 'var(--red)' : 'var(--blue)';
        
        listenTeammates();
    });
}

function listenTeammates() {
    db.ref('jugadores_enlistados').on('value', snap => {
        snap.forEach(child => {
            const data = child.val();
            const id = child.key;
            
            // Solo ver aliados y a uno mismo
            if(data.equipo === myTeam && data.lat) {
                if(!teamMarkers[id]) {
                    teamMarkers[id] = L.circleMarker([data.lat, data.lng], {
                        radius: 6, color: 'white', fillColor: myTeam === 'RED' ? '#ff3333' : '#3333ff', fillOpacity: 1
                    }).addTo(map).bindTooltip(id, {permanent: true, className: 'tactical-label'});
                } else {
                    teamMarkers[id].setLatLng([data.lat, data.lng]);
                }
            }
        });
    });
}

function handleMedicRequest() {
    medicSteps++;
    const btn = document.getElementById('medic-trigger');
    
    if(medicSteps === 1) {
        btn.innerText = "⚠️ CONFIRMAR BAJA (KIA)";
        btn.classList.add('warning');
        // Aquí podrías enviar una alerta al equipo de "Médico solicitado por..."
    } else {
        // CONFIRMACIÓN DE BAJA
        document.getElementById('map-container').classList.add('KIA');
        btn.innerText = "❌ ESTADO: KIA";
        btn.disabled = true;
        
        // Sumar baja al equipo contrario en Firebase
        const enemyTeam = myTeam === 'RED' ? 'killsBlue' : 'killsRed';
        db.ref(`operacion_activa/control/${enemyTeam}`).transaction(current => (current || 0) + 1);

        // Enfocar solo el respawn
        if(respawnZone) {
            map.flyTo(respawnZone.getBounds ? respawnZone.getBounds().getCenter() : respawnZone.getLatLng(), 18);
        }
        
        alert("HAS CAÍDO EN COMBATE. Vuelve a tu zona de respawn para reincorporarte.");
        setTimeout(() => {
            if(confirm("¿REASIGNAR OPERATIVO? (Reset de estado)")) location.reload();
        }, 10000);
    }
}

function listenGlobalTimer() {
    db.ref('operacion_activa/control').on('value', snap => {
        const data = snap.val();
        if(!data) return;
        document.getElementById('kills-red').innerText = data.killsRed || 0;
        document.getElementById('kills-blue').innerText = data.killsBlue || 0;
        
        if(data.startTime && !data.paused) {
            setInterval(() => {
                const diff = Date.now() - data.startTime;
                document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
            }, 1000);
        }
    });
}

function startGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            const {latitude, longitude} = pos.coords;
            db.ref(`jugadores_enlistados/${myCallsign}`).update({ lat: latitude, lng: longitude });
        }, null, { enableHighAccuracy: true });
    }
}

function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }
function abortMission() { if(confirm("¿EXFILTRAR DE LA ZONA?")) window.location.href = 'lobby.html'; }

window.onload = initMap;
</script>
</body>
</html>
