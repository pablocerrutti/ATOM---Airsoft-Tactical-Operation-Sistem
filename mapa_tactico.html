<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - MAPA TÁCTICO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        #main-map { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 1; background: #000; }

        #tactical-blocker {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 15, 5, 0.95); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
            padding: 20px; box-sizing: border-box; transition: 0.6s;
        }
        .loading-box { border: 1px solid var(--p); padding: 30px; background: #000; box-shadow: 0 0 20px var(--p); }

        .hud-top, .hud-bottom { z-index: 10; pointer-events: none; }
        .mission-info { background: rgba(0,0,0,0.85); border: 1px solid var(--p); padding: 10px; }
        .status-badge { color: var(--gold); font-size: 10px; font-weight: bold; }

        .btn-medic { 
            background: var(--red); color: white; padding: 12px 20px; 
            border: none; font-weight: bold; cursor: pointer; margin-top: 10px;
            display: none;
        }
        .zone-alert {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9); color: white; padding: 20px 40px;
            font-size: 18px; font-weight: bold; border: 3px solid white;
            display: none; z-index: 10000; animation: blinker 0.8s infinite;
        }
        @keyframes blinker { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="tactical-blocker">
        <div class="loading-box">
            <h3 id="block-title" style="color: var(--gold);">PENDIENTE DE ASIGNACIÓN</h3>
            <div id="team-notification" style="margin-top:20px; font-size:18px; font-weight:bold; display:none;"></div>
        </div>
        <button class="btn-exit" style="margin-top:40px;" onclick="abortMission()">CANCELAR</button>
    </div>

    <div class="screen">
        <div id="main-map"></div>

        <div class="hud-top">
            <div class="mission-info">
                <span id="m-status" class="status-badge">CONECTANDO...</span>
                <div id="m-name" style="font-weight:bold; font-size:16px;">---</div>
                <div id="m-obj" style="font-size:11px; margin-top:5px;">---</div>
            </div>
        </div>

        <div class="hud-bottom" style="position:absolute; bottom:20px; left:10px; right:10px;">
            <div id="op-list" style="display:flex; gap:8px; overflow-x:auto; background:rgba(0,20,0,0.7); padding:8px; border-radius:4px;"></div>
            <button id="btn-medic" class="btn-medic" onclick="solicitarMedico()">SOLICITAR MÉDICO</button>
        </div>
    </div>

    <div id="zone-alert" class="zone-alert">¡SALISTE DE LA ZONA DE OPERACIONES!</div>

<script>
// ==================== CONFIGURACIÓN ====================
const firebaseConfig = { /* ... tu config ... */ };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "INVITADO";
let map, drawnItems, currentMissionId, myTeam = null, gameZoneLayer = null;
let deathCount = 0;
let lastTeamObjective = null;

// ==================== INICIALIZACIÓN ====================
window.onload = () => {
    initMap();
    syncTacticalFlow();
};

function initMap() {
    map = L.map('main-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
    drawnItems = L.featureGroup().addTo(map);
    
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updateMyLocation, console.error, { enableHighAccuracy: true });
    }
}

// ==================== LÓGICA PRINCIPAL ====================
function syncTacticalFlow() {
    currentMissionId = localStorage.getItem('activeMissionId');

    db.ref(`jugadores_enlistados/${myCallsign}`).on('value', snap => {
        const data = snap.val();
        if (!data) return;

        myTeam = data.equipo;

        // Desbloqueo temprano: solo con equipo asignado
        const blocker = document.getElementById('tactical-blocker');
        if (myTeam && myTeam !== 'PENDIENTE') {
            document.getElementById('team-notification').style.display = 'block';
            document.getElementById('team-notification').innerHTML = `EQUIPO: <span style="color:${myTeam==='RED'?'#ff3333':'#3333ff'}">${myTeam}</span>`;
            document.getElementById('block-title').innerText = "EN ESPERA DE INICIO";
            
            if (data.misionId) {
                loadTacticalIntel(data.misionId);
                setupTeamListeners(data.misionId);
            }
            
            // Desbloquear aunque la misión no esté "activa"
            blocker.style.opacity = '0';
            setTimeout(() => blocker.style.display = 'none', 600);
        }
    });
}

function loadTacticalIntel(missionId) {
    db.ref(`misiones/${missionId}`).on('value', snap => {
        const m = snap.val();
        if (!m) return;

        document.getElementById('m-name').innerText = (m.nombre || "MISIÓN").toUpperCase();
        document.getElementById('m-obj').innerText = m.objetivos || "Sin objetivos definidos";

        drawnItems.clearLayers();

        if (m.elementos) {
            m.elementos.forEach(el => {
                if (el.type === 'GAME_ZONE') gameZoneLayer = el;
                
                let layer;
                const col = el.type === 'GAME_ZONE' ? '#00ff00' : (el.type.includes('RESPAWN') ? '#ffff00' : '#ffffff');
                
                if (el.path) layer = L.polygon(el.path, {color: col, weight: 3, fillOpacity: 0.1});
                else if (el.radius) layer = L.circle(el.center, {radius: el.radius, color: col, fillOpacity: 0.15});
                
                if (layer) drawnItems.addLayer(layer);
            });

            if (drawnItems.getLayers().length) {
                map.fitBounds(drawnItems.getBounds(), {padding: [50,50]});
            }
        }
    });
}

function setupTeamListeners(missionId) {
    // Compañeros del mismo equipo
    db.ref(`jugadores_enlistados`).on('value', snap => {
        const list = document.getElementById('op-list');
        list.innerHTML = '';
        
        snap.forEach(child => {
            const p = child.val();
            if (p.misionId === missionId && p.equipo === myTeam && p.callsign !== myCallsign) {
                const tag = document.createElement('div');
                tag.className = 'op-tag';
                tag.style.background = myTeam === 'RED' ? '#ff3333' : '#3333ff';
                tag.innerText = p.callsign;
                list.appendChild(tag);
            }
        });
    });

    // Control de zona
    setInterval(checkGameZone, 3000);
}

// ==================== POSICIÓN Y ZONA ====================
function updateMyLocation(pos) {
    const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    db.ref(`jugadores_enlistados/${myCallsign}`).update({
        lat: coords.lat, lng: coords.lng, lastSeen: Date.now(), equipo: myTeam
    });
}

function checkGameZone() {
    if (!gameZoneLayer) return;
    navigator.geolocation.getCurrentPosition(pos => {
        const inside = isPointInZone(pos.coords.latitude, pos.coords.longitude);
        document.getElementById('zone-alert').style.display = inside ? 'none' : 'block';
    });
}

function isPointInZone(lat, lng) {
    // Simplificado - mejorar según tu estructura de GAME_ZONE
    return true; // Implementa lógica real de polygon/circle
}

// ==================== BAJAS Y MÉDICO ====================
function registrarBaja() {
    deathCount++;
    db.ref(`jugadores_enlistados/${myCallsign}`).update({ deathCount: deathCount });
    
    if (deathCount >= 2) {
        document.getElementById('btn-medic').style.display = 'block';
    }
}

function solicitarMedico() {
    if (confirm("¿Solicitar apoyo médico?")) {
        // Aquí iría lógica para respawn en último objetivo o spawn inicial
        alert("Solicitud de médico enviada. Respawneando en último checkpoint...");
        // Reiniciar posición en Firebase hacia respawn
        deathCount = 0;
        document.getElementById('btn-medic').style.display = 'none';
    }
}

function abortMission() {
    if (confirm("¿Confirmas el aborto de la operación?")) {
        db.ref(`jugadores_enlistados/${myCallsign}`).remove();
        location.href = 'lobby.html';
    }
}
</script>
</body>
</html>
