<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - MAPA TÁCTICO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        #main-map { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 1; background: #000; }

        /* HUD Superior */
        .hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .mission-info { 
            background: rgba(0,0,0,0.85); border: 1px solid var(--p); padding: 10px; 
            max-width: 70%; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .status-badge { color: var(--gold); font-size: 10px; font-weight: bold; margin-bottom: 4px; display: block; letter-spacing: 1px; }

        /* HUD Inferior */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .op-scroller {
            display: flex; gap: 8px; overflow-x: auto; pointer-events: auto;
            background: rgba(0,20,0,0.7); padding: 8px; border-radius: 4px; border-top: 1px solid var(--p);
        }
        .op-tag { 
            background: var(--p); color: #000; padding: 5px 12px; 
            font-weight: bold; font-size: 11px; white-space: nowrap; border-radius: 2px;
        }

        /* Estilos Tácticos Leaflet */
        .tactical-label {
            background: rgba(0,0,0,0.8); border: 1px solid var(--p); color: var(--p);
            padding: 2px 6px; font-size: 9px; font-weight: bold; border-radius: 3px;
            white-space: nowrap; text-transform: uppercase; box-shadow: 0 0 5px #000;
        }

        .btn-exit {
            background: rgba(100,0,0,0.6); color: #fff; border: 1px solid var(--red);
            padding: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; font-size: 10px;
        }

        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="screen">
        <div id="main-map"></div>

        <div class="hud-top">
            <div class="mission-info">
                <span id="m-status" class="status-badge blink">CONECTANDO...</span>
                <div id="m-name" style="font-weight: bold; font-size: 16px; color: var(--p);">---</div>
                <div id="m-obj" style="font-size: 11px; color: #eee; margin-top: 5px; font-family: sans-serif; line-height: 1.2;">Esperando inteligencia...</div>
            </div>
            <button class="btn-exit" onclick="abortMission()">ABORTAR</button>
        </div>

        <div class="hud-bottom">
            <div id="op-list" class="op-scroller"></div>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "INVITADO";

let map, drawnItems, currentMissionId;
const ATOM_COLORS = { 'GAME_ZONE': '#0f0', 'SAFE_ZONE': '#ffd700', 'RESPAWN_RED': '#f33', 'RESPAWN_BLUE': '#33f', 'OBJ_POINT': '#fff' };

window.onload = () => {
    initMap();
    syncTacticalFlow();
};

function initMap() {
    map = L.map('main-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
    drawnItems = L.featureGroup().addTo(map);

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updateMyLocation, (err) => console.log("GPS Error:", err), { enableHighAccuracy: true });
    }
}

function syncTacticalFlow() {
    // 1. Detectar ID de misión activa
    db.ref('operacion_activa/control/missionId').on('value', snap => {
        currentMissionId = snap.val();
        if(currentMissionId) loadTacticalIntel(currentMissionId);
    });

    // 2. Operadores en red
    db.ref('jugadores_enlistados').on('value', snap => {
        const list = document.getElementById('op-list');
        list.innerHTML = '';
        snap.forEach(child => {
            const op = child.val();
            const color = op.equipo === 'RED' ? '#ff3333' : (op.equipo === 'BLUE' ? '#3333ff' : '#00ff00');
            list.innerHTML += `<div class="op-tag" style="background:${color}">${op.callsign}</div>`;
        });
    });
}

function loadTacticalIntel(id) {
    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;

        document.getElementById('m-name').innerText = (m.nombre || "S/D").toUpperCase();
        document.getElementById('m-obj').innerText = m.objetivos || "Sin objetivos tácticos.";
        document.getElementById('m-status').innerText = `SAT_LINK: ${m.estado || 'ACTIVA'}`;

        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const col = ATOM_COLORS[el.type] || '#0f0';
                const style = { color: col, weight: 2, fillOpacity: 0.15, dashArray: '5, 5' };
                
                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                else if(el.center) layer = L.marker(el.center);
                
                if(layer) {
                    // Añadir etiqueta flotante
                    const labelPos = el.center || getPolygonCenter(el.path);
                    L.marker(labelPos, {
                        icon: L.divIcon({
                            className: 'tactical-label',
                            html: el.type.replace('_', ' '),
                            iconAnchor: [30, 0]
                        })
                    }).addTo(drawnItems);
                    drawnItems.addLayer(layer);
                }
            });

            // CENTRADO AUTOMÁTICO AL CARGAR O ACTUALIZAR
            if(drawnItems.getLayers().length > 0) {
                setTimeout(() => {
                    map.fitBounds(drawnItems.getBounds(), { padding: [60, 60], maxZoom: 18 });
                }, 300);
            }
        }
    });
}

function updateMyLocation(pos) {
    const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    db.ref(`jugadores_enlistados/${myCallsign}`).update({
        lat: coords.lat,
        lng: coords.lng,
        lastSeen: Date.now()
    });
}

function abortMission() {
    if(confirm("¿CONFIRMA ABORTO DE OPERACIÓN?")) {
        db.ref(`jugadores_enlistados/${myCallsign}`).remove();
        location.href = 'lobby.html';
    }
}

function getPolygonCenter(path) {
    if(!path || path.length === 0) return [0,0];
    const lats = path.map(p => p.lat);
    const lngs = path.map(p => p.lng);
    return [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
}
</script>
</body>
</html>
