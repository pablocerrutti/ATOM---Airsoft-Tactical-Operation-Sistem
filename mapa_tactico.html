<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.T.O.M - MAPA TÁCTICO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        
        body { margin:0; font-family: 'Courier New', monospace; background:var(--f); color:var(--p); overflow:hidden; }
        .screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        /* Mapa Full Screen */
        #main-map { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 1; }

        /* HUD Superior */
        .hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .mission-info { 
            background: rgba(0,0,0,0.8); border: 1px solid var(--p); padding: 10px; 
            max-width: 60%; pointer-events: auto;
        }
        .status-badge { color: var(--gold); font-size: 10px; font-weight: bold; margin-bottom: 4px; display: block; }

        /* HUD Inferior */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .op-scroller {
            display: flex; gap: 5px; overflow-x: auto; pointer-events: auto;
            background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px;
        }
        .op-tag { 
            background: var(--p); color: #000; padding: 4px 10px; 
            font-weight: bold; font-size: 11px; white-space: nowrap; 
        }

        /* Estilos Tácticos Leaflet */
        .tactical-label {
            background: rgba(0,0,0,0.8); border: 1px solid var(--p); color: var(--p);
            padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 3px;
            white-space: nowrap; text-transform: uppercase;
        }

        .btn-exit {
            background: rgba(255,0,0,0.2); color: var(--red); border: 1px solid var(--red);
            padding: 10px; font-weight: bold; cursor: pointer; pointer-events: auto;
        }

        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="screen">
        <div id="main-map"></div>

        <div class="hud-top">
            <div class="mission-info">
                <span id="m-status" class="status-badge blink">OPERACIÓN ACTIVA</span>
                <div id="m-name" style="font-weight: bold; font-size: 16px; color: #fff;">---</div>
                <div id="m-obj" style="font-size: 11px; color: #aaa; margin-top: 5px; font-family: sans-serif;">Cargando objetivos...</div>
            </div>
            <button class="btn-exit" onclick="abortMission()">ABORTAR</button>
        </div>

        <div class="hud-bottom">
            <div id="op-list" class="op-scroller">
                </div>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDWHHeMFVxznRER-j0fNZHnQJAnw_JL0DY",
    databaseURL: "https://atom---sistem-default-rtdb.firebaseio.com",
    projectId: "atom---sistem",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myCallsign = localStorage.getItem('callsign') || "OPERADOR_ANON";

let map, drawnItems, currentMissionId;

window.onload = () => {
    initMap();
    syncTacticalData();
};

function initMap() {
    map = L.map('main-map', { zoomControl: false, attributionControl: false });
    L.gridLayer.googleMutant({ type: 'hybrid' }).addTo(map);
    drawnItems = L.featureGroup().addTo(map);

    // Intentar obtener ubicación real del operador
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updateMyLocation, null, { enableHighAccuracy: true });
    }
}

function syncTacticalData() {
    // 1. Obtener la misión activa
    db.ref('operacion_activa/control/missionId').on('value', snap => {
        currentMissionId = snap.val();
        if(currentMissionId) loadMissionAssets(currentMissionId);
    });

    // 2. Obtener lista de operadores en tiempo real
    db.ref('jugadores_enlistados').on('value', snap => {
        const list = document.getElementById('op-list');
        list.innerHTML = '';
        snap.forEach(child => {
            const op = child.val();
            list.innerHTML += `<div class="op-tag">${op.callsign} [${op.equipo || 'S/E'}]</div>`;
        });
    });
}

function loadMissionAssets(id) {
    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;

        // Actualizar HUD
        document.getElementById('m-name').innerText = (m.nombre || "S/D").toUpperCase();
        document.getElementById('m-obj').innerText = m.objetivos || "Sin objetivos.";
        document.getElementById('m-status').innerText = `ESTADO: ${m.estado || 'ACTIVO'}`;

        // Dibujar elementos tácticos
        drawnItems.clearLayers();
        if(m.elementos) {
            m.elementos.forEach(el => {
                let layer;
                const style = { color: '#0f0', weight: 2, fillOpacity: 0.2, dashArray: '5, 5' };
                
                if(el.path) layer = L.polygon(el.path, style);
                else if(el.radius) layer = L.circle(el.center, {radius: el.radius, ...style});
                
                if(layer) {
                    const labelPos = el.center || getPolygonCenter(el.path);
                    L.marker(labelPos, {
                        icon: L.divIcon({
                            className: 'tactical-label',
                            html: el.type || 'ZONA',
                            iconAnchor: [30, 0]
                        })
                    }).addTo(drawnItems);
                    drawnItems.addLayer(layer);
                }
            });

            // Ajustar cámara a la zona de misión
            if(drawnItems.getLayers().length > 0) {
                map.fitBounds(drawnItems.getBounds(), { padding: [50, 50] });
            }
        }
    });
}

function updateMyLocation(pos) {
    const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    
    // Actualizar en Firebase para que otros me vean
    db.ref(`jugadores_enlistados/${myCallsign}`).update({
        lat: coords.lat,
        lng: coords.lng,
        lastSeen: Date.now()
    });

    // Opcional: Centrar mi cámara si es la primera vez
    // map.setView([coords.lat, coords.lng], 17);
}

function abortMission() {
    if(confirm("¿DESEA ABORTAR LA OPERACIÓN Y VOLVER AL LOBBY?")) {
        db.ref(`jugadores_enlistados/${myCallsign}`).remove();
        location.href = 'lobby.html';
    }
}

function getPolygonCenter(path) {
    if(!path || path.length === 0) return [0,0];
    const lats = path.map(p => p.lat);
    const lngs = path.map(p => p.lng);
    return [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
}
</script>
</body>
</html>
