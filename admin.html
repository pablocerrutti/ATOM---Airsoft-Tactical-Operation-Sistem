<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A.T.O.M. - HQ Mando Central </title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --safe: #00ffff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); display: flex; height: 100vh; overflow: hidden; }
        
        #side-panel { width: 380px; border-right: 2px solid var(--p); padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; overflow-y: auto; flex-shrink: 0; z-index: 10; }
        #map { flex-grow: 1; height: 100%; background: #111; }

        .control-group { border: 1px solid #333; padding: 10px; border-radius: 4px; background: #050505; margin-bottom: 5px; }
        h3 { margin: 0 0 10px 0; color: var(--p); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        button, input, select { width: 100%; background: #111; border: 1px solid var(--p); color: var(--p); padding: 8px; margin-bottom: 5px; font-family: monospace; font-size: 11px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: var(--p); color: #000; }
        
        .btn-edit { border-color: var(--warn); color: var(--warn); }
        .btn-update { background: var(--p); color: #000; font-weight: bold; margin-top: 10px; }
        .btn-safe { border-color: var(--safe) !important; color: var(--safe) !important; }
        .hidden { display: none !important; }

        .player-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 5px; margin-bottom: 3px; font-size: 10px; border-left: 3px solid #444; }
        .assigned-red { border-left-color: var(--red); }
        .assigned-blue { border-left-color: var(--blue); }
        .btn-small { width: auto; padding: 2px 6px; margin: 0 2px; font-size: 9px; }

        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="border: 2px solid var(--p); padding: 40px; text-align: center; background: #050505; width: 300px;">
            <h1 style="letter-spacing: 8px;">A.T.O.M.</h1>
            <input type="password" id="master-key" placeholder="MASTER KEY" autofocus style="margin: 20px 0;">
            <button onclick="checkAuth()">AUTORIZAR ACCESO</button>
        </div>
    </div>

    <div id="side-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin:0; font-size: 1rem; color: #fff;">HQ ESTRATÉGICO</h2>
            <button onclick="window.location.href='index.html'" style="width: auto; padding: 4px 8px; font-size: 9px; border-color: #444; color: #888;">INICIO</button>
        </div>
        
        <div class="control-group">
            <h3>Misiones Activas</h3>
            <div id="lista-misiones-db" style="max-height: 120px; overflow-y: auto;"></div>
        </div>

        <div id="panel-editor" class="control-group">
            <h3 id="editor-title">Editor de Operación</h3>
            <input type="text" id="op-name" placeholder="NOMBRE DE LA MISIÓN">
            
            <div id="controles-dibujo">
                <button onclick="setMode('polygon', 'zona_juego')">DIBUJAR LÍMITE CAMPO</button>
                <button class="btn-safe" onclick="setMode('polygon', 'zona_segura')">DIBUJAR ZONA SEGURA (SAFETY)</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                    <button style="color:var(--red); border-color:var(--red);" onclick="setMode('marker', 'respawn_rojo')">SPAWN R</button>
                    <button style="color:var(--blue); border-color:var(--blue);" onclick="setMode('marker', 'respawn_azul')">SPAWN A</button>
                </div>
                <button style="color:gold; border-color:gold;" onclick="setMode('marker', 'objetivo_conquista')">PUNTO CONQUISTA</button>
            </div>

            <button id="btn-habilitar-edicion" class="btn-edit hidden" onclick="activarModoEdicion()">🔓 ACTIVAR EDICIÓN TÁCTICA</button>
            <button id="btn-save" class="btn-update" onclick="publicarMision()">🚀 PUBLICAR NUEVA MISIÓN</button>
            <button id="btn-update" class="btn-update hidden" onclick="actualizarMision()">💾 ACTUALIZAR CAMBIOS</button>
        </div>

        <div class="control-group">
            <h3>Asignación de Tropas <button class="btn-small" onclick="autoBalancear()">AUTO-BALANCE</button></h3>
            <div id="lista-espera" style="font-size: 10px; color: #666;">Seleccione una misión...</div>
        </div>

        <button class="btn-outline" style="border:none; font-size: 10px;" onclick="location.reload()">CERRAR SESIÓN / LIMPIAR</button>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, drawingManager, miMisionEdicionId = null;
        let allShapes = [];
        let playerMarkers = {};
        let currentRole = 'zona_juego';

        function checkAuth() {
            if(document.getElementById('master-key').value === "Ik3rc3rru771") {
                document.getElementById('lock-screen').classList.add('hidden');
                initMap();
                cargarMisionesDB();
            }
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -34.095, lng: -56.214 },
                zoom: 15, mapTypeId: 'satellite', disableDefaultUI: true
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingControl: false,
                polygonOptions: { fillOpacity: 0.2, strokeWeight: 2, editable: true }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'overlaycomplete', (event) => {
                let shape = event.overlay;
                shape.type = event.type;
                shape.role = currentRole;
                aplicarEstilo(shape, currentRole);
                allShapes.push(shape);
            });
        }

        function cargarMisionesDB() {
            db.ref('operaciones').on('value', snap => {
                const list = document.getElementById('lista-misiones-db');
                list.innerHTML = "";
                snap.forEach(child => {
                    const div = document.createElement('div');
                    div.className = 'player-row';
                    div.innerHTML = `<span onclick="seleccionarMision('${child.key}')" style="cursor:pointer; flex:1">📍 ${child.val().nombre}</span>
                                     <span style="color:red; cursor:pointer" onclick="eliminarMision('${child.key}')">✖</span>`;
                    list.appendChild(div);
                });
            });
        }

        function seleccionarMision(id) {
            miMisionEdicionId = id;
            limpiarMapa();
            
            // Ocultar herramientas de dibujo y botón de publicar al seleccionar
            document.getElementById('controles-dibujo').classList.add('hidden');
            document.getElementById('btn-save').classList.add('hidden');
            document.getElementById('btn-habilitar-edicion').classList.remove('hidden');
            document.getElementById('btn-update').classList.add('hidden');

            db.ref(`operaciones/${id}`).once('value', snap => {
                const m = snap.val();
                document.getElementById('op-name').value = m.nombre;
                const bounds = new google.maps.LatLngBounds();

                m.zonas.forEach(z => {
                    let shape;
                    if(z.type === 'polygon') {
                        shape = new google.maps.Polygon({ paths: z.path, map: map, editable: false });
                        z.path.forEach(p => bounds.extend(p));
                    } else {
                        shape = new google.maps.Marker({ position: {lat: z.lat, lng: z.lng}, map: map, draggable: false });
                        bounds.extend({lat: z.lat, lng: z.lng});
                    }
                    shape.role = z.role;
                    shape.type = z.type;
                    aplicarEstilo(shape, z.role);
                    allShapes.push(shape);
                });

                if(!bounds.isEmpty()) map.fitBounds(bounds);
                escucharInscritos(id);
                monitorearJugadores(id);
            });
        }

        function activarModoEdicion() {
            document.getElementById('controles-dibujo').classList.remove('hidden');
            document.getElementById('btn-update').classList.remove('hidden');
            document.getElementById('btn-habilitar-edicion').classList.add('hidden');
            document.getElementById('editor-title').innerText = "MODO EDICIÓN ACTIVO";
            document.getElementById('editor-title').style.color = "var(--warn)";

            allShapes.forEach(s => {
                if(s.getPath) s.setEditable(true);
                if(s.setPosition) s.setDraggable(true);
            });
        }

        function publicarMision() {
            if(!document.getElementById('op-name').value) return alert("NOMBRE DE MISIÓN REQUERIDO");
            const data = allShapes.map(s => extraerDatosShape(s));
            db.ref('operaciones').push({ 
                nombre: document.getElementById('op-name').value, 
                zonas: data 
            }).then(() => location.reload());
        }

        function actualizarMision() {
            const data = allShapes.map(s => extraerDatosShape(s));
            db.ref(`operaciones/${miMisionEdicionId}`).update({ 
                nombre: document.getElementById('op-name').value, 
                zonas: data 
            }).then(() => { alert("OPERACIÓN ACTUALIZADA"); location.reload(); });
        }

        function extraerDatosShape(s) {
            let d = { type: s.type || (s.getPath ? 'polygon' : 'marker'), role: s.role };
            if(d.type === 'polygon') d.path = s.getPath().getArray().map(p => ({lat: p.lat(), lng: p.lng()}));
            else { d.lat = s.getPosition().lat(); d.lng = s.getPosition().lng(); }
            return d;
        }

        function aplicarEstilo(shape, role) {
            const c = {
                'respawn_rojo': {icon: {path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: 'red', fillOpacity: 1, strokeColor: '#fff'}},
                'respawn_azul': {icon: {path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: 'blue', fillOpacity: 1, strokeColor: '#fff'}},
                'objetivo_conquista': {icon: {path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW, scale: 7, fillColor: 'gold', fillOpacity: 1}},
                'zona_juego': {fillColor: '#00ff00', strokeColor: '#00ff00', fillOpacity: 0.1},
                'zona_segura': {fillColor: '#00ffff', strokeColor: '#00ffff', fillOpacity: 0.3}
            };
            if(c[role]) shape.setOptions(c[role]);
        }

        // --- Funciones de soporte (Inscritos, Balance, etc) ---
        function monitorearJugadores(misionId) {
            Object.values(playerMarkers).forEach(m => m.setMap(null));
            playerMarkers = {};
            ['EQUIPO_ROJO', 'EQUIPO_AZUL'].forEach(eq => {
                db.ref(`posiciones/${eq}`).on('value', snap => {
                    snap.forEach(pPos => {
                        const callsign = pPos.key;
                        if(!playerMarkers[callsign]) {
                            playerMarkers[callsign] = new google.maps.Marker({
                                map: map, label: {text: callsign, color: 'white', fontSize: '9px'},
                                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 4, fillColor: eq === 'EQUIPO_ROJO' ? 'red' : 'blue', fillOpacity: 1, strokeColor: 'white' }
                            });
                        }
                        playerMarkers[callsign].setPosition(pPos.val());
                    });
                });
            });
        }

        function escucharInscritos(misionId) {
            db.ref('inscripciones').orderByChild('mision').equalTo(misionId).on('value', snap => {
                const list = document.getElementById('lista-espera');
                list.innerHTML = "";
                snap.forEach(pSnap => {
                    const p = pSnap.val();
                    const row = document.createElement('div');
                    row.className = `player-row ${p.equipo === 'EQUIPO_ROJO' ? 'assigned-red' : (p.equipo === 'EQUIPO_AZUL' ? 'assigned-blue' : '')}`;
                    row.innerHTML = `<b>${p.callsign}</b> <div>
                        <button class="btn-small" onclick="asignarEquipo('${p.callsign}', 'EQUIPO_ROJO')">R</button>
                        <button class="btn-small" onclick="asignarEquipo('${p.callsign}', 'EQUIPO_AZUL')">A</button>
                    </div>`;
                    list.appendChild(row);
                });
            });
        }

        function asignarEquipo(callsign, equipo) { db.ref(`inscripciones/${callsign}`).update({ equipo: equipo }); }
        function autoBalancear() {
            db.ref('inscripciones').orderByChild('mision').equalTo(miMisionEdicionId).once('value', snap => {
                let p = []; snap.forEach(x => p.push(x.key));
                p.sort(() => Math.random() - 0.5);
                p.forEach((id, i) => asignarEquipo(id, (i % 2 === 0) ? 'EQUIPO_ROJO' : 'EQUIPO_AZUL'));
            });
        }
        function limpiarMapa() { allShapes.forEach(s => s.setMap(null)); allShapes = []; }
        function setMode(m, r) { currentRole = r; drawingManager.setDrawingMode(m === 'marker' ? google.maps.drawing.OverlayType.MARKER : google.maps.drawing.OverlayType.POLYGON); }
        function eliminarMision(id) { if(confirm("¿BORRAR MISIÓN PERMANENTEMENTE?")) db.ref(`operaciones/${id}`).remove(); }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry" defer></script>
</body>
</html>
