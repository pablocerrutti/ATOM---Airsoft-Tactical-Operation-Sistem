<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Comando Central</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        <style>
        :root { --p: #00ff00; --f: #0a0a0a; --a: #3399ff; --r: #ff3333; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--f); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { border: 2px solid var(--p); padding: 30px; text-align: center; background: #111; border-radius: 10px; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 12px; margin: 10px 0; width: 200px; text-align: center; font-size: 16px; }
        
        #admin-content { display: none; flex-direction: column; flex-grow: 1; height: 100vh; }
        #google-map { flex-grow: 1; border-bottom: 2px solid var(--p); }
        
        .panel { background: #111; padding: 10px; max-height: 45vh; overflow-y: auto; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        
        button { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 10px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        button:active { background: var(--p); color: #000; }
        button.active { background: var(--p); color: #000; }
        
        .btn-special { background: #aa5500; color: white; border-color: #ffaa00; }
        .player-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; align-items: center; }
    </style>
</head>
<body>
    <div id="lock-screen">
        <div class="login-box">
            <h2>COMANDO CENTRAL</h2>
            <input type="password" id="admin-pass" placeholder="PASSWORD">
            <button onclick="checkPass()" style="width:100%; background: var(--p); color: black;">ACCEDER</button>
            <br><br>
            <a href="index.html" style="color: #666; text-decoration: none; font-size: 10px;">← CANCELAR</a>
        </div>
    </div>

    <div id="admin-content">
        <div id="google-map"></div>
        <div class="panel">
            <div class="controls">
                <button id="btn-polygon" onclick="setMode('polygon')">LÍMITES</button>
                <button id="btn-safezone" onclick="setMode('safezone')" style="border-color:white; color:white;">SAFE ZONE</button>
                <button id="btn-resA" onclick="setMode('resA')" style="border-color:var(--a); color:var(--a);">RESPAWN A</button>
                <button id="btn-resR" onclick="setMode('resR')" style="border-color:var(--r); color:var(--r);">RESPAWN R</button>
                <button id="btn-obj" onclick="setMode('obj')">OBJETIVO</button>
                <button onclick="undoLast()">↩️ DESHACER</button>
                
                <button class="btn-special" onclick="autoBalance()" style="grid-column: span 2;">⚖️ AUTO-ASIGNAR EQUIPOS</button>
                <button onclick="saveOp()" style="grid-column: span 2; background: #004400; border-color: lime;">🚀 LANZAR OPERACIÓN</button>
                
                <button onclick="window.location.href='index.html'" style="grid-column: span 2; border-color: #ff3333; color: #ff3333;">SALIR AL INICIO</button>
            </div>
            <div id="player-list"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

    <script>
        const firebaseConfig = { /* TU CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const PASS_MAESTRA = "1234";

        function checkPass() {
            if(document.getElementById('admin-pass').value === PASS_MAESTRA) unlock();
            else alert("DENEGADO");
        }

        function unlock() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'flex';
        }

        let map, mode = 'view', drawingManager;
        let coords = { polygon:[], safezone:[], resA:[], resR:[], obj:[] };
        let shapes = { polygon:null, safezone:null, resA:null, resR:null };

        function initMap() {
            map = new google.maps.Map(document.getElementById("google-map"), {
                center: { lat: -34.10, lng: -56.21 },
                zoom: 15,
                mapTypeId: 'hybrid', // Vista satélite con etiquetas
                disableDefaultUI: true
            });

            map.addListener("click", (e) => {
                if(mode === 'view') return;
                const latlng = { lat: e.latLng.lat(), lng: e.latLng.lng() };
                
                if(mode === 'obj') {
                    coords.obj.push(latlng);
                    new google.maps.Marker({ position: latlng, map: map, icon: 'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png' });
                } else {
                    coords[mode].push(latlng);
                    drawShape(mode);
                }
            });

            loadPlayers();
        }

        function drawShape(type) {
            if(shapes[type]) shapes[type].setMap(null);
            let color = (type === 'safezone'?'#FFFFFF':type==='resA'?'#3399ff':type==='resR'?'#ff3333':'#00ff00');
            
            shapes[type] = new google.maps.Polygon({
                paths: coords[type],
                strokeColor: color,
                strokeOpacity: 0.8,
                strokeWeight: 2,
                fillColor: color,
                fillOpacity: 0.35,
                map: map
            });
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            if(document.getElementById('btn-'+m)) document.getElementById('btn-'+m).classList.add('active');
        }

        function loadPlayers() {
            db.ref('users').on('value', snap => {
                const u = snap.val(); const list = document.getElementById('player-list');
                list.innerHTML = "<h4>OPERADORES</h4>";
                for(let id in u) {
                    list.innerHTML += `<div class="player-row">
                        <span>${u[id].callsign} [${u[id].team.toUpperCase()}]</span>
                        <button onclick="db.ref('users/${id}').update({team:'azul'})">A</button>
                        <button onclick="db.ref('users/${id}').update({team:'rojo'})">R</button>
                    </div>`;
                }
            });
        }

        function undoLast() {
            if(coords[mode].length > 0) {
                coords[mode].pop();
                drawShape(mode);
            }
        }

        function saveOp() {
            const n = prompt("Nombre Misión:");
            if(!n) return;
            db.ref('operaciones').push().set({
                nombre: n,
                limites: coords.polygon,
                safezone: coords.safezone,
                resA: coords.resA,
                resR: coords.resR,
                objetivos: coords.obj
            });
            alert("MISIÓN LANZADA");
        }
    </script>
</body>
</html>
