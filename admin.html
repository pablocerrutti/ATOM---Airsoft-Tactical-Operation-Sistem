<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A.T.O.M. - HQ Mando y Despliegue </title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #header { height: 60px; background: #000; border-bottom: 2px solid var(--p); display: flex; align-items: center; padding: 0 10px; justify-content: space-between; z-index: 10; }
        #map { flex-grow: 1; background: #111; }

        /* Panel Lateral de Administración */
        #admin-sidebar { 
            position: absolute; right: 0; top: 62px; bottom: 0; width: 280px; 
            background: rgba(0,0,0,0.9); border-left: 2px solid var(--p); 
            padding: 15px; z-index: 100; overflow-y: auto; display: none;
        }

        .user-card { 
            background: #111; border: 1px solid #333; padding: 8px; margin-bottom: 8px; font-size: 11px;
        }
        .user-card select { 
            width: 100%; background: #000; color: var(--p); border: 1px solid var(--p); margin-top: 5px; font-size: 10px;
        }

        #setup-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .setup-content { border: 2px solid var(--p); padding: 30px; background: #050505; width: 85%; max-width: 400px; }
        .btn-main { background: var(--p); color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        .team-tag { padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .tag-rojo { background: var(--red); color: #fff; }
        .tag-azul { background: var(--blue); color: #fff; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-content">
            <h2 style="text-align: center; letter-spacing: 4px;">A.T.O.M. HQ</h2>
            <p style="font-size: 10px; color: #666;">SELECCIONE MISIÓN ACTIVA:</p>
            <select id="select-mision" style="width:100%; padding:10px; background:#111; color:var(--p); border:1px solid var(--p);">
                <option value="OPERACION_EUCALIPTUS">OPERACIÓN EUCALIPTUS</option>
                <option value="OPERACION_MENDOZA">OPERACIÓN MENDOZA</option>
            </select>
            <button class="btn-main" onclick="conectarSistema()">CONECTAR A BASE DE DATOS</button>
        </div>
    </div>

    <div id="header">
        <div>
            <span id="op-active-name" style="font-weight: bold;">---</span>
        </div>
        <button onclick="toggleAdmin()" style="background:transparent; border:1px solid gold; color:gold; padding:5px 10px; cursor:pointer;">ADMIN TROPAS</button>
    </div>

    <div id="admin-sidebar">
        <h3 style="font-size: 12px; border-bottom: 1px solid var(--p);">OPERADORES INSCRITOS</h3>
        <div id="lista-operadores">Cargando...</div>
    </div>

    <div id="map"></div>

    <script>
        // URL DE TU GOOGLE SHEET PUBLICADO COMO CSV (Pestaña Usuarios/Inscritos)
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6l7G-9G7_G_p1FpYvL_n_xNfS_lD3XlQYnK6z6W8yS8y/pub?gid=0&single=true&output=csv"; 

        let map;
        let operacionActual = "";

        async function conectarSistema() {
            operacionActual = document.getElementById('select-mision').value;
            document.getElementById('op-active-name').innerText = operacionActual;
            document.getElementById('setup-screen').style.display = 'none';
            
            initMap();
            await cargarYFiltrarUsuarios();
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -34.095, lng: -56.214 },
                zoom: 15, mapTypeId: 'satellite', disableDefaultUI: true
            });
        }

        async function cargarYFiltrarUsuarios() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const filas = data.split("\n").slice(1); // Quitamos cabecera

                const container = document.getElementById('lista-operadores');
                container.innerHTML = "";

                filas.forEach(fila => {
                    // Estructura asumida: Callsign, Password, Status, Mision, Equipo
                    const columnas = fila.split(",");
                    const callsign = columnas[0]?.trim();
                    const misionAsignada = columnas[3]?.trim(); // Columna de la Misión
                    const equipoActual = columnas[4]?.trim(); // Columna del Equipo

                    // FILTRO: Solo mostramos si el usuario está anotado en la misión seleccionada
                    if (misionAsignada === operacionActual) {
                        const card = document.createElement('div');
                        card.className = 'user-card';
                        card.innerHTML = `
                            <strong>${callsign}</strong>
                            <div style="margin-top:5px;">
                                <select onchange="asignarBando('${callsign}', this.value)">
                                    <option value="">SIN BANDO</option>
                                    <option value="ROJO" ${equipoActual === 'ROJO' ? 'selected' : ''}>EQUIPO ROJO</option>
                                    <option value="AZUL" ${equipoActual === 'AZUL' ? 'selected' : ''}>EQUIPO AZUL</option>
                                </select>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });

                if(container.innerHTML === "") {
                    container.innerHTML = "<p style='color:red; font-size:10px;'>NO HAY OPERADORES PARA ESTA MISIÓN</p>";
                }

            } catch (e) {
                console.error("Error cargando DB:", e);
            }
        }

        function asignarBando(callsign, bando) {
            console.log(`Asignando a ${callsign} al bando ${bando}`);
            // Aquí iría tu fetch al Google Apps Script para actualizar la celda en la planilla
            alert(`Sincronizando: ${callsign} -> ${bando}`);
        }

        function toggleAdmin() {
            const side = document.getElementById('admin-sidebar');
            side.style.display = side.style.display === 'block' ? 'none' : 'block';
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58" defer></script>
</body>
</html>
