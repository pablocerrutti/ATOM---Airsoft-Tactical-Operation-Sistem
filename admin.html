<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M. - COMANDO CENTRAL</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; --red:#ff3333; --blue:#33aaff; }

body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; }

/* PANEL */
#panel {
    width:320px;
    background:#050505;
    border-right:2px solid var(--p);
    padding:10px;
    overflow:auto;
    height:100vh;
    z-index:1000;
}

/* MAPA */
#map { flex:1; }

/* BOTÓN TOGGLE */
#toggleMenu {
    position:fixed;
    top:10px;
    left:10px;
    z-index:1001;
    background:#000;
    border:1px solid var(--p);
    color:var(--p);
    padding:10px;
    width:auto;
}

/* INPUTS Y BOTONES */
button, select, input {
    width:100%;
    margin-top:6px;
    background:#111;
    color:var(--p);
    border:1px solid var(--p);
    padding:12px;
    font-size:14px;
}

.user { 
    display:flex; 
    justify-content:space-between; 
    font-size:12px; 
    border-bottom:1px solid #222; 
    padding:6px;
}

.stat { font-size:12px; margin-top:5px; }

/* 📱 RESPONSIVE */
@media (max-width: 768px) {

    body {
        flex-direction: column;
    }

    #panel {
        width:100% !important;
        height:auto;
        position:fixed;
        bottom:0;
        top:auto;
        border-right:none;
        border-top:2px solid var(--p);
        max-height:50vh;
    }

    #map {
        height:100vh;
        width:100%;
    }
}
</style>
</head>

<body>

<button id="toggleMenu" onclick="toggleMenu()">☰</button>

<div id="panel">

<h3>MISIONES</h3>
<select id="misiones" onchange="cargarMision(this.value)"></select>

<input id="nombre" placeholder="Nombre misión">

<select id="modo">
<option value="DOMINIO">DOMINIO</option>
<option value="EXTERMINIO">EXTERMINIO</option>
</select>

<button onclick="nuevaMision()">+ NUEVA</button>
<button onclick="guardarMision()">GUARDAR</button>
<button onclick="eliminarMision()">ELIMINAR</button>

<hr>

<h3>EDITOR MAPA</h3>
<button onclick="setMode('zona')">ZONA</button>
<button onclick="setMode('segura')">SEGURA</button>
<button onclick="setMode('respawn_rojo')">SPAWN R</button>
<button onclick="setMode('respawn_azul')">SPAWN A</button>
<button onclick="setMode('objetivo')">OBJ</button>

<hr>

<h3>JUGADORES</h3>
<div id="jugadores"></div>
<button onclick="balancear()">BALANCEAR</button>

<hr>

<h3>ESTADO</h3>
<div class="stat" id="stats"></div>

<button onclick="lanzar()">🚀 LANZAR</button>

</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 databaseURL:"https://atom--airsoft-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, currentId=null;
let shapes=[];
let playerMarkers={};
let objetivos={};

function toggleMenu(){
 let panel = document.getElementById("panel");
 panel.style.display = (panel.style.display === "none") ? "block" : "none";
}

function initMap(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.09,lng:-56.21},
  zoom:15,
  mapTypeId:"satellite"
 });

 map.addListener("click",e=>{
  if(!mode) return;

  shapes.push({
   type:"marker",
   role:mode,
   lat:e.latLng.lat(),
   lng:e.latLng.lng()
  });

  new google.maps.Marker({position:e.latLng,map:map});
 });
}

let mode=null;
function setMode(m){ mode=m; }

function nuevaMision(){
 shapes=[]; currentId=null;
}

function guardarMision(){
 let nombre=document.getElementById("nombre").value;
 let modo=document.getElementById("modo").value;

 if(currentId){
  db.ref("operaciones/"+currentId).update({nombre,modo,zonas:shapes});
 } else {
  let ref=db.ref("operaciones").push();
  ref.set({nombre,modo,zonas:shapes,estado:{activo:false}});
  currentId=ref.key;
 }
 cargarListado();
}

function cargarListado(){
 db.ref("operaciones").on("value",snap=>{
  let sel=document.getElementById("misiones");
  sel.innerHTML="";
  snap.forEach(s=>{
   sel.innerHTML+=`<option value="${s.key}">${s.val().nombre}</option>`;
  });
 });
}

function cargarMision(id){
 currentId=id;

 db.ref("operaciones/"+id).once("value",snap=>{
  let m=snap.val();

  document.getElementById("nombre").value=m.nombre;
  document.getElementById("modo").value=m.modo;

  if(m.zonas){
   m.zonas.forEach(z=>{
    if(z.role==="objetivo"){
     let circle=new google.maps.Circle({
      map:map,
      center:{lat:z.lat,lng:z.lng},
      radius:25,
      fillOpacity:0.2,
      strokeColor:"#ffff00"
     });
     objetivos["obj_"+Math.random()]=circle;
    }
   });
  }

 });

 cargarJugadores();
 escucharJugadores();
 escucharObjetivos();
 escucharEventos();
 contarEquipos();
}

function eliminarMision(){
 db.ref("operaciones/"+currentId).remove();
}

function cargarJugadores(){
 db.ref("inscripciones").orderByChild("mision").equalTo(currentId)
 .on("value",snap=>{
  let cont=document.getElementById("jugadores");
  cont.innerHTML="";
  snap.forEach(s=>{
   let p=s.val();
   cont.innerHTML+=`
   <div class="user">
    ${p.callsign}
    <div>
     <button onclick="equipo('${s.key}','EQUIPO_ROJO')">R</button>
     <button onclick="equipo('${s.key}','EQUIPO_AZUL')">A</button>
    </div>
   </div>`;
  });
 });
}

function equipo(id,e){
 db.ref("inscripciones/"+id).update({equipo:e});
}

function balancear(){
 db.ref("inscripciones").orderByChild("mision").equalTo(currentId)
 .once("value",snap=>{
  let arr=[];
  snap.forEach(s=>arr.push(s.key));
  arr.sort(()=>Math.random()-0.5);
  let mitad=Math.ceil(arr.length/2);
  arr.forEach((id,i)=>{
   db.ref("inscripciones/"+id).update({
    equipo:i<mitad?"EQUIPO_ROJO":"EQUIPO_AZUL"
   });
  });
 });
}

function lanzar(){
 db.ref("operaciones/"+currentId+"/estado")
 .set({activo:true,startTime:Date.now()});
}

function escucharJugadores(){
 db.ref("posiciones").on("value",snap=>{
  snap.forEach(s=>{
   let p=s.val(); let id=s.key;
   if(p.mision!==currentId) return;

   let pos={lat:p.lat,lng:p.lng};
   let color="http://maps.google.com/mapfiles/ms/icons/green-dot.png";

   if(p.equipo==="EQUIPO_ROJO") color="http://maps.google.com/mapfiles/ms/icons/red-dot.png";
   if(p.equipo==="EQUIPO_AZUL") color="http://maps.google.com/mapfiles/ms/icons/blue-dot.png";

   if(!playerMarkers[id]){
    playerMarkers[id]=new google.maps.Marker({position:pos,map:map,icon:color});
   } else playerMarkers[id].setPosition(pos);
  });
 });
}

function escucharObjetivos(){
 db.ref("objetivos").on("value",snap=>{
  snap.forEach(s=>{
   let o=s.val();
   let circle=objetivos[s.key];
   if(circle){
    let c="#ffff00";
    if(o.owner==="EQUIPO_ROJO") c="#ff0000";
    if(o.owner==="EQUIPO_AZUL") c="#0000ff";
    circle.setOptions({fillColor:c,strokeColor:c});
   }
  });
 });
}

// 💀 BAJAS + EVENTOS
let bajas={rojo:0,azul:0};

function escucharEventos(){
 db.ref("eventos").on("child_added",snap=>{
  let e=snap.val();

  if(e.tipo==="baja"){
   if(e.equipo==="EQUIPO_ROJO") bajas.rojo++;
   if(e.equipo==="EQUIPO_AZUL") bajas.azul++;
  }

  actualizarStats();
 });
}

function contarEquipos(){
 db.ref("posiciones").on("value",snap=>{
  let r=0,a=0;

  snap.forEach(s=>{
   let p=s.val();
   if(p.mision!==currentId) return;
   if(p.equipo==="EQUIPO_ROJO") r++;
   if(p.equipo==="EQUIPO_AZUL") a++;
  });

  window.totalR=r;
  window.totalA=a;

  actualizarStats();
 });
}

function actualizarStats(){
 document.getElementById("stats").innerHTML=
 `
 ROJO: ${window.totalR||0} | BAJAS: ${bajas.rojo}<br>
 AZUL: ${window.totalA||0} | BAJAS: ${bajas.azul}
 `;

 if(document.getElementById("modo").value==="EXTERMINIO"){
  if(bajas.rojo>=window.totalR){
   alert("AZUL GANA");
  }
  if(bajas.azul>=window.totalA){
   alert("ROJO GANA");
  }
 }
}

initMap();
cargarListado();

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58" async defer></script>

</body>
</html>
