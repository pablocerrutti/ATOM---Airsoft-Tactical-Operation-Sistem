<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A.T.O.M. - HQ Mando Central </title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --safe: #00ffff; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); display: flex; height: 100vh; overflow: hidden; }
        
        #side-panel { width: 380px; border-right: 2px solid var(--p); padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; overflow-y: auto; flex-shrink: 0; z-index: 10; }
        #map { flex-grow: 1; height: 100%; background: #111; }

        .control-group { border: 1px solid #333; padding: 10px; border-radius: 4px; background: #050505; margin-bottom: 5px; }
        h3 { margin: 0 0 10px 0; color: var(--p); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        button, input, select { width: 100%; background: #111; border: 1px solid var(--p); color: var(--p); padding: 8px; margin-bottom: 5px; font-family: monospace; font-size: 11px; cursor: pointer; }
        button:hover { background: var(--p); color: #000; }
        
        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-blue { border-color: var(--blue); color: var(--blue); }
        .btn-update { background: #fff; color: #000; font-weight: bold; }

        /* Lista de Jugadores para asignar */
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 5px; margin-bottom: 3px; font-size: 10px; border-left: 3px solid #666; }
        .player-row.assigned-red { border-left-color: var(--red); }
        .player-row.assigned-blue { border-left-color: var(--blue); }
        .btn-small { width: auto; padding: 2px 6px; margin: 0 2px; font-size: 9px; }

        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="border: 2px solid var(--p); padding: 40px; text-align: center; background: #050505; width: 300px;">
            <h1 style="letter-spacing: 8px;">A.T.O.M.</h1>
            <input type="password" id="master-key" placeholder="MASTER KEY" autofocus style="margin: 20px 0;">
            <button onclick="checkAuth()">AUTORIZAR ACCESO</button>
        </div>
    </div>

    <div id="side-panel">
        <h2 style="margin:0; font-size: 1rem; color: #fff;">HQ ESTRATÉGICO</h2>
        
        <div class="control-group">
            <h3>Misiones en Sistema</h3>
            <div id="lista-misiones-db" style="max-height: 100px; overflow-y: auto;"></div>
        </div>

        <div class="control-group">
            <h3>Editor de Operación <span id="edit-mode-label" style="color:var(--safe)">[NUEVO]</span></h3>
            <input type="text" id="op-name" placeholder="NOMBRE DE LA MISIÓN">
            <button onclick="setMode('polygon', 'zona_juego')">LÍMITE CAMPO</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                <button class="btn-red" onclick="setMode('marker', 'respawn_rojo')">SPAWN R</button>
                <button class="btn-blue" onclick="setMode('marker', 'respawn_azul')">SPAWN A</button>
            </div>
            <button class="btn-obj" style="border-color:gold; color:gold" onclick="setMode('marker', 'objetivo_conquista')">PUNTO CONQUISTA</button>
            
            <button id="btn-save" onclick="publicarMision()" style="margin-top:10px;">GUARDAR COMO NUEVA</button>
            <button id="btn-update" class="btn-update hidden" onclick="actualizarMision()">ACTUALIZAR EXISTENTE</button>
        </div>

        <div class="control-group">
            <h3>Draft de Operadores <button class="btn-small" onclick="autoBalancear()">AUTO-BALANCE</button></h3>
            <div id="lista-espera" style="max-height: 200px; overflow-y: auto;">
                Seleccione una misión para ver aspirantes...
            </div>
        </div>

        <button class="btn-outline" style="border-color: #444; color: #444;" onclick="location.reload()">RESETEAR TERMINAL</button>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        // Configuración idéntica a la anterior
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, drawingManager, miMisionEdicionId = null;
        let allShapes = [];
        let playerMarkers = {};
        let currentRole = 'zona_juego';

        function checkAuth() {
            if(document.getElementById('master-key').value === "Ik3rc3rru771") {
                document.getElementById('lock-screen').classList.add('hidden');
                initMap();
                cargarMisionesDB();
            }
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -34.095, lng: -56.214 },
                zoom: 16, mapTypeId: 'satellite', disableDefaultUI: true
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingControl: true,
                drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['marker', 'polygon'] },
                polygonOptions: { fillOpacity: 0.2, strokeWeight: 2, editable: true }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'overlaycomplete', (event) => {
                let shape = event.overlay;
                shape.type = event.type;
                shape.role = currentRole;
                aplicarEstilo(shape, currentRole);
                allShapes.push(shape);
            });
        }

        function cargarMisionesDB() {
            db.ref('operaciones').on('value', snap => {
                const list = document.getElementById('lista-misiones-db');
                list.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const div = document.createElement('div');
                    div.className = 'player-row';
                    div.innerHTML = `
                        <span onclick="cargarParaEditar('${child.key}')" style="cursor:pointer">📂 ${m.nombre}</span>
                        <span style="color:red; cursor:pointer" onclick="eliminarMision('${child.key}')">✖</span>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // CARGAR MISIÓN PARA EDITAR
        function cargarParaEditar(id) {
            miMisionEdicionId = id;
            limpiarMapa();
            
            db.ref(`operaciones/${id}`).once('value', snap => {
                const m = snap.val();
                document.getElementById('op-name').value = m.nombre;
                document.getElementById('edit-mode-label').innerText = "[EDITANDO]";
                document.getElementById('btn-save').classList.add('hidden');
                document.getElementById('btn-update').classList.remove('hidden');

                m.zonas.forEach(z => {
                    let shape;
                    if(z.type === 'polygon') {
                        shape = new google.maps.Polygon({ paths: z.path, map: map, editable: true });
                    } else {
                        shape = new google.maps.Marker({ position: {lat: z.lat, lng: z.lng}, map: map, draggable: true });
                    }
                    shape.type = z.type;
                    shape.role = z.role;
                    aplicarEstilo(shape, z.role);
                    allShapes.push(shape);
                });
                escucharInscritos(id);
                monitorearMapaEnTiempoReal(id);
            });
        }

        // ESCUCHAR JUGADORES QUE ELIGIERON ESTA MISIÓN
        function escucharInscritos(misionId) {
            db.ref('inscripciones').orderByChild('mision').equalTo(misionId).on('value', snap => {
                const list = document.getElementById('lista-espera');
                list.innerHTML = "";
                if(!snap.exists()) list.innerText = "Sin operadores en espera.";

                snap.forEach(pSnap => {
                    const p = pSnap.val();
                    const row = document.createElement('div');
                    row.className = `player-row ${p.equipo === 'EQUIPO_ROJO' ? 'assigned-red' : (p.equipo === 'EQUIPO_AZUL' ? 'assigned-blue' : '')}`;
                    row.innerHTML = `
                        <b>${p.callsign}</b>
                        <div>
                            <button class="btn-small btn-red" onclick="asignarEquipo('${p.callsign}', 'EQUIPO_ROJO')">R</button>
                            <button class="btn-small btn-blue" onclick="asignarEquipo('${p.callsign}', 'EQUIPO_AZUL')">A</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
            });
        }

        function asignarEquipo(callsign, equipo) {
            db.ref(`inscripciones/${callsign}`).update({ equipo: equipo });
        }

        function autoBalancear() {
            db.ref('inscripciones').orderByChild('mision').equalTo(miMisionEdicionId).once('value', snap => {
                let players = [];
                snap.forEach(p => players.push(p.key));
                
                // Mezcla aleatoria básica
                players.sort(() => Math.random() - 0.5);
                
                players.forEach((id, index) => {
                    let eq = (index % 2 === 0) ? 'EQUIPO_ROJO' : 'EQUIPO_AZUL';
                    asignarEquipo(id, eq);
                });
            });
        }

        function monitorearMapaEnTiempoReal(misionId) {
            // Limpiar marcadores viejos
            Object.values(playerMarkers).forEach(m => m.setMap(null));
            playerMarkers = {};

            // Ver posiciones de ambos equipos en el mapa del admin
            ['EQUIPO_ROJO', 'EQUIPO_AZUL'].forEach(eq => {
                db.ref(`posiciones/${eq}`).on('value', snap => {
                    snap.forEach(pPos => {
                        const callsign = pPos.key;
                        const pos = pPos.val();
                        if(!playerMarkers[callsign]) {
                            playerMarkers[callsign] = new google.maps.Marker({
                                map: map, label: {text: callsign, color: 'white', fontSize: '10px'},
                                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 5, fillColor: eq === 'EQUIPO_ROJO' ? 'red' : 'blue', fillOpacity: 1, strokeColor: 'white' }
                            });
                        }
                        playerMarkers[callsign].setPosition(pos);
                    });
                });
            });
        }

        function actualizarMision() {
            if(!miMisionEdicionId) return;
            const zonasData = procesarZonas();
            db.ref(`operaciones/${miMisionEdicionId}`).update({
                nombre: document.getElementById('op-name').value,
                zonas: zonasData
            }).then(() => alert("OPERACIÓN ACTUALIZADA EN TIEMPO REAL"));
        }

        function publicarMision() {
            const name = document.getElementById('op-name').value;
            if(!name) return alert("Nombre requerido");
            db.ref('operaciones').push({ nombre: name, zonas: procesarZonas() })
            .then(() => location.reload());
        }

        function procesarZonas() {
            return allShapes.map(s => {
                let d = { type: s.type, role: s.role };
                if(s.type === 'polygon') {
                    d.path = s.getPath().getArray().map(p => ({lat: p.lat(), lng: p.lng()}));
                } else {
                    d.lat = s.getPosition().lat();
                    d.lng = s.getPosition().lng();
                }
                return d;
            });
        }

        function aplicarEstilo(shape, role) {
            const config = {
                'respawn_rojo': {icon: {path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: 'red', fillOpacity: 1, strokeColor: '#fff'}},
                'respawn_azul': {icon: {path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: 'blue', fillOpacity: 1, strokeColor: '#fff'}},
                'objetivo_conquista': {icon: {path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW, scale: 7, fillColor: 'gold', fillOpacity: 1, strokeColor: '#000'}},
                'zona_juego': {fillColor: '#00ff00', strokeColor: '#00ff00'}
            };
            if(config[role]) shape.setOptions(config[role]);
        }

        function limpiarMapa() {
            allShapes.forEach(s => s.setMap(null));
            allShapes = [];
        }

        function setMode(mode, role) {
            currentRole = role;
            drawingManager.setDrawingMode(mode === 'marker' ? google.maps.drawing.OverlayType.MARKER : google.maps.drawing.OverlayType.POLYGON);
        }
        
        function eliminarMision(id) {
            if(confirm("¿Eliminar misión y datos asociados?")) db.ref(`operaciones/${id}`).remove();
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing,geometry" defer></script>
</body>
</html>
