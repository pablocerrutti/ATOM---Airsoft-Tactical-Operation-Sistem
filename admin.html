<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A.T.O.M. - HQ Mando Central </title>
    <style>
        :root { --p: #00ff00; --f: #0b0b0b; --red: #ff3333; --blue: #33aaff; --safe: #00ffff; --warn: #ffd700; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); display: flex; height: 100vh; overflow: hidden; }
        
        #side-panel { width: 380px; border-right: 2px solid var(--p); padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; overflow-y: auto; flex-shrink: 0; z-index: 10; }
        #map { flex-grow: 1; height: 100%; background: #111; }

        .control-group { border: 1px solid #333; padding: 10px; border-radius: 4px; background: #050505; margin-bottom: 5px; }
        h3 { margin: 0 0 10px 0; color: var(--p); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        button, input, select { width: 100%; background: #111; border: 1px solid var(--p); color: var(--p); padding: 8px; margin-bottom: 5px; font-family: monospace; font-size: 11px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: var(--p); color: #000; }
        
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 5px; margin-bottom: 3px; font-size: 10px; border-left: 3px solid #444; }

        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #auth-error { color: var(--red); font-size: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="border: 2px solid var(--p); padding: 40px; text-align: center; background: #050505; width: 300px;">
            <h1 style="letter-spacing: 8px;">A.T.O.M.</h1>
            <p style="font-size: 10px; color: #444;">RESTRICTED AREA - HQ ACCESS</p>
            <input type="password" id="master-key" placeholder="MASTER KEY" autofocus style="margin: 20px 0;">
            <button onclick="checkAuth()">AUTORIZAR ACCESO</button>
            <div id="auth-error">DENIEGO: CLAVE INCORRECTA</div>
        </div>
    </div>

    <div id="side-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin:0; font-size: 1rem; color: #fff;">HQ ESTRATÉGICO</h2>
            <button onclick="location.reload()" style="width: auto; padding: 4px 8px; font-size: 9px;">LOGOUT</button>
        </div>
        
        <div class="control-group">
            <h3>Operadores Activos (Desde DB)</h3>
            <div id="lista-usuarios-db" style="max-height: 200px; overflow-y: auto;"></div>
        </div>

        <div class="control-group">
            <h3>Escuadrones Registrados</h3>
            <div id="lista-escuadrones-db"></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // CONFIGURACIÓN DE TU GOOGLE SHEET (Copiado de BASE DE DATOS ATOM SISTEM )
        // Debes ir a Archivo > Compartir > Publicar en la Web > Valores separados por comas (.csv)
        const URL_USUARIOS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6l...TU_URL_AQUI.../pub?gid=0&single=true&output=csv";
        const URL_ESCUADRONES_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6l...TU_URL_AQUI.../pub?gid=12345&single=true&output=csv";

        let map, usuariosCache = [];

        async function checkAuth() {
            const inputKey = document.getElementById('master-key').value;
            const errorMsg = document.getElementById('auth-error');

            try {
                // Obtenemos los usuarios directamente de la hoja de Google 
                const response = await fetch(URL_USUARIOS_CSV);
                const data = await response.text();
                const filas = data.split("\n").slice(1); // Omitir encabezado

                let autorizado = false;
                filas.forEach(fila => {
                    const [nombre, password, status] = fila.split(",");
                    if (password && password.trim() === inputKey) {
                        autorizado = true;
                        usuariosCache.push({nombre, status});
                    }
                });

                if (autorizado) {
                    document.getElementById('lock-screen').style.display = 'none';
                    initMap();
                    renderizarDatos();
                } else {
                    throw new Error("Invalid Key");
                }
            } catch (e) {
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -34.095, lng: -56.214 },
                zoom: 15, mapTypeId: 'satellite', disableDefaultUI: true
            });
        }

        function renderizarDatos() {
            const userList = document.getElementById('lista-usuarios-db');
            usuariosCache.forEach(u => {
                const div = document.createElement('div');
                div.className = 'player-row';
                div.innerHTML = `<span>👤 ${u.nombre}</span> <small style="color:gold">${u.status}</small>`;
                userList.appendChild(div);
            });
            // Aquí podrías añadir lógica similar para cargar la pestaña de escuadrones 
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58" defer></script>
</body>
</html>
