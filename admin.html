<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones Pro</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        
        #panel { width:320px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; z-index:10; overflow-y: auto; }
        #map { flex:1; }

        .menu-drop { border-bottom: 1px solid #222; }
        .menu-header { padding:15px; background:#111; cursor:pointer; font-weight:bold; display:flex; justify-content:space-between; }
        .menu-content { padding:10px; display:none; flex-direction:column; }
        .menu-content.active { display:flex; }

        button, select, input { width:100%; padding:12px; margin-top:8px; background:#111; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; transition: 0.3s; }
        button:hover { background:var(--p); color:#000; }
        
        .timer-display { font-size: 24px; text-align: center; padding: 10px; border: 1px solid var(--gold); color: var(--gold); margin-top: 10px; }
        .btn-launch { background: var(--gold); color: #000; border: none; font-size: 1.1rem; }
        .btn-hub { background:#222; border-color:#555; margin-top:auto; padding:20px; }
        
        select option { background: #000; color: var(--p); }
    </style>
</head>
<body>

<div id="panel">
    <div style="padding:15px; border-bottom:2px solid var(--p)">
        <h3 style="margin:0 0 10px 0;">A.T.O.M EDITOR V2</h3>
        <!-- Selector de Misiones Limpio -->
        <select id="mission-selector" onchange="editMission(this.value)">
            <option value="">-- SELECCIONAR OPERACIÓN --</option>
        </select>
        <input id="mission-name" placeholder="Nombre de Nueva Misión">
        <button onclick="createNewMission()" style="background:#003300">NUEVA MISIÓN</button>
    </div>

    <!-- Gestión de Tiempo -->
    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⏱️ RELOJ Y ESTADO <span>+</span></div>
        <div class="menu-content">
            <div id="timer" class="timer-display">00:00:00</div>
            <button id="btn-start" class="btn-launch" onclick="launchMission()">🚀 LANZAR MISIÓN</button>
            <p id="status-label" style="text-align:center; font-size:10px; margin-top:5px;">ESTADO: STANDBY</p>
        </div>
    </div>

    <!-- Herramientas Tácticas -->
    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⚒ HERRAMIENTAS <span>+</span></div>
        <div class="menu-content active">
            <button onclick="setMode('GAME_ZONE')">🟢 ZONA DE JUEGO (LÍMITE)</button>
            <button onclick="setMode('SAFE_ZONE')">🔴 ZONA SEGURA (HOSPITAL)</button>
            <button onclick="setMode('RESPAWN_RED')">⭕ RESP. ROJO (ALERTA)</button>
            <button onclick="setMode('RESPAWN_BLUE')">⭕ RESP. AZUL (ALERTA)</button>
            <button onclick="setMode('OBJ_GREY')">🔘 PUNTO DE INTERÉS</button>
        </div>
    </div>

    <!-- Gestión Cloud -->
    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">💾 GESTIÓN CLOUD <span>+</span></div>
        <div class="menu-content">
            <button onclick="deleteCurrentMission()" style="color:var(--red); border-color:var(--red)">ELIMINAR MISIÓN ACTUAL</button>
        </div>
    </div>

    <button class="btn-hub" onclick="location.href='hub.html'">🔙 VOLVER AL HUB</button>
</div>

<div id="map"></div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
// Configuración integrada
const firebaseConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawingManager, currentMissionId = null;
let currentOverlays = [];
let missionInterval;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, // Centro por defecto (Uruguay)
        zoom: 15,
        mapTypeId: "satellite",
        disableDefaultUI: false,
        tilt: 45
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        circleOptions: { clickable: true, editable: true },
        polygonOptions: { clickable: true, editable: true }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
        const mode = document.body.dataset.mode;
        processOverlay(event, mode);
    });
    
    loadMissionsList();
}

function setMode(mode) {
    if(!currentMissionId) return alert("Primero selecciona o crea una misión.");
    document.body.dataset.mode = mode;
    
    const isCircle = mode.includes("RESPAWN");
    const isPolygon = mode.includes("ZONE");
    
    drawingManager.setDrawingMode(
        isCircle ? google.maps.drawing.OverlayType.CIRCLE :
        isPolygon ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.MARKER
    );

    const color = mode === 'GAME_ZONE' ? '#00ff00' : 
                  mode === 'SAFE_ZONE' ? '#ff3333' : 
                  mode.includes('RED') ? '#ff3333' : '#3333ff';

    drawingManager.setOptions({
        polygonOptions: { fillColor: color, strokeColor: color, fillOpacity: 0.2, strokeWeight: 2 },
        circleOptions: { fillColor: color, strokeColor: color, fillOpacity: 0.4, strokeWeight: 2 }
    });
}

function processOverlay(event, mode) {
    const id = Math.random().toString(36).substr(2, 9);
    let elementData = { id, type: mode };
    
    if (event.type === 'polygon') {
        elementData.path = event.overlay.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
    } else if (event.type === 'circle') {
        elementData.center = {lat: event.overlay.getCenter().lat(), lng: event.overlay.getCenter().lng()};
        elementData.radius = event.overlay.getRadius();
    } else {
        elementData.pos = {lat: event.overlay.getPosition().lat(), lng: event.overlay.getPosition().lng()};
    }

    // Guardado y limpieza inmediata
    db.ref(`operaciones/${currentMissionId}/elements/${id}`).set(elementData);
    event.overlay.setMap(null); 
    drawingManager.setDrawingMode(null);
}

function editMission(id) {
    if(!id) return;
    currentMissionId = id;
    
    // Escuchar cambios de la misión
    db.ref(`operaciones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;
        
        document.getElementById('mission-name').value = m.nombre;
        document.getElementById('status-label').innerText = "ESTADO: " + (m.estado || "STANDBY");
        
        if(m.startTime) updateTimer(m.startTime);
        renderMission(m.elements);
    });
}

function renderMission(elements) {
    currentOverlays.forEach(o => o.setMap(null));
    currentOverlays = [];
    if(!elements) return;

    const bounds = new google.maps.LatLngBounds();
    let hasElements = false;

    Object.values(elements).forEach(e => {
        let obj;
        const color = e.type === 'GAME_ZONE' ? '#00ff00' : 
                      e.type === 'SAFE_ZONE' ? '#ff3333' : 
                      e.type.includes('RED') ? '#ff3333' : '#3333ff';

        if(e.path) {
            obj = new google.maps.Polygon({ paths: e.path, fillColor: color, strokeColor: color, fillOpacity: 0.15, map: map, zIndex: e.type === 'GAME_ZONE' ? 1 : 2 });
            e.path.forEach(p => bounds.extend(p));
            hasElements = true;
        } else if(e.radius) {
            obj = new google.maps.Circle({ center: e.center, radius: e.radius, fillColor: color, strokeColor: color, fillOpacity: 0.3, map: map });
            bounds.extend(e.center);
            hasElements = true;
        } else {
            obj = new google.maps.Marker({ position: e.pos, map: map, icon: 'http://maps.google.com/mapfiles/ms/icons/grey-dot.png' });
            bounds.extend(e.pos);
            hasElements = true;
        }
        currentOverlays.push(obj);
    });

    // Auto-centrado lógico: vuela a la zona si hay elementos
    if(hasElements) {
        map.fitBounds(bounds);
    }
}

function createNewMission() {
    const name = document.getElementById('mission-name').value;
    if(!name) return alert("Asigna un nombre a la operación.");
    
    currentMissionId = db.ref('operaciones').push().key;
    db.ref(`operaciones/${currentMissionId}`).set({ 
        nombre: name, 
        estado: "STANDBY",
        created: Date.now() 
    });
    
    // Seleccionar automáticamente la nueva misión
    setTimeout(() => {
        document.getElementById('mission-selector').value = currentMissionId;
        editMission(currentMissionId);
    }, 500);
}

function loadMissionsList() {
    db.ref("operaciones").on("value", s => {
        const sel = document.getElementById("mission-selector");
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- SELECCIONAR OPERACIÓN --</option>';
        s.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
        sel.value = currentVal;
    });
}

function launchMission() {
    if(!currentMissionId) return;
    const startTime = Date.now();
    db.ref(`operaciones/${currentMissionId}`).update({
        estado: "ACTIVA",
        startTime: startTime
    });
}

function updateTimer(startTime) {
    clearInterval(missionInterval);
    missionInterval = setInterval(() => {
        const diff = Date.now() - startTime;
        const h = Math.floor(diff / 3600000).toString().padStart(2,'0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2,'0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2,'0');
        document.getElementById("timer").innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function deleteCurrentMission() {
    if(!currentMissionId) return;
    if(confirm("¿Seguro que deseas ELIMINAR esta operación de la nube?")) {
        db.ref(`operaciones/${currentMissionId}`).remove();
        location.reload();
    }
}

function toggleMenu(header) {
    header.nextElementSibling.classList.toggle('active');
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing&callback=initMap" async defer></script>
</body>
</html>
