<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - EDITOR TÁCTICO</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body{
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 display:flex;
 height:100vh;
 overflow:hidden;
}

#panel{
 width:340px;
 background:#050505;
 border-right:2px solid var(--p);
 padding:10px;
 overflow:auto;
}

#map{ flex:1; }

button,input,select{
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
 cursor:pointer;
}

.section{
 margin-top:10px;
 border-top:1px solid #222;
 padding-top:10px;
}

.user{
 font-size:12px;
 border-bottom:1px solid #222;
 padding:4px;
}
</style>
</head>

<body>

<div id="panel">

<h3>COMANDO</h3>

<select id="misiones" onchange="loadMission(this.value)"></select>

<input id="nombre" placeholder="Nombre misión">

<button onclick="createMission()">NUEVA</button>
<button onclick="saveMission()">GUARDAR</button>
<button onclick="deleteMission()">BORRAR</button>
<button onclick="deployMission()">DESPLEGAR (START)</button>

<div class="section">
<h4>DIBUJO</h4>

<button onclick="setMode('ZONE')">ZONA (POLIGONO)</button>
<button onclick="setMode('SAFE')">ZONA SEGURA</button>

<button onclick="setMode('RESPAWN_RED')">RESPAWN ROJO</button>
<button onclick="setMode('RESPAWN_BLUE')">RESPAWN AZUL</button>

<button onclick="setMode('OBJ_NEUTRAL')">OBJ NEUTRO</button>
<button onclick="setMode('OBJ_RED')">OBJ ROJO</button>
<button onclick="setMode('OBJ_BLUE')">OBJ AZUL</button>

<button onclick="clearMode()">DESACTIVAR</button>
</div>

<div class="section">
<h4>JUGADORES</h4>
<div id="players"></div>
</div>

</div>

<div id="map"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain:"atom--airsoft.firebaseapp.com",
 databaseURL:"https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId:"atom--airsoft"
});

const db = firebase.database();
const auth = firebase.auth();

let map;
let mode=null;
let missionId=null;

let markers=[];
let polygons=[];
let tempPolygon=[];

/* MAP */
window.initMap = function(){
 map = new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.9,lng:-56.2},
  zoom:15,
  mapTypeId:"satellite"
 });

 map.addListener("click",(e)=>handleClick(e));
};

/* CLICK MAP */
function handleClick(e){
 if(!mode || !missionId) return;

 const pos = {lat:e.latLng.lat(),lng:e.latLng.lng()};

 // POLYGON MODE
 if(mode==="ZONE"){
  tempPolygon.push(pos);

  let poly = new google.maps.Polygon({
   paths: tempPolygon,
   strokeColor:"#00ff00",
   fillColor:"#00ff00",
   fillOpacity:0.2,
   map
  });

  polygons.push(poly);
  return;
 }

 // MARKERS
 let color="yellow";

 if(mode.includes("RED")) color="red";
 if(mode.includes("BLUE")) color="blue";
 if(mode.includes("SAFE")) color="white";

 new google.maps.Marker({
  position:pos,
  map,
  icon:`http://maps.google.com/mapfiles/ms/icons/${color}-dot.png`
 });

 saveTempPoint(mode,pos);
}

/* SAVE TEMP */
function saveTempPoint(type,pos){
 db.ref(`operaciones/${missionId}/points`).push({
  type,
  ...pos
 });
}

/* MODE */
function setMode(m){ mode=m; }
function clearMode(){ mode=null; }

/* MISSIONS */
function loadMissions(){
 db.ref("operaciones").on("value",s=>{
  let sel=document.getElementById("misiones");
  sel.innerHTML="";
  s.forEach(x=>{
   sel.innerHTML+=`<option value="${x.key}">${x.val().nombre}</option>`;
  });
 });
}

function loadMission(id){
 missionId=id;
 tempPolygon=[];

 db.ref("operaciones/"+id).once("value",s=>{
  let m=s.val();
  document.getElementById("nombre").value=m.nombre||"";
 });
}

/* CREATE */
function createMission(){
 missionId=db.ref("operaciones").push().key;
 tempPolygon=[];
}

/* SAVE */
function saveMission(){
 db.ref("operaciones/"+missionId).set({
  nombre:document.getElementById("nombre").value,
  estado:{activo:false},
  created:Date.now()
 });
 alert("GUARDADO");
}

/* DELETE */
function deleteMission(){
 if(!missionId) return;
 db.ref("operaciones/"+missionId).remove();
 alert("BORRADO");
}

/* DEPLOY START GAME */
function deployMission(){
 db.ref("operaciones/"+missionId+"/estado").update({
  activo:true,
  startTime:Date.now()
 });
 alert("MISIÓN DESPLEGADA");
}

/* PLAYERS */
db.ref("usuarios").on("value",s=>{
 let html="";
 s.forEach(u=>{
  html+=`<div class="user">${u.val().callsign} - ${u.val().rol}</div>`;
 });
 document.getElementById("players").innerHTML=html;
});

loadMissions();
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
