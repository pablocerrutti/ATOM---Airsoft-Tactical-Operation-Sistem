<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        #panel { width:320px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; overflow-y: auto; z-index: 10; }
        #map { flex:1; }
        .menu-drop { border-bottom: 1px solid #222; }
        .menu-header { padding:15px; background:#111; cursor:pointer; font-weight:bold; display:flex; justify-content:space-between; }
        .menu-content { padding:10px; display:none; flex-direction:column; }
        .menu-content.active { display:flex; }
        button, select, input { 
            width:100%; padding:12px; margin-top:8px; background:#111; color:var(--p); 
            border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; 
        }
        button:hover { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; }
        .btn-save { background: var(--p); color: #000; border: none; margin-top: 20px; font-size: 16px; }
        .btn-hub { background:#222; border-color:#555; margin-top:auto; padding:20px; }
        .edit-mode-indicator { background: var(--gold); color: #000; padding: 5px; font-size: 10px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="panel">
    <div style="padding:15px; border-bottom:2px solid var(--p)">
        <h3 style="margin:0;">A.T.O.M TACTICAL EDITOR</h3>
        <div id="edit-tag" class="edit-mode-indicator">MODO EDICIÓN ACTIVO</div>
        
        <select id="mission-load-selector" onchange="loadMissionToEdit(this.value)">
            <option value="">-- EDITAR EXISTENTE --</option>
        </select>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⚒ HERRAMIENTAS DE DIBUJO</div>
        <div class="menu-content active" id="tools">
            <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>
            <button onclick="setMode('SAFE_ZONE', this)">⚪ ZONA SEGURA</button>
            <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>
            <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>
            <button onclick="setMode('OBJ_GREY', this)">🔘 OBJETIVO / POI</button>
            <button onclick="clearCurrentEditor()" style="border-color:var(--red); color:var(--red); margin-top:20px;">🗑️ REINICIAR EDITOR</button>
        </div>
    </div>

    <div class="menu-drop" style="background: #111;">
        <div class="menu-header" onclick="toggleMenu(this)">💾 FINALIZAR Y GUARDAR</div>
        <div class="menu-content active">
            <input id="mission-name" placeholder="Nombre de la Operación..." style="border-color: var(--gold); color: var(--gold);">
            <button class="btn-save" id="save-btn" onclick="saveFullMission()">💾 GUARDAR MISIÓN</button>
        </div>
    </div>

    <button class="btn-hub" onclick="handleExit()">🔙 VOLVER AL HUB</button>
</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawingManager;
let currentMissionId = null; // Si es null, es una misión nueva
let mapOverlays = [];  

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, 
        zoom: 15,
        mapTypeId: "satellite",
        tilt: 45,
        disableDefaultUI: true
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: true, draggable: true, fillOpacity: 0.3, strokeWeight: 2 },
        circleOptions: { editable: true, draggable: true, fillOpacity: 0.4, strokeWeight: 2 },
        markerOptions: { draggable: true }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        if (!mode) { e.overlay.setMap(null); return alert("Selecciona una herramienta primero"); }
        
        // Al dibujar, inyectamos el tipo en el objeto para recuperarlo al guardar
        e.overlay.atomType = mode;
        mapOverlays.push(e.overlay);
    });

    populateSelector();
}

function populateSelector() {
    db.ref("misiones").on("value", s => {
        const sel = document.getElementById("mission-load-selector");
        sel.innerHTML = '<option value="">-- EDITAR EXISTENTE --</option>';
        s.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

function loadMissionToEdit(id) {
    if (!id) return;
    clearCurrentEditor(false); // Limpiamos sin confirmación
    currentMissionId = id;
    
    document.getElementById('edit-tag').style.display = "block";
    document.getElementById('save-btn').innerText = "💾 ACTUALIZAR OPERACIÓN";

    db.ref(`misiones/${id}`).once('value', snap => {
        const m = snap.val();
        document.getElementById('mission-name').value = m.nombre;
        
        if (m.elements) {
            Object.values(m.elements).forEach(e => {
                const color = e.type.includes('RED') ? '#ff3333' : e.type.includes('BLUE') ? '#3333ff' : e.type === 'GAME_ZONE' ? '#00ff00' : '#ffd700';
                let obj;
                
                if (e.path) {
                    obj = new google.maps.Polygon({ paths: e.path, fillColor: color, strokeColor: color, map: map, editable: true, draggable: true });
                } else if (e.radius) {
                    obj = new google.maps.Circle({ center: e.center, radius: e.radius, fillColor: color, strokeColor: color, map: map, editable: true, draggable: true });
                } else {
                    obj = new google.maps.Marker({ position: e.pos, map: map, draggable: true });
                }
                
                obj.atomType = e.type; // Preservamos el tipo
                mapOverlays.push(obj);
            });
        }
    });
}

function setMode(mode, btn) {
    document.querySelectorAll('#tools button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;

    const isCircle = mode.includes("RESPAWN");
    const isPolygon = mode.includes("ZONE");
    
    drawingManager.setDrawingMode(
        isCircle ? google.maps.drawing.OverlayType.CIRCLE :
        isPolygon ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.MARKER
    );

    const color = mode.includes('RED') ? '#ff3333' : mode.includes('BLUE') ? '#3333ff' : mode === 'GAME_ZONE' ? '#00ff00' : '#ffd700';
    drawingManager.setOptions({
        polygonOptions: { fillColor: color, strokeColor: color },
        circleOptions: { fillColor: color, strokeColor: color }
    });
}

function saveFullMission() {
    const name = document.getElementById('mission-name').value;
    if (!name) return alert("Nombre requerido");
    if (mapOverlays.length === 0) return alert("El mapa está vacío");

    // Recolectamos datos de los overlays actuales en el mapa
    let elementsObject = {};
    mapOverlays.forEach((overlay, index) => {
        const elId = "el_" + Date.now() + "_" + index;
        let data = { id: elId, type: overlay.atomType };

        if (overlay.getPath) { // Es polígono
            data.path = overlay.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
        } else if (overlay.getRadius) { // Es círculo
            data.center = {lat: overlay.getCenter().lat(), lng: overlay.getCenter().lng()};
            data.radius = overlay.getRadius();
        } else { // Es marcador
            data.pos = {lat: overlay.getPosition().lat(), lng: overlay.getPosition().lng()};
        }
        elementsObject[elId] = data;
    });

    const missionId = currentMissionId || db.ref('misiones').push().key;
    
    const finalData = {
        id: missionId,
        nombre: name,
        estado: "STANDBY",
        timestamp: Date.now(),
        elements: elementsObject
    };

    db.ref(`misiones/${missionId}`).update(finalData).then(() => {
        alert("Operación procesada con éxito.");
        location.reload();
    });
}

function clearCurrentEditor(confirmAction = true) {
    if (confirmAction && !confirm("¿Reiniciar el editor? Se perderán los cambios no guardados.")) return;
    mapOverlays.forEach(o => o.setMap(null));
    mapOverlays = [];
    currentMissionId = null;
    document.getElementById('mission-name').value = "";
    document.getElementById('edit-tag').style.display = "none";
    document.getElementById('save-btn').innerText = "💾 GUARDAR MISIÓN";
}

function handleExit() { location.href = "hub.html"; }
function toggleMenu(h) { h.nextElementSibling.classList.toggle('active'); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing&callback=initMap" async defer></script>
</body>
</html>
