<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - COMANDO CENTRAL</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 display:flex;
 height:100vh;
 overflow:hidden;
}

#panel {
 width:320px;
 background:#050505;
 border-right:2px solid var(--p);
 padding:10px;
 overflow:auto;
}

#map { flex:1; }

button, input, select {
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

@media (max-width:768px){
 body{flex-direction:column;}
 #panel{width:100%;height:45vh;}
 #map{height:55vh;}
}
</style>
</head>

<body>

<div id="panel">

<h3>COMANDO</h3>

<select id="misiones" onchange="loadMission(this.value)"></select>

<input id="nombre" placeholder="Nombre misión">

<button onclick="saveMission()">GUARDAR MISIÓN</button>
<button onclick="newMission()">NUEVA MISIÓN</button>

<hr>

<h3>HERRAMIENTAS</h3>

<button onclick="setMode('ZONA')">ZONA JUEGO</button>
<button onclick="setMode('SEGURA')">ZONA SEGURA</button>
<button onclick="setMode('RESPAWN')">RESPAWN</button>
<button onclick="setMode('OBJETIVO_NEUTRO')">OBJETIVO NEUTRO</button>
<button onclick="setMode('OBJETIVO_ROJO')">OBJ ROJO</button>
<button onclick="setMode('OBJETIVO_AZUL')">OBJ AZUL</button>

<button onclick="clearMode()">DESACTIVAR</button>

<hr>

<button onclick="logout()">SALIR</button>

</div>

<div id="map"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

/* ===== STATE ===== */
let map;
let mode = null;
let missionId = null;
let shapes = [];

/* ===== MAPA ===== */
window.initMap = function () {

 map = new google.maps.Map(document.getElementById("map"), {
  center: { lat: -34.9, lng: -56.2 },
  zoom: 15,
  mapTypeId: "satellite"
 });

 map.addListener("click", (e) => {

  if (!mode) return;
  if (!missionId) {
   alert("Selecciona o crea una misión");
   return;
  }

  const point = {
   type: mode,
   lat: e.latLng.lat(),
   lng: e.latLng.lng()
  };

  shapes.push(point);

  let color = "green";

  if (mode.includes("ROJO")) color = "red";
  if (mode.includes("AZUL")) color = "blue";
  if (mode.includes("RESPAWN")) color = "purple";
  if (mode.includes("SEGURA")) color = "white";
  if (mode.includes("NEUTRO")) color = "yellow";

  new google.maps.Marker({
   position: e.latLng,
   map: map,
   icon: `http://maps.google.com/mapfiles/ms/icons/${color}-dot.png`
  });

 });
};

/* ===== MODOS ===== */
function setMode(m){
 mode = m;
 alert("Modo: " + m);
}

function clearMode(){
 mode = null;
}

/* ===== MISIONES ===== */
function loadMissions(){
 db.ref("operaciones").on("value",snap=>{
  let sel=document.getElementById("misiones");
  sel.innerHTML="";

  snap.forEach(s=>{
   sel.innerHTML += `<option value="${s.key}">${s.val().nombre}</option>`;
  });
 });
}

function loadMission(id){
 missionId = id;
 shapes = [];

 db.ref("operaciones/"+id).once("value",snap=>{
  const m = snap.val();
  if(!m) return;

  document.getElementById("nombre").value = m.nombre;

  renderExisting(m.zonas || []);
 });
}

/* ===== RENDER EXISTENTE ===== */
function renderExisting(zonas){
 zonas.forEach(z=>{
  let color = "green";

  if (z.type.includes("ROJO")) color = "red";
  if (z.type.includes("AZUL")) color = "blue";
  if (z.type.includes("RESPAWN")) color = "purple";
  if (z.type.includes("SEGURA")) color = "white";
  if (z.type.includes("NEUTRO")) color = "yellow";

  new google.maps.Marker({
   position: {lat:z.lat,lng:z.lng},
   map: map,
   icon: `http://maps.google.com/mapfiles/ms/icons/${color}-dot.png`
  });
 });
}

/* ===== GUARDAR ===== */
function saveMission(){

 if(!missionId){
  missionId = db.ref("operaciones").push().key;
 }

 const nombre = document.getElementById("nombre").value;

 db.ref("operaciones/"+missionId).set({
  nombre,
  zonas: shapes,
  estado:{
   activo:false,
   killsR:0,
   killsA:0,
   startTime:null
  },
  modo:"MILITAR_REAL"
 });

 alert("MISIÓN GUARDADA");
}

/* ===== NUEVA ===== */
function newMission(){
 shapes = [];
 missionId = null;
 document.getElementById("nombre").value="";
}

/* ===== AUTH ===== */
auth.onAuthStateChanged(u=>{
 if(!u) location.href="login.html";
});

/* ===== LOGOUT ===== */
function logout(){
 auth.signOut().then(()=>location.href="login.html");
}

/* INIT */
loadMissions();
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap" async defer></script>

</body>
</html>
