<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sistema A.T.O.M. - Uruguay </title>
    <style>
        :root { --p: #00ff00; --f: #0a0a0a; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); height: 100vh; display: flex; flex-direction: column; }
        #lock-screen { position: fixed; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .box { border: 2px solid var(--p); padding: 30px; text-align: center; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 10px; width: 100%; margin: 10px 0; box-sizing: border-box; }
        button { background: var(--p); color: #000; padding: 10px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="lock-screen">
        <div class="box">
            <h2>COMANDO CENTRAL</h2>
            <input type="password" id="admin-pass" placeholder="MASTER KEY">
            <button onclick="checkAdmin()">ACCEDER</button>
            <a href="index.html" style="color:#444; display:block; margin-top:15px; text-decoration:none; font-size:10px;">← CANCELAR</a>
        </div>
    </div>

    <div id="admin-content" style="display:none; padding: 20px;">
        <h1>PANEL DE CONTROL GOOGLE MAPS</h1>
        </div>

    <script>
        function checkAdmin() {
            const p = document.getElementById('admin-pass').value;
            if(p === "Ik3rc3rru771") { // Cambia esto por tu clave maestra
                alert("Bienvenido nuevamente Administrador");
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                // Aquí podrías disparar la función initMap()
            } else {
                alert("CLAVE MAESTRA INCORRECTA");
            }
        }
    </script>
</body>
</html>
