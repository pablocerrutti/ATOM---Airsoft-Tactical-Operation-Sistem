<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - COMANDO CENTRAL</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 height:100vh;
 display:flex;
 overflow:hidden;
}

/* PANEL */
#panel {
 width:320px;
 background:#050505;
 border-right:2px solid var(--p);
 padding:10px;
 overflow-y:auto;
}

/* MAPA */
#map {
 flex:1;
 height:100vh;
 width:100%;
}

/* BOTONES */
button, input, select {
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

/* RESPONSIVE */
@media (max-width: 768px) {

 body {
  flex-direction:column;
 }

 #panel {
  width:100%;
  height:45vh;
  border-right:none;
  border-top:2px solid var(--p);
 }

 #map {
  height:55vh;
 }
}
</style>
</head>

<body>

<div id="panel">
<h3>COMANDO</h3>

<select id="misiones"></select>

<input id="nombre" placeholder="Nombre misión">

<button onclick="guardarMision()">GUARDAR</button>
<button onclick="nuevaMision()">NUEVA</button>

<hr>

<h3>EDITOR</h3>
<button onclick="setMode('zona')">ZONA</button>
<button onclick="setMode('segura')">SEGURA</button>
<button onclick="setMode('objetivo')">OBJ</button>

<hr>

<div id="jugadores"></div>

<button onclick="lanzar()">LANZAR</button>
<button onclick="logout()">SALIR</button>
</div>

<div id="map"></div>

<script
src="https://maps.googleapis.com/maps/api/js?key=TU_KEY&callback=initMap"
async defer>
</script>
// tu lógica intacta
</script>

</body>
</html>
