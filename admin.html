<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        #panel { width:320px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; overflow-y: auto; }
        #map { flex:1; }
        .menu-drop { border-bottom: 1px solid #222; }
        .menu-header { padding:15px; background:#111; cursor:pointer; font-weight:bold; display:flex; justify-content:space-between; }
        .menu-content { padding:10px; display:none; flex-direction:column; }
        .menu-content.active { display:flex; }
        button, select, input { width:100%; padding:12px; margin-top:8px; background:#111; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; }
        button:hover { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; }
        .timer-display { font-size: 24px; text-align: center; padding: 10px; border: 1px solid var(--gold); color: var(--gold); margin-top: 10px; }
        .btn-launch { background: var(--gold); color: #000; border: none; }
        .btn-hub { background:#222; border-color:#555; margin-top:auto; padding:20px; }
    </style>
</head>
<body>

<div id="panel">
    <div style="padding:15px; border-bottom:2px solid var(--p)">
        <h3 style="margin:0;">A.T.O.M EDITOR</h3>
        <select id="mission-selector" onchange="editMission(this.value)">
            <option value="">-- CARGAR OPERACIÓN --</option>
        </select>
        <input id="mission-name" placeholder="Nueva Misión">
        <button onclick="createNewMission()" style="background:#003300">CREAR</button>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⏱️ CONTROL DE TIEMPO</div>
        <div class="menu-content">
            <div id="timer" class="timer-display">00:00:00</div>
            <button class="btn-launch" onclick="launchMission()">🚀 LANZAR MISIÓN</button>
            <p id="status-label" style="text-align:center; font-size:10px;">STANDBY</p>
        </div>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⚒ DIBUJO TÁCTICO</div>
        <div class="menu-content active" id="tools">
            <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>
            <button onclick="setMode('SAFE_ZONE', this)">⚪ ZONA SEGURA</button>
            <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>
            <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>
            <button onclick="setMode('OBJ_GREY', this)">🔘 OBJETIVO / POI</button>
        </div>
    </div>

    <button class="btn-hub" onclick="location.href='hub.html'">🔙 VOLVER AL HUB</button>
</div>

<div id="map"></div>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawingManager, currentMissionId = null;
let overlays = [];
let timerInterval;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, 
        zoom: 15,
        mapTypeId: "satellite",
        tilt: 45
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: true, fillOpacity: 0.2, strokeWeight: 2 },
        circleOptions: { editable: true, fillOpacity: 0.4, strokeWeight: 2 }
    });
    drawingManager.setMap(map);

    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        saveElement(e, mode);
    });

    loadList();
}

function setMode(mode, btn) {
    if(!currentMissionId) return alert("Crea una misión primero.");
    document.querySelectorAll('#tools button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;

    const isCircle = mode.includes("RESPAWN");
    const isPolygon = mode.includes("ZONE");
    
    drawingManager.setDrawingMode(
        isCircle ? google.maps.drawing.OverlayType.CIRCLE :
        isPolygon ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.MARKER
    );

    const color = mode.includes('RED') ? '#ff3333' : mode.includes('BLUE') ? '#3333ff' : mode === 'GAME_ZONE' ? '#00ff00' : '#888';
    drawingManager.setOptions({
        polygonOptions: { fillColor: color, strokeColor: color },
        circleOptions: { fillColor: color, strokeColor: color }
    });
}

function saveElement(event, mode) {
    const id = Math.random().toString(36).substr(2, 9);
    let data = { id, type: mode };

    if (event.type === 'polygon') {
        data.path = event.overlay.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
    } else if (event.type === 'circle') {
        data.center = {lat: event.overlay.getCenter().lat(), lng: event.overlay.getCenter().lng()};
        data.radius = event.overlay.getRadius();
    } else {
        data.pos = {lat: event.overlay.getPosition().lat(), lng: event.overlay.getPosition().lng()};
    }

    db.ref(`operaciones/${currentMissionId}/elements/${id}`).set(data);
    event.overlay.setMap(null); // Se limpia para que el render oficial lo dibuje
}

function loadList() {
    db.ref("operaciones").on("value", s => {
        const sel = document.getElementById("mission-selector");
        sel.innerHTML = '<option value="">-- CARGAR OPERACIÓN --</option>';
        s.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

function createNewMission() {
    const name = document.getElementById('mission-name').value;
    if(!name) return;
    const id = db.ref('operaciones').push().key;
    db.ref(`operaciones/${id}`).set({ 
        nombre: name, 
        estado: "STANDBY",
        stats: { deaths_RED: 0, deaths_BLUE: 0 } 
    });
}

function editMission(id) {
    if(!id) return;
    currentMissionId = id;
    db.ref(`operaciones/${id}`).on('value', snap => {
        const m = snap.val();
        document.getElementById('status-label').innerText = m.estado;
        if(m.startTime) startTimer(m.startTime);
        renderElements(m.elements);
    });
}

function renderElements(elements) {
    overlays.forEach(o => o.setMap(null));
    overlays = [];
    if(!elements) return;
    const bounds = new google.maps.LatLngBounds();

    Object.values(elements).forEach(e => {
        let obj;
        const color = e.type.includes('RED') ? '#ff3333' : e.type.includes('BLUE') ? '#3333ff' : e.type === 'GAME_ZONE' ? '#00ff00' : '#888';
        
        if(e.path) {
            obj = new google.maps.Polygon({ paths: e.path, fillColor: color, strokeColor: color, map: map });
            e.path.forEach(p => bounds.extend(p));
        } else if(e.radius) {
            obj = new google.maps.Circle({ center: e.center, radius: e.radius, fillColor: color, strokeColor: color, map: map });
            bounds.extend(e.center);
        } else {
            obj = new google.maps.Marker({ position: e.pos, map: map });
            bounds.extend(e.pos);
        }
        overlays.push(obj);
    });
    if(overlays.length) map.fitBounds(bounds);
}

function launchMission() {
    if(!currentMissionId) return;
    db.ref(`operaciones/${currentMissionId}`).update({
        estado: "ACTIVA",
        startTime: Date.now()
    });
}

function startTimer(start) {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        const diff = Date.now() - start;
        const h = Math.floor(diff/3600000).toString().padStart(2,'0');
        const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        document.getElementById("timer").innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function toggleMenu(h) { h.nextElementSibling.classList.toggle('active'); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing&callback=initMap" async defer></script>
</body>
</html>
