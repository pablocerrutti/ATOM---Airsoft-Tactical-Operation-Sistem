<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M. - COMANDO</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; --red:#ff3333; --blue:#33aaff; }

body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; }

#panel {
    width:300px;
    background:#050505;
    border-right:2px solid var(--p);
    padding:10px;
    overflow:auto;
    height:100vh;
}

#map { flex:1; }

button, select, input {
    width:100%;
    margin-top:5px;
    background:#111;
    color:var(--p);
    border:1px solid var(--p);
    padding:8px;
}

.user { display:flex; justify-content:space-between; font-size:12px; border-bottom:1px solid #222; padding:5px;}
</style>
</head>

<body>

<div id="panel">

<h3>MISIONES</h3>

<select id="misiones" onchange="cargarMision(this.value)"></select>

<input id="nombre" placeholder="Nombre misión">

<select id="modo">
<option value="DOMINIO">DOMINIO</option>
<option value="EXTERMINIO">EXTERMINIO</option>
</select>

<button onclick="nuevaMision()">+ NUEVA</button>
<button onclick="guardarMision()">GUARDAR</button>
<button onclick="eliminarMision()">ELIMINAR</button>

<hr>

<h3>EDITOR MAPA</h3>

<button onclick="setMode('zona')">ZONA JUEGO</button>
<button onclick="setMode('segura')">ZONA SEGURA</button>
<button onclick="setMode('respawn_rojo')">RESPAWN ROJO</button>
<button onclick="setMode('respawn_azul')">RESPAWN AZUL</button>
<button onclick="setMode('objetivo')">OBJETIVO</button>
<button onclick="setMode('dominio')">OBJ DEFENSA</button>

<hr>

<h3>JUGADORES</h3>
<div id="jugadores"></div>

<button onclick="balancear()">BALANCEAR</button>

<hr>

<button onclick="lanzar()">🚀 LANZAR MISIÓN</button>

</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 databaseURL:"https://atom--airsoft-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawMode=null, shapes=[], currentId=null;

// MAPA
function initMap(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:-34.09,lng:-56.21},
  zoom:15,
  mapTypeId:"satellite"
 });

 map.addListener("click",e=>{
  if(!drawMode) return;

  let obj={
   type:"marker",
   role:drawMode,
   lat:e.latLng.lat(),
   lng:e.latLng.lng()
  };

  let marker=new google.maps.Marker({position:e.latLng,map:map});
  shapes.push(obj);
 });
}

// MODOS
function setMode(m){ drawMode=m; }

// NUEVA
function nuevaMision(){
 shapes=[];
 currentId=null;
 alert("Nueva misión");
}

// GUARDAR
function guardarMision(){

 let nombre=document.getElementById("nombre").value;
 let modo=document.getElementById("modo").value;

 if(!nombre) return alert("Nombre requerido");

 if(currentId){
  db.ref("operaciones/"+currentId).update({
   nombre,modo,zonas:shapes
  });
 } else {
  let ref=db.ref("operaciones").push();
  ref.set({
   nombre,modo,zonas:shapes,
   estado:{activo:false}
  });
  currentId=ref.key;
 }

 alert("Guardado");
 cargarListado();
}

// LISTADO
function cargarListado(){
 db.ref("operaciones").on("value",snap=>{
  let sel=document.getElementById("misiones");
  sel.innerHTML="";
  snap.forEach(s=>{
   sel.innerHTML+=`<option value="${s.key}">${s.val().nombre}</option>`;
  });
 });
}

// CARGAR
function cargarMision(id){
 currentId=id;
 db.ref("operaciones/"+id).once("value",snap=>{
  let m=snap.val();
  document.getElementById("nombre").value=m.nombre;
  document.getElementById("modo").value=m.modo;

  shapes=m.zonas||[];
 });
 cargarJugadores();
}

// ELIMINAR
function eliminarMision(){
 if(confirm("Eliminar misión")){
  db.ref("operaciones/"+currentId).remove();
 }
}

// JUGADORES
function cargarJugadores(){
 db.ref("inscripciones").orderByChild("mision").equalTo(currentId)
 .on("value",snap=>{
  let cont=document.getElementById("jugadores");
  cont.innerHTML="";
  snap.forEach(s=>{
   let p=s.val();

   cont.innerHTML+=`
   <div class="user">
    ${p.callsign}
    <div>
     <button onclick="equipo('${s.key}','EQUIPO_ROJO')">R</button>
     <button onclick="equipo('${s.key}','EQUIPO_AZUL')">A</button>
    </div>
   </div>`;
  });
 });
}

// EQUIPO
function equipo(id,e){
 db.ref("inscripciones/"+id).update({equipo:e});
}

// BALANCEO
function balancear(){
 db.ref("inscripciones").orderByChild("mision").equalTo(currentId)
 .once("value",snap=>{
  let arr=[];
  snap.forEach(s=>arr.push(s.key));

  arr.sort(()=>Math.random()-0.5);

  let mitad=Math.ceil(arr.length/2);

  arr.forEach((id,i)=>{
   db.ref("inscripciones/"+id).update({
    equipo:i<mitad?"EQUIPO_ROJO":"EQUIPO_AZUL"
   });
  });
 });
}

// LANZAR
function lanzar(){
 db.ref("operaciones/"+currentId+"/estado")
 .set({activo:true,startTime:Date.now()});
 alert("MISIÓN INICIADA");
}

// INIT
initMap();
cargarListado();

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58" async defer></script>

</body>
</html>
