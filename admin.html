<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.T.O.M - COMANDO CENTRAL</title>

<style>
:root { --p:#00ff00; --f:#0b0b0b; }

body {
 margin:0;
 font-family: monospace;
 background:var(--f);
 color:var(--p);
 height:100vh;
 display:flex;
 overflow:hidden;
}

#panel {
 width:320px;
 background:#050505;
 border-right:2px solid var(--p);
 padding:10px;
 overflow-y:auto;
}

#map {
 flex:1;
 height:100vh;
 width:100%;
}

button, input, select {
 width:100%;
 margin-top:6px;
 padding:10px;
 background:#111;
 color:var(--p);
 border:1px solid var(--p);
}

@media (max-width: 768px) {
 body { flex-direction:column; }

 #panel {
  width:100%;
  height:45vh;
  border-right:none;
  border-top:2px solid var(--p);
 }

 #map {
  height:55vh;
 }
}
</style>
</head>

<body>

<div id="panel">
<h3>COMANDO</h3>

<select id="misiones"></select>

<input id="nombre" placeholder="Nombre misión">

<button onclick="guardarMision()">GUARDAR</button>
<button onclick="nuevaMision()">NUEVA</button>

<hr>

<h3>EDITOR MAPA</h3>
<button onclick="setMode('zona')">AREA DE JUEGO</button>
<button onclick="setMode('segura')">ZONA SEGURA</button>
<button onclick="setMode('objetivo')">OBJETIVO</button>

<hr>

<div id="jugadores"></div>

<button onclick="lanzar()">LANZAR</button>
<button onclick="logout()">SALIR</button>
</div>

<div id="map"></div>

<!-- 🔥 FIREBASE REAL -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
 authDomain: "atom--airsoft.firebaseapp.com",
 databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
 projectId: "atom--airsoft",
 storageBucket: "atom--airsoft.firebasestorage.app",
 messagingSenderId: "310010107781",
 appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec",
 measurementId: "G-3X2C87MPPV"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* ===== MAPA ===== */
let map;
let mode = null;
let shapes = [];

window.initMap = function () {

 map = new google.maps.Map(document.getElementById("map"), {
  center: { lat: -34.9, lng: -56.2 },
  zoom: 15,
  mapTypeId: "satellite"
 });

 map.addListener("click", (e) => {

  if (!mode) return;

  new google.maps.Marker({
   position: e.latLng,
   map: map
  });

  shapes.push({
   role: mode,
   lat: e.latLng.lat(),
   lng: e.latLng.lng()
  });

 });

};

function setMode(m) {
 mode = m;
}

function nuevaMision() {
 shapes = [];
 document.getElementById("nombre").value = "";
 alert("Nueva misión iniciada");
}

function guardarMision() {

 const nombre = document.getElementById("nombre").value;

 if (!nombre) {
  alert("Falta nombre");
  return;
 }

 db.ref("operaciones").push().set({
  nombre,
  zonas: shapes,
  estado: { activo: false }
 });

 alert("Misión guardada");
}

function lanzar() {
 alert("Misión activada (placeholder)");
}

function logout() {
 firebase.auth().signOut().then(() => {
  location.href = "login.html";
 });
}
</script>

<!-- 🔥 GOOGLE MAPS CON CALLBACK CORRECTO -->
<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&callback=initMap"
async defer>
</script>

</body>
</html>
