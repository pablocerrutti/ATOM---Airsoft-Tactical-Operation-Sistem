<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M - Editor de Operaciones</title>
    <style>
        :root { --p:#00ff00; --f:#050505; --red:#ff3333; --blue:#3333ff; --gold:#ffd700; }
        body { margin:0; font-family: monospace; background:var(--f); color:var(--p); display:flex; height:100vh; overflow:hidden; }
        #panel { width:320px; background:#000; border-right:2px solid var(--p); display:flex; flex-direction:column; overflow-y: auto; z-index: 10; }
        #map { flex:1; }
        .menu-drop { border-bottom: 1px solid #222; }
        .menu-header { padding:15px; background:#111; cursor:pointer; font-weight:bold; display:flex; justify-content:space-between; }
        .menu-content { padding:10px; display:none; flex-direction:column; }
        .menu-content.active { display:flex; }
        button, select, input { width:100%; padding:12px; margin-top:8px; background:#111; color:var(--p); border:1px solid var(--p); cursor:pointer; font-family:inherit; font-weight: bold; }
        button:hover { background:var(--p); color:#000; }
        button.active { background: var(--p); color: #000; }
        .timer-display { font-size: 24px; text-align: center; padding: 10px; border: 1px solid var(--gold); color: var(--gold); margin-top: 10px; }
        .btn-launch { background: var(--gold); color: #000; border: none; }
        .btn-hub { background:#222; border-color:#555; margin-top:auto; padding:20px; }
        #player-list { font-size: 10px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<div id="panel">
    <div style="padding:15px; border-bottom:2px solid var(--p)">
        <h3 style="margin:0;">A.T.O.M EDITOR</h3>
        <select id="mission-selector" onchange="editMission(this.value)">
            <option value="">-- CARGAR OPERACIÓN --</option>
        </select>
        <input id="mission-name" placeholder="Nombre de Misión">
        <button onclick="createNewMission()" style="background:#003300">CREAR NUEVA</button>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⏱️ CONTROL DE MISIÓN</div>
        <div class="menu-content">
            <div id="timer" class="timer-display">00:00:00</div>
            <button class="btn-launch" onclick="launchMission()">🚀 LANZAR / ACTUALIZAR</button>
            <p id="status-label" style="text-align:center; font-size:10px; color:var(--gold)">STANDBY</p>
        </div>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">⚒ DIBUJO TÁCTICO</div>
        <div class="menu-content active" id="tools">
            <button onclick="setMode('GAME_ZONE', this)">🟢 LÍMITE DE JUEGO</button>
            <button onclick="setMode('SAFE_ZONE', this)">⚪ ZONA SEGURA</button>
            <button onclick="setMode('RESPAWN_RED', this)">🔴 RESPAWN ROJO</button>
            <button onclick="setMode('RESPAWN_BLUE', this)">🔵 RESPAWN AZUL</button>
            <button onclick="setMode('OBJ_GREY', this)">🔘 OBJETIVO / POI</button>
            <button onclick="clearMap()" style="border-color:var(--red); color:var(--red); margin-top:20px;">🗑️ LIMPIAR MAPA</button>
        </div>
    </div>

    <div class="menu-drop">
        <div class="menu-header" onclick="toggleMenu(this)">👥 OPERADORES ENROLADOS</div>
        <div class="menu-content" id="player-list">Selecciona una misión...</div>
    </div>

    <button class="btn-hub" onclick="handleExit()">🔙 VOLVER AL HUB</button>
</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
    authDomain: "atom--airsoft.firebaseapp.com",
    databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
    projectId: "atom--airsoft"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, drawingManager, currentMissionId = null;
let overlays = []; 
let timerInterval;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat:-34.34, lng:-56.71}, 
        zoom: 15,
        mapTypeId: "satellite",
        tilt: 45,
        disableDefaultUI: true
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingControl: false,
        polygonOptions: { editable: false, fillOpacity: 0.2, strokeWeight: 2 },
        circleOptions: { editable: false, fillOpacity: 0.4, strokeWeight: 2 }
    });
    drawingManager.setMap(map);

    // CRÍTICO: Captura el evento de dibujo y lo manda a Firebase
    google.maps.event.addListener(drawingManager, 'overlaycomplete', (e) => {
        const mode = document.body.dataset.mode;
        if (!currentMissionId) {
            e.overlay.setMap(null);
            return alert("Selecciona una misión primero");
        }
        saveElement(e, mode);
    });

    loadList();
}

function createNewMission() {
    const name = document.getElementById('mission-name').value;
    if(!name) return alert("Nombre obligatorio");
    
    const id = db.ref('misiones').push().key;
    db.ref(`misiones/${id}`).set({
        id: id,
        nombre: name,
        estado: "STANDBY",
        timestamp: Date.now()
    }).then(() => {
        document.getElementById('mission-name').value = "";
        alert("Misión creada");
    });
}

function loadList() {
    db.ref("misiones").on("value", s => {
        const sel = document.getElementById("mission-selector");
        sel.innerHTML = '<option value="">-- CARGAR OPERACIÓN --</option>';
        s.forEach(child => {
            sel.innerHTML += `<option value="${child.key}">${child.val().nombre}</option>`;
        });
    });
}

function editMission(id) {
    if(!id) return;
    currentMissionId = id;
    
    // Limpiar listener anterior si existe
    db.ref(`misiones/${id}`).off();

    db.ref(`misiones/${id}`).on('value', snap => {
        const m = snap.val();
        if(!m) return;
        document.getElementById('status-label').innerText = m.estado;
        if(m.startTime) startTimer(m.startTime);
        renderElements(m.elements);
        renderPlayers(m.players);
    });
}

function saveElement(event, mode) {
    const id = db.ref().push().key; // ID único para el elemento
    let data = { id, type: mode };

    if (event.type === 'polygon') {
        data.path = event.overlay.getPath().getArray().map(p => ({lat:p.lat(), lng:p.lng()}));
    } else if (event.type === 'circle') {
        data.center = {lat: event.overlay.getCenter().lat(), lng: event.overlay.getCenter().lng()};
        data.radius = event.overlay.getRadius();
    } else {
        data.pos = {lat: event.overlay.getPosition().lat(), lng: event.overlay.getPosition().lng()};
    }

    // Guardar en la rama correcta
    db.ref(`misiones/${currentMissionId}/elements/${id}`).set(data);
    
    // Borramos el dibujo "temporal" del DrawingManager porque el render oficial lo dibujará
    event.overlay.setMap(null);
}

function renderElements(elements) {
    // 1. Limpiar mapa
    overlays.forEach(o => o.setMap(null));
    overlays = [];
    
    if(!elements) return;

    Object.values(elements).forEach(e => {
        const color = e.type.includes('RED') ? '#ff3333' : e.type.includes('BLUE') ? '#3333ff' : e.type === 'GAME_ZONE' ? '#00ff00' : '#ffd700';
        let obj;

        if(e.path) {
            obj = new google.maps.Polygon({ paths: e.path, fillColor: color, strokeColor: color, map: map, clickable: false });
        } else if(e.radius) {
            obj = new google.maps.Circle({ center: e.center, radius: e.radius, fillColor: color, strokeColor: color, map: map, clickable: false });
        } else {
            // Etiqueta/Marcador con el nombre del tipo
            obj = new google.maps.Marker({ 
                position: e.pos, 
                map: map, 
                label: { text: e.type.replace('_', ' '), color: 'white', fontSize: '10px' } 
            });
        }
        overlays.push(obj);
    });
}

function setMode(mode, btn) {
    if(!currentMissionId) return alert("Selecciona misión");
    document.querySelectorAll('#tools button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.mode = mode;

    const isCircle = mode.includes("RESPAWN");
    const isPolygon = mode.includes("ZONE");
    
    drawingManager.setDrawingMode(
        isCircle ? google.maps.drawing.OverlayType.CIRCLE :
        isPolygon ? google.maps.drawing.OverlayType.POLYGON : google.maps.drawing.OverlayType.MARKER
    );

    const color = mode.includes('RED') ? '#ff3333' : mode.includes('BLUE') ? '#3333ff' : mode === 'GAME_ZONE' ? '#00ff00' : '#ffd700';
    drawingManager.setOptions({
        polygonOptions: { fillColor: color, strokeColor: color, fillOpacity: 0.2 },
        circleOptions: { fillColor: color, strokeColor: color, fillOpacity: 0.3 }
    });
}

function launchMission() {
    if(!currentMissionId) return;
    db.ref(`misiones/${currentMissionId}`).update({ estado: "ACTIVA", startTime: Date.now() });
}

function startTimer(start) {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        const diff = Date.now() - start;
        const h = Math.floor(diff/3600000).toString().padStart(2,'0');
        const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        document.getElementById("timer").innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function clearMap() {
    if(currentMissionId && confirm("¿Borrar todo el dibujo?")) {
        db.ref(`misiones/${currentMissionId}/elements`).remove();
    }
}

function renderPlayers(players) {
    const list = document.getElementById('player-list');
    list.innerHTML = "";
    if(!players) { list.innerHTML = "Esperando personal..."; return; }
    Object.values(players).forEach(p => {
        list.innerHTML += `<div style="border:1px solid #333; padding:5px; margin:2px;">${p.callsign} [${p.team || '?'}]</div>`;
    });
}

function handleExit() {
    const user = JSON.parse(localStorage.getItem("usuario"));
    location.href = (user && (user.rol === "ADMIN" || user.rol === "EDITOR")) ? "hub.html" : "hub2.html";
}

function toggleMenu(h) { h.nextElementSibling.classList.toggle('active'); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6LAM-_vTwaCS8RrvogtDO7HuQ9ke_K58&libraries=drawing&callback=initMap" async defer></script>
</body>
</html>
