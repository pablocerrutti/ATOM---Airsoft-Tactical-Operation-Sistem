<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATOM - Comando Central</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --p: #00ff00; --f: #0a0a0a; --a: #3399ff; --r: #ff3333; }
        body { margin: 0; font-family: monospace; background: var(--f); color: var(--p); height: 100vh; overflow: hidden; }
        
        /* Pantalla de Bloqueo */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--f); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box { border: 2px solid var(--p); padding: 30px; text-align: center; background: #111; max-width: 300px; }
        input { background: #000; border: 1px solid var(--p); color: var(--p); padding: 10px; margin: 10px 0; width: 80%; }
        
        /* Layout Principal */
        #admin-content { display: none; flex-direction: column; height: 100vh; }
        #admin-map { flex-grow: 1; border-bottom: 2px solid var(--p); }
        .panel { background: #111; padding: 10px; max-height: 45vh; overflow-y: auto; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 10px; cursor: pointer; font-size: 11px; font-weight: bold; }
        button.active { background: var(--p); color: #000; }
        .player-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; align-items: center; font-size: 12px; }
        
        .biometric-btn { margin-top: 15px; border-color: #3399ff; color: #3399ff; font-size: 10px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="login-box">
            <h2>COMANDO CENTRAL</h2>
            <input type="password" id="admin-pass" placeholder="PASSWORD">
            <button onclick="checkPass()" style="width:100%; background: var(--p); color: black;">ACCEDER</button>
        </div>
    </div>

    <div id="admin-content">
        <div id="admin-map"></div>
        <div class="panel">
            <div class="controls">
                <button id="btn-polygon" onclick="setMode('polygon')">LÍMITES</button>
                <button id="btn-safezone" onclick="setMode('safezone')" style="border-color:white; color:white;">SAFE ZONE</button>
                <button id="btn-resA" onclick="setMode('resA')" style="border-color:var(--a); color:var(--a);">RESPAWN A</button>
                <button id="btn-resR" onclick="setMode('resR')" style="border-color:var(--r); color:var(--r);">RESPAWN R</button>
                <button id="btn-obj" onclick="setMode('obj')">OBJETIVO</button>
                <button onclick="undoLast()">↩️ DESHACER</button>
                <button class="btn-special" onclick="autoBalance()" style="grid-column: span 2;">⚖️ AUTO-ASIGNAR EQUIPOS (50/50)</button>
                <button onclick="saveOp()" style="grid-column: span 2; background: #004400; border-color: lime;">🚀 LANZAR OPERACIÓN</button>
                <button onclick="clearAll()" style="grid-column: span 2; font-size: 9px; border-color: #444;">LIMPIAR TODO EL MAPA</button>
            </div>
            <div id="player-list"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBd8oZjbQCahwDa539TPirLaG-0DflHTzw",
            authDomain: "atom--airsoft.firebaseapp.com",
            databaseURL: "https://atom--airsoft-default-rtdb.firebaseio.com",
            projectId: "atom--airsoft",
            storageBucket: "atom--airsoft.firebasestorage.app",
            messagingSenderId: "310010107781",
            appId: "1:310010107781:web:c7ced7f288a77e0f2bd6ec"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const PASS_MAESTRA = "Ik3rc3rru771"; 

        function checkPass() {
            if(document.getElementById('admin-pass').value === PASS_MAESTRA) unlock();
            else alert("ACCESO DENEGADO");
        }

        function unlock() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'flex';
            init();
        }

        let map, mode = 'view', coords = { polygon:[], safezone:[], resA:[], resR:[], obj:[] }, layers = {};

        function init() {
            map = L.map('admin-map').setView([-34.10, -56.21], 15);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

            map.on('click', e => {
                if(mode === 'view') return;
                let latlng = [e.latlng.lat, e.latlng.lng];
                if(mode === 'obj') { coords.obj.push({lat: latlng[0], lng: latlng[1]}); L.marker(latlng).addTo(map); }
                else { coords[mode].push(latlng); refreshLayer(mode); }
            });

            db.ref('users').on('value', snap => {
                const u = snap.val(); const list = document.getElementById('player-list');
                list.innerHTML = "<h4>OPERADORES REGISTRADOS</h4>";
                for(let id in u) {
                    let teamColor = u[id].team === 'azul' ? 'var(--a)' : (u[id].team === 'rojo' ? 'var(--r)' : '#555');
                    list.innerHTML += `<div class="player-row">
                        <span>${u[id].callsign} <span class="team-badge" style="background:${teamColor}">${u[id].team.toUpperCase()}</span></span>
                        <div>
                            <button onclick="assign('${id}','azul')" style="color:var(--a)">A</button>
                            <button onclick="assign('${id}','rojo')" style="color:var(--r)">R</button>
                        </div>
                    </div>`;
                }
            });
        }

        function refreshLayer(type) {
            if(layers[type]) map.removeLayer(layers[type]);
            let color = (type === 'safezone'?'white':type==='resA'?'#3399ff':type==='resR'?'#ff3333':'lime');
            layers[type] = L.polygon(coords[type], {color: color, fillOpacity: 0.3}).addTo(map);
        }

        function undoLast() { if(coords[mode] && coords[mode].length > 0) { coords[mode].pop(); refreshLayer(mode); } }
        function clearAll() { if(confirm("¿RESETEAR TODO?")) { location.reload(); } }
        function setMode(m) { mode = m; document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+m).classList.add('active'); }
        function assign(uid, team) { db.ref('users/'+uid).update({team: team}); }

        function autoBalance() {
            db.ref('users').once('value', snap => {
                const users = snap.val(); if(!users) return;
                let ids = Object.keys(users);
                ids.sort(() => Math.random() - 0.5);
                ids.forEach((id, i) => {
                    const team = (i % 2 === 0) ? 'azul' : 'rojo';
                    db.ref('users/'+id).update({team: team});
                });
                alert("EQUIPOS NIVELADOS");
            });
        }

        function saveOp() {
            const n = prompt("Nombre de la Misión:"); if(!n) return;
            db.ref('operaciones').push().set({ nombre: n, limites: coords.polygon, safezone: coords.safezone, resA: coords.resA, resR: coords.resR, objetivos: coords.obj });
            alert("MISIÓN ENVIADA AL CAMPO");
        }
    </script>
</body>
</html>
